external_audit:
  support_provider:
    subject: gemmini-worktrees/phase1-support-baseline
    fixes:
      c5b94f1: INFRA-ONLY; fact-grounded diagnostics and paired ISA trace tools; no
        numerical program implementation.
      7e7a883: INFRA-ONLY; retain plugin.backend in regenerated metadata; no numerical
        program implementation.
  model2mlir:
    branch: core-aten-numeric
    fixes:
      3d2613d:
        classification: CAPSULE-ABLE
        bug: Exported result layouts and storage provenance.
      f8ed82443:
        classification: CAPSULE-ABLE
        bug: Numeric opmath, storage rounding and absent-edge semantics.
      "654987203":
        classification: CAPSULE-ABLE
        bug: Batch normalization must retain strided affine parameter semantics.
    subject: lorenshung/model2MLIR; local model2MLIR and m2m-worktrees/stage5
    capsule_obligations:
      c147b57: Same-conversion result ordinals, mutation/alias boundaries and complete
        lossless bundle goldens; training_batch_norm_mutation and view_alias.
      f9d0997: Integer bmm, dtype promotion, optional/keyword tensor positions, complete
        pool auxiliary results, metadata mutation and LayerNorm ABI; independent calls
        needed for each family.
      e4627a4: Drop-all native_dropout with NaN, infinities and signed zero must multiply
        by masked scale.
      526045b: PT2E linear keyword bias and convolution keyword stride/padding require
        quantized retained capture capsules.
      bf61901: Runtime full fill scalar position and both max-pool-with-indices results.
      3c70681: Addmm beta=0 with nonfinite bias; empty/low-count variance; nonfinite
        sign/sort; normalization with absent affine arguments.
      eb30f01: Nondefault add/sub alpha, addmm alpha/beta and all layer/batch norm
        tuple results.
      33c0d72: Nondefault PT2E quantization scale and zero point.
      06275ae: Ragged multi-result split, scalar-other where, and new_ones result
        dtype.
      482e016: BF16/float8 input bundle storage plus int64 input IDs without narrowing.
      b3f2c3a: BF16 quantized inner inputs materialized as the captured f32 values.
      '7317461': Integer abs including INT_MIN must legalize without math.absi.
      a05fac0: Batch-one im2col output reshape and independent batch-greater-than-one
        transpose correctness.
    additional_lowering_obligations:
      a1243ce: Runtime scalar extraction and data-dependent nonzero descriptors.
      50233eb: Runtime scalar_tensor values rather than compile-time samples.
      c3c5e5b: Training batch normalization including running-stat mutation.
      0c3a02c: Literal and runtime fill scalar values.
      d8f8cb0: Exact exported as_strided element mapping.
      541f439: Bounded as_strided policy must preserve exact layout or refuse.
      c083b3b: Explicit RNG state; source-eager RNG parity remains unqualified.
