epilogue:
  required:
  - stage: relu
    family: elementwise_map
    evidenced_by:
    - manifest_composed_with
    isa_classes: []
  - stage: acc_scale
    family: elementwise_map
    evidenced_by:
    - manifest_composed_with
    isa_classes: []
  - stage: bias_add
    family: elementwise_map
    evidenced_by:
    - manifest_composed_with
    isa_classes: []
  - stage: maxpool
    family: reduction
    evidenced_by:
    - manifest_composed_with
    isa_classes: []
  rejected:
  - stage: requant
    family: elementwise_map
    why: no readout this target declares APPLIES the stage ('i8' applies ['acc_scale', 'bias', 'bias_add',
      'maxpool', 'relu']; 'i32' applies []), so fusing it would declare a computation the hardware does
      not perform. Stage-granular RTL-evidenced declaration overrides the family-granular manifest evidence
      that would otherwise require it.
  axis_basis: the epilogue stages this target can fuse onto a contraction, evidenced by its capability
    manifest declaring the stage's family fused-only OR by its own instruction taxonomy resolving a class
    for the role the stage needs, and then INTERSECTED with the stages its declared readout actually applies
    -- the first two are family-granular and the last is stage-granular, so a target that fuses an activation
    but not an integer requantize is described correctly instead of being asked for both. A (family, dtype,
    alignment) cell cannot express WHICH epilogue rides the contraction, so a corpus derived from cells
    alone tests one stage and calls the fusion capability covered
groups:
  status: ok
  required: []
  unstated:
    stage 'cast' has no name in the capsule epilogue vocabulary: 22
  captures_unreadable: {}
  axis_basis: 'the compute groups this target''s captured models form: a contraction with the stages its
    unit absorbs, by op, epilogue COMBINATION and operand format. A corpus that demands each stage once
    demands no combination, so a backend that fuses any one stage and no two passes it; and the model
    route is only as good as the patterns some capsule has certified'
carried_state:
  required:
  - stage: relu
    evidenced_by:
    - manifest_composed_with
  axis_basis: a readout stage with no operand and no parameter is configuration a unit stays in; a program
    is two commands over one resident weight, the stage on the FIRST and none on the second, on a stimulus
    that goes negative, so a backend that does not restore its configuration returns the second result
    with the first one's stage applied
