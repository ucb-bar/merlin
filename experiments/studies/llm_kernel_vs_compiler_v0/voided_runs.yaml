# Matrix runs invalidated by a harness defect, read by `merlin experiment study board --void`.
#
# A voided run is NOT deleted: it consumed tokens and money, and hiding it would understate what the
# study cost. It is kept out of every solved rate and cycle claim and reported on its own line.
# Adding an entry is a reviewed edit and needs the defect named; never void a run for its result.
voided:
  s3:
    codex_kernel: "codex ran its own bwrap sandbox inside ours; its shell died and it wrote nothing (harness defect, since fixed)"
    bedrock_kernel: "same round as the voided codex cells; superseded by s4 under the fixed sandbox"
  smoke:
    codex_kernel: "smoke run before the sandbox fix"
    bedrock_kernel: "smoke run before the sandbox fix"
    gemini_kernel: "single-seed smoke, not a claim-bearing run"
