policy:
  bundle_admits:
  - hand
  bundle_excludes:
  - agent_generated
  - compiler_generated
  - artifact_only
  - unknown
  note: 'unknown is excluded exactly like agent_generated: an unclassified kernel is not a safe kernel.
    artifact_only is excluded because a compiled ELF is still an answer.'
limitations:
- A `hand` verdict means 'a human authored source file is present and a human committed it'. It CANNOT
  distinguish source a human typed from agent output a human reviewed and committed under their own name.
  Any reference-performance claim built on these kernels inherits that limit and must say so; never call
  them 'expert'.
- 'Name-based verdicts are conservative by construction: a hand-written kernel that happens to sit under
  a generation-run prefix is excluded. That costs coverage, never safety.'
- '`artifact_only` directories hold no source but DO hold ELFs, which disassemble. They are answer surfaces
  and are excluded from the bundle for that reason, not because they are generated.'
