# Minimal OpenTelemetry Collector config for local development.
# Receives OTLP traces, logs them to console.
# Uncomment the SigNoz or Logfire exporter stubs to forward to a backend.

receivers:
  otlp:
    protocols:
      # 0.0.0.0 here is the CONTAINER's interface, not the host's, and is correct: a
      # container process that binds 127.0.0.1 is unreachable even from its own published
      # port. What decides host exposure is the `-p` publish, which must name 127.0.0.1
      # (see claude_code_otel.md). Do not "harden" these two lines instead -- that breaks
      # the receiver while leaving the actual exposure untouched.
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  # --- SigNoz (self-hosted, Docker Compose) ---
  # otlp/signoz:
  #   endpoint: http://signoz-otel-collector:4317
  #   tls:
  #     insecure: true

  # --- Logfire (cloud) ---
  # otlp/logfire:
  #   endpoint: https://logfire-api.pydantic.dev
  #   headers:
  #     Authorization: "Bearer ${LOGFIRE_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    # Uncomment to forward:
    # traces/forward:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [otlp/signoz]
