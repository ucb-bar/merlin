schema_version: 2
kind: template
id: baseline-functional-template
target: OPERATOR_TARGET
description: Combined correctness/performance backend generation; select a reviewed release, policy and timing evidence.
stages:
  backend-generation:
    adapter: capsule_bench
    config:
      require_reviewed_corpus: true
      joint_campaign: ../../out/operator-inputs/joint-policy.json
      fresh_backend: true
      schedule: continuous
      descriptor: ../../out/operator-inputs/target_experiment.yaml
      level: EL1
      bundle: OPERATOR_BUNDLE_ID
      bundle_manifest: ../../out/operator-inputs/input_bundle_manifest.yaml
      oracle_timing: ../../out/operator-inputs/oracle_timing.json
      model: OPERATOR_MODEL
      effort: high
      driver: claudecode
      provider: subscription
      max_wall_s: 600
      round_timeout: 600
