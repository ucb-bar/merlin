          - operation
          - operand_dtype
          - accum_dtype
          exact_points: 4
          note: input channel count read from the declared IFM shape, at a fixed window and image size.
            The four points are multiples of the array's own tile dimension, so the cohort scales with
            a wider array instead of pinning it to one width
        replicates:
          exact_count: 2
          identities:
          - r000
          - r001
        evidence:
          correctness_simulator: $target_oracle:L2
          correctness_tier: L2
          timing_simulator: $target_oracle:L3
          timing_tier: L3
          correctness_cycles_citable: false
        thresholds:
          slope_min_exclusive: 0.0
          r_squared_min_inclusive: 0.95
          residual_bound:
            predicate: abs_residual_le_max_of_floor_and_fraction_of_observed
            absolute_floor_cycles: 64
