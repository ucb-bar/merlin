      emitter:
        status: existing
        entry: merlin.perf.barrier_arms.pair_from_emitter
        knobs:
          # THE TWO ARMS ARE TWO EMISSIONS OF ONE CAPSULE, which is what this family's own `regime`
          # and `negative_control` above already declare. Both halves resolve in this tree and each
          # target's own driver test exercises them: the entry point is
          # `barrier_arms.pair_from_emitter`, and the knob is `retire` on the target's own driver
          # emitter (`RETIRE_ONCE` is what a graded run emits; `RETIRE_PER_JOB` reproduces the
          # pre-hoist arm so the lever HAS a second side). An earlier revision retargeted this entry
          # on the belief that neither existed; both do, and the change reddened those tests.
          #
          # The pair is PROVEN rather than asserted: the cheap arm's lines must be a subsequence of
          # the expensive arm's, and every added line must be the same statement, so "the difference
          # is barrier count" holds by construction. NOTHING here knows how a barrier is spelled --
          # the statement is discovered as the line the two arms differ by. Measured on this corpus's
