[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "merlin-experiments"
version = "0.1.0"
description = "Explicit phase definitions and orchestration for Merlin experiments"
requires-python = ">=3.12"
dependencies = [
    "merlin", "pyyaml", "jsonschema>=4",
    "aet @ git+https://github.com/ucb-bar/agentic-eval-tool.git@903d4def8995e4697c6f214cc26c60a5a38d0554",
]

[project.optional-dependencies]
bedrock = ["boto3"]
# Immutable source archive: the Python package does not need example submodules.
# Official ucb-bar/chia main, verified 2026-09-29; AET remains independently pinned above.
chia = ["chialoops @ https://github.com/ucb-bar/chia/archive/dd976318012f1a9807a339bb7856da157cd24f87.tar.gz"]

[project.scripts]
merlin-phase2-public-diagnostic = "merlin_experiments.phase2.public_diagnostic_launch:main"
merlin-experiment = "merlin_experiments.cli:main"
merlin-evaluation-cohort = "merlin.targetgen.evaluation_cohort:main"
merlin-phase2-timing-study = "merlin_experiments.phase2.timing_study:main"
merlin-phase2-normal-timing-study = "merlin_experiments.phase2.ordinary_timing_study:main"

[project.entry-points."merlin.exact_offload_release"]
reviewed_phase0 = "merlin_experiments.corpus.release:verify_exact_offload_binding"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merlin_experiments = ["resources/*.json"]
"merlin_experiments.execution" = ["container_guardian.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same retention as the root config, which this file shadows when its tests run on their own:
# keep only the failing tests' trees from the last run, not every tree from the last three.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
