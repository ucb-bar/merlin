# Feature-extraction contract for the Gemmini ISA family. This is the data that used to be an
# `if fam == "gemmini"` branch in features/{roles,dispatch,loops}.py — moved here so the extractors
# stay framework-agnostic and the Gemmini specifics are one contract entry, not code.
family: gemmini
# markers.py: the kernel.target spellings that select this family (matched case-insensitively).
targets: [gemmini]
# roles.py: static RHS/weight-reuse proxy = accelerator compute ops issued per weight load-in.
rhs_reuse:
  method: compute_per_wload
  compute_token: compute_preloaded       # occurrences of the systolic compute op
  wload_tokens: [mvin2, mvin3]           # weight mvin ops (also *_mvin2 / *_mvin3 wrapper macros)
  label: compute per weight load         # plots.py: how this family's reuse count is measured
# dispatch.py: the accelerator dispatch opcodes counted for the small-dispatch metric.
dispatch:
  opcodes: [mvin, mvin2, mvin3, mvout, preload, compute_preloaded,
            config_ex, config_ld, config_st, fence]
  config_prefix: config                  # opcodes starting with this are config/setup dispatches
  compute_token: compute_preloaded       # the one non-overhead (real compute) dispatch
# loops.py: Gemmini's tiling marker is an explicit nested-scratchpad directive, not mere loop presence.
loops:
  tiling_is_directive: true
# markers.py: motif -> regex patterns over the family's C (library calls and RoCC wrapper macros).
# Single-quoted, so each string is the regex verbatim.
markers:
  # Packed RHS / weight staged into scratchpad and reused across compute.
  packed_rhs: ['\bmvin[23]\b', 'gemmini_extended\d*_mvin[23]?', 'sp_tiled_matmul']
  # Accumulator addressing (bit 31 / 0x40000000) + preloaded systolic compute.
  accumulator_lifetime: ['1u?\s*<<\s*31', '0x40000000',
                         'compute_preloaded', 'gemmini_extended_compute_preloaded']
  # Epilogue: bias loaded into the accumulator, or a non-NO_ACTIVATION config.
  epilogue_before_commit: ['mvin\s*\(\s*&?\s*bias',
                           'config_ex\([^)]*,\s*(?:RELU|GELU|IGELU)\b']
  # Manual double buffering / DMA overlap.
  double_buffering: ['\balt_wbuf\b', '\bcur_wbuf\b', '\bdb_sel\b']
  # Dataflow mode is explicit in config_ex.
  weight_stationary_dataflow: ['WEIGHT_STATIONARY', 'OUTPUT_STATIONARY']
  intrinsic_lowering: ['config_(?:ex|ld|st)\b', '\bpreload\b', 'compute_preloaded', '\bmvout\b']
