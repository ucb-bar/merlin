# yaml-language-server: $schema=none
# merlin schema (not yet formal JSON Schema; structured enough for validation).
title: CPU Coupling Measurements
purpose: >-
  Measured host/runtime coupling overhead for a workload, under different dispatch regimes
  (op-level vs batched command buffer). Consumed by merlin-dse-guidance to compute measured
  cpu_dispatch_ms / sync_ms per replan under flat vs multi-rate dispatch, and to upgrade the
  evidence tag of the command_batching / autonomous_K_loop axes from structural_bound to
  measured. When no such file (or aet run) is supplied, the tool reports the CPU-coupling
  result as unavailable rather than substituting constants. Owned by design-pressure/DSE.

required_top_level_fields:
  - workload
  - measurements

example: |
  workload: smolvla_action_head
  measurements:
    op_level_dispatch:
      host_submit_ns: 12000
      command_encode_ns: 3000
      sync_wait_ns: 8000
      source: measured
    batched_command_buffer:
      host_submit_ns: 15000
      command_encode_ns: 6000
      sync_wait_ns: 9000
      source: measured
