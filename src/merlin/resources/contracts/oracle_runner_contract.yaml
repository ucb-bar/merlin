# Oracle runner contract (experiment ABI v0.1)
# How the runner executes a package's lowered program and what it requires of the output.
version: "0.1"

oracle_ladder:
  - level: 0
    name: merlin_reference_and_simulate
    derived_from_rtl: false
    cycle_accurate: false
    always_runs: true
    gate: "reference_outputs(cb) == simulate(cb)['outputs'] (pure Python; no toolchain)"
  - level: 1
    name: "spike_{target}_functional"
    derived_from_rtl: false
    cycle_accurate: false
    skip_if_unavailable: true
    gate: "oracle_output == reference_outputs(cb) == simulate(cb) (bootstrap only, NOT certification)"
  - level: 2
    name: "{target}_verilator_rtl"
    derived_from_rtl: true
    cycle_accurate: true
    skip_if_unavailable: true
    gate: "oracle_output == reference_outputs(cb) == simulate(cb) (RTL certification)"
  - level: 3
    name: firesim
    derived_from_rtl: true
    deferred: true

# A skipped oracle is recorded as skipped (with reason) — NEVER silently treated as pass.

execution_artifact:
  description: "the RV64 ELF the runner builds from the package's lowered LLVM + a thin harness"
  harness_output_format:
    # The harness (and thus any package's runtime) MUST print results in this exact format,
    # parsed by the {target} runtime backend's parse_output (resolved through the registry:
    # merlin.runtime.backends.base.get_backend("{target}").parse_output).
    lines:
      - "OUT <name> <rows> <cols> <v0> <v1> ... <v(rows*cols-1)>   # row-major integer WORDS"
      - "METRIC <name> <int>                                       # e.g. METRIC cycles 308"
      - "DONE                                                      # MUST be reached"
    notes:
      - "outputs mapped by <name> back to the command buffer's committed tensor names"
      - "cycles are anchors, not a calibrated cost model; cycle_window = {target}_region"
      # A FLOAT RESULT IS DELIVERABLE OVER THIS PROTOCOL. The words on an OUT line are the destination
      # buffer's STORED CONTAINER, not necessarily a decimal number: a bare-metal harness has no float
      # formatting, and a decimal round-trip would be the lossy step anyway. So an output whose tensor
      # is DECLARED f32 is printed as the 32-bit pattern that was stored, one declared bf16/f16 as its
      # 16-bit pattern, and the runner decodes the value back from that declared dtype
      # (merlin.runtime.backends.base.decode_float_readback). The hand-back is lossless and the
      # declaration is what makes it readable -- so declare the output dtype you actually store.
      - "a float-declared output is carried as its stored bit pattern and decoded from that dtype"
      - "the harness sizes each buffer at its declared dtype's own storage width (a bf16 store is 2 bytes)"

correctness: >-
  each capsule's own numeric_policy: `exact_int` compares exactly across all three engines
  (reference, simulate, oracle); `tolerance_float` compares the oracle's decoded output against the
  capsule's independent golden within its declared atol/rtol.
