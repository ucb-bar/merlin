# WHAT EACH MEASURING INSTRUMENT'S VERDICT IS GOOD FOR.
#
# This project runs three instruments over the same program and they cost microseconds, minutes and
# about an hour respectively. All three emit a number called "cycles". Nothing declared what each
# one's verdict ESTABLISHES, so in practice the cheapest one that answered was believed, and the
# reporting path could not tell a ranking signal from an adjudicated measurement.
#
# ⚠️ THE CHECK THAT COULD NOT FAIL. The elaborated-RTL equivalence certificate compares OUTPUT BYTES
# and nothing else -- `evidence: output_bytes`, stated in src/merlin/targetgen/
# rtl_engine_policy.py's own docstring -- while the certificate producer WRITES the literal constants
# `cycle_accurate: true` and `fidelity: elaborated_rtl_cycle_accurate` into every document it emits,
# and the gate downstream then requires those fields to be true. They are true because they were
# typed, not because anything measured them. Two engines agreeing on output bytes is evidence about
# OUTPUTS; it is not evidence that either one's cycle count is the device's. That certificate sat
# under every timing claim the campaign made.
#
# ⚠️ AND THE NUMBERS THAT ACTUALLY LEFT THE PROJECT WERE NEVER ITS NUMBERS. The whole-model results
# this repo publishes are FireSim jobs: 43,900,637 and 41,373,659, against the 24,359,749 FSM control
# from job 728. Elaborated RTL was never the authority for anything publishable -- so declaring it a
# SEARCH SIGNAL takes nothing away from any existing result. It writes down what was already true.
#
# WHAT THIS FILE IS. The roster of rungs, as DATA -- the same posture as src/merlin/resources/contracts/storage.yaml
# (concerns) and src/merlin/resources/contracts/perf_reference_targets.yaml (program identities): adding or
# re-authorising a rung is a reviewed edit to a contract file, and no module may know what any
# particular rung is called. Read by src/merlin/perf/measurement_ladder.py.
#
# WHAT THIS FILE IS NOT. A fourth spelling of the ladder. Three already exist and each is right about
# its own axis:
#
#   * merlin.kernels.measurement.TIER_ORDER  -- the TIER a number was reached at, per target, with
#     `citable()` as the existing (claim-kind-blind) predicate. Every rung below binds to one of its
#     tiers, and a test holds the two together.
#   * merlin.targetgen.rtl_engine_policy.ENGINE_PRIORITY -- WHICH engine answers at the elaborated-RTL
#     fidelity, in cost order. Its docstring already says the load-bearing thing: "the cert tier is a
#     FIDELITY, not a simulator", and an engine adopted on an output-bytes certificate "has been
#     adopted on a narrower claim than this ranking implies". That sentence is this file's thesis.
#   * merlin.targetgen.runner_config.conventional_tier_sim() -- the capsule tier -> simulator map (L3 elaborated
#     RTL, L5 FireSim).
#
# The dimension NONE of them has is the one that was missing: authority is per CLAIM KIND. The
# elaborated-RTL rung is a perfectly good authority for a structural fact and for output equivalence,
# and is not an authority for a cycle count. `citable_tier` collapses all claim kinds into a single
# threshold and therefore cannot say that. `establishes:` below is that dimension.
version: 1

# ------------------------------------------------------------------------------------------
# CLAIM KINDS. What a verdict can be ABOUT. A rung establishes some of these and not others, and
# "not others" is a refusal, never a weaker version of the same claim.
# ------------------------------------------------------------------------------------------
claim_kinds:

  ranking:
    means: >-
      Candidate A is more expensive than candidate B on this device. An ORDER over candidates, with
      no statement about either one's magnitude. This is what a search loop consumes and it is the
      only thing a search loop needs.

  structure:
    means: >-
      A fact about the program as elaborated: how many commands it issues, which units it lands on,
      what its operand census is. Established by running or elaborating the design, not by timing it.

  output_equivalence:
    means: >-
      Two engines produced identical output bytes for identical inputs. A statement about RESULTS.
      It is what the equivalence certificate actually measures, and it says nothing about timing --
      which is the confusion this whole file exists to end.

  cycle_count:
    means: >-
      A cycle number that is the device's, quotable as a magnitude and as a ratio against another
      number of the same program identity and cycle scope. THE ONLY CLAIM KIND THAT REQUIRES
      ADJUDICATION: see `adjudicates_cycle_counts` below.

# ------------------------------------------------------------------------------------------
# THE RUNGS. Cheapest first. `establishes` is the authority; anything not listed is refused.
# ------------------------------------------------------------------------------------------
rungs:

  cost_proxy:
    summary: An analytic transaction-count model of what a schedule asks the device for.
    tier: static                    # merlin.kernels.measurement.TIER_ORDER
    engines: []                     # not an engine; arithmetic over the schedule
    implemented_by: merlin.perf.schedule_proxy
    cost: microseconds
    establishes:
      - ranking
    refuses:
      - structure
      - output_equivalence
      - cycle_count
    adjudicates_cycle_counts: false
    # STATED AS MEASURED NUMBERS, not as a property. Validated against 71 FireSim-measured ResNet-50
    # compute groups (queue jobs 759/760/761, bitstreams 0af6f26e / a9a190b9).
    evidence:
      kind: rank_correlation_against_adjudicated_points
      spearman_rho_uncalibrated: 0.920
      spearman_rho_calibrated: 0.978
      pairwise_decision_accuracy: 0.932
      median_absolute_relative_error: 0.43
      worst_absolute_relative_error: 1.05
      measured_points: 71
      adjudicated_by: fpga_firesim
      # The 71 points themselves, with the contraction each group presents and the machine the proxy
      # was scored with; tests/dse/test_schedule_proxy.py re-derives the figures above from it.
      points: examples/gemmini/phase2/schedule-proxy-validation.json
    why_not_cycles: >-
      The rank statistics are strong and the magnitude error is not: median 43%, worst 105%, with the
      slot cost FITTED ON THE SAME POINTS. A signal that orders candidates to 93.2% pairwise accuracy
      while being wrong by half on the number is exactly a ranking instrument, and quoting its output
      as a cycle count would be quoting a fit residual as a hardware fact. This rung declares that
      refusal so the reporting path can enforce it without importing any proxy.

  elaborated_rtl:
    summary: The elaborated design, simulated. A SEARCH SIGNAL and a structural oracle.
    tier: rtl                       # merlin.kernels.measurement.TIER_ORDER
    # Binds to merlin.targetgen.rtl_engine_policy.ENGINE_PRIORITY, which ranks these by COST because
    # their fidelity is equal. Which one answers is an availability decision; none of them is
    # promoted to a cycle authority by being chosen.
    engines: [vcs, gsim, verilator]
    capsule_tier: L3                # merlin.targetgen.runner_config.conventional_tier_sim()
    cost: minutes
    establishes:
      - ranking
      - structure
      - output_equivalence
    refuses:
      - cycle_count
    adjudicates_cycle_counts: false
    evidence:
      kind: output_bytes
      what_it_covers: >-
        Two engines ran the identical ELF and produced identical output bytes, encoded and digested.
      what_it_does_not_cover: >-
        Timing. Also halting behaviour, assertion reporting and timeout semantics -- measured on this
        project, a program violating a design assert makes one engine $stop and exit non-zero while
        the other prints the same assertion and runs to completion with exit_code 0.
    why_not_cycles: >-
      NOTHING HAS EVER ESTABLISHED THAT THIS RUNG'S CYCLE COUNT IS THE DEVICE'S. The fields that
      assert it -- `cycle_accurate: true`, `fidelity: elaborated_rtl_cycle_accurate` -- are literal
      constants a producer writes and a gate then requires to be true, which is a check that cannot
      fail. The evidence that DOES exist is output-byte equivalence, and output bytes are not cycles.
      This is not a claim that the rung's numbers are wrong; it is the statement that their agreement
      with hardware is UNMEASURED, and an unmeasured agreement is not an authority. Promote this rung
      to `adjudicates_cycle_counts: true` only by adding an `evidence` block of kind
      `cycle_agreement_against_adjudicated_points` with the measured points in it -- the same bar the
      cost proxy above had to clear to claim ranking.

  fpga_firesim:
    summary: The design on an FPGA. The rung that adjudicates a cycle number.
    tier: fpga                      # merlin.kernels.measurement.TIER_ORDER
    engines: [firesim]
    capsule_tier: L5                # merlin.targetgen.runner_config.conventional_tier_sim()
    cost: about an hour, queued, one job at a time
    establishes:
      - ranking
      - structure
      - output_equivalence
      - cycle_count
    refuses: []
    adjudicates_cycle_counts: true
    evidence:
      kind: the_device
      what_it_covers: >-
        The elaborated design executing on hardware, with the cycle count read out of the design's
        own counters and carried in a queued-FireSim receipt
        (merlin.perf.firesim_receipt, schema merlin_queued_firesim_receipt_v1).
    # ADJUDICATION IS NOT THE WHOLE OF QUOTABILITY. A FireSim number is still not comparable to
    # another one across devices, program identities or cycle scopes -- see
    # src/merlin/resources/contracts/perf_reference_targets.yaml, which is the contract for those three refusals and
    # is NOT restated here. This rung says the number is the device's; that file says which other
    # numbers it may stand beside.
    still_requires:
      - device
      - program_identity
      - cycle_scope

# ------------------------------------------------------------------------------------------
# PER TARGET. Which rungs exist, and which one adjudicates a cycle number.
#
# Target-parametric by construction: the module that reads this takes `target=` and knows no target
# name. A target absent from this section resolves to UNKNOWN -- never to a default rung. A default
# here would be a rung nobody chose, answering for a target nobody described, which is the silent
# degradation the whole ladder exists to stop.
# ------------------------------------------------------------------------------------------
targets:

  gemmini:
    rungs: [cost_proxy, elaborated_rtl, fpga_firesim]
    cycle_adjudicator: fpga_firesim
    notes: >-
      All three rungs are live here and the published whole-model numbers are FireSim jobs. The cost
      proxy's own calibration points were measured on this target.

  gemmini_universal:
    rungs: [cost_proxy, elaborated_rtl, fpga_firesim]
    cycle_adjudicator: fpga_firesim

  muon:
    rungs: [elaborated_rtl]
    cycle_adjudicator: UNKNOWN
    notes: >-
      NO ADJUDICATING RUNG EXISTS FOR THIS TARGET. Stated rather than omitted: a cycle number from
      this target is unadjudicated, and the reporting path must mark it so rather than quote it. This
      is not a defect in the target, it is the absence of an FPGA image for it.

  atlas:
    rungs: [elaborated_rtl]
    cycle_adjudicator: UNKNOWN
    notes: >-
      As muon: elaborated RTL only, so nothing here adjudicates a cycle count.

  radiance:
    rungs: [elaborated_rtl]
    cycle_adjudicator: UNKNOWN
    notes: >-
      As muon: elaborated RTL only, so nothing here adjudicates a cycle count.
