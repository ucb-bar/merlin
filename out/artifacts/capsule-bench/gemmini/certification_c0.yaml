# Gemmini C0 certification — RTL-certified.
#
# A C0 correctness certificate and measured cycle anchor. NOT a generalized calibrated
# cost model. Generated by running the Merlin C0 command buffer through gemmini_codegen ->
# riscv gcc -> the Gemmini Verilator RTL sim, and gating three-way bit-exact equality:
#   RTL output == reference_outputs(cb) == simulate(cb).
target: gemmini
status: rtl_certified
conformance_level: C0

workload:
  name: repeated_rhs_matmul
  dtype: i8xi8_to_i32
  epilogue: none
  output_dtype: i32
  shapes: {m: 16, k: 16, n: 16}    # single DIM x DIM tile
  tensors_seed: deterministic       # merlin Tensor.deterministic (name+shape)

oracle:
  level: 2
  kind: rtl_verilator
  derived_from_rtl: true
  config: GemminiAndOPUShuttleConfig
  simulator_command: "simulator-chipyard.harness-GemminiAndOPUShuttleConfig <elf>"
  chipyard_sha: 6a9b4cd9
  gemmini_sha: 8c3f992
  merlin_sha: 66abb8c
  memory_model: unknown            # Verilator sim memory timing not characterized (FireSim/FASED is realistic)

comparisons:
  merlin_reference_outputs: pass
  merlin_command_buffer_simulator: pass
  rtl_outputs: pass

metrics:
  cycles: 241
  cycle_source: rdcycle
  cycle_window: gemmini_region

notes:
  - "C0 correctness certificate + measured cycle anchor; NOT a generalized calibrated cost model."
  - "Level 2 Verilator and Level 3 FireSim share the same RTL for functional correctness; FireSim upgrades scale and memory-timing fidelity, not basic correctness."
  - "Also bootstrapped on spike-gemmini (functional model, derived_from_rtl: false) — see bootstrap path; spike results are never marked rtl_certified."
  - "Cycle count is a single anchor at one shape; not predictive across shapes/reuse/dtype."
