# GENERATED-EDITABLE residual side-input for the target-agnostic capability deriver (merlin.targetgen.capability_manifests.manifest_for). Provenance-tagged; requires_human_review. This is the human intent/prose the RTL facts cannot ground; the mesh / memory capacities / datapath dtypes / encoding codes are layered on from facts.json when 'facts_source: rtl'. Regenerable but hand-owned.
# facts_source: rtl + facts_target: gemmini — mx-gemmini is a config variant of gemmini (same generator,
# same RoCC custom3 decoder, same 16x16 WS mesh); its STRUCTURAL facts (funct_decode_table -> endpoint,
# mesh geometry) are gemmini's, so we ground them from gemmini's RTL facts. Only the MX datapath (dtypes,
# block scale, requant) differs and stays in the compute_units below / mx_ref goldens — never inherited
# from gemmini's int8 datapath. This derives endpoint_kind (inline_asm_insn) + mesh 16x16 instead of
# defaulting/hardcoding them.
facts_source: rtl
facts_target: gemmini
capabilities:
  ops:
  - matmul
compiler_obligations:
- must_tile_to_mesh_shape
- must_supply_e8m0_block_scales
compute_units:
- accumulate:
  - acc: f32
    in: mxfp4
    weight: mxfp4
  - acc: f32
    in: mxfp6
    weight: mxfp6
  - acc: f32
    in: mxfp8
    weight: mxfp8
  - acc: i32
    in: int8
    weight: int8
  dtypes:
  - mxfp4
  - mxfp6
  - mxfp8
  - int8
  - bf16
  kind: systolic
  name: mx_pe
  ops:
  - matmul
  requant:
    ref: mx_gemmini.mx_requantizer
  scaling: block_e8m0
  # Semantic-family capability (ARR denominator): the MX PE is a matmul-only tensor tile — contraction
  # over the micro-scaled + int8 formats. It has no reduction/elementwise/softmax hardware of its own, so
  # a whole attention/normalization region is only partially eligible (its contractions, not the rest).
  semantic_capabilities:
  - {family: contraction, dtypes: [mxfp4, mxfp6, mxfp8, int8, bf16]}
family: tensor_resident
features:
- systolic_array
- microscaling
- resident_packed_tensor
- accumulator_commit
hardware_promises:
- microscaling_block_exponent
- widening_accumulate
legality:
- mx block-scale granularity == 32
memory_model:
  accumulators: true
  block_scale_memory: true
  resident: true
name: mx_gemmini
provenance: 'chipyard generators/gemmini (branch gemmini-mx) MxParameters.scala: mxGemminiConfig=[mode0(fp4/fp4), mode4(fp6/fp6), mode8(fp8/fp8)]; block scale via ScaleFactorMem + MxExp (E8M0) + QuantLut. TypeSupport permits independent act/wei modes (not enumerated here — shipped config is symmetric).'
requires_human_review: true
runtime:
