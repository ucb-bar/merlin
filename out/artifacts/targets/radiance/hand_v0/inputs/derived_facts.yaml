abstraction_features:
- simt
- cvfpu
- tensor_core
- microscaling
- resident_packed_tensor
- accumulator_commit
- command_buffer
- metrics
generator: radiance-derive-facts-v2
lanes_per_warp: 16
provenance:
  features:
    accumulator_commit: compute_units[].accumulate declares an accumulator dtype
    command_buffer: 'runtime.default_backend: simulator'
    metrics: 'runtime_promises: metrics'
    resident_packed_tensor: 'memory_model.resident: true'
  lanes_per_warp: capabilities.simt.lanes_per_warp from the committed manifest
  resident_storage_bytes: TapeoutSmemConfig.size in RadianceConfigs.scala, reached
    from class RadianceMuonConfig -> WithRadianceCluster(smemConfig=...); corroborated
    by MU_SMEM_SIZE_BYTES in mu_intrinsics.h (header witness absent)
  smem_aperture_bytes: "1 << SMEM_LOG_SIZE from VX_config.h \u2014 the ADDRESS WINDOW,\
    \ not the capacity (the same header derives IO_BASE_ADDR from it); never size\
    \ a tile against this"
  smem_banks: TapeoutSmemConfig.numBanks
  smem_depth_rows: size / row_bytes / banks (the generator's own division)
  smem_row_bytes: TapeoutSmemConfig.numWords * wordSize
  warps_per_core: capabilities.simt.warps_per_core from the committed manifest
resident_storage_bytes: 131072
smem_aperture_bytes: 524288
smem_banks: 4
smem_depth_rows: 512
smem_row_bytes: 64
warps_per_core: 8
