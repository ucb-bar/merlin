# Lowering tables for the isolated radiance package (run hand_v0). Data, not core code.
#
# A SIMT cluster stages an operand into shared scratchpad rather than packing it into a systolic
# feed, so interface.resident_pack maps to radiance.stage and resident_evict to radiance.release.
# The command-buffer opcodes are the target-independent ABI: the runtime layer must not need to know
# which of the two shapes produced them.
interface_to_target:
  interface.resident_pack: radiance.stage
  interface.matmul: radiance.matmul
  interface.elementwise: radiance.elementwise
  interface.commit: radiance.commit
  interface.resident_evict: radiance.release
target_to_opcode:
  radiance.stage: RES_PACK
  radiance.matmul: MATMUL_RESIDENT
  radiance.elementwise: VECTOR_MAP
  radiance.commit: COMMIT
  radiance.release: EVICT
