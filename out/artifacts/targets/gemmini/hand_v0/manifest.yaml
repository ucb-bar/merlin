# Isolated target-package manifest (one generation round).
target: gemmini
run_id: hand_v0
family: tensor_resident
origin: hand_curated             # legacy alias of authoring.mode (kept for back-compat)
dialect_format: xdsl_prototype   # xDSL-first; export C++/ODS(TableGen) to artifacts/ once stable
status: rtl_certified            # C0-C5 + Q0-Q1t three-way bit-exact on Gemmini Verilator (see results/)

# Provenance / authoring mode — HONEST labeling (the Level A/B/C distinction).
#   hand_curated                     : a human wrote the dialect/contract/lowering (this package)
#   agent_generated_from_recipe      : agent wrote it given an ISA recipe (the C kernel slot)
#   agent_generated_from_rtl_facts   : agent proposed the spec FROM recorded RTL facts (the thesis)
#   deterministic_generated_from_spec: a generator emitted the package from a spec
authoring:
  mode: hand_curated
  generated_by_agent: false
  generated_from_rtl_facts: false
  author: human
reproducibility:
  # The CERTIFICATION is reproducible (re-run the recorded dispatcher sweep); the PACKAGE itself
  # is NOT regenerable from recorded inputs yet — it was hand-authored. This is the gap that
  # artifacts/targets/gemmini/agent_spec_v0 is meant to close.
  certified_execution_reproducible: true
  target_generation_reproducible: false

# Recorded RTL-derived evidence this package is CONSTRAINED by (Level B). These facts are
# extracted by merlin.targetgen.rtl.introspect and reproduce the hand-curated capacities; they
# did NOT author the package, they bound it.
inputs:
  rtl_facts: inputs/rtl_facts.yaml   # generator rtl-introspect-v1-grep-firrtl (NOT a CIRCT pass yet)
  source: "generators/gemmini/src/main/scala/gemmini/Configs.scala (GemminiAndOPUShuttleConfig)"
outputs:
  dialect_module: dialect.py
  lowering: lowering.yaml
validation:
  facts_match_contract: true         # introspect.validate_against_contract -> no problems
  package_loads_isolated: true       # merlin.targetgen.registry.load_target
  certification: "results/gemmini/certification_{mlir_battery,quant_layer}.yaml; recorded runs under runs/gemmini_cert/"
artifacts:
  exported: []                  # C++/TableGen final artifacts go here once the design settles
notes: >-
  Loaded via merlin.targetgen.registry.load_target — NOT hardcoded into the core lowering tables.
  Multiple rounds coexist under artifacts/targets/gemmini/<run_id>/. This is the Level A
  (RTL-certified backend) + weak Level B (RTL-constrained) package; Level C (RTL-derived,
  agent-proposed spec) is the agent_spec_v0 milestone.
