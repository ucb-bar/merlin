# GENERATED-EDITABLE residual side-input for the target-agnostic capability deriver (merlin.targetgen.capability_manifests.manifest_for). Provenance-tagged; requires_human_review. This is the human intent/prose the RTL facts cannot ground; the mesh / memory capacities / datapath dtypes / encoding codes are layered on from facts.json when 'facts_source: rtl'. Regenerable but hand-owned.
capabilities:
  ops:
  - matmul
compiler_obligations:
- must_tile_to_mesh_shape
- must_supply_e8m0_block_scales
compute_units:
- accumulate:
  - acc: bf16
    in: fp8_e4m3
    weight: fp8_e4m3
  - acc: f32
    in: fp8_e4m3
    weight: fp8_e4m3
  dtypes:
  - fp8_e4m3
  - bf16
  kind: systolic
  name: mxu
  ops:
  - matmul
  requant:
    ref: atlas.e4m3_block_requant
  scaling: block_e8m0
  # The ARR denominator: what the SILICON can execute, independent of what the compiler lowers today.
  # PROPOSED here and RE-AUDITED on every run by merlin.targetgen.capability_derive against this
  # target's own evidence -- the structural ISA role census (a role comes from each instruction's typed
  # operands, never its mnemonic) plus the RTL facts. `capability_evidence.drift` in the derived
  # contract is that audit; a disagreement is an error, not a note.
  #   contraction     <- ISA role 'matmul'   (MXUMatMul)
  #   elementwise_map <- ISA roles 'tensor_compute_unary' / 'tensor_compute_binary' (standalone vector
  #                      ops) and 'acc_readout_scaled' (the fused requant epilogue)
  #   movement        <- ISA role 'memory'   (TensorBaseOffset)
  # reduction and synchronization are deliberately ABSENT rather than denied: the role census cannot
  # separate a reduction from an elementwise map (both are TensorComputeUnary), so the deriver reports
  # them UNKNOWN and they are excluded from BOTH sides of the ratio instead of being scored either way.
  semantic_capabilities:
  - family: contraction
    dtypes: [fp8_e4m3, bf16]
    ranks: [2]
  - family: elementwise_map
    dtypes: [fp8_e4m3, bf16]
  - family: movement
    dtypes: [fp8_e4m3, bf16]
facts_source: rtl
family: tensor_resident
features:
- systolic_array
- fp8_mxu
- microscaling
- bf16_accumulate
hardware_promises:
- fp8_multiply
- bf16_accumulate
legality:
- matmul tiles to the 32x32 mesh
memory_model:
  accumulators: true
  block_scale_memory: true
  resident: true
name: atlas
provenance: endpoint_kind + capabilities.mesh + encoding codes are DERIVED from the pinned mlc CIRCT facts (a 42-entry ScalarDecoder decode of 14-bit opcodes — too wide for RoCC funct7 -> self-hosted ISA -> external_backend; a 32x32 discovered array -> mesh). The compute-unit datapath (inputFmt=E4M3 fp8 activation+weight; accumFmt=outputFmt=BF16, with an FP32Addition PE variant; E8M0 block scale via ScalingFactorRegFile) is DECLARED intent from the atlas-npu chipyard generator (MxuParams.scala) — NOT yet RTL-grounded (dtypes are absent from this facts.json schema; pending mlc datapath discovery). NOT RTL-certified.
requires_human_review: true
runner:
  fourth_output_name: kernel.S
  model_ext: npu_model
  # Run-identity dtype token (the fp8 E4M3 activation/weight format; accumulate/output is BF16). Without
  # this the shared runner's manifest-derived RunnerConfig defaults to the gemmini i8xi8_i32 token, which
  # would MISLABEL an atlas run's identity (the float grading itself rides each capsule's numeric_policy).
  dtype: fp8_e4m3
# Oracle ladder (informational parity with the other targets): the merlin reference + the npu_model
# functional bootstrap are NOT RTL-derived; the mlc arc cosim is the RTL-derived functional gold; the
# program-driven Verilator sim is the RTL-certified tier (additive, present only when a vsim is wired).
oracle_ladder:
  level_0: {name: merlin_reference, derived_from_rtl: false}
  level_1: {name: npu_model_functional, derived_from_rtl: false}
  level_2: {name: mlc_arc_cosim, derived_from_rtl: true}
  level_3: {name: program_verilator_rtl, derived_from_rtl: true}
runtime:
  default_backend: simulator
runtime_promises:
- metrics
status: prototype
version: '0.1'

# Families this target DECLARES (the hardware has them) but whose probes cannot yet be turned
# into a runnable capsule. Recorded with a reason rather than left silent: a family that is
# declared, probed and never graded is an untested claim, and the coverage gate refuses to let
# one hide as an empty `skipped` list.
unmaterializable_families:
  elementwise_map: >-
    no probe path today: an elementwise capsule is authored through the PyTorch/linalg source with a host-eager golden (needs the m2m venv, so not a deterministic offline probe), and capsule_golden._recompute_golden has no elementwise op, so it cannot be graded at all on an exact-integer datapath.
    Needs a merlin_iface elementwise mnemonic + a recompute entry.
