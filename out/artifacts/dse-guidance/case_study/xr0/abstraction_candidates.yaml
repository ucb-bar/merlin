    legality: structural
    quantification_blocked_by: missing_calibration
  system_abstraction_needed: resident_weight_object
  what_is_not_claimed:
  - speedup
  - cycle_reduction
  - energy_reduction
  - accuracy
  why_this_exists:
    attributed_facts: &id001
      activation_bytes_per_invocation: 6053888
      activation_bytes_total: 30269440
      invocations: 5
      macs_per_invocation: 1114798080
      macs_total: 5573990400
      matmul_count: 17
      weight_bytes: 169086976
