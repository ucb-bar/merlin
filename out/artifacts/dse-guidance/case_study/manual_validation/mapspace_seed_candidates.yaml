  - workload: bitvla
    op_class: attention_contraction
    shape: {M: 32, K: 32, N: 32}
    multiplicity: 4        # identical-shape instances (layers)
    macs_total: 1048576
    equation: "C[M,N] += A[M,K] * B[K,N]"
    loops: [M, N, K]
    operands: {A: activation, B: activation, C: output}
    legal_spatial_axes: [M, N, K_with_reduction]
    legal_temporal_axes: [M, N, K]
    bypass_candidates: {A: possible, B: possible, C: possible}
