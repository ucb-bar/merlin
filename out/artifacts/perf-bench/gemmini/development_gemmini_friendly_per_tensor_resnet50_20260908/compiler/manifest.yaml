    argv: ["{tool}", "--source-convolution", "--convert-iface-to-gemmini", "--emit-target-artifact", "{input_mlir}"]
  emit_analysis_bundle:
    argv: ["{tool}", "--source-convolution", "--convert-iface-to-gemmini", "--emit-command-buffer={output_json}", "--emit-target-artifact", "{input_mlir}"]

optimization_surfaces:
  - id: native_aligned_i32_bias_scalar_epilogue
    scope: canonicalization
    path: mlir_oot/frontend/native_aligned_epilogue.py
    symbol: fold
    effects: [fusion, movement, encoding]
    cca_axes: [compute.epilogue, communication.intermediate_materialized,
      communication.resident_across_calls]
    mechanism: >-
      Under the explicit native_aligned_i32_bias_scalar_requant_v1 contract, recognize an i32
      bias whose scale is exactly the float32 product of the two scalar operand scales, combine
      those scales with the static output scale once, and form accumulator bias followed by one
      scalar round-even/saturating i8 readout with optional ReLU.
    emitted_delta: >-
      Replace the represented f32 bias/QDQ traversal and full-width accumulator boundary with a
      repeating i32 D preload plus target CONFIG_ST scale and native i8 readout.
    validation: >-
      Independently re-recognize the canonical source form at target selection; exercise exact
      boundary values and optional ReLU; refuse mismatched bias scale, nonzero zero point, and a
      non-column bias; compile the complete public ResNet source under a 120-second cap.
    abandonment: >-
      Default off for every other integer contract. Refuse dynamic/nonpositive scales, nonzero
      zero points, non-i32 bias, shared or malformed chains, non-round-even quantization, and any
      bias that is not Gemmini's hardware N axis.
  - id: exact_per_tensor_qdq_layout_reuse
    scope: canonicalization
    path: mlir_oot/frontend/gemmini_friendly_quant.py
    symbol: _static_per_tensor_i8_layout_chain
    effects: [movement, memory_planning, fusion]
    cca_axes: [communication.intermediate_materialized, memory.capacity_fit]
    mechanism: >-
      Commute a calibrated symmetric per-tensor i8 value and its scalar scale through statically
      proven reshape, transpose, zero-pad, and pure-gather operations before integer contraction.
    emitted_delta: >-
      Rebuild only layout operations on i8 and erase the replaced f32 expansion chain; preserve the
      exact captured qvalue and scale rather than introducing a second dynamic quantizer.
    validation: >-
      Require exact zero point and padding, static shapes, pure gather bodies, focused refusal tests,
      108/108 full-model operand reuse, and unchanged 54-task accelerator coverage.
    abandonment: >-
      Refuse computed transforms, nonzero padding/zero points, shared unsafe chains, unsupported
      ranks, or any graph whose post-rewrite verifier or numerical contract does not hold.
  - id: linear_global_task_provenance_tagging
    scope: codegen
    path: mlir_oot/codegen/builder.py
    symbol: FnBuilder._decorate
    effects: [compile_time]
    cca_axes: [envelope.runtime_calls]
    mechanism: >-
      Attach the active global-task attribute when each LLVM operation is inserted, rather than
      rescanning every accumulated CFG block after every scheduled task.
    emitted_delta: >-
      Preserve task ownership while reducing attribution work from tasks times accumulated blocks
      to one visit per newly inserted operation.
    validation: >-
      Unit-test insertion and absence of whole-CFG rescans; compile the full 109-task graph under a
      120-second cap; require all task IDs -1 through 108 in the verified output.
    abandonment: >-
      Revert if any inserted operation loses or changes task ownership, or if a construction path
      bypasses the scoped builder without an explicit owner.
  - id: accuracy_bounded_global_requantization_regions
    scope: heuristic
    path: mlir_oot/frontend/requantization_contract.py
    symbol: evaluate_accuracy_gate
    effects: [fusion, movement, encoding]
    cca_axes: [communication.intermediate_materialized, communication.resident_across_calls,
      layout.operand_major, memory.capacity_fit]
    mechanism: >-
      Preserve an exact target-neutral quantized-epilogue contract (scale granularity and axis,
      zero points, bias domain, ordered stages, rounding and saturation), prefer universal proof,
      and otherwise admit native narrow readout only under an explicit normalized-source/site/
      semantic-contract-bound held-out accuracy budget supported by the target capability.
      Post-selection formation joins maximal dependency-connected accelerator regions across one
      retained physical encoding and reports every remaining host operation and refusal.
    emitted_delta: >-
      For a passing opt-in site, replace the full-width accumulator readback plus host f32/QDQ
      chain with the declared native scalar-scale i8 readout, retain compatible encoded values
      across consumers, and delete the represented host operations and i32 boundary. Exact-default
      behavior and all failing or absent-policy sites remain unchanged.
    validation: >-
      Recompute candidate outputs from held-out i32 accumulator/channel samples; check source,
      semantic, dataset, independent-reference and output hashes; enforce sample/channel coverage,
      maximum and mean LSB error, mismatch and saturation-mismatch budgets; verify target stage
      order/capability; run focused exact/refusal/stale-evidence/whole-region tests and all fixed
      portfolio compile gates.
    abandonment: >-
      Refuse absent or false opt-in, stale/ambiguous evidence, training rather than held-out data,
      missing provenance, unsupported target scale/bias/zero-point/order, inadequate channel
      coverage, any exceeded error dimension, or a host/layout boundary that prevents region
      joining. Never relabel empirical qualification as all-input equivalence.
  - id: global_model_partition_and_batched_contraction
