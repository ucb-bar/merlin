  - id: row_major_address_strength_reduction
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg
    effects: [movement, tiling]
    cca_axes: [memory.access_pattern, envelope.calls_in_loop]
    mechanism: >-
      Build statically bounded row-major tensor offsets with a Horner recurrence, and decode
      bounded flat indices with a minor-to-major mixed-radix recurrence whose final quotient is
      the highest non-unit coordinate; specialize unit extents and unit divisors while retaining
      the source loop nest, tensor representation, and exact element access order.
    emitted_delta: >-
      Delete redundant host integer multiply, add, divide, and highest-axis remainder operations
      used only for tensor address calculation; retain every load, store, scalar computation,
      allocation, source operation, dependency, accelerator command, and boundary payload.
    validation: >-
      Recompile the fixed complete graph and require exact source/task/CFG coverage, unchanged
      graph and plan digests, logical dispatch, accelerator work, movement payload, storage,
      synchronization and ABI, with fewer host integer operations and no machine-site increase;
      qualify the actual changed host indexing mechanism when a witness is available.
    abandonment: >-
      Revert if index bounds are not static and non-negative, full-model analysis changes any
      access count, payload, source/dependency/dispatch field, or synchronization, the intended
      integer-operation delta is absent, machine sites increase, or semantic qualification fails.
  - id: pipeline_issue
    scope: codegen
    path: mlir_oot/lowering/schedule.py
    symbol: Scheduler.contraction
    effects: [issue, latency_hiding, tiling]
    cca_axes: [dispatch.loop_offloaded, dispatch.descriptor_reuse,
      dispatch.dma_overlap, spatial.accumulator_resident,
      communication.resident_across_calls, memory.capacity_fit]
    mechanism: >-
      Select the pinned target LOOP_WS endpoint sequencer for capacity-bounded bias-free
      i8 by i8 contractions whose emitted boundary is the exact raw i32 accumulator form;
      retain the explicit schedule for bias initialization and narrowed native readout.
    emitted_delta: >-
      Replace repeated host-issued load, preload, compute, and readout commands with one
      descriptor sequence per capacity block, carrying later K-block partial sums through
      the descriptor's explicit D input without changing source arithmetic or tensor ABI.
    validation: >-
      Recompile the fixed complete graph, require exact source/task/CFG coverage, unchanged
      logical dispatch, contraction MACs and boundary payload, and verify every descriptor's
      bounds, strides, offsets, capacity, accumulator continuation and decoded opcode fields;
      qualify the changed contraction mechanism and profile only an admitted reduced witness.
    abandonment: >-
      Retain the explicit schedule for bias, non-i32 or activated/scaled readout, invalid
      capacity or representation; revert if whole-model emission has no descriptor delta,
      changes source/dependency coverage, arithmetic, payload, or fails semantic qualification.
  - id: one_use_pointwise_reduction_fusion
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._lazy_pointwise
    effects: [fusion, movement, encoding]
    cca_axes: [compute.reduction_form, compute.epilogue,
      communication.intermediate_materialized]
    mechanism: >-
      Preserve the exact authored one-use full-shape pointwise-to-reduction fusion;
      the source-native reduction visits each producer input element exactly once,
      retaining producer rounding and reduction order.
    emitted_delta: >-
      Delete the producer materialization, stores and reloads without changing
      floating arithmetic, conversions or reduction initialization semantics.
    validation: >-
      Compile all complete frozen model graphs with this single compiler, require
      verified source/plan/CFG ownership, and preserve the original scoped authored
      numerical receipt rather than claiming the merge is a new agent experiment.
    abandonment: >-
      Refuse fanout, mismatched reduction input shape, output initializer use or
      cross-task producer consumers. Do not reassociate or reorder reduction arithmetic.
  - id: one_use_reduction_pointwise_fusion
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg
    effects: [fusion, movement]
    mechanism: >-
      Keep a final-axis scalar reduction recurrence lazy when its result has exactly one
      same-segment pointwise consumer whose input map is bijective, so the consumer evaluates
      each reduced element once without an intervening memory-backed tensor.
    emitted_delta: >-
      Remove the reduction-result allocation, final reduction stores, and matching pointwise
      input loads while retaining every initializer read, source reduction step, dtype rounding,
      pointwise scalar operation, source operation identity, and dependency.
    validation: >-
      Recompile every fixed portfolio member and require unchanged graph ownership, ABI,
      accelerator work, command stream and dispatch structure, with a per-affected-model decrease
      in host allocation and load/store payload; qualify the host-selected changed reduction chain.
    abandonment: >-
      Retain materialization for non-final or multi-input reductions, fanout, boundary results,
      broadcast/constant/non-bijective consumer maps, dynamic shapes, or any readiness, semantic,
      source-ownership, work, movement, or per-model host-cost regression.
  - id: uniform_map_before_padded_gather
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._emit_commuted_gather
    effects: [encoding, movement, fusion]
    cca_axes: [memory.access_pattern, layout.transpose_materialized,
      communication.intermediate_materialized]
    mechanism: >-
      Evaluate a uniform pure scalar chain on each interior input and the constant padding
      scalar once, then gather transformed values through original bijective encodings.
      Candidate-only gather_commute.py proves source geometry, bounds and one-use ownership,
      complete interior source coverage, and at least one original padding access.
    emitted_delta: >-
      Delete repeated floating point/conversion work and float padded materialization;
      retain exact scalar rounding and transformed padding, encoded padded storage and
      final boundary stores. No native saturated output substitution is involved.
    validation: >-
      Require full source/task/CFG coverage and unchanged accelerator commands; compare
      actual dynamic scalar work and payload, then run reduced overlapping padded source
      witnesses including negative values and nonzero transformed padding controls.
    abandonment: >-
      Refuse unknown index bounds or incomplete/unproved source coverage, unused padding,
      nonconstant padding, nonuniform side inputs, fanout,
      nonbijective views, nonboundary sinks, or an interior-plus-padding evaluation count
      not strictly smaller than the original gather count.
  - id: bounded_readonly_gather_view
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._lazy_gather_view
    effects: [encoding, movement, fusion]
    cca_axes: [memory.access_pattern, layout.transpose_materialized,
      communication.intermediate_materialized]
    mechanism: >-
      Compose a statically bounded readonly tensor gather through single-use bijective
      reshape/transpose views into an equal-domain pure pointwise consumer; index range
      proof is implemented by mlir_oot/codegen/gather_view.py.
    emitted_delta: >-
      Delete the float or integer gathered tensor allocation, initializer, stores and
      reloads while preserving every source read, index evaluation and scalar operation.
    validation: >-
      Verify complete source/task/CFG ownership, unchanged accelerator stream and scalar
      arithmetic counts, plus actual-source reduced overlapping/padded gather witnesses.
    abandonment: >-
      Refuse unknown or overflowing integer bounds, out-of-bounds source indices,
      fanout, non-bijective views, output accumulator reads and cross-task consumers.
  - id: single_consumer_pointwise_fusion
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._lazy_pointwise
    effects: [fusion, movement, encoding]
    cca_axes: [compute.epilogue, communication.intermediate_materialized,
      coverage.non_contraction_op_fraction]
    mechanism: >-
      Inline a pure scalar producer into its unique pointwise consumer or full-shape
      reduction input, optionally through a one-use element-count-preserving chain of
      reshape/collapse/expand and verified transpose views. Preserve every scalar operation,
      dtype rounding and evaluation count; broadcast and slicing are not bijective views.
    emitted_delta: >-
      Remove intermediate allocation, initialization, store and reload operations;
      retain floating arithmetic, width conversions and accelerator commands.
    validation: >-
      Verify the complete source/task plan and compare emitted dynamic host work and payload;
      prove each traversed view is bijective and execute an actual changed reduced composed-map
      witness with shape-changing views, signed overflow and f32 rounding.
    abandonment: >-
      Refuse fanout, broadcast, slice, element-count change, invalid transpose, partial-domain
      or multi-use reduction consumers, output accumulator use, unknown indexing, non-scalar
      effects and cross-task consumers. No arithmetic reassociation.
  - id: lazy_affine_copy_encoding
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._lazy_copy_map
    effects: [encoding, movement, fusion]
    cca_axes: [layout.transpose_materialized, memory.access_pattern,
      communication.intermediate_materialized]
    mechanism: >-
      Represent a same-dtype, pure-copy, all-parallel affine generic with proven in-bounds
      indexing as a lazy reindexing view for one consumer in the same host segment.
    emitted_delta: >-
      Delete intermediate allocation, initialization, copy stores and unused output loads;
      preserve consumer payload loads and arithmetic and every source/task dependency.
    validation: >-
      Compare complete-model emitted dynamic host work and payload bytes; independently
      execute reduced signed-integer and float affine-copy consumers with negative inputs.
    abandonment: >-
      Decline fusion on unknown bounds, non-permutation output indexing, dtype mismatch,
      output-accumulator use, fanout, unknown consumer effects or task-boundary crossing.
  - id: direct_pointwise_boundary_store
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._lazy_segment_output
    effects: [fusion, movement, encoding]
    cca_axes: [compute.epilogue, communication.intermediate_materialized,
      envelope.runtime_calls]
    mechanism: >-
      Defer a pure pointwise result with static in-bounds projected indexing until the host
      segment writes its declared boundary output, optionally following an exclusive chain of
      element-count-preserving reshape/collapse/expand or verified transpose views. Recognize
      the source result of target-neutral quantization normalization, reject any same-segment
      consumer beyond that view chain, and evaluate every scalar operation and dtype rounding
      exactly once per output element directly at the existing boundary store.
    emitted_delta: >-
      Remove the pointwise result's private stack allocation, initialization, element stores,
      and reloads while retaining the required DRAM boundary buffer and its stores, every source
      scalar operation, all later device or host reads, and the global task dependency order.
    validation: >-
      Recompile the fixed complete model with analyze-whole-model; require verified source/task
      coverage and CFG dependencies, identical logical dispatch and accelerator work, unchanged
      boundary payload, and reduced host allocations, loads, and stores attributable to the
      terminal pointwise maps; qualify normalized pointwise and bijective-view boundary chains
      with shape-changing and transpose controls in an admitted reduced witness.
    abandonment: >-
      Materialize normally for a non-pointwise op, unknown or out-of-bounds indexing, output
      accumulator use, dynamic or non-scalar effects, fanout, non-bijective or dtype-changing
      views, a same-segment consumer beyond the exclusive view chain, or any analysis change to
      source/task coverage, logical dispatch, boundary payload, or accelerator work.
  - id: dead_pointwise_initializer_elision
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._t_linalg_generic
    effects: [movement, fusion]
    cca_axes: [communication.intermediate_materialized, envelope.runtime_calls]
    mechanism: >-
      For a statically bounded all-parallel linalg.generic whose output indexing map is a full
      permutation and whose scalar body does not read the outs block argument, allocate the
      unfused result without copying its dead initializer; fanout and task boundaries still force
      result materialization, while every result element is written exactly once.
    emitted_delta: >-
      Remove only initializer loads, address calculations, and stores for otherwise materialized
      pointwise results; retain the result allocation, every source scalar operation, every final
      result store and all consumers, task boundaries, accelerator commands, and dependencies.
    validation: >-
      Recompile the fixed complete model with analyze-whole-model; require verified source/task
      coverage and CFG dependencies, identical logical dispatch, accelerator work, boundary
      payload, and synchronization, with reduced host dynamic stores attributable to pointwise
      tasks; qualify the actual changed region with the host-selected semantic witness.
    abandonment: >-
      Materialize the initializer normally if the scalar output argument is used, any iterator is
      non-parallel, the output map is not a full permutation, bounds or scalar effects are unknown,
      or whole-model analysis changes source/task coverage, dependencies, dispatch, accelerator
      work, boundary payload, or synchronization.
  - id: retire_nested_host_epilogue_hazard_frontier
    scope: heuristic
    path: mlir_oot/lowering/schedule.py
    symbol: Scheduler.run
    effects: [synchronization, issue, latency_hiding]
    cca_axes: [communication.fences, dispatch.dma_overlap]
    mechanism: >-
      When a contraction uses a non-native readout, its mandatory fence retires all prior
      accelerator accesses before the synchronous host epilogue writes the declared destination;
      clear the device hazard frontier and continue tracking that destination as host-written.
    emitted_delta: >-
      Remove only a redundant FENCE before an immediately following host segment; retain the
      contraction's device-to-host fence, later host-to-device fences, endpoint commands, source
      operation ownership, and dependency order.
    validation: >-
      Recompile the fixed complete model with analyze-whole-model and require verified source and
      task coverage with no dependency problems, unchanged accelerator work, and fewer emitted
      synchronization instructions attributable to adjacent host work.
    abandonment: >-
      Abandon if full-model analysis does not reduce synchronization, changes compute or movement
      instruction counts, loses any source operation or task, reports a plan/CFG dependency
      problem, or fails changed-region semantic qualification.
  - id: global_issue_and_fences
    scope: heuristic
    path: mlir_oot/lowering/schedule.py
    symbol: Scheduler.run
    effects: [synchronization, issue, latency_hiding]
    cca_axes: [communication.fences, dispatch.dma_overlap]
    mechanism: >-
      Emit the kernel-exit completion fence only while the verified global-program hazard
      frontier contains outstanding device reads or writes. A non-native contraction readout
      already fences before its synchronous host epilogue and retires that frontier; retain the
      conservative exit fence when the verified global-program receipt is unavailable.
    emitted_delta: >-
      Delete exactly one redundant terminal FENCE when all accelerator accesses completed before
      terminal host work; retain every device-to-host and host-to-device fence, endpoint command,
      source operation, dependency, arithmetic operation, movement, and boundary payload.
    validation: >-
      Recompile the fixed complete model with analyze-whole-model; require exact source/task/CFG
      coverage, unchanged graph and logical-dispatch digests, and a changed plan digest attributable
      only to the deleted terminal fence; require identical accelerator work, movement,
      configuration and payload, and exactly one fewer synchronization instruction.
    abandonment: >-
      Revert if the exit frontier is not provably empty, whole-model analysis does not delete
      exactly one synchronization, any source/task/dependency/work/payload field changes, machine
      sites increase, or changed-region semantic qualification fails.
  - id: final_target_emission
    scope: codegen
    path: mlir_oot/codegen/llvm_emit.py
    symbol: Emitter.build
    effects: [issue, latency_hiding]
    cca_axes: [dispatch.descriptor_reuse, dispatch.loop_offloaded]
    mechanism: >-
      Cache only the Gemmini configuration registers that are truly global. Program bounds, AB/DC
      addresses, AB/DC strides, and launch for every LOOP_WS descriptor because the target owns one
      descriptor register file per concurrent loop slot; a value equal to the preceding launch is
      not proof that the alternate slot contains it. Omit load-stream-2 configuration only when a
      null D address proves that the optional accumulator input is inactive.
    emitted_delta: >-
      Emit a complete slot-local descriptor for every overlapping launch while continuing to delete
      only repeated truly-global configurations and inactive-D CONFIG_LD writes; retain all active
      movement, arithmetic, readout, synchronization, source ownership, and ABI behavior.
    validation: >-
      Recompile the fixed complete graph, require one each of bounds, AB/DC addresses, AB/DC strides,
      and launch per LOOP_WS descriptor, exact source/task/CFG coverage, unchanged logical dispatch,
      contraction MACs, movement, payload, synchronization, and a reduced two-launch overlap witness.
    abandonment: >-
      Revert if any loop slot can observe a stale descriptor record, an accumulating block can
      observe an unemitted stream-2 value, a changed global configuration is skipped, or whole-model
      analysis changes source coverage, dependencies, arithmetic, movement, payload,
      synchronization, or ABI behavior.
  - id: host_tensor_workspace_lifetime
    scope: codegen
    path: mlir_oot/codegen/loop_host_linalg.py
    symbol: LoopHostLinalg._storage_for
    effects: [movement, memory_planning]
    cca_axes: [memory.capacity_fit, communication.intermediate_materialized, envelope.runtime_calls]
    mechanism: >-
      Derive each statically sized host tensor temporary's lifetime from ordered host segments,
      allocate multi-element values in one 64-byte-aligned internal byte workspace, and reuse offsets
      after a segment boundary. Values that cross a host/accelerator migration use the existing
      explicit intermediate buffers; only bounded one-element scalar temporaries remain on stack.
    emitted_delta: >-
      Replace function-local tensor allocas with deterministic workspace GEPs and emit a
      whole_program_host_storage_v1 receipt, without adding an ABI pointer or changing the command,
      task, schedule, tensor encoding, dependency, or source-ownership plan.
    validation: >-
      Require deterministic reduced host-only and mixed-lane storage witnesses, byte-identical
      command buffers after removing only params.host_storage, unchanged kernel ABI argument count,
      target-policy stack preflight, and exact warm/measured full-model execution on a normal stack.
    abandonment: >-
      Keep a value in an explicit cross-lane buffer or refuse the transformation when its extent,
      element width, lifetime, producer, consumer, or lane migration is not statically proved; revert
      on alias overlap, ABI growth, changed scheduling, stack-policy failure, or numerical mismatch.

# Which submission-relative sources each declared command actually rides on.
# `manifest.yaml` is listed under every command because it declares that command's argv, and the
# documentation is listed too: nothing in the package should be unattributable, and an
# unattributable path invalidates every certificate the package has earned.
components:
  parse:
    - manifest.yaml
    - REPORT.md
    - docs/
    - gemmini-opt
    - mlir_oot/__init__.py
    - mlir_oot/__pycache__/
    - mlir_oot/gemmini_opt.py
    - mlir_oot/frontend/
  lower_interface_to_target:
    - manifest.yaml
    - REPORT.md
    - docs/
    - gemmini-opt
    - mlir_oot/__init__.py
    - mlir_oot/__pycache__/
    - mlir_oot/gemmini_opt.py
    - mlir_oot/frontend/
    - mlir_oot/lowering/
    - mlir_oot/ir/
    - mlir_oot/tables/
    - mlir_oot/codegen/
  emit_analysis_bundle:
    - manifest.yaml
    - REPORT.md
    - docs/
    - gemmini-opt
    - mlir_oot/__init__.py
    - mlir_oot/__pycache__/
    - mlir_oot/gemmini_opt.py
    - mlir_oot/frontend/
    - mlir_oot/lowering/
    - mlir_oot/cmdbuf.py
    - mlir_oot/ir/
    - mlir_oot/tables/
    - mlir_oot/codegen/
  emit_command_buffer:
    - manifest.yaml
    - REPORT.md
