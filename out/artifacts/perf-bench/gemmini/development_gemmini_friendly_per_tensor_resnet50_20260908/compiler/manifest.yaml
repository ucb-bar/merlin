    emitted_delta: >-
      Replace eligible host contraction tasks and their materialized representation boundaries with
      verified accelerator tasks while preserving every source operation, batch index, reduction
      order, tensor shape/dtype, dependency, and external binding.
    validation: >-
      Recompile every fixed portfolio member and require monotonic ready-member coverage, exact
      graph/plan/task ownership, unchanged contraction MACs and ABI, legal capacity, and fewer host
      contraction MACs, boundaries, or payload on each affected model; qualify a reduced instance
      of every newly admitted rank/broadcast pattern.
    abandonment: >-
      Refuse dynamic or non-bijective batch mappings, nonzero accumulator initializers, mismatched
      batch extents, unproved broadcasts, or capacity overflow; revert if any ready portfolio member
      regresses or the emitted plan does not remove the intended host work.
  - id: global_mesh_eligibility
