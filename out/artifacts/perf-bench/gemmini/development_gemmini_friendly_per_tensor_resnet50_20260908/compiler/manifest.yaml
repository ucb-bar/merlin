    - gemmini-opt
    - mlir_oot/__init__.py
    - mlir_oot/__pycache__/
    - mlir_oot/gemmini_opt.py
    - mlir_oot/frontend/
    - mlir_oot/lowering/
    - mlir_oot/cmdbuf.py
    - mlir_oot/tables/
    - mlir_oot/ir/
    - mlir_oot/codegen/
