    - mlir_oot/gemmini_opt.py
    - mlir_oot/frontend/
    - mlir_oot/lowering/
    - mlir_oot/cmdbuf.py
    - mlir_oot/tables/
    - mlir_oot/ir/
    - mlir_oot/codegen/
  lower_target_to_llvm:
