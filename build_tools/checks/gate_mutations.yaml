# Recorded mutations: for each gate, the change to the world that makes it FAIL.
#
# Read `build_tools/checks/check_mutation_proofs.py` first. The short version:
#
#   proof:    a RUNNABLE pytest node -- `<file under tests/>::<test function>` -- that drives
#             the gate into its failing direction. It must name its gate structurally, so it cannot
#             be a reimplementation of the gate's logic that passes while the gate itself is broken.
#   mutation: what that proof changes.
#   removes:  WHICH SATISFIERS THAT CHANGE DESTROYS. This is the field people get wrong, and the one
#             that has already cost an evening: a defective capability line was re-introduced while
#             the corrected version's RTL citations were left standing in the surrounding comment
#             block, the gate found the citations, it passed, and the near-conclusion was that the
#             gate was broken. A mutation that leaves an alternative satisfier in place proves
#             nothing. Nothing automated can check this for you; writing the sentence is the
#             mechanism. If you cannot name what the mutation removes, the mutation is not faithful.
#   execution: optional, `subprocess` -- declares that the proof drives the gate as a child process,
#             so `--prove` cannot trace the coupling. Printed on every run; use it only when true.
#
# A gate that is not here must be listed in `mutation_proof_ratchet.txt`, which may only shrink.

proofs:
  check_tutorials.py:
    proof: tests/infra/test_mutation_proofs_gate_can_fail.py::test_a_gate_with_no_recorded_mutation_is_reported
    mutation: >-
      Read an actual public tutorial and remove every executable code cell before calling the
      runner's own mandatory-work guard. The unchanged tutorial passes that guard first.
    removes: >-
      No executable cell remains in the same document. Markdown, metadata and saved results cannot
      supply execution work, so the real guard must refuse rather than count an empty tutorial as run.
      This control covers the mandatory-work guard, not kernel execution or notebook parsing.

  check_backend_boundaries.py:
    proof: tests/infra/test_mutation_proofs_gate_can_fail.py::test_a_skipped_boundary_case_changes_the_real_runner_verdict
    mutation: >-
      Run the real boundary-runner main over six exact clean local Git source selections and bounded
      process fixtures, then change the first selected lane's JUnit skipped count from zero to one.
    removes: >-
      The mutated lane no longer supplies zero-skip execution evidence. Every manifest field, source
      HEAD and payload, wheel byte and other lane count remains unchanged; no ratchet or alternate
      XML suite can forgive the skip. The paired clean main returns zero before the mutation makes
      the real JUnit admission fail and the durable report remain passed=false. Process fixtures
      establish no installed-wheel or device qualification.

  check_reference_readiness.py:
    proof: tests/infra/test_mutation_proofs_gate_can_fail.py::test_missing_reference_region_evidence_changes_the_real_readiness_verdict
    mutation: >-
      Invoke the real readiness main and assessment with complete bounded analyzer-transport reports,
      then remove one included region's only semantic and source-correspondence projection.
    removes: >-
      Every semantic/correspondence satisfier for that region is absent. Both declared regions and
      all seven instruction sites remain in the denominator, so a successful first region cannot
      replace the missing second region. The same main first returns zero for complete reports,
      then returns two and retains the blocked summary and original per-region diagnostic.

  check_no_target_name.py:
    proof: tests/infra/test_overfit_gates.py::test_a_target_identifier_planted_in_a_clean_module_fails_the_gate
    mutation: >-
      Point the real gate's main at one core module, first byte-identical to the tracked clean file and
      then with a module-level identifier FOO_SATURN_X appended, and assert the exit status flips from
      0 to 1 with the identifier named in the report.
    removes: >-
      Every way the planted line could pass: it is an identifier, not a string literal, so only the
      tokenized check can see it; the module's path names no target, so path ownership cannot excuse
      it; the file is in neither the allowlist nor the token ratchet; the line carries no target-ok
      marker; and the clean run returning 0 proves nothing else in the file was already failing.
  check_opset_coverage.py:
    proof: tests/infra/test_opset_coverage_gate_can_fail.py::test_an_unclassified_operation_changes_the_real_gate_verdict
    mutation: >-
      Replace an explicitly structural source operation with an unclassified
      operation in the declared vocabulary and invoke the real gate entry point.
    removes: >-
      The operation has neither a semantic family nor a structural home. The
      explicit request has no capabilities, exclusions or ratchet that could
      supply or forgive a home, and no unrelated cell or member failures. A
      restored structural operation must return the verdict to clean.

  check_numeric_falsifiability.py:
    proof: tests/infra/test_numeric_falsifiability_gate_can_fail.py::test_the_verdict_and_not_only_the_finding_changes
    mutation: >-
      Derive the same small capsule twice, with tolerance above and below its
      golden half-spread, and invoke the real gate for both.
    removes: >-
      The answer key is not stored, the tolerance policy is applicable, and the
      golden has spread. The failing case admits a midrange constant; the clean
      companion proves that findings actually control the exit status.

  check_mutation_proofs.py:
    proof: tests/infra/test_mutation_proofs_gate_can_fail.py::test_a_gate_with_no_recorded_mutation_is_reported
    mutation: >-
      Audit the actual tutorial gate with its recorded proof, then remove both its registry entry
      and its ledger allowance and require that gate to be reported.
    removes: >-
      Both of the two things that let a gate pass this audit: it has no registry entry and no ratchet
      line. Removing only one leaves the other satisfying the check, and the same control first
      checks that either declared satisfier is admitted on its own.

  check_silent_defaults.py:
    proof: tests/infra/test_silent_defaults_gate_can_fail.py::test_numeric_default_reaches_the_gate_finding
    mutation: >-
      Scan one otherwise clean synthetic grade function that defaults absent explicit_cycles to zero.
    removes: >-
      The selected numeric fallback is the sole fabricated datum in the input. It is not an unknown
      marker, an expression that derives a value, or a read without a default; no ledger is consulted.
      The real scanner must emit get-default rather than silently treating missing cycles as zero.

  check_grammar_documentation.py:
    proof: tests/infra/test_grammar_documentation.py::test_a_removed_row_and_a_reordered_operand_are_both_caught
    mutation: >-
      On a private copy of the grammar spec, delete the `rope` index row and swap the operand order of
      the `attention_qk` row, and require the gate to report the missing row and the drifted one and
      exit non-zero.
    removes: >-
      Both satisfiers of the index rule for those two ops: `rope` keeps its prose heading but loses the
      only row that states its opcode and operands, and `attention_qk` keeps its row but with an order
      the parser does not use. The real-spec tests must pass on the unmutated copy, so a gate that
      reported everything would not pass both.

  check_wiring.py:
    proof: tests/infra/test_check_wiring.py::test_new_debt_fails_and_a_stale_entry_fails
    mutation: >-
      Build a tree holding one module that nothing in production imports, beside one that a build
      script does import, and require the gate to exit non-zero naming the orphan as unwired.
    removes: >-
      Every caller the orphan could have: no production module, script, entry point or experiment
      imports it, and it is absent from the ledger. The same test then re-adds a ledger line for the
      WIRED module to prove a stale entry also fails, and only the honest ledger passes.

  check_conformance_coverage.py:
    proof: tests/infra/test_coverage_gates_can_fail.py::test_shape_geometry_gap_reaches_the_verdict
    mutation: >-
      Put one uncovered shape_geometry cell in an otherwise clean coverage report and invoke the real
      uncovered_debt accumulator, retaining the original geometry regression as one direct witness.
    removes: >-
      The geometry axis has no ratchet entry, and every other measured axis remains clean. No second
      uncovered axis can produce the observed geometry debt or mask an accumulator that ignores it.

  check_claim_set_disjointness.py:
    proof: tests/infra/test_coverage_gates_can_fail.py::test_uncaptured_claim_reaches_the_unmeasured_verdict
    mutation: >-
      Feed claim_model_uncaptured, the actual status previously absent from every verdict bucket,
      to the real verdict classifier and require its explicit unmeasured result.
    removes: >-
      This status supplies neither a captured model nor a clean claim. It must not resolve to clean
      or disappear as an unclassified value, which formerly kept the measured failure from the exit code.

  check_rtl_facts_schema.py:
    proof: tests/infra/test_rtl_facts_schema_gate_can_fail.py::test_an_artifact_whose_body_contradicts_its_family_is_caught
    mutation: >-
      Write a facts artifact whose declared family contradicts its own body and require the gate to
      report it.
    removes: >-
      Every satisfier for that artifact: it is not a receipt (which the gate skips), its family IS
      decidable, and the schema for that family exists -- so the only remaining reason to pass would
      be a gate that does not compare.

  check_target_package_duplication.py:
    proof: tests/infra/test_target_package_duplication_gate_can_fail.py::test_the_same_function_in_two_target_packages_is_flagged
    mutation: >-
      Put the same function body in two target packages and require the gate to report the shape.
    removes: >-
      All three ways a duplicate is forgiven: the shape is not in the ratchet, the two copies are in
      DIFFERENT packages, and the function is long enough not to be dismissed as trivial.

  check_schedule_ir_coverage.py:
    proof: tests/infra/test_schedule_ir_coverage_gate_can_fail.py::test_a_primitive_with_no_row_is_flagged
    mutation: >-
      Present a live primitive that the declared axis register does not mention, and require the gate
      to report it.
    removes: >-
      The only satisfier: the register has no row for that primitive under any spelling, so nothing
      else in the register can answer for it.

  check_inert_capabilities.py:
    proof: tests/infra/test_inert_capabilities.py::test_runtime_inert_flags_a_pass_that_saw_candidates_and_transformed_none
    mutation: >-
      Hand the checker a pass report showing candidates seen and zero transformed, the shape of a
      capability that is declared and never fires.
    removes: >-
      Both ways that report could otherwise pass: the pass is not exempt, and the report is present
      and readable -- the companion test pins that a MISSING report is refused rather than called
      clean, which is the absence-reads-as-pass half of the same defect.

  check_capability_backing.py:
    proof: tests/infra/test_capability_backing.py::test_the_gate_fails_on_a_reintroduced_unbacked_narrowing
    mutation: >-
      Point the gate at one synthetic target whose only contract document declares an elementwise map
      reachable only behind a contraction, justified by prose alone, and run its main with the ledger
      ignored.
    removes: >-
      Every satisfier the claim could have: no ledger line forgives it, the target declares no hardware
      pin whose read set could hold a cited file, and the comment names no in-repo path, test or
      module. The same test then adds a module citation to show the gate passes once one resolves.

  check_test_budget.py:
    proof: tests/infra/test_ci_contracts.py::test_global_budget_counts_expanded_cases_not_functions
    mutation: >-
      Give the real complete-collection validator 150 unique expanded parameter nodeids, then add
      a 151st nodeid while keeping the collection exit, errors, skips and deselections clean.
    removes: >-
      No duplicate identity, collection failure, skip or deselection can account for refusal. The
      sole difference is the actual expanded case count crossing the fixed 150-case budget; the
      paired 150-case input must pass before the 151-case input produces an explicit count error.
