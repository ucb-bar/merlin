# THE INPUTS A FRESH `git worktree` LACKS, AND WHY EACH ONE MATTERS.
#
# Every entry here is gitignored, so a worktree created from this repo does not have it, and NOT ONE
# of them fails loudly when absent. Each degrades into a plausible-looking wrong answer instead. That
# is the whole reason this file exists as a reviewed roster rather than folklore: measured
# 2026-09-23, standing up one runnable worktree took eight of them, discovered one at a time over
# several hours, and three wrong conclusions were drawn from trees that were missing one.
#
# `consequence` is not documentation. It is the sentence a reader needs in order to recognise the
# symptom they are already looking at.
#
# Read by build_tools/scripts/provision_worktree.py. Fields: `path` or `path_glob` (repo-relative, in
# the SOURCE checkout); `kind`; optional `merge: per_file` + `files_glob` for a TRACKED directory whose
# gitignored files must be compared one by one; optional `link: hard` for a consumer that refuses a
# symlink.
#
# Add an entry when you find another. Do not delete one without saying what now provides it.
#
# It lives beside the tool that reads it, OUTSIDE src/merlin/resources/contracts/: that tree is granted read-only to
# authoring agents, and this roster names the holdout store's path, which the answer-surface checks
# treat as an answer key in any granted file.

artifacts:

  - path: .env
    kind: file
    consequence: >-
      `ext_path('chipyard')` raises, so test collection dies with a KeyError that looks like a code
      defect. Cost measured: a full bucket run reporting 28 failures out of 28, all collection errors.

  - path: .venv
    kind: dir
    consequence: >-
      Gates and infra tests shell out to `<repo_root>/.venv/bin/python`; without it they fail in ways
      that read as harness bugs (7 of 10 stop-hook gate failures vanished when it was linked). AND THE
      TRAP IT CREATES: this venv has merlin installed in DEVELOPMENT mode against whichever checkout
      last ran the editable install, so a script or child process here imports THAT library, not this
      worktree's `src/`. The test suite pins its own checkout (tests/conftest.py); nothing else
      does. Measured: a 30-minute sweep against the wrong library, and a phase-1 run launched from a
      pinned worktree that imported its library from the source tree for its whole life. The tool
      reports the library each worktree resolves and the PYTHONPATH that corrects it.

  - path: .compat_lib
    kind: dir
    consequence: >-
      Named in the sandbox `LD_LIBRARY_PATH` (`paths.compat_lib`). A sandboxed agent run cannot
      resolve its libraries.

  - path: third_party/llvm-install
    kind: dir
    consequence: >-
      Looks like the one input that announces itself, and is not. A toolchain lookup with a fallback
      chain SUBSTITUTES the system clang rather than failing closed: measured 2026-09-23, 13 tests
      failed on `-Wno-gcc-install-dir-libstdcxx` under `-Werror` with system clang 18.1.3 and passed
      134/134 from the main checkout. A fallback over a toolchain reports a CODE failure for a
      TOOLCHAIN absence.

  - path: third_party/llvm-build
    kind: dir
    consequence: >-
      WORST OF THE SET. Its absence makes whole test modules SKIP rather than fail. A skip is not a
      pass, but a failure-set diff cannot tell them apart, so a test that skips on one tree and fails
      on another reads as a regression that never happened -- exactly one phantom regression in a
      base-vs-branch comparison on 2026-09-23.

  - path: experiments/corpora
    kind: dir
    merge: per_file
    files_glob: "**/golden.yaml"
    link: hard
    consequence: >-
      THE ANSWER KEYS. A capsule's `golden.yaml` carries the outputs an INDEPENDENT oracle produced,
      and every one is gitignored. The absence is silent for an integer capsule -- its golden source
      falls back to the integer Tensor engine, which recomputes the same answer -- and surfaces only on
      a FLOAT capsule as `ValueError: golden: unsupported operation 'gelu'` (or layernorm / softmax /
      reduce_sum / depthwise_conv2d), which reads as an unimplemented reference rather than an absent
      file. Hard-linked: the answer keys already exist on the same filesystem.

  - path: experiments/corpora/model
    kind: dir
    merge: per_file
    files_glob: "*/capsule.weights.safetensors*"
    link: hard
    consequence: >-
      The model capsules' EXTERNAL WEIGHTS (`capsule.weights.safetensors` + its manifest) are
      gitignored, so a worktree gets the capsule directories from git and the weights from nowhere.
      Every model capsule then grades `incomplete` with "model capsule external weights asset is
      missing or a symlink", which reads as a model-path defect. The loader refuses a SYMLINK as well
      as an absent file, so these are hard-linked.

  - path: experiments/corpora/model
    kind: dir
    merge: per_file
    files_glob: "*/capsule.extra.npz"
    link: hard
    consequence: >-
      An open model capsule's LEAF ARGUMENTS the weights file does not hold (registered buffers, lifted
      constants), gitignored beside the weights. Without them the open-model builder cannot bind the
      model's forward arguments and the whole-model gate for that model fails at build -- for every
      package, which reads as a package defect.

  - path_glob: "experiments/corpora/**/hidden"
    kind: dir
    # FILE BY FILE: the goldens entry above already hard-links every `hidden/*/golden.yaml`, so by the
    # time this entry runs a hidden directory EXISTS holding goldens and nothing else, and a
    # whole-directory presence check would skip it. Measured 2026-09-26: 15 hidden directories, each
    # holding only its golden and no capsule.yaml.
    merge: per_file
    files_glob: "**/*"
    link: hard
    consequence: >-
      The hidden cohort, beside each corpus (`<corpus>/../hidden`). Readiness reports
      `hidden source=0` and the hidden grade scores 0/0 -- a phase that cannot fail.

  - path: out/artifacts/cache/rtl_introspect
    kind: dir
    consequence: >-
      The derived RTL facts cache (it replaces the retired per-target `contracts/rtl_facts/` copies).
      Without it a facts load re-derives from RTL live -- xdsl parses the target's whole `hw.mlir` and
      a test appears to HANG -- or degrades to a header fallback where every capability question
      answers UNKNOWN, and UNKNOWN is silently non-blocking, so a perf family reports itself
      inapplicable rather than underivable. Alternatively run with MERLIN_OUT_ROOT=<source>/out.

  - path: out/build/rtl_engines
    kind: dir
    consequence: >-
      The elaborated-RTL engines, pinned by digest in hardware_pins.yaml. Without them
      `describe_l3_engine` picks verilator instead of gsim, so any corpus regeneration silently
      rewrites every L3 family's frozen `timing_simulator`, and the opt-in memory-order tier reports
      its engine `unavailable`.
