schema_version: 1

target:
  name: zephyr_rocket_rv64
  display_name: Zephyr on Rocket RV64GC + RVV (FireSim Quad)
  vendor: UCB-BAR
  maturity: experimental

platform:
  host_isa: riscv64
  operating_systems:
    - zephyr
  environments:
    - firesim
    - simulator

execution_model:
  kind: vector_cpu_extension
  attachment: cpu_extension
  submission_model: inline_cpu_instructions
  compiler_recovery_stage: llvmcpu_codegen

isa:
  base: riscv64
  features:
    - +m
    - +a
    - +f
    - +d
    - +c
    - +v
    - +zvl128b
  exposure:
    kind: llvm_backend_features
    needs_llvm_backend_changes: false
    needs_new_intrinsics: false
    needs_new_feature_bits: false
  state_model:
    kind: explicit_ssa
  register_constraints:
    accumulator_register_file: vector
    even_alignment_required: false
    vl_dependent: true

operations:
  compute:
    - name: matmul
      native: true
      type_triples:
        - i8*i8->i32
        - f32*f32->f32
    - name: dot_product
      native: true
      type_triples:
        - i8*i8->i32
        - f32*f32->f32
  movement:
    - vector_load
    - vector_store
  synchronization:
    - fence

geometry:
  compute_array:
    kind: vector_dot
  vector:
    vlen_bits: 128
    dlen_bits: 128
  native_tile_options:
    - [8, 8, 8]
  preferred_tiles:
    - [8, 8, 8]

memory:
  spaces:
    - name: global
      kind: dram
    - name: vector_registers
      kind: register_file
  preferred_layouts:
    lhs: mmt4d_lhs
    rhs: mmt4d_rhs
    result: mmt4d_result
  packing:
    requires_pack: false
    requires_unpack: false

numeric:
  legal_type_triples:
    - i8*i8->i32
    - f32*f32->f32
  quantization:
    requantize_native: false
  rounding_modes:
    - rne
  saturation: true

runtime:
  # IREE runtime is required: linked into the Zephyr ELF as static libraries.
  required: true
  executable_format: llvm_cpu_vmfb
  driver:
    # IREE is built under IREE_PLATFORM_GENERIC -- single-thread local-sync
    # only. Multi-hart parallelism is at the Zephyr-app layer (one
    # iree_vm_context per worker k_thread; see samples/merlin/
    # model_benchmark/src/main.c).
    backend_id: local-sync
    uri_schemes:
      - local-sync://
  synchronization:
    semaphores: false
    timelines: false
  # Compilation flags consumed by `merlin compile --target zephyr_rocket_rv64`.
  # Mirrors BASE_RVV_FLAGS in samples/SaturnOPU/simple_embedding_ukernel/CMakeLists.txt.
  compile_flags:
    - --iree-hal-target-device=local
    - --iree-hal-local-target-device-backends=llvm-cpu
    - --iree-llvmcpu-target-triple=riscv64-unknown-elf
    - --iree-llvmcpu-target-abi=lp64d
    - --iree-llvmcpu-target-vector-width-in-bytes=16
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c,+v,+zvl128b
    - --iree-llvmcpu-link-ukernel-bitcode=false
    - --iree-llvmcpu-enable-ukernels=none
    - --iree-llvmcpu-debug-symbols=true
    - --iree-vm-bytecode-module-strip-source-map=true
    - --iree-vm-emit-polyglot-zip=false

verification:
  golden_model:
    available: true
    kind: cpu_reference
  simulator:
    available: true
    kind: rtl_sim
  rtl:
    available: true
    kind: firesim_fpga
  perf_counters:
    available: true
    kind: rocket_hpm
  tolerances:
    int8:
      atol: 0
      rtol: 0
    fp32:
      atol: 1.0e-4
      rtol: 1.0e-4

access:
  model: simulator
  sdk_requirements:
    - rtl_sim
    - iree_llvmcpu
    - zephyr_rtos
    - chipyard_riscv64_board
  credential_requirements: none
  availability_class: always_local
  verification_gates:
    - compile_only
    - smoke_run
    - firesim_run

references:
  - docs/architecture/target_generator.md
  - docs/reference/cli.md
  - docs/dev_blog/2026-03-18-chipyard-bare-metal-integration.md
