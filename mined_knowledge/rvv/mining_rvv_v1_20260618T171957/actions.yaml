- axis: compute.contraction_form
  class: PASS
  target_seam: pass:vector.fma-forming contraction lowering
  forkable_now: false
  change: emit a vector.fma / llvm.fmuladd for the contraction so it lowers to fused
    vfmacc instead of separate vfmul.vv+vfadd.vv
  expected_effect: vfmacc replaces vfmul+vfadd; fewer ops, higher FLOP/insn
  evidence:
  - openblas_rvv_gemm
  - openblas_rvv_gemv
  - openblas_rvv_trmm
  - xnnpack_rvv_gemm
- axis: compute.widening
  class: KNOB
  target_seam: schedule:dtype_strategy=int8_w8a8 (vwmacc datapath)
  forkable_now: true
  change: route the i8 matmul through the widening vwmacc i8xi8->i32 datapath
  expected_effect: i32-accumulating widening MAC instead of dequantize-to-f32
  evidence:
  - xnnpack_rvv_dwconv
  - xnnpack_rvv_gemm
  - xnnpack_rvv_other
  - xnnpack_rvv_rdsum
  - xnnpack_rvv_rsum
  - xnnpack_rvv_vcvt
  - xnnpack_rvv_vmul
- axis: compute.epilogue
  class: PASS
  target_seam: pass:fuse-requant-narrowing-store
  forkable_now: false
  change: fuse the requantize + narrowing (vnclip/vfncvt) into the store epilogue
  expected_effect: single narrowing store; no separate requant pass over the tile
  evidence:
  - xnnpack_rvv_dwconv
  - xnnpack_rvv_gemm
  - xnnpack_rvv_other
  - xnnpack_rvv_vcvt
  - xnnpack_rvv_vmul
