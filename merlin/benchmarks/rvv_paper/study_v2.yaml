backends:
  - name: hand_v0_int8
    kind: frozen_baseline
    runtime: merlin
    precisions: [w8a8]
    quantization: static_w8a8
    kernel_scope: compiled_model
    adapter: merlin_compile
    options:
      package: out/artifacts/targets/rvv/hand_v0_int8
      package_sha256: unresolved
      timeout: 14400
      source_paths: [out/artifacts/targets/rvv/hand_v0_int8]
      kernel_source_sha256: unresolved
  - name: merlin_frozen
    kind: compiler
    runtime: merlin
    precisions: [w8a8, fp32]
    quantization: declared_by_precision
    kernel_scope: compiled_model
    adapter: merlin_compile
    options: {package: unresolved, package_sha256: unresolved, timeout: 14400}
  - name: merlin_xnnpack
    kind: kernel_swap
    runtime: merlin
    precisions: [fp32]
    quantization: none
    kernel_scope: routable_ops_only
    adapter: merlin_compile
    options:
      package: out/artifacts/targets/rvv/hand_v0
      package_sha256: unresolved
      kernel_backend: xnnpack
      timeout: 14400
      source_paths: [tmp/kernels/XNNPACK, merlin/python/merlin/runtime/backends/xnnpack_board]
      kernel_source_sha256: unresolved
  - name: merlin_openblas
    kind: kernel_swap
    runtime: merlin
    precisions: [fp32]
    quantization: none
    kernel_scope: routable_ops_only
    adapter: merlin_compile
    options:
      package: out/artifacts/targets/rvv/hand_v0
      package_sha256: unresolved
      kernel_backend: openblas
      timeout: 14400
      source_paths: [tmp/kernels/OpenBLAS, merlin/python/merlin/runtime/backends/openblas_board]
      kernel_source_sha256: unresolved
  - name: executorch_xnnpack
    kind: external_runtime
    runtime: executorch
    precisions: [fp32]
    quantization: none
    kernel_scope: full_system
    adapter: executorch
    options:
      xnnpack: true
      timeout: 14400
      # Local adapter identity is frozen just like framework/package bytes.  Never resolve a bare
      # `python` through ambient PATH for a paper measurement.
      python_executable: /home/agustin/.local/share/uv/python/cpython-3.12.13-linux-x86_64-gnu/bin/python3.12
      python_executable_sha256: 9ed008e5a8685235361f0c53771b520ab082dd99a877ad2fd796a93fa4c0b488
      # Nonexistent argv[0] preserves .venv/pyvenv.cfg semantics while exec uses a private fd-bound
      # copy of the pinned regular file; no symlink/path lookup selects executable bytes.
      python_venv_argv0: .venv/bin/python-paper-adapter
      command:
        - "{python_executable}"
        - -m
        - merlin.baselines.executorch_session
        - run
        - --package
        - "{framework_package}"
        - --package-sha256
        - "{framework_package_sha256}"
        - --model
        - "{model}"
        - --variant
        - "{variant}"
        - --cores
        - "{cores}"
        - --warmups
        - "{warmups}"
        - --observations
        - "{observations}"
        - --measurement-repeats
        - "{measurement_repeats}"
        - --quality-metric
        - "{quality_metric}"
        - --quality-min
        - "{quality_min}"
        - --framework-source-sha256
        - "{framework_source_sha256}"
      source_paths:
        - third_party/baselines/executorch
        - merlin/python/merlin
      framework_source_sha256: unresolved
      external_model_sources:
        lstmnetvit:
          environment_key: VITFLY_DIR
          source_root: models
          source_file: models/model.py
          git_sha: f11386f90d0265152f7776a2e89555456a5011dc
          source_file_sha256: 574f026fdace4c18bd8e42f6266ab73e55dbfeb49fa589a2e7176884d12e0fa8
      packages:
        gemma2_2b:
          fp32: {path: unresolved, sha256: unresolved}
        tinyllama_1_1b:
          fp32: {path: unresolved, sha256: unresolved}
        smolvla:
          fp32: {path: unresolved, sha256: unresolved}
        resnet50_v1_5:
          fp32: {path: unresolved, sha256: unresolved}
        lstmnetvit:
          fp32: {path: unresolved, sha256: unresolved}

reporting:
  unsupported_comparisons:
    - backend: executorch_xnnpack
      precision: w8a8
      status: not_implemented
      reason: >-
        Full-system ExecuTorch/XNNPACK W8A8 continuous-session export and runtime ABI are not yet
        implemented. No quantized external-runtime result may be inferred from the FP32 arm.
  primary_statistic: median
  secondary_statistics: [p05, p95]
  execution_order:
    policy: deterministic_block_randomized
    seed_sha256: 2a68c9dab32c2ff43063e9e6d4f61b25a01e6f934b2f4c5ada0ff4fbabf75799
    block_fields: [model, precision, core_count]
    randomized_field: backend
  performance_claims:
    parity_median_ratio_band: [0.95, 1.05]
    win_median_ratio_max: 0.95
    win_requires_nonoverlapping_observed_ranges: true
    win_requires_causal_attribution: true
    language: descriptive_ratio_not_statistical_significance
  report_build_and_run_separately: true
  report_peak_rss: true
  report_attribution: true
  performance_scope_policy:
    primary_table: end_to_end_continuous_sessions
    diagnostic_table: exact_declared_stage_subsets
    e2e_claim_requires_all_stages_timed: true
    e2e_win_requires_attribution: true
  same_buffer_repeat_is_diagnostic_only: true
  deferred_models: [bitvla, rdt2, openvla]
