description: 'Synthetic VLA action-chunk decode: reused immutable weight, small-batch GEMV/GEMM, quantized epilogue, repeated over the action horizon.'
expected_candidate_features:
- resident_packed_tensor
- accumulator_commit
name: vla_action_chunk_decode
op_sequence:
- matmul
- bias_add
- requant
- relu
ops:
- matmul
- bias_add
- requant
- relu
parameters:
  H: 16
  K: 256
  dtype: i8
  epilogue: true
region:
