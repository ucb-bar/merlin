# boundary_candidate_contracts (search space; no speedup)
boundary_candidate_contracts:
  boundary_levels_vocabulary:
  - compiler_transform
  - runtime_hal_object
  - command_buffer_or_command_isa
  - accelerator_isa
  - device_microcode_or_controller
  - fixed_hardware_datapath
  certificates:
  - abstraction: resident_weight_object
    boundary_levels:
    - hardware_manages: none (generic ops)
      level: compiler_transform
      metadata_crossing: n/a
      missing_evidence: per-unit throughput / latency / area (a design YAML) to choose this placement
      required_compiler_proof: none (generic ops)
      required_hw_support: generic matmul / elementwise datapath
      required_isa_semantics: none
      required_runtime_support: none
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: compiler rewrites the workload; hardware sees ordinary ops
      status: possible
    - hardware_manages: exploits the declared lifetime / layout
      level: runtime_hal_object
      metadata_crossing: dtype, shape, layout, size_bytes, lifetime
      missing_evidence: per-unit throughput / latency / area (a design YAML) to choose this placement
      required_compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
      required_hw_support: addressable resident store
      required_isa_semantics: none
      required_runtime_support: object ABI + lifetime tracking + metadata
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: runtime tracks the object's lifetime + layout
      status: strong_candidate
    - hardware_manages: command processor executes / loops / tracks deps
      level: command_buffer_or_command_isa
      metadata_crossing: dtype, shape, layout, size_bytes, lifetime
      missing_evidence: per-unit throughput / latency / area (a design YAML) to choose this placement
      required_compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
      required_hw_support: device-side command processor
      required_isa_semantics: command opcodes + handles
      required_runtime_support: command encoder + event/queue
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: submits higher-level commands instead of ops
      status: strong_candidate
    - hardware_manages: datapath executes the semantic instruction
      level: accelerator_isa
      metadata_crossing: dtype, shape, layout, size_bytes, lifetime
      missing_evidence: per-unit throughput / latency / area (a design YAML) to choose this placement
      required_compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
      required_hw_support: datapath implementing the op
      required_isa_semantics: the semantic instruction + operands
      required_runtime_support: dispatch only
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: compiler targets the semantic ISA op
      status: weak_candidate
    - hardware_manages: controller owns the loop / deps / prefetch / state
      level: device_microcode_or_controller
      metadata_crossing: dtype, shape, layout, size_bytes, lifetime
      missing_evidence: per-unit throughput / latency / area (a design YAML) to choose this placement
      required_compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
      required_hw_support: sequencer + state + dependency tracking
      required_isa_semantics: region / loop descriptor
      required_runtime_support: bounded-region handoff
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: submits a bounded region; device iterates
      status: possible
    - hardware_manages: hardwired unit
      level: fixed_hardware_datapath
      metadata_crossing: n/a
      missing_evidence: n/a
      required_compiler_proof: n/a
      required_hw_support: dedicated fixed unit
      required_isa_semantics: implicit
      required_runtime_support: none
      risk: a hardware cache would hide the semantic lifetime the compiler already knows
      software_manages: none (absorbed into the unit)
      status: not_applicable
    boundary_pressure_score: 14
    compiler_proof_matrix_axis: resident_action_head_weights
    compiler_proof_status: proven_for_workload
    dse_knobs:
    - evidence: recovered_from_ir
      knob: resident_capacity
      reason: weight bytes resident across the K-loop
    - evidence: recovered_from_ir
      knob: replacement_policy
      reason: which resident objects evict
    - evidence: recovered_from_ir
      knob: lifetime_scope
      reason: loop-invariant vs replan scope
    evidence_summary: supported by memory_hierarchy_envelope, state_lifetime, compiler_proof_matrix; suggested in groot_n1d7, molmoact, openvla, pi05, rdt, rdt2, small_llama, smolvla, tiny_llama
    pressure_components:
      compiler_provable: 1
      crosses_rate_boundary: 1
      in_repeated_loop: 1
      missing_evidence_penalty: 0
      n_region_roles: 2
      n_supporting_workloads: 9
      overfit_penalty: 0
    region_roles:
    - repeated_head
    - backbone_once
    required_compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
    source_analyses:
    - memory_hierarchy_envelope
    - state_lifetime
    - compiler_proof_matrix
    supporting_workloads:
    - groot_n1d7
    - molmoact
    - openvla
    - pi05
    - rdt
    - rdt2
    - small_llama
    - smolvla
    - tiny_llama
    what_is_not_claimed: no speedup, cycles, area, or energy claim; a boundary search-space candidate, not a chosen design
