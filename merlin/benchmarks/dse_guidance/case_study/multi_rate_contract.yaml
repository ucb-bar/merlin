# multi_rate_contract (rate model + phases)
multi_rate_contract:
  note: rate constants (K/H/control_rate) are recovered_from_model_config (the model's published architecture); the replan deadline is derived from H / control_rate. No speedup/cycle claim.
  workloads:
  - phases:
    - cadence: once_per_replan
      invocations: 1
      phase: backbone
      role: backbone_once
    - cadence: K_times_per_replan
      invocations: 5
      phase: head
      role: repeated_head
    rate_model:
      H:
        source: recovered_from_model_config
        value: 64
      K:
        source: recovered_from_model_config
        value: 5
      control_rate_hz:
        source: recovered_from_model_config
        value: 30.0
      deadline_equation: t_backbone + K * t_head_step <= H / control_rate_hz
      replan_deadline_s:
        source: derived_requirement
        value: 2.133333
    states_across_rates:
