# abstraction_candidates: small_llama
abstraction_candidates:
- axis: resident_action_head_weights
  compiler_proof: action-head weights immutable and live across the K-loop (resident-pack candidate); backbone weights excluded
  dse_knobs_exposed:
  - local_memory_capacity
  - packed_weight_format
  - dma_bandwidth
  - residency/replacement_policy
  - weight_prefetch_overlap
  measurements_needed:
  - action_head_weight_bytes
  - weight_reload_bytes_per_step
  - pack_cost_per_step
  - resident_capacity_required
  - measured memory bandwidth
  runtime_hw_support: resident weight store + pack-once/use-many interface
  status:
    legality: structural
    quantification_blocked_by: missing_calibration
  system_abstraction_needed: resident_weight_object
  what_is_not_claimed:
  - speedup
  - cycle_reduction
  - energy_reduction
  - accuracy
  why_this_exists:
    attributed_facts: &id001
      activation_bytes_per_invocation: 156160
      activation_bytes_total: 4997120
      invocations: 32
      macs_per_invocation: 3162112
      macs_total: 101187584
      matmul_count: 14
      weight_bytes: 1581056
    evidence:
      K: 32
      head_phases:
      - head
      loop_invariant_state:
      - weights
    reason: action-head weights are loop-invariant across K=32 steps; a flat capture sees one use and hides this axis
    signal: temporal_reuse
