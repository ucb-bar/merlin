# Gemmini dialect plan (prototype). Mirrors xdsl_dialects/targets/gemmini.py.
# The dialect is the compiler-level abstraction (pack/matmul/commit/release), NOT the
# Gemmini ISA — the mvin/preload/compute/mvout mapping lives in the runtime kernel codegen.
target: gemmini
dialect_name: gemmini
ops:
  - {name: pack,    summary: "make an immutable RHS resident (mvin + weight-stationary preload)"}
  - {name: matmul,  summary: "systolic matmul vs resident weight -> i32 accumulator"}
  - {name: commit,  summary: "apply epilogue + commit accumulator (mvout)"}
  - {name: release, summary: "release the resident weight's working-set budget"}
types:
  - {name: resident_tensor}
  - {name: accumulator}
lowering:
  - {from: interface.resident_pack,  to: gemmini.pack}
  - {from: interface.matmul,         to: gemmini.matmul}
  - {from: interface.commit,         to: gemmini.commit}
  - {from: interface.resident_evict, to: gemmini.release}
tests:
  - {lit: pack_roundtrip}
  - {lit: matmul_commit_epilogue}
  - {lit: release_after_use}
confidence: medium
requires_human_review: true
