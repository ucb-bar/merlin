# Gemmini target contract (prototype).
#
# Gemmini (Berkeley systolic-array accelerator, chipyard generators/gemmini) modeled at
# the Merlin compiler level as a tensor-resident target: a weight-stationary matrix kept
# resident in the array/scratchpad and reused across the region, with an i32 accumulator
# committed via mvout. This is a PROTOTYPE contract for the C0 certification path
# (i8 x i8 -> i32, matmul only); it is not yet RTL-certified.
#
# Capacities below are provenance-tagged to their generator source and must be confirmed
# against the concrete config (GemminiAndOPUShuttleConfig) before any RTL-level claim.
name: gemmini
version: 0.1
family: tensor_resident
# Codegen endpoint + grading knobs the shared RunnerConfig reads (rtl_tiers + the rocc_insn trace gate
# ride the systolic family default; declared here only where they differ from it). Fork-free .insn on
# stock LLVM — no gemmini-forked toolchain.
endpoint_kind: inline_asm_insn
runner:
  suite: gemmini-capsule-bench
  dtype: i8xi8_i32
  tier_sim: {L2: spike, L3: verilator, L4: vcs, L5: firesim}
# The ABI encoding surface RTL discovery cannot ground (opcode/funct3/legal-funct/DIM come from the
# fact bundle; THESE do not). Declared once from the Gemmini ISA doc (human-reviewed) and consumed as
# the SINGLE source of truth by the generated ISA module + the decoder — retiring the triplicated
# hand-coded constants in GemminiToLLVM.cpp / gemmini_codegen_mlir.py / rocc_decode.py.
encoding:
  addr_len: 32             # RoCC accumulator/scratchpad address field width (bits)
  readout_bits:            # RoCC accumulator-readout / encoding bit conventions
    f1: 0x3F800000         # 1.0f
    c_acc: 0xA0000000      # full-i32 accumulator readout base
    acc_i8: 0x80000000     # scaled-i8 readout base
    acc_accum: 0x40000000  # accumulate-onto bit
    full_c_bit: 0x20000000 # set in c_acc, clear in acc_i8 -> i32 vs i8 readout
  semantic_class:          # RTL funct CODE -> the compiler's shared op class (the guardrail boundary:
    0: CONFIG              # codes are RTL-derived; the MVIN/MVOUT/... vocabulary is human-owned + shared)
    2: MVIN
    3: MVOUT
    4: COMPUTE_PRELOADED
    5: COMPUTE_ACCUMULATE
    6: PRELOAD
    7: FLUSH
    8: LOOP_WS
    15: LOOP_CONV
  config_subtype: {0: CONFIG_EX, 1: CONFIG_LD, 2: CONFIG_ST}   # CONFIG refined by rs1 & 0x3
status: prototype
features: [systolic_array, resident_packed_tensor, accumulator_commit, command_buffer, metrics]
ops: [pack, matmul, commit, release]
types: [resident_tensor, accumulator]
runtime:
  backends: [simulator, spike_gemmini, verilator]
  # The RTL sim harness that realizes this target — a DECLARED target fact, not a hardcoded backend
  # constant, so it is onboardable from the contract and read from ONE place (not overfit in code). This
  # is the SAME config the ISA facts are introspected from (targetgen.rtl.introspect), so sim and codegen
  # stay coherent: its gemmini is the certified 16x16 int8 mesh above (the SoC also carries an OPU that the
  # gemmini path never touches). Change here + re-derive facts + re-cert to move to a different harness.
  rtl_sim_config: GemminiAndOPUShuttleConfig
dtypes:
  storage: i8
  accumulator: i32
# Datatype -> compute-unit -> op capability (parsed by merlin.targetgen.compute_units; cross-checked
# against the RTL datapaths by rtl.introspect.validate_against_contract). The C0 systolic mesh is
# int8 x int8 -> i32. `requant` is an OPAQUE reference to Gemmini's own accumulator-scale lowering
# (rounding-shift / FP-scale-multiply) — Merlin does not model that arithmetic here.
compute_units:
  - name: systolic_mesh
    kind: systolic
    dtypes: [int8]
    ops: [matmul]
    accumulate:
      - {in: int8, weight: int8, acc: i32}
    scaling: per_channel
    requant: {ref: gemmini.accumulator_scale}
capabilities:
  ops: [matmul, bias_add, requant, relu]   # C0 exercises matmul only; rest are future rungs
  layouts: [packed_rhs]
  mesh: {rows: 16, cols: 16}               # DIM x DIM systolic array
  resident_storage_bytes: 262144           # scratchpad
  accumulator_storage_bytes: 65536         # acc SRAM
# Provenance for the capacity numbers above (hand-curated, pending confirmation). A future
# merlin-rtl-introspect (CIRCT facts) pass replaces these and must reproduce them.
provenance:
  source: "generators/gemmini/src/main/scala/gemmini/Configs.scala (GemminiAndOPUShuttleConfig)"
  confirmed: false
  fields: [mesh.rows, mesh.cols, resident_storage_bytes, accumulator_storage_bytes]
memory_model:
  resident: true
  accumulators: true
prototype_scope:
  workload: repeated_rhs_matmul
  conformance_level: C0
  epilogue: none
  output_dtype: i32
oracle_ladder:
  level_0: {name: merlin_reference_and_command_buffer_sim, derived_from_rtl: false}
  level_1: {name: spike_gemmini_functional, derived_from_rtl: false}
  level_2: {name: gemmini_verilator_rtl, derived_from_rtl: true}
  level_3: {name: firesim, derived_from_rtl: true}
compiler_obligations:
  - must_prove_rhs_immutable_for_residency
  - must_tile_to_mesh_shape
  - must_commit_accumulator_before_reuse
  - must_respect_scratchpad_capacity
hardware_promises:
  - weight_stationary_resident_array
  - widening_integer_accumulate
  - cycle_counter
runtime_promises:
  - command_buffer
  - metrics
certification:
  status: uncertified
confidence: medium
requires_human_review: true
notes: >-
  Hand-curated prototype contract for the Gemmini C0 RTL-certification path. Capacities are
  provenance-tagged and pending confirmation against the concrete chipyard config. Spike-Gemmini
  is a functional bootstrap model (derived_from_rtl: false); only Verilator/FireSim count as
  RTL-certified. A future merlin-rtl-introspect pass will replace these hand-curated capacities
  with extracted RTL facts and must reproduce them.
