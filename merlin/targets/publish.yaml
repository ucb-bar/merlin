# Target-publishing remotes (WS-E "target becomes its own repo" bridge).
#
# The publish bridge (merlin.targetgen.publish / `merlin-target-publish`) reads this file to
# resolve the git remote for a target's public repo. Precedence, lowest first:
#   1. this file (per-target default)
#   2. env MERLIN_PUBLISH_REMOTE_<TARGET>  (via merlin.common.paths.env; honors .env)
#   3. --remote CLI override
# Never hardcode a remote in code — resolve_remote() consults these three sources only.
#
# NOTE: the two ucb-bar remotes below are the intended public homes, but the bridge is verified
# against a LOCAL bare remote (file://...) and is NEVER pushed to GitHub by the harness/tests.
layout_version: "1.0"
targets:
  rvv: git@github.com:ucb-bar/rvv-mlir.git
  gemmini: git@github.com:ucb-bar/gemmini-mlir.git

# Branch-per-version publishing (BB0 / C5). The FROZEN unoptimized baseline publishes to a shared
# `baseline` branch (published FIRST so before->after is externally visible); every certified
# champion publishes to its own `stable/<package_id>` branch. resolve_branch() precedence, highest
# first: --branch > env MERLIN_PUBLISH_BRANCH_<TARGET> > this `branches.<target>.<package_id>` map >
# the default policy (baseline | stable/<pkg>). Add an entry here only to override the default for a
# specific package; the default policy covers the common case with no config.
branches:
  rvv: {}
  gemmini: {}
