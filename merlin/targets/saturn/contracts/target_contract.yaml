# Saturn target contract (validates against merlin/schemas/target_contract.schema.yaml).
#
# Curated reference contract for the Saturn RVV vector unit modeled as a multicore
# RV64GCV CPU on spike (chipyard toolchain). Vector parameters below describe the
# spike model; confirm VLEN/ELEN/queue depths against a concrete Saturn RTL config
# (chipyard generators/saturn) before drawing RTL-level conclusions.
name: saturn
version: 0.1
# Runtime backend, evicted from the core runtime/backends/ into this package's backend/ dir (a package of
# saturn_vec.py + saturn_vec_codegen.py + saturn_vec_mlir.py). base._oot_backend_modules loads a reference
# target's plugin.backend (the reference package root is injected as the path), so importing the backend
# self-registers "saturn_vec" with zero env — the core no longer seeds a saturn reference backend.
# Dialect, evicted from the shared library (xdsl_dialects/targets/saturn.py) into this package's
# dialect/ dir. target_lowering._ensure_dialects_discovered loads a reference target's plugin.dialect
# (the reference package root is injected as the path), so importing it self-registers saturn's
# TargetSpec + op->opcode map — the core lowering no longer hardcodes a saturn dialect spec.
plugin:
  backend: backend
  dialect: dialect
features: [rvv, scalable_vl, multicore, resident_packed_tensor, accumulator_commit, command_buffer, metrics]
ops: [pack, matmul, commit, release]
types: [packed_tensor, accumulator]
runtime:
  backends: [simulator, baremetal, vcs, zephyr]
  # Default runtime backend the lowering pipeline stamps when a caller passes none (DERIVED from this
  # contract, not from a name -> backend map in code; see target_registry.backend_for).
  default_backend: baremetal
capabilities:
  ops: [matmul, bias_add, requant, relu]
  layouts: [packed_rhs]
  # "Residency" on a CPU target = a packed weight kept live in memory/cache across
  # the region; bound by a conservative working-set budget (L2-class).
  resident_storage_bytes: 2097152
  harts: 4
vector:
  isa: rv64gcv_zfh_zvfh
  elen: 64
  vlen_default: 128       # spike default; Saturn configs are typically 256/512
  vl_policy: scalable_vl
  tail_policy: agnostic   # vsetvli ta,ma
  lmul_policy: static_m4_accumulate   # e8m1 loads widened into e32m4 accumulators
memory_model:
  resident: true
  accumulators: true      # vector register accumulators (e32m4 tiles)
compiler_obligations:
  - must_prove_rhs_immutable_for_residency
  - must_respect_resident_storage_bytes
  - must_commit_accumulator_before_reuse
  - must_partition_rows_across_harts_deterministically
hardware_promises:
  - scalable_vector_length
  - widening_integer_accumulate
  - per_hart_mcycle
runtime_promises:
  - command_buffer
  - metrics
  - multicore_barrier
legality:
  - "pack requires rhs.mutable == false"
  - "sum(packed_tensor.bytes) <= resident_storage_bytes"
  - "row partition must cover [0, M) exactly once across harts"
confidence: medium
requires_human_review: false
notes: >-
  Curated by hand for the spike-modeled multicore RVV CPU (Merlin's first real-ISA
  backend). The RVV kernel is hand-written assembly
  (merlin/runtime/baremetal/spike/rvv_matmul_i8.S); VCS replay is gated on
  MERLIN_SATURN_SIMV.
