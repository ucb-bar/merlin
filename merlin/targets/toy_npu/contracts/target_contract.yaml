# ToyNPU target contract (validates against merlin/schemas/target_contract.schema.yaml).
name: toy_npu
version: 0.1
features: [resident_packed_tensor, accumulator_commit, command_buffer, metrics]
ops: [res_pack, matmul, commit, evict]
types: [resident_tensor, accumulator]
runtime:
  backends: [simulator, zephyr]
capabilities:
  ops: [matmul, bias_add, requant, relu]
  layouts: [packed_rhs]
  resident_storage_bytes: 131072
  accumulator_entries: 4096
# Datatype -> unit -> op capability model (see merlin.targetgen.compute_units + the target-contract
# schema). ToyNPU is a single int8 systolic matmul unit; formats reference the quant_formats registry.
compute_units:
  - name: pe_array
    kind: systolic
    dtypes: [int8]
    ops: [matmul, bias_add, requant, relu]
    accumulate:
      - {in: int8, weight: int8, acc: i32}
    scaling: per_channel
    requant: {ref: none}
memory_model:
  resident: true
  accumulators: true
compiler_obligations:
  - must_prove_rhs_immutable_for_residency
  - must_respect_resident_storage_bytes
  - must_commit_accumulator_before_reuse
hardware_promises:
  - persistent_resident_tensor
  - accumulator_commit_epilogue
runtime_promises:
  - persistent_handles
  - profiling_regions
legality:
  - "res_pack requires rhs.mutable == false"
  - "sum(resident_tensor.bytes) <= resident_storage_bytes"
