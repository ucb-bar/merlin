# Integration manifest for Autocomp.
name: autocomp
display_name: Autocomp
kind: adapter
vendored: false
external_repo:
  env_var: MERLIN_AUTOCOMP_REPO
  required: false
emits_schema: kernel_record
status: implemented
backing_module: merlin.kernels.ingest.autocomp
notes: >-
  External repo is passed by path/env var, never vendored. Adapter must degrade
  gracefully when MERLIN_AUTOCOMP_REPO is unset.
