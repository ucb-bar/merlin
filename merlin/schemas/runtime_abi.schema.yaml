# yaml-language-server: $schema=none
# merlin schema (not yet formal JSON Schema; structured enough for validation).
title: Runtime ABI
purpose: >-
  Declares the Merlin-owned runtime ABI: the versioned set of operations every backend/adapter
  must support (device discovery, buffer alloc/import, typed views, command-buffer create/append,
  submit, wait, persistent handle create/destroy, metrics read, trace emit, error reporting).
  Merlin owns this; targets implement adapters against a named version. Consumed by the runtime
  backends, adapters, and the command-buffer format.
required_top_level_fields:
  - version
  - operations
  - backends
  - error_model
producer: merlin core runtime (hand-authored, versioned)
consumers:
  - merlin/runtime/*
  - generated target repo runtime/adapter
  - command_buffer.schema.yaml
validation_notes: >-
  version is a string (e.g. "0.1"). operations is the canonical capability list; adapters
  declare support against it in runtime_adapter_plan. backends enumerates the runtime backends
  Merlin ships (simulator/host/baremetal/zephyr/firesim/external).
example: |
  version: "0.1"
  operations:
    - device_get
    - buffer_alloc
    - buffer_view_create
    - command_buffer_create
    - command_buffer_append
    - submit
    - wait
    - handle_create
    - handle_destroy
    - metrics_read
    - trace_emit
  backends: [simulator, host, baremetal, zephyr, firesim, external]
  error_model:
    convention: int_return_codes
    zero_is_success: true
