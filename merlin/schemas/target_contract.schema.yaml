# yaml-language-server: $schema=none
# merlin schema (not yet formal JSON Schema; structured enough for validation).
title: Target Contract
purpose: >-
  Describes a hardware/software target: its capabilities, the obligations it places on the compiler, and the promises the hardware/runtime makes. Owned by the TargetGen workstream; consumed by kernel-mining and design-pressure/DSE.

required_top_level_fields:
  - name
  - version
  - capabilities
  - memory_model
  - compiler_obligations
  - hardware_promises
  - runtime_promises
  - legality
producer: merlin.targetgen.synthesize.target_contract (or hand-authored under merlin/targets/<t>/contracts/)
consumers:
  - merlin.python.merlin.kernels
  - merlin.python.merlin.design_pressure
  - merlin.python.merlin.dse
  - merlin.targetgen.synthesize.* (seeds the other plans)
validation_notes: >-
  Required top-level fields must all be present. For toy_npu the synthesized contract also
  carries `features`, `ops`, `types`, and `runtime.backends`; real targets surface detected
  concepts under `capabilities.detected_concepts` and are flagged `requires_human_review: true`.

  OPTIONAL `compute_units` (the datatype -> unit -> op capability model; parsed by
  `merlin.targetgen.compute_units`): a list of units, each `{name, kind (systolic|simt|vector|
  scalar), dtypes: [<quant_formats name>...], ops: [...], accumulate: [{in, weight, acc}] (the
  act x weight -> accumulator matrix), scaling: <quant_formats name>|none, requant: {ref: <id>}|none,
  contains: [<unit name>...]}`. `dtypes`/`scaling` REFERENCE the target-agnostic
  merlin/schemas/quant_formats.registry.yaml by name (never redefine an encoding here). `acc` is a
  raw MLIR accumulator token (i32/f32). `requant` is an OPAQUE reference to the target's own
  out-of-tree lowering — Merlin does not interpret the requant arithmetic (it is target-specific:
  gemmini rounding-shift vs gemmini-mx E8M0 block-exponent + LUT vs radiance none). `contains`
  composes units (a gemmini-mx systolic unit can be embedded in a radiance cluster, or stand alone).
  When present, `merlin.targetgen.rtl.introspect.validate_against_contract` cross-checks the units'
  dtypes/accumulators against the RTL-derived `datapaths`.

  OPTIONAL `harness_abi` (how a runner-owned harness calls into this target's kernel; parsed by
  `merlin.targetgen.contract.harness_abi`): `{entry_symbol (REQUIRED), fence_symbol, includes: [...],
  cycle_window_metric, extern_decls: [...]}`. These are conventions of the target's own bare-metal test
  environment, NOT RTL facts — nothing in a fact bundle says a kernel is called `foo_kernel` rather than
  `bar_entry` — which is exactly why the target declares them and why the parser refuses rather than
  substituting a default. A default here would produce a harness that compiles and then fails to link,
  with the error pointing at the linker instead of at the missing declaration. Omit `cycle_window_metric`
  when the target does not distinguish an accelerator region: an absent metric and one printed as 0 are
  read identically by the runner's parser, so emitting a falsy one says nothing.

  OPTIONAL `plugin` (the package's extension points; recognised keys are declared once in
  `merlin.targetgen.plugins.PLUGIN_KEYS` and validated by `load_target`). A reference is a path
  relative to the package root, a dotted module, or `module:attribute`. Two rules matter more than the
  list of keys. An UNRECOGNISED key is an ERROR, not something to ignore — a misspelled `backend` is
  not a broken backend, it is no backend at all, found much later as a missing feature. And every
  reference must resolve to a file inside THIS package: a generated contract that inherits its base
  contract's plugin block can otherwise carry pointers to modules sitting beside the base, one level
  above the new root, which read exactly like live seams and resolve to nothing.
  Each key also records whether core actually loads it. `backend` is load-bearing (a runtime backend
  module that self-registers). `dialect_module` and `lowering_entrypoint` are POINTERS to a package's
  own feasibility prototypes and are deliberately loaded by nothing; they are not the staged pipeline's
  target dialect (that is the package's `dialect.py`) nor its lowering tables (`lowering.yaml`).
  Recording that distinction at the declaration is what keeps "nothing consumes this" from being read
  as "this is broken".

example: |
  name: toy_npu
  version: 0.1
  capabilities:
    ops: [matmul, requant, relu]
    layouts: [packed_rhs]
    resident_storage_bytes: 131072
  memory_model:
    resident: true
    accumulators: true
  compiler_obligations:
    - must_prove_rhs_immutable_for_residency
    - must_respect_resident_storage_bytes
  hardware_promises:
    - persistent_resident_tensor
    - accumulator_commit
  runtime_promises:
    - persistent_handles
  legality:
    - resident_pack requires rhs.mutable == false
