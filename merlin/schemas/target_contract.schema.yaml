# yaml-language-server: $schema=none
# merlin schema (not yet formal JSON Schema; structured enough for validation).
title: Target Contract
purpose: >-
  Describes a hardware/software target: its capabilities, the obligations it places on the compiler, and the promises the hardware/runtime makes. Owned by the TargetGen workstream; consumed by kernel-mining and design-pressure/DSE.

required_top_level_fields:
  - name
  - version
  - capabilities
  - memory_model
  - compiler_obligations
  - hardware_promises
  - runtime_promises
  - legality
producer: merlin.targetgen.synthesize.target_contract (or hand-authored under merlin/targets/<t>/contracts/)
consumers:
  - merlin.python.merlin.kernels
  - merlin.python.merlin.design_pressure
  - merlin.python.merlin.dse
  - merlin.targetgen.synthesize.* (seeds the other plans)
validation_notes: >-
  Required top-level fields must all be present. For toy_npu the synthesized contract also
  carries `features`, `ops`, `types`, and `runtime.backends`; real targets surface detected
  concepts under `capabilities.detected_concepts` and are flagged `requires_human_review: true`.

example: |
  name: toy_npu
  version: 0.1
  capabilities:
    ops: [matmul, requant, relu]
    layouts: [packed_rhs]
    resident_storage_bytes: 131072
  memory_model:
    resident: true
    accumulators: true
  compiler_obligations:
    - must_prove_rhs_immutable_for_residency
    - must_respect_resident_storage_bytes
  hardware_promises:
    - persistent_resident_tensor
    - accumulator_commit
  runtime_promises:
    - persistent_handles
  legality:
    - resident_pack requires rhs.mutable == false
