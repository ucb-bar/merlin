# Command-buffer ABI (experiment ABI v0.1)
# The target-independent command buffer a package emits from emit_command_buffer. Strict schema:
# schemas/command_buffer.schema.json. Interpreted by merlin's reference + simulator (the L0 gate).
version: "0.1"
schema: schemas/command_buffer.schema.json
top_level:
  required: [abi_version, target, commands]
  optional: [backend, tensors, kernel_abi, params, metrics_requested, resources]
tensors:
  description: "name -> {shape:[..], dtype: i8|i16|i32|f16|f32|bf16|fp8_e4m3|fp8_e5m2, role: input|weight|bias|output|scale|intermediate, base?: int}"
  note: >
    Declare EVERY tensor your kernel touches — inputs/weights AND the output. For an external_backend
    (self-hosted-ISA) target graded on the program oracle, add `base` (the DRAM byte address your kernel
    loads that input from / stores that output to): the oracle preloads inputs and reads the output back
    at exactly these addresses, so they must match your kernel's loads/stores. `base` is optional (if you
    omit it the harness assigns a canonical layout), but the OUTPUT tensor must be declared so its result
    can be captured. For a command_buffer (ISA-less) target the leaf inputs alone still suffice.
kernel_abi:
  description: >-
    Optional explicit pointer boundary for one submitted whole-program kernel. This is the admissible
    form for a program whose submitted ELF contains more work than the accelerator-only `commands`
    stream can represent, such as mesh -> scalar-host -> mesh. It is an allocation/call contract, not
    permission for the harness to implement an operation.
  kind: whole_program
  args: "ordered [{tensor: declared_tensor_name, access: read|write|readwrite}, ...]"
  outputs: "non-empty [tensor_name, ...], exactly the tensors whose declared role is output"
  launch: >-
    Optional {kind: simt_single_warp|simt_all_warps}. Requests an evaluator-owned launch wrapper which
    activates every RTL-derived lane in the current warp, or every warp and lane on the one-core launch
    path, before calling the submitted external kernel, then restores manager-only execution before the
    harness continues. The buffer supplies no geometry, CSR, opcode, or mask: those are derived from the
    target runtime/RTL facts and checked against `resources`.
  invariants: >-
    Every tensor declared in `tensors` appears in args exactly once and every arg names a declared
    tensor. input/weight/bias/scale roles have read access; output/intermediate roles have write access.
    The runner allocates/materializes those buffers, performs one unmeasured warm kernel call, measures
    exactly one complete kernel call, and prints only outputs. It does not reconstruct scalar regions,
    add/remove work, or infer a candidate-specific pointer order.
opcodes:
  RES_PACK:
    operands: {src: leaf_or_handle, dst: handle}
    attributes: {layout: string}
    semantics: "make src resident (packed/stationary) under handle dst"
  MATMUL_RESIDENT:
    operands: {lhs: tensor, rhs: resident_handle, dst: acc_handle}
    semantics: "dst = lhs @ resolve(rhs); i8 x i8 -> i32 accumulate"
  MATMUL:
    operands: {lhs: tensor, rhs: tensor, dst: acc_handle}
    semantics: "non-resident matmul (residency optimization absent)"
  COMMIT:
    operands: {src: acc_handle, dst: output_tensor, bias: "tensor (optional)"}
    attributes:
      # THE epilogue vocabulary of this ABI. It has exactly ONE definition --
      # merlin.runtime.commandbuffer.EPILOGUE_STAGES -- from which this line, the strict validator's enum
      # in schemas/command_buffer.schema.json, interface_dialect_contract.yaml and the dialect verifiers
      # are all derived; build_tools/scripts/check_epilogue_vocabulary.py fails if any of them drifts.
      # It is deliberately NOT derived per-target: this schema is target-INDEPENDENT (one validator for
      # every target), so no single target's RTL can define it. It is the set of stages the command-buffer
      # ENGINES implement. Whether a given target can EXECUTE a stage is a separate question, answered by
      # its own capability manifest and, at run time, by its oracle -- and an engine that does not
      # implement a listed stage REJECTS IT BY NAME rather than skipping it (see `semantics` below).
      # The per-opcode lines further down are documented SUBSETS of this one, never extensions.
      epilogue: "ordered subset of [bias_add, bias, requant, acc_scale, relu, maxpool]"
      output_dtype: "i32 (full readout) | i8 (scaled/clamped readout)"
      acc_scale: "f32; applied as clamp_i8(round_near_even(acc * scale)) in binary32, the declared device readout; a command that also names scale_numerator/scale_denominator, zero_point, quant_min, quant_max or rounding gets the exact rational host RNE instead (the pair takes precedence and acc_scale is then optional). Device defaults to full i32"
      requant_shift: "int; the integer requant stage's round-half-up arithmetic shift; REQUIRED iff requant in epilogue, defaulted by nothing -- an omitted shift is not 4, it is a stage whose one parameter nobody stated, and every engine would then apply its own"
      # Pooling geometry -- REQUIRED iff "maxpool" is in epilogue, defaulted by nothing. These are the
      # store-path configuration fields (config_st's pool_size / pool_stride / orows / ocols / upad /
      # lpad), which is where this class of target fuses pooling, so they ride on the command that
      # reads the accumulator out.
      pool_in_dims: "[H, W] -- the spatial extent the committed ROWS unflatten to (the ABI's orows/ocols). REQUIRED: an [M, N] accumulator carries no spatial extent, and 25 rows is 5x5 or 25x1"
      pool_size: "[ph, pw] pooling window. REQUIRED -- no default"
      pool_stride: "[sh, sw] pooling stride. REQUIRED -- no default"
      pool_padding: "[top, left, bottom, right]; default [0, 0, 0, 0]"
      pool_pad_value: "int; REQUIRED iff any pool_padding entry is nonzero -- the identity element of a max over a padded cell is a datapath property (-inf mathematically, commonly 0 in a store path) and is never assumed"
    semantics: >-
      apply epilogue stages in listed order, then cast to output_dtype. Every stage but `maxpool` is
      elementwise and preserves the accumulator's [M, N] shape; `maxpool` is a WINDOWED MAX that
      reshapes the M rows to [batch, H, W] (batch = M / (H*W)), walks the window, and commits
      [batch*Ho*Wo, N] with Ho = (H + pt + pb - ph) // sh + 1 (Wo likewise). A stage this engine does
      not implement is REJECTED BY NAME, never skipped: golden and reference both skipping one AGREE,
      and the capsule then passes having proved nothing about the stage it declared.
  EVICT:
    operands: {handle: resident_handle}
    semantics: "release the resident weight's working-set budget"
  # Whole-op opcodes (no residency decomposition). The authoritative enumeration of the interface
  # mnemonics that reach them is targetgen.contract.interface_emit.defined_mnemonics(), read from the
  # parser's own tables; an op the parser does not define now RAISES rather than being dropped.
  MOVEMENT:
    operands: {src: tensor, dst: output_tensor}
    attributes:
      output_dtype: "the container dtype the values land in (operand dtype in, accumulate dtype out)"
      semantic: "string; the movement form being exercised (e.g. mvin_mvout)"
      form: >-
        "identity (default) | permute | slice | pad | broadcast | repeat". Absent, the op is the identity
        round-trip below. Each other form names its own REQUIRED attributes and no default is applied:
        permute {perm}; slice {offsets, sizes, strides}; pad {low, high, mode: constant|reflect|replicate,
        value_code (constant only: the already-quantized pad code)}; broadcast {} (to dst's declared
        shape, LEADING dims only -- a stride-0 load replays whole rows); repeat {repeats}
      scale: >-
        "legacy binary scalar, optional: exact host clamp(RNE(x * scale)), never an approximate load-path multiply; paired scale_numerator/scale_denominator takes precedence"
    semantics: >-
      identity load->store round-trip through the accelerator: dst holds src's values UNCHANGED,
      only the container dtype widens. No clamp, no requantize -- the point of the capsule is that
      the data survives the trip bit-for-bit. A `form` restates WHICH elements move where
      (torch permute / extract_slice / pad / broadcast / repeat semantics, defined once in
      merlin.runtime.integer_ops.move), still with no arithmetic unless `scale` is stated.
  CONCAT:
    operands: {src0: tensor, src1: tensor, "src2..src7": "tensor (optional)", dst: output_tensor}
    attributes:
      axis: "int -- REQUIRED, no default"
      output_dtype: "the destination container dtype"
      scales: "[f32, ...] -- optional, one per source: each source is requantized once (see MOVEMENT scale); absent, sources share qparams and move unchanged"
    semantics: >-
      dst = cat([requant(src_i, scales[i]) for i], axis): torch.cat over sources of equal rank whose
      shapes agree off the axis. Defined in merlin.runtime.integer_ops.concat.
  INSERT_SLICE:
    operands: {dest: tensor, src: tensor, dst: output_tensor}
    attributes:
      offsets: "[int] -- REQUIRED, one per dim"
      strides: "[int >= 1] -- REQUIRED, one per dim"
      output_dtype: "the destination container dtype"
    semantics: >-
      dst = dest with dst[offsets[d] + i*strides[d] for each d] = src[i] -- slice_scatter, and
      select_scatter with the selected dim kept at size 1 (src rank equals dest rank). The slice must lie
      inside dest. Defined in merlin.runtime.integer_ops.insert_slice.
  FILL:
    operands: {dst: output_tensor}
    attributes:
      value_code: "int -- REQUIRED; the ALREADY-quantized code, sat(RNE(v / s_out)) (merlin.targetgen.recipe_numerics.constant_code)"
      output_dtype: "an integer dtype -- REQUIRED"
    semantics: >-
      every element of dst's declared shape is value_code: fill, full, full_like, and zero_fill
      (value_code 0). Defined in merlin.runtime.integer_ops.fill.
  AFFINE_MAP:
    operands: {x: tensor, y: "tensor (optional)", dst: output_tensor}
    attributes:
      weights: "[int] -- REQUIRED, one per operand, |w| <= 381; applied in the int32 accumulator, never on an int8 load path"
      constant: "int -- REQUIRED (0 for none); the int32 accumulator seed"
      activation: "none | relu -- REQUIRED; relu acts on the ACCUMULATOR, before the scale"
      readout_scale: "legacy binary scalar; optional with exact scale_numerator/scale_denominator; host only"
      scale_numerator: "decimal integer string -- exact rational numerator"
      scale_denominator: "positive decimal integer string -- paired denominator"
      zero_point: "int, optional (0); added after RNE"
      rounding: "half_to_even (default)"
      output_dtype: "i8 (one readout rounding) | i32 (no readout: readout_scale must be 1.0) -- REQUIRED"
      quant_min: "int, optional; default the dtype minimum"
      quant_max: "int, optional; default the dtype maximum"
    semantics: >-
      acc = weights[0]*x + weights[1]*y + constant (exact int32 integers; overflow refuses);
      acc = max(acc, 0) iff activation is relu; dst = clamp(round_half_even(acc * exact_rational_scale) + zero_point,
      quant_min, quant_max) for an i8 result, dst = acc for an i32 result. y has x's shape or broadcasts
      along LEADING dims only. This is the exact single-rounding form of add/sub.Tensor (signed rational
      integer weights), add/sub.Scalar (integer gain and int32 constant), mul/div.Scalar and neg
      (readout scale, negative for neg), standalone relu and int8 -> int32 widening; parameters come from
      merlin.targetgen.recipe_numerics and the definition is merlin.runtime.integer_ops.affine_map.
  WINDOW_SUM:
    operands: {src: tensor, dst: output_tensor}
    attributes:
      mode: >-
        "REQUIRED. window {kernel, stride, padding, count_include_pad} | adaptive {} (output extents from
        dst) | reduce {dims, average} | window_transpose / adaptive_transpose (the pool backwards; same
        attributes as window / adaptive, dst is the pooled op's INPUT shape) | fold {kernel, stride,
        padding, dilation} (col2im: src [N, C*prod(kernel), L] -> dst [N, C, *spatial])"
      readout_scale: "legacy binary scalar > 0; optional with exact rational pair; host only"
      scale_numerator: "decimal integer string -- exact numerator of s_in / s_out"
      scale_denominator: "positive decimal integer string -- paired denominator"
      zero_point: "int, optional (0); added after RNE"
      rounding: "half_to_even (default)"
      output_dtype: "i8 (one readout per output) | i32 (no readout: readout_scale 1.0 and no divisor) -- REQUIRED"
      layout: "nhwc (default; spatial dims are dims[1:-1]) | nchw (spatial dims are the trailing ones) -- window/adaptive modes"
      ceil_mode: "bool, optional (window modes); torch's ceil_mode output extent"
      divisor_override: "int > 0, optional (window modes); replaces every window's count"
      quant_min: "int, optional"
      quant_max: "int, optional"
    semantics: >-
      Exact int32 sums, full-width readout, then ONE exact host quantization per output:
      dst[o] = clamp(round_half_even(acc[o] * exact_rational_scale / count[o]) + zero_point,
      quant_min, quant_max). No floating accumulator conversion, product rounding or scale division.
      window: acc[o] = sum of src over o's window (torch avg-pool geometry with symmetric padding; padded
      cells contribute nothing), count[o] = the window's in-bounds size, its padded size when
      count_include_pad, or divisor_override. adaptive: torch adaptive windows [floor(o*In/Out),
      ceil((o+1)*In/Out)). reduce: the sum over dims, count = their product when average else 1 (a mean or
      a sum). window_transpose / adaptive_transpose: each window w spreads its value over the positions it
      covers divided by its count, stated exactly as integer weights L/count[w] (L = the least common
      multiple of every count) into one accumulator with the readout readout_scale / L. fold: the sum of
      overlapping patches (torch col2im), count 1. Defined in merlin.runtime.integer_ops.window_sum.
  FENCE:
    operands: {}
    semantics: >-
      A completion barrier: every earlier command's loads, stores and computes are complete and their
      memory effects visible before any later command issues. No numeric effect in any engine. A command
      that reads a tensor an EARLIER command of the same buffer wrote needs a FENCE between them on a
      target whose contract obliges must_fence_dram_read_after_write (merlin.runtime.fences).
  ATTENTION_QK:
    operands: {q: tensor, k: tensor, dst: output_tensor}
    attributes:
      epilogue: "ordered subset of [acc_scale, requant, relu]"
      output_dtype: "i32 (full readout) | i8 (scaled/clamped readout)"
    semantics: >-
      dst = q @ transpose(k), the first matmul of attention: q is [m, d] and k is [n, d] -- K is stored
      ROW-PER-KEY, so the contraction is over the TRAILING head dim of BOTH operands and dst is [m, n].
      The transpose is part of the op's definition and is NOT spelled as an attribute: there is no
      transpose_rhs / rhs_transposed / transpose_b flag, and an unrecognised attribute is rejected rather
      than ignored. Operand keys are exactly q / k / dst (the interface grammar's positional operands for
      the `attention_qk` mnemonic).
  ATTENTION_PV:
    operands: {p: tensor, v: tensor, dst: output_tensor}
    attributes:
      epilogue: "ordered subset of [acc_scale, requant, relu]"
      output_dtype: "i32 (full readout) | i8 (scaled/clamped readout)"
    semantics: >-
      dst = p @ v, the second matmul of attention: p is [m, s] over s keys, v is [s, d].
      NO transpose (unlike ATTENTION_QK, which contracts the trailing head dim of both operands).
  BATCHED_MATMUL:
    operands: {a: tensor, w: tensor, dst: output_tensor}
    semantics: >-
      Independently varying batched contraction A[*B, M, K] @ W[*B, K, N] -> dst[*B, M, N].
      A, W, and dst have the same rank, which is at least three; *B is a non-empty, identical,
      strictly-positive static batch prefix on all three tensors. There is NO broadcasting and no
      implicit shared/resident weight: both a and w are read in full. Execution may flatten *B to
      product(*B) independent 2-D contractions, but slices follow row-major lexicographic order and
      the declared destination retains the original batch axes. Integer multiplication accumulates
      in i32; an i8 x i8 command therefore declares an i32 destination. The tensor shapes, not an
      optional `batch` attribute, are authoritative.
  BIAS_ADD:
    operands: {src: tensor, bias: tensor, dst: output_tensor}
    attributes:
      output_dtype: "the ACCUMULATOR's dtype -- see semantics; the stage runs before any requant"
      epilogue: "ordered subset of [bias_add]; the stage this op IS, listed for symmetry with COMMIT"
    semantics: >-
      dst[i, j] = src[i, j] + bias[j] -- one length-N vector added to every row. This is the
      `bias_add` COMMIT stage standing on its own, over an already-committed tensor rather than over
      an accumulator, so that a fused matmul+bias has an unfused half to be measured against.
      BOTH OPERANDS ARE IN THE ACCUMULATOR'S DTYPE, not the operand dtype: the bias lands on the
      accumulator before any requant, so on an i8 x i8 -> i32 datapath the vector is i32. Declared in
      the operand dtype it would be a different computation from the one the fused capsule performs,
      and the two members' cycles would not be summable -- which is the whole basis of the comparison.
      A target with no separate vector-add class is expected to fold this into its accumulator
      read-out; its capsule then requires no vector instruction, which the derived
      `expected_instruction_coverage` already reflects rather than demanding one.
  RESIDUAL_ADD:
    operands: {lhs: tensor, rhs: tensor, dst: output_tensor}
    attributes:
      lhs_scale: "f32 -- REQUIRED, no default; carries lhs into the output's domain"
      rhs_scale: "f32 -- REQUIRED, no default; carries rhs into the output's domain"
      bound_lsb: "int >= 0 -- REQUIRED, no default; see semantics"
      epilogue: "ordered subset of [relu]"
      output_dtype: "an integer dtype; the sum is saturated into it before the activation"
    semantics: >-
      dst[i, j] = relu?( sat( RNE( exact(lhs[i, j]) * lhs_scale + exact(rhs[i, j]) * rhs_scale ) ) ),
      every product and the sum in exact rational arithmetic. The final RNE and saturation are
      the only quantization. Exact device admission requires bound_lsb 0 and recorded product
      proofs for any floating load implementation. A scaled load that rounds each operand before
      addition is refused; integer weights with full int32 readout and exact host requantization
      provide the general implementation. Identity loads and exact integer sums remain admissible.
  CONV2D:
    operands: {ifm: tensor, weight: resident_handle_or_tensor, dst: output_tensor}
    attributes:
      kernel: "[kh, kw, ci, co] -- REQUIRED; ci must equal the ifm's channel dim"
      stride: "[stride_h, stride_w]; default [1, 1]"
      padding: "[top, left, bottom, right] zero-pad; default [0, 0, 0, 0]"
      dilation: "[dilation_h, dilation_w]; default [1, 1]"
      layout: "nhwc (the ONLY layout defined; anything else is rejected by name)"
      epilogue: "ordered subset of [bias_add, bias, requant, acc_scale, relu, maxpool] -- the readout a COMMIT applies"
      acc_scale: "f32 -- REQUIRED iff acc_scale is in epilogue; NO default (a stage declared without its multiplier is refused by every engine, never applied at 1.0)"
      bias: "name of a declared tensor of role bias, shape [Co], in the ACCUMULATOR's dtype -- REQUIRED iff bias_add/bias is in epilogue; resolved by the same reader a COMMIT's bias is"
      output_dtype: "an INTEGER dtype: i32/i64 read out whole, i8/i16/... saturate to that width"
      # Pooling geometry -- REQUIRED iff "maxpool" is in epilogue, defaulted by nothing. These are the
      # store-path configuration fields (config_st's pool_size / pool_stride / orows / ocols / upad /
      # lpad), which is where this class of target fuses pooling, so they ride on the command that
      # reads the accumulator out.
      pool_in_dims: "[Ho, Wo] -- the conv's OWN output extent. Declared so the flat [N*Ho*Wo, Co] product can be unflattened, and CROSS-CHECKED against the geometry derived from kernel/stride/padding/dilation: a disagreement is rejected, never reconciled"
      pool_size: "[ph, pw] pooling window. REQUIRED -- no default"
      pool_stride: "[sh, sw] pooling stride. REQUIRED -- no default"
      pool_padding: "[top, left, bottom, right]; default [0, 0, 0, 0]"
      pool_pad_value: "int; REQUIRED iff any pool_padding entry is nonzero -- the identity element of a max over a padded cell is a datapath property (-inf mathematically, commonly 0 in a store path) and is never assumed"
    semantics: >-
      dst = im2col(ifm) @ resolve(weight): the NHWC activation is gathered into its
      [N*Ho*Wo, Kh*Kw*Ci] im2col matrix (column order kh, kw, ci; out-of-bounds taps read zero) and
      contracted against the PRE-im2col'd weight [Kh*Kw*Ci, Co], giving [N*Ho*Wo, Co]. Ho/Wo follow
      the usual (H + pt + pb - (dh*(kh-1)+1)) // sh + 1. There is no separate COMMIT: the epilogue
      and the narrowing happen here -- including a fused `maxpool`, which pools the [N*Ho*Wo, Co]
      product down to [N*Hp*Wp, Co] exactly as the fused conv loop's pooling store does.
    unsupported: >-
      Grouped/depthwise convolution (no groups attribute exists), a non-nhwc layout, a bias stage
      that names no tensor, an acc_scale stage that names no multiplier, and a non-integer
      output_dtype. Each is REJECTED by name rather than ignored -- an ignored conv parameter is exactly the silent wrong answer this
      opcode was added to stop.
  K_CHAIN:
    operands: {src: tensor, weight: tensor, weight2: tensor, dst: output_tensor}
    attributes:
      output_dtype: "the accumulator/output dtype of both contractions"
    semantics: >-
      dst = (src @ weight) @ weight2. This is the canonical whole-op representation for a composed
      two-matmul linalg graph when the frontend has not decomposed it into residency commands. The
      intermediate result is not externally observable; a target may fuse the chain or lower it into
      two ordinary tiled contractions. Shapes must satisfy src[M,K], weight[K,N], weight2[N,P], and
      dst[M,P]. This opcode is target-independent model vocabulary, not permission to dispatch on one
      corpus shape.
  DEPTHWISE_CONV2D:
    operands: {src: tensor, weight: tensor, dst: output_tensor}
    attributes:
      kernel: "[kh, kw]; must match weight's trailing dimensions"
      stride: "[stride_h, stride_w]; default [1, 1]"
      padding: "[top, left, bottom, right]; default [0, 0, 0, 0]"
      dilation: "[dilation_h, dilation_w]; default [1, 1]"
      output_dtype: "logical output dtype"
    semantics: >-
      NCHW depthwise convolution with groups equal to the input channel count: weight has shape
      [C, 1, Kh, Kw], each output channel consumes only the corresponding input channel, and output
      geometry follows the ordinary convolution stride/padding/dilation rule. A target may lower the
      window formation through generated im2col linalg, scalar/vector lanes, or a native convolution
      instruction; the command does not prescribe a target or a capsule shape.
correctness_gate: >-
  Integer workloads => exact equality (==), never a tolerance. reference_outputs(cb) and
  simulate(cb)["outputs"] MUST be equal (L0), and equal to the oracle output (L1/L2).

exact_int32_host_readout:
  api: merlin.runtime.exact_readout.requantize_int32
  device_output: full-width signed int32 accumulator tiles; no scaling or narrowing
  parameters: [scale_numerator, scale_denominator, zero_point, quant_min, quant_max, rounding, axis]
  scale: exact rational effective coefficient, already divided by output_scale; denominator positive
  broadcast: scalar or one-element vector; channel vectors along axis (default last)
  semantics: clamp(RNE(acc * scale_numerator / scale_denominator) + zero_point, quant_min, quant_max)
  result: int64 logical storage codes with the accumulator shape; store as declared int8/uint8 without rounding
  rounding: half_to_even only; one rounding after all exact source arithmetic
  refusal: non-int32 or overflowed accumulators, invalid extents, bounds, zero points or denominators
  provider_proof: schedule.readout=full_i32 and schedule.requantization=retained_source_exact_integer with matching rational arrays
  fp32_exception: Merlin conservatively requires full_i32; final-code equivalence alone never proves product exactness
