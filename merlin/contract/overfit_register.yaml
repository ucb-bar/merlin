# Every place the target-agnostic core is welded to a specific target — declared, costed, countable.
#
# WHY THIS FILE EXISTS. The repo's cardinal rule is "derive, never hardcode": library code must not bake
# in facts about one piece of hardware. The gates that enforce it kept their exemptions in flat
# allowlists and announced them on a PASSING line ("36 allowlisted entries"), which reads as "nothing to
# see" when it means 36 places the rule is suspended. An overfit that passes a gate quietly stops being
# work anyone can see. This file makes each one say what it costs and what would remove it.
#
# THE COUNT MAY ONLY FALL. `check_overfit_register.py` re-measures the live tree on every run: a coupled
# module that is not declared here FAILS the gate (new debt must be declared, not absorbed), and a
# declared module that no longer couples is reported as ready to delete. So the register cannot drift
# from reality in either direction, which is the failure mode of every hand-maintained debt list.
#
# TRIAGE IS PART OF THE SCHEMA, ON PURPOSE. An entry is `status: triaged` only when someone has actually
# read the code and can state why the fact is not derivable, what it blocks, and what would remove it.
# Everything else is `status: untriaged` and must say when and how it surfaced. Without that distinction
# a required-fields schema just pressures people into inventing plausible rationales, and a fabricated
# `removal_condition` is worse than an honest "nobody has looked at this yet" — it reads as rigour.
#
# Required fields: id, kind, status, items, owner.
#   `status: triaged`   also requires why, blocks, removal_condition.
#   `status: untriaged` also requires surfaced_by, surfaced_on.
#
# kinds:
#   target_name        a target-name string literal in code that should resolve the target at runtime
#   target_coupling    a module with no target in its name that depends on a specific target
#   runtime_concession a limit taken at run time because a general path does not work on some hardware
#   dead_seam          a declared extension point that nothing consumes
#
# NOT YET MIGRATED. Two sibling ratchets still hold their own entries and are counted here without being
# restated, because inventing rationales for them would violate the paragraph above:
#   build_tools/scripts/regex_allowlist.txt      (23 entries)
#   build_tools/scripts/provenance_ratchet.txt   (28 entries)
# Prose ledger of the same debt, task-numbered: docs/design/target_agnostic_core.md (T1–T13).
version: 1

entries:

  # ---------------------------------------------------------------- oracle + runner dispatch
  - id: oracle-and-runner-dispatch-names-reference-targets
    kind: target_coupling
    status: triaged
    owner: targetgen
    items:
      - merlin/python/merlin/targetgen/heavy_oracles.py
      - merlin/python/merlin/targetgen/oot_runner.py
      - merlin/python/merlin/targetgen/baremetalc_corroborate.py
      - merlin/python/merlin/targetgen/agent/kernel_slot.py
      - merlin/python/merlin/targetgen/agent/vector_kernel_slot.py
      - merlin/python/merlin/targetgen/rtl/mlc_bridge.py
    why: >-
      The inputs to oracle selection are already declarative — endpoint_kind and sim_via come from the
      capability manifest and the contract — but the DISPATCH on them is a hardcoded if-chain that
      imports a reference target's module directly (`sim_via == "cyclotron"` -> muon_oracles,
      `sim_via == "chipyard"` -> the gemmini backend). There is no registry to route through: nothing
      like `register_oracle_engine(sim_via, factory)`, `register_suite(name, build_fn)` or
      `register_fact_extractor(kind, fn)` exists. `runtime/backends/base.py` is the only seam in the repo
      that is complete end to end, and these predate it.
    blocks: >-
      Evicting any reference accelerator backend, and adding a new target's oracle without editing core.
      A package can already supply a runtime backend via plugin.backend; it cannot supply an oracle, a
      conformance suite, or an RTL fact extractor.
    removal_condition: >-
      Registries exist for oracle engines, suites and fact extractors, modelled on
      runtime/backends/base.py (register + file-path discovery via a plugin.<key> contract entry), and
      these modules route through them instead of importing a target.

  # ---------------------------------------------------------------- merged-in coupling, not yet read
  - id: answer-surface-and-prompt-name-reference-targets
    kind: target_coupling
    status: untriaged
    owner: capsule-bench
    items:
      - merlin/python/merlin/targetgen/sandbox/answer_surfaces.py
    surfaced_by: >-
      The overfit-register gate, on merging reconcile/gemmini-feat-v2 into feat/target-generalization for
      the gemmini arm-4 model-comparison campaign. Both modules gained the coupling on that side of the
      merge, not in this branch's work; the register itself merged clean and so did not carry a matching
      declaration. Declared rather than absorbed, per this file's own rule. Nobody has yet read either
      module to say whether the fact is derivable, so no rationale or removal condition is invented here.
    surfaced_on: 2026-08-18

  # ---------------------------------------------------------------- cost model / calibration
  - id: cost-model-and-calibration-bound-to-an-instance
    kind: target_coupling
    status: triaged
    owner: targetgen
    items:
      - merlin/python/merlin/cost_model/calibrate.py
      - merlin/python/merlin/targetgen/oracle_helpers/npu_emit.py
    why: >-
      `cost_model/gemmini.py` is already a clean split — an EVENTS tuple, a byte ratio, a coefficient
      artifact and one `predict` override over `cost_model/linear.LinearCostModel` — but nothing in core
      RESOLVES a target to a cost model, so the only way to reach it is to import it by name. The npu
      calibration modules import a model package the same way.
    blocks: >-
      Evicting cost_model/gemmini.py and its coefficient artifact into the target's own package, and
      supplying a cost model for any new target without editing core.
    removal_condition: >-
      A cost-model seam exists (a contract key naming the class, or EVENTS + coefficients read from the
      package) and these callers resolve through it.

  # ---------------------------------------------------------------- run-time concession
  - id: simt-spawn-width-capped-below-declared-hardware
    kind: runtime_concession
    status: triaged
    owner: targetgen
    items:
      - out/artifacts/targets/radiance/hand_v0/backend.py
    why: >-
      The target's contract correctly declares 8 warp slots (its RTL config sets
      `WithSIMTConfig(numWarps = 8)`), but 8 does not produce correct results on the arc oracle we grade
      against, while 4 does: measured with three unrelated kernel bodies, at 8 warps every case returned
      the manager warp's element as zero with the rest correct. The mechanism is deliberately NOT asserted
      — the same oracle also drops stores that little execution follows, which would explain the identical
      table with no spawn defect at all.
    blocks: >-
      Using half the declared machine, and any performance number from this path being read as the
      hardware's capability rather than the oracle's.
    removal_condition: >-
      The oracle's store-visibility behaviour is resolved and 8 warps grades correctly, at which point the
      cap and this entry are deleted together. It is reported per run (`warps_used` vs `warps_declared`)
      so a capped run cannot be mistaken for a full-width one in the meantime.

  # ---------------------------------------------------------------- prose that names a target
  - id: target-names-in-human-facing-prose
    kind: target_coupling
    status: triaged
    owner: targetgen
    items:
      - merlin/python/merlin/compile_cli.py
      - merlin/python/merlin/kernels/ceiling_drivers/multishape_compare.py
      - merlin/python/merlin/kernels/plots.py
      - merlin/python/merlin/targetgen/rtl/circt_introspect.py
      - merlin/python/merlin/targetgen/rtl_checks.py
      - merlin/python/merlin/targetgen/rtl/spatial_introspect.py
    why: >-
      Read line by line. Each of these names a target inside text meant for a person: an error message
      ("no multicore Saturn Verilator sim built"), a report paragraph, a plot axis label, a comment in
      emitted C, a generated-file banner, a remediation hint ("bracket the kernel with gemmini_fence").
      None is a value any code branches on. They are NOT docstrings, which is why the whole-identifier
      gate exempts them and the coupling scan does not.
      They are declared rather than exempted because prose is where a fixed assumption hides in plain
      sight: a message that names one target reads as instruction on any other, and a report that says
      "Gemmini" while grading something else is a wrong result presented confidently.
    blocks: >-
      Nothing at run time. What it costs is that a second target's user is shown another target's name
      in a diagnostic, which is how someone concludes the tool does not support their hardware.
    removal_condition: >-
      Human-facing text carries the RUN's target rather than a literal — messages and report templates
      interpolate the resolved target name. Cheap per site and worth doing when each file is next
      touched; not worth a sweep of its own, which is why this is one entry rather than eight.

  # ---------------------------------------------------------------- operative names, not yet routed
  - id: operative-target-names-in-generic-modules
    kind: target_coupling
    status: triaged
    owner: targetgen
    items:
      - merlin/python/merlin/kernels/bench_ceiling.py
      - merlin/python/merlin/kernels/build_asm.py
      - merlin/python/merlin/kernels/framework_contracts/__init__.py
      - merlin/python/merlin/kernels/ingest/exo.py
      - merlin/python/merlin/kernels/markers.py
      - merlin/python/merlin/runtime/backends/zephyr_model.py
      - merlin/python/merlin/runtime/boards.py
      - merlin/python/merlin/targetgen/corpora.py
      - merlin/python/merlin/targetgen/rtl/introspect.py
      - merlin/python/merlin/targetgen/rtl/mlc_bridge.py
      - build_tools/scripts/firesim_sweep.py
      - build_tools/scripts/make_delivery.py
    why: >-
      Read line by line, and these DO decide behaviour. Five kinds: environment-variable names
      (`MERLIN_SATURN_REPO`, `MERLIN_GEMMINI_SPIKE`, `MERLIN_SATURN_VERILATOR`); table keys a lookup
      indexes by (`firesim_dual_saturn` in the board table, `saturn_opu_mxv256d128` in the OPU id map,
      `saturn_vec` seeding the backend registry); emitted-symbol patterns a matcher tests against
      (`gemmini_extended_compute_preloaded`, `replace_gemmini_calls`); elaborated-config names
      (`GemminiRocketConfig`, `MultiSaturnV256D128ShuttleConfig`); and directory/framework identifiers
      (`gemmini_perf_bench`, `saturn_vectors`).
      Each has the same shape as an overfit already closed elsewhere in this file — a fact that could
      come from a contract, a manifest or a registry, written as a literal instead. They are grouped
      because the fix is one mechanism, not fourteen: a per-kind lookup the target resolves.
    blocks: >-
      A second target reaching any of these paths. It cannot set an env var named after another
      accelerator, appear in a board table keyed by one, or be matched by a symbol pattern written for
      one. This is the residue that makes "plug in any RTL repo" still cost core edits.
    removal_condition: >-
      Each kind routes through a resolver keyed on the target: env-var names and config names come from
      the target's contract or capability manifest, board and OPU tables become registries the target
      registers into, symbol patterns come from the framework contract the kernel-mining layer already
      has, and corpus/framework directories resolve through `merlin.common.corpora`. Close them per
      kind, and delete each path from this list as its kind lands.
