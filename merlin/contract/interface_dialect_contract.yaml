# Interface dialect contract (experiment ABI v0.1)
# The merlin_iface input grammar a package MUST accept. Canonical prose spec: interface_grammar.md.
version: "0.1"
dialect:
  namespace: merlin_iface
  module_attributes:
    - {name: merlin_iface.version, type: string, must_equal: "0.1", note: "reject unknown versions"}
    - {name: merlin_iface.target, type: string}
    - {name: merlin_iface.abi_version, type: string}
  types:
    - {name: resident, syntax: "!merlin_iface.resident", note: "opaque resident/stationary weight handle"}
    - {name: acc, syntax: "!merlin_iface.acc<i32>", note: "opaque integer accumulator handle"}
    - {name: tensor, syntax: "tensor<RxCxDT>", note: "builtin; DT in {i8,i32}"}
  required_ops:
    - name: merlin_iface.tensor
      result: "tensor<RxCxDT>"
      attrs: {name: string, role: "enum[weight,input,bias]"}
      maps_to: "leaf tensor declaration (materialized deterministically by name)"
    - name: merlin_iface.resident_pack
      operands: ["tensor<RxCxDT>"]
      result: "!merlin_iface.resident"
      attrs: {layout: string}
      maps_to: RES_PACK
    - name: merlin_iface.matmul
      operands: ["tensor<MxKxi8>", "!merlin_iface.resident"]
      result: "!merlin_iface.acc<i32>"
      maps_to: MATMUL_RESIDENT
    - name: merlin_iface.commit
      operands: ["!merlin_iface.acc<i32>"]
      result: "tensor<MxNxDT>   # M pools to batch*Ho*Wo when the epilogue contains maxpool"
      attrs:
        name: string
        epilogue: "ordered subset of [bias_add, bias, requant, acc_scale, relu, maxpool]"
        output_dtype: "enum[i32,i8]"
        acc_scale: "f32 (required iff acc_scale in epilogue)"
        requant_shift: "int (required iff requant in epilogue; no default) -- the round-half-up arithmetic shift the integer requant stage applies"
        pool_in_dims: "[H, W] (required iff maxpool in epilogue) -- the extent the M rows unflatten to"
        pool_size: "[ph, pw] (required iff maxpool in epilogue; no default)"
        pool_stride: "[sh, sw] (required iff maxpool in epilogue; no default)"
        pool_padding: "[top, left, bottom, right] (default [0, 0, 0, 0])"
        pool_pad_value: "int (required iff any pool_padding entry is nonzero)"
      maps_to: COMMIT
    - name: merlin_iface.evict
      operands: ["!merlin_iface.resident"]
      result: "()"
      maps_to: EVICT
    - name: merlin_iface.movement
      operands: ["tensor<MxNxDT>"]
      result: "tensor<MxNxDT2>"
      attrs:
        name: string
        semantic: string
        output_dtype: string
        form: "identity (default) | permute {perm} | slice {offsets, sizes, strides} | pad {low, high, mode, value_code} | broadcast | repeat {repeats}"
        scale: "f32 (optional; one load-path requantization)"
      maps_to: MOVEMENT
    - name: merlin_iface.attention_pv
      operands: ["tensor<MxSxDT>", "tensor<SxDxDT>"]
      result: "tensor<MxDxDT2>"
      attrs: {name: string, output_dtype: string, block_scale: "string (optional)"}
      maps_to: ATTENTION_PV
    - name: merlin_iface.residual_add
      operands: ["tensor<MxNxDT>", "tensor<MxNxDT>"]
      result: "tensor<MxNxDT2>"
      attrs:
        name: string
        lhs_scale: "f32 (required; no default) -- carries the first operand into the output's domain"
        rhs_scale: "f32 (required; no default) -- carries the second operand into the output's domain"
        bound_lsb: "int >= 0 (required; no default) -- how many output steps a target may lie from the reference roundeven(lhs*lhs_scale + rhs*rhs_scale), which rounds ONCE. 0 demands that arithmetic; 1 admits a unit that rounds each operand before adding"
        epilogue: "ordered subset of [relu]"
        output_dtype: "an integer dtype (i8/...)"
      maps_to: RESIDUAL_ADD
    - name: merlin_iface.affine_map
      operands: ["tensor<...xDT>", "tensor<...xDT> (optional; broadcasts along leading dims only)"]
      result: "tensor<...xDT2>   # x's shape; DT2 i8 (one readout) or i32 (no readout)"
      attrs:
        name: string
        weights: "[int] (required; one per operand, |w| <= 381, applied in the int32 accumulator)"
        constant: "int (required; the int32 accumulator seed)"
        activation: "none | relu (required; relu acts on the accumulator before the scale)"
        readout_scale: "f32 (required; may be negative, never with relu; 1.0 for an i32 result)"
        output_dtype: "i8 | i32 (required)"
        quant_min: "int (optional)"
        quant_max: "int (optional)"
      maps_to: AFFINE_MAP
    - name: merlin_iface.concat
      operands: ["tensor<...xDT> (2 to 8 sources)"]
      result: "tensor<...xDT2>"
      attrs: {name: string, axis: "int (required)", output_dtype: string, scales: "[f32] (optional; one per source)"}
      maps_to: CONCAT
    - name: merlin_iface.insert_slice
      operands: ["tensor<...xDT>", "tensor<...xDT>"]
      result: "tensor<...xDT2>   # dest's shape"
      attrs: {name: string, offsets: "[int] (required)", strides: "[int >= 1] (required)", output_dtype: string}
      maps_to: INSERT_SLICE
    - name: merlin_iface.fill
      operands: []
      result: "tensor<...xDT2>"
      attrs: {name: string, value_code: "int (required; the quantized code)", output_dtype: "string (required)"}
      maps_to: FILL
    - name: merlin_iface.window_sum
      operands: ["tensor<...xDT>"]
      result: "tensor<...xDT2>"
      attrs:
        name: string
        mode: "window | adaptive | reduce | window_transpose | adaptive_transpose | fold (required)"
        readout_scale: "f32 > 0 (required)"
        output_dtype: "i8 | i32 (required)"
        kernel: "[int] (window, window_transpose, fold)"
        stride: "[int] (window, window_transpose, fold)"
        padding: "[int] (window, window_transpose, fold)"
        count_include_pad: "bool (window, window_transpose)"
        dims: "[int] (reduce)"
        average: "bool (reduce)"
        dilation: "[int] (fold)"
        layout: "nhwc (default) | nchw"
        ceil_mode: "bool (optional)"
        divisor_override: "int (optional)"
      maps_to: WINDOW_SUM
    - name: merlin_iface.fence
      operands: []
      result: "()"
      maps_to: FENCE
    - name: merlin_iface.conv2d
      operands: ["tensor<NxHxWxCixDT>", "!merlin_iface.resident"]
      result: "tensor<PxCoxDT2>   # P = N*Ho*Wo, the im2col row count"
      attrs:
        name: string
        kernel: "[kh, kw, ci, co] (required)"
        stride: "[sh, sw]"
        padding: "[top, left, bottom, right]"
        dilation: "[dh, dw]"
        layout: "nhwc only"
        epilogue: "ordered subset of [bias_add, bias, requant, acc_scale, relu, maxpool] -- the same readout a commit applies"
        output_dtype: "an integer dtype (i32/i8/...)"
        acc_scale: "f32 (required iff acc_scale in epilogue; no default -- a stage with no multiplier is refused, not applied at 1.0)"
        bias: "string (required iff bias_add/bias in epilogue) -- names a declared tensor of role bias, shape [Co], in the accumulator dtype"
        requant_shift: "int (required iff requant in epilogue; no default)"
        pool_in_dims: "[Ho, Wo] (required iff maxpool in epilogue) -- cross-checked against the conv's own derived output extent"
        pool_size: "[ph, pw] (required iff maxpool in epilogue; no default)"
        pool_stride: "[sh, sw] (required iff maxpool in epilogue; no default)"
        pool_padding: "[top, left, bottom, right] (default [0, 0, 0, 0])"
        pool_pad_value: "int (required iff any pool_padding entry is nonzero)"
      maps_to: CONV2D
acceptance:
  - "A package must parse every examples/*.interface.mlir without error (K2)."
  - "An unknown merlin_iface.version must be rejected (fail-closed)."
  - >-
    An op mnemonic this contract does not define must be REJECTED, naming the mnemonic -- never
    skipped. Silently dropping unreadable ops mis-read 15 of 160 shipped interface capsules
    (5 movement capsules to zero commands, 7 flash-attention capsules without their P@V matmul)
    while reporting success, which is a wrong answer that looks like a right one.
