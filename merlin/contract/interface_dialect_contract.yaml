# Interface dialect contract (experiment ABI v0.1)
# The merlin_iface input grammar a package MUST accept. Canonical prose spec: interface_grammar.md.
version: "0.1"
dialect:
  namespace: merlin_iface
  module_attributes:
    - {name: merlin_iface.version, type: string, must_equal: "0.1", note: "reject unknown versions"}
    - {name: merlin_iface.target, type: string}
    - {name: merlin_iface.abi_version, type: string}
  types:
    - {name: resident, syntax: "!merlin_iface.resident", note: "opaque resident/stationary weight handle"}
    - {name: acc, syntax: "!merlin_iface.acc<i32>", note: "opaque integer accumulator handle"}
    - {name: tensor, syntax: "tensor<RxCxDT>", note: "builtin; DT in {i8,i32}"}
  required_ops:
    - name: merlin_iface.tensor
      result: "tensor<RxCxDT>"
      attrs: {name: string, role: "enum[weight,input,bias]"}
      maps_to: "leaf tensor declaration (materialized deterministically by name)"
    - name: merlin_iface.resident_pack
      operands: ["tensor<RxCxDT>"]
      result: "!merlin_iface.resident"
      attrs: {layout: string}
      maps_to: RES_PACK
    - name: merlin_iface.matmul
      operands: ["tensor<MxKxi8>", "!merlin_iface.resident"]
      result: "!merlin_iface.acc<i32>"
      maps_to: MATMUL_RESIDENT
    - name: merlin_iface.commit
      operands: ["!merlin_iface.acc<i32>"]
      result: "tensor<MxNxDT>   # M pools to batch*Ho*Wo when the epilogue contains maxpool"
      attrs:
        name: string
        epilogue: "ordered subset of [bias_add, bias, requant, acc_scale, relu, maxpool]"
        output_dtype: "enum[i32,i8]"
        acc_scale: "f32 (required iff acc_scale in epilogue)"
        requant_shift: "int (required iff requant in epilogue; no default) -- the round-half-up arithmetic shift the integer requant stage applies"
        pool_in_dims: "[H, W] (required iff maxpool in epilogue) -- the extent the M rows unflatten to"
        pool_size: "[ph, pw] (required iff maxpool in epilogue; no default)"
        pool_stride: "[sh, sw] (required iff maxpool in epilogue; no default)"
        pool_padding: "[top, left, bottom, right] (default [0, 0, 0, 0])"
        pool_pad_value: "int (required iff any pool_padding entry is nonzero)"
      maps_to: COMMIT
    - name: merlin_iface.evict
      operands: ["!merlin_iface.resident"]
      result: "()"
      maps_to: EVICT
    - name: merlin_iface.movement
      operands: ["tensor<MxNxDT>"]
      result: "tensor<MxNxDT2>"
      attrs: {name: string, semantic: string, output_dtype: string}
      maps_to: MOVEMENT
    - name: merlin_iface.attention_pv
      operands: ["tensor<MxSxDT>", "tensor<SxDxDT>"]
      result: "tensor<MxDxDT2>"
      attrs: {name: string, output_dtype: string, block_scale: "string (optional)"}
      maps_to: ATTENTION_PV
    - name: merlin_iface.conv2d
      operands: ["tensor<NxHxWxCixDT>", "!merlin_iface.resident"]
      result: "tensor<PxCoxDT2>   # P = N*Ho*Wo, the im2col row count"
      attrs:
        name: string
        kernel: "[kh, kw, ci, co] (required)"
        stride: "[sh, sw]"
        padding: "[top, left, bottom, right]"
        dilation: "[dh, dw]"
        layout: "nhwc only"
        epilogue: "ordered subset of [acc_scale, requant, relu, maxpool]"
        output_dtype: "an integer dtype (i32/i8/...)"
        pool_in_dims: "[Ho, Wo] (required iff maxpool in epilogue) -- cross-checked against the conv's own derived output extent"
        pool_size: "[ph, pw] (required iff maxpool in epilogue; no default)"
        pool_stride: "[sh, sw] (required iff maxpool in epilogue; no default)"
        pool_padding: "[top, left, bottom, right] (default [0, 0, 0, 0])"
        pool_pad_value: "int (required iff any pool_padding entry is nonzero)"
      maps_to: CONV2D
acceptance:
  - "A package must parse every examples/*.interface.mlir without error (K2)."
  - "An unknown merlin_iface.version must be rejected (fail-closed)."
  - >-
    An op mnemonic this contract does not define must be REJECTED, naming the mnemonic -- never
    skipped. Silently dropping unreadable ops mis-read 15 of 160 shipped interface capsules
    (5 movement capsules to zero commands, 7 flash-attention capsules without their P@V matmul)
    while reporting success, which is a wrong answer that looks like a right one.
