# Compute endpoints — how software drives each target's compute datapath, and what each instruction DOES.
#
# Generalizes matrix_units.yaml (which described exactly one endpoint) to every endpoint the tree can
# mine. One block per endpoint; the role vocabulary is merlin.kernels.roles, which is CLOSED.
#
# What this file is NOT: an encoding table. No opcode, funct, register field or address appears here.
# Encodings are DERIVED from each target's own sources at run time — the RTL funct_decode_table, the
# capability manifest, the IsaModel — and this file only says WHERE to derive them from and, where a
# target's derived table uses its own vocabulary, which of its names carries which role.
#
# That mapping is a bridge between two vocabularies, not a hardcoded fact: every name on the right-hand
# side must appear in the target's OWN derived table, so a rename in the RTL surfaces as a missing role
# rather than as a silently wrong decode. Targets with a derived IsaModel (self-hosted ISA) need no
# name map at all — their roles come from the model, bridged by roles.FROM_ISA_ROLE.
version: 1

endpoints:

  gemmini_rocc:
    description: >-
      The RoCC command endpoint. Two instruction LEVELS share one funct space: a fine-grained
      preload/compute sequence, and a hardware loop FSM that is handed a whole loop nest. A kernel looks
      identical in C either way — tiled_matmul_auto expands into the FSM inside the library — so the
      level is a property of the emitted stream and can only be established by disassembly.
    target: gemmini
    engine: spatial
    exposure: rocc
    encoding:
      source: rtl_facts                  # merlin.targetgen.rtl.facts.load_facts(target)
      opcode_from: funct_decode_table.custom_opcode
      table: funct_decode_table          # legal_funct + names, both RTL-derived
      names_from: names
    # Left: this repo's closed role vocabulary. Right: names that must exist in the RTL-derived table.
    roles:
      config: [CONFIG_CMD, CLKGATE_EN]
      operand_load: [LOAD_CMD, LOAD2_CMD, LOAD3_CMD]
      weight_load: [PRELOAD_CMD]
      accumulate: [COMPUTE_AND_FLIP_CMD, COMPUTE_AND_STAY_CMD]
      # MVOUT does BOTH: it drains the accumulator and makes the result visible. Listing it
      # under one role only made a complete contraction report a missing readout.
      readout: [STORE_CMD, STORE_SPAD_CMD]
      commit: [STORE_CMD, STORE_SPAD_CMD]
      sync: [FLUSH_CMD]
      loop_descriptor:
        - LOOP_WS
        - LOOP_WS_CONFIG_BOUNDS
        - LOOP_WS_CONFIG_ADDRS_AB
        - LOOP_WS_CONFIG_ADDRS_DC
        - LOOP_WS_CONFIG_STRIDES_AB
        - LOOP_WS_CONFIG_STRIDES_DC
        - LOOP_WS_CONFIG_SPAD_AB
        - LOOP_CONV_WS
        - LOOP_CONV_WS_CONFIG_1
        - LOOP_CONV_WS_CONFIG_2
        - LOOP_CONV_WS_CONFIG_3
        - LOOP_CONV_WS_CONFIG_4
        - LOOP_CONV_WS_CONFIG_5
        - LOOP_CONV_WS_CONFIG_6
    levels:
      # Which roles distinguish the two levels. Reported, never chosen for the user: which level an
      # expert kernel used is one of the decisions mining exists to surface.
      fsm: [loop_descriptor]
      fine_grained: [weight_load, accumulate]

  radiance_simt:
    description: >-
      Radiance's SIMT cluster, which is the same cluster RTL muon is introspected from — so it resolves
      the same derived encoding. Declared as its own endpoint rather than aliased to muon's: the two
      are separate subjects everywhere downstream (corpus, contract, suite, results), and an endpoint
      that silently stood for another target would attribute one target's kernels to the other.
    target: radiance
    engine: simt
    exposure: external_backend
    encoding:
      source: isa_encoding
      spaces: [custom_0, repurposed_op]
      match: opcode
      disasm_triple: riscv32
      disasm_mattr: "+m,+a,+f,+d,+c"
      stream_width: 32
      # The CUSTOM opcode space is where this target's SIMT control surface lives, and its own
      # intrinsics header IS the decode table for it: each intrinsic names the operation and encodes
      # it in the same place, so reading the header is the same act as reading a funct table out of
      # RTL. Without it these are 4 unexplained opcode spaces; with it, barriers, warp spawns and
      # divergence points are legible — and `simt.barriers_in_loop` becomes decidable from a real
      # kernel instead of being an axis nothing can populate.
      intrinsics:
        pin: radiance_kernels
        path: lib/include/vx_intrinsics.h
    roles:
      operand_load: [LOAD]
      commit: [STORE]
      accumulate: [MADD, MSUB, NM_ADD, NM_SUB]
      elementwise: [OP, OP_IMM, OP_FP]
      # The loop structure around the work. Roled so the UNROLED bucket contains only instructions we
      # genuinely cannot explain — which for this target is the CUSTOM spaces, where its accelerator
      # surface lives and where guessing would invent the semantics the corpus exists to teach us.
      control: [BRANCH, JAL, JALR, AUIPC, LUI]
      # Roles over the intrinsic names the header declares — the same shape as a role table over an
      # RTL funct table, with the target's own vocabulary on the right-hand side.
      #
      # `sync` gains the warp barrier here. Before this the only sync evidence was a fence opcode,
      # so "how many barriers are inside the reduction loop" — the one axis that says whether the
      # engine can hold its state across a reduction — could not be answered from a real kernel.
      sync: [MISC_MEM, SYSTEM, vx_barrier]
      # Thread-mask, predicate, split and join all change WHICH LANES ARE LIVE. Distinct from
      # `control` (branch/jump), which changes what the whole warp executes.
      # vx_tmc_zero / vx_tmc_one are convenience wrappers that encode IDENTICALLY to vx_tmc, so the
      # table (keyed by encoding) holds one name for all three. Declaring the wrappers would report
      # them permanently missing from a table that has nothing to add them to.
      divergence: [vx_tmc, vx_pred, vx_split, vx_join]
      # Spawning warps partitions work across threads of control: a scheduling decision, neither
      # arithmetic nor a branch.
      warp_control: [vx_wspawn]
    notes: >-
      The MX array this cluster embeds is a SECOND endpoint that does not exist here yet: its
      instructions live in the custom opcode spaces, which are reported unroled rather than guessed.

  radiance_mx:
    description: >-
      The MX array this SIMT cluster embeds, driven over RoCC. The notes on radiance_simt said its
      instructions "live in the custom opcode spaces, reported unroled rather than guessed" — this is
      that endpoint, and the guess was never needed: the kernel repo ships the header that defines the
      table, in exactly the `#define k_<NAME> <N>` convention a RoCC target's ISA headers already use.
    target: radiance
    engine: spatial
    exposure: rocc
    encoding:
      # ⚠️ This endpoint SHARES an opcode space with radiance_simt, which is a real property of the
      # target and not a modelling shortcut. They are told apart by FIELD: a RoCC command carries its
      # operation in funct7, while every SIMT intrinsic has funct7 == 0 and carries its operation in
      # funct3. So funct7 != 0 is unambiguously this endpoint.
      #
      # funct7 == 0 is genuinely AMBIGUOUS — k_CONFIG is funct7 0, and a RoCC funct3 holds the
      # xd/xs1/xs2 flags, which can coincide with an intrinsic's funct3. Nothing in the encoding
      # separates those two cases, so this endpoint claims only funct7 != 0 and the ambiguity is
      # recorded here rather than resolved by preference.
      source: funct_header
      pin: radiance_kernels
      path: lib/mxgemmini/include/gemmini.h
      opcode_space: CUSTOM0
      discriminator: funct7
      disasm_triple: riscv32
      disasm_mattr: "+m,+a,+f,+d,+c"
      stream_width: 32
    # The same role vocabulary as any other RoCC array endpoint, over this header's own k_ names.
    roles:
      config: [CONFIG]
      operand_load: [MVIN, MVIN2, MVIN3]
      weight_load: [PRELOAD]
      accumulate: [COMPUTE_PRELOADED, COMPUTE_ACCUMULATE]
      readout: [MVOUT, MVOUT_SPAD]
      commit: [MVOUT, MVOUT_SPAD]
      sync: [FLUSH]
      loop_descriptor:
        - LOOP_WS
        - LOOP_WS_CONFIG_BOUNDS
        - LOOP_WS_CONFIG_ADDRS_AB
        - LOOP_WS_CONFIG_ADDRS_DC
        - LOOP_WS_CONFIG_STRIDES_AB
        - LOOP_WS_CONFIG_STRIDES_DC
        - LOOP_WS_CONFIG_SPAD_AB
        - LOOP_WS_CONFIG_SPAD_C
        - LOOP_CONV_WS
        - LOOP_CONV_WS_CONFIG_1
        - LOOP_CONV_WS_CONFIG_2
        - LOOP_CONV_WS_CONFIG_3
        - LOOP_CONV_WS_CONFIG_4
        - LOOP_CONV_WS_CONFIG_5
        - LOOP_CONV_WS_CONFIG_6
    levels:
      fsm: [loop_descriptor]
      fine_grained: [weight_load, accumulate]

  rvv_lanes:
    description: >-
      The base vector ISA's lane engine. Declared as an endpoint like any other so a vector kernel is
      measured the SAME WAY as an accelerator kernel — without this the loop's one working target is
      the one target whose assembly carries no declared meaning, and a cross-target comparison is not
      apples to apples.
    target: rvv
    engine: vector
    exposure: inline_asm
    encoding:
      # A standard ISA has no per-target decode table to derive from; its own instruction GRAMMAR is
      # the vocabulary, and the mnemonics below are stems matched before the form suffix (`.vv`,
      # `.vf`, `.vx`, `.vs`, `.wv`, ...), which is a property of the ISA's naming, not of any target.
      #
      # ⚠️ Unlike an RTL-derived table this cannot be verified against the silicon, so the loader marks
      # it UNVERIFIED and the asm audit reports every observed mnemonic no role covers. The gap is
      # visible and shrinkable rather than assumed away.
      source: mnemonic_grammar
      match: stem                      # compare the mnemonic up to its first '.'
    roles:
      config: [vsetvli, vsetivli, vsetvl]
      # The whole-register load family spells its element width into the stem (vl2re8, not vl2r.e8),
      # so the stems must be listed as the ISA actually names them. Found by auditing a real kernel:
      # the shorter spellings matched nothing and the instructions fell through to "unroled".
      operand_load: [vle8, vle16, vle32, vle64, vlse8, vlse16, vlse32, vlse64,
                     vluxei8, vluxei16, vluxei32, vloxei8, vloxei16, vloxei32,
                     vl1re8, vl1re16, vl1re32, vl1re64, vl2re8, vl2re16, vl2re32, vl2re64,
                     vl4re8, vl4re16, vl4re32, vl4re64, vl8re8, vl8re16, vl8re32, vl8re64]
      # A multiply-accumulate ADVANCES a partial sum; a bare multiply does not, and counting the two
      # together is how an unfused mul+add lowering reads as a contraction.
      accumulate: [vfmacc, vmacc, vfwmacc, vwmacc, vwmaccu, vwmaccsu, vwmaccus,
                   vfmadd, vmadd, vfnmacc, vfmsac, vqmacc, vqmaccu, vqmaccsu, vqmaccus]
      # `.vf`/`.vx` forms take a scalar operand broadcast across the lanes; the stem alone cannot say
      # which form was used, so the FORM is read from the operand syntax by the decoder and this list
      # names the stems that HAVE a broadcast form.
      broadcast: [vfmv, vmv, vrgather, vfslide1up, vslideup, vslidedown]
      # Draining a vector accumulator to a scalar is a readout, exactly as popping a tile is.
      readout: [vredsum, vfredsum, vfredusum, vfredosum, vredmax, vredmin, vfredmax, vfredmin]
      commit: [vse8, vse16, vse32, vse64, vsse8, vsse16, vsse32, vsse64,
               vsuxei8, vsuxei16, vsuxei32, vsoxei8, vsoxei16, vsoxei32, vs1r, vs2r, vs4r, vs8r]
      # Whole-register moves compute nothing and touch no memory. A stream full of them is an operand
      # ladder being REBUILT per step instead of broadcast — a real, diagnosable shape that was
      # invisible while these counted as "the tool named it".
      move: [vmv1r, vmv2r, vmv4r, vmv8r]
      elementwise: [vadd, vsub, vmul, vmulh, vmulhu, vdiv, vrem, vand, vor, vxor, vsll, vsrl, vsra,
                    vmin, vmax, vminu, vmaxu, vfadd, vfsub, vfmul, vfdiv, vfsqrt, vfabs, vfneg,
                    vfmin, vfmax, vzext, vsext, vfcvt, vfwcvt, vfncvt, vnsrl, vnsra, vnclip,
                    vssra, vssrl, vsadd, vssub, vaadd, vasub, vwadd, vwsub, vwmul, vwmulu]
      sync: [fence]

  saturn_opu:
    description: >-
      The outer-product matrix extension: four instructions in reserved even funct6 slots of the vector
      opcode. Command-buffer driven, NOT RoCC. Its roles are already declared in matrix_units.yaml under
      the same names, so they are referenced rather than restated.
    target: saturn
    engine: spatial
    exposure: command_buffer
    encoding:
      source: matrix_units               # merlin/contract/matrix_units.yaml, unit saturn_opu
      unit: saturn_opu
      roles_from: kernel_roles           # accumulate/broadcast/readout/operand_load, already declared
    crosscheck:
      # MEASURED, and it corrects an earlier reading. The RTL derivation and bme.h AGREE on every field
      # (funct3 = 6 for the VX-form OPMVIN/OPMVINBCAST/OPMVOUT and 2 for the VV-form OPMACC; the
      # difference is the instruction FORM, which matrix_units.yaml already declares under form_funct3,
      # not a disagreement between sources). The reported conflicting value could not be reproduced:
      # no file in the toolchain defines these instructions, and the cited lines of the Spike
      # encoding.h are CSR definitions.
      #
      # So the check is NOT blocked by a dispute — it is UNCORROBORATED, which is a different problem
      # with a different fix. `crosscheck_sources` reports `conclusive: false` because only one source
      # spoke; a second independent source would settle it. A readable file that happens to contain
      # none of these instructions is SILENT, never agreeing, and must not raise confidence.
      sources: [crosscheck_header]
      status: single_source
      corroborating: 1
      note: >-
        A second independent source is what this needs, not a tie-break. Finding one is the work;
        picking a value would manufacture confidence the evidence does not support.

  atlas_isa:
    description: >-
      A self-hosted ISA: the kernel emits its own encoded instructions. Roles come from the DERIVED
      IsaModel and need no name map here — isa_model.roles is already a role table, bridged to this
      repo's vocabulary by kernels.roles.FROM_ISA_ROLE.
    target: atlas
    engine: spatial
    exposure: external_backend
    encoding:
      source: isa_model                  # merlin.targetgen.isa_model.isa_model_for_target(target)
      roles_from: isa_model.roles
      # The corpus and the derived model spell the same instruction differently — the corpus writes
      # VMATPUSH.W.MXU0 where the model has vmatpush.weight.mxu0, an ABBREVIATION rather than a
      # prefix, so no amount of string normalization joins them. The target's OWN assembler is the
      # bridge: it is a pure encoder, so calling each of its mnemonics yields a word whose opcode and
      # funct7 identify the instruction, and the model's table carries the same two fields.
      #
      # The join is therefore by ENCODING, never by name — which is the difference between deriving
      # the correspondence from the target's own sources and hand-writing an alias table that goes
      # stale the moment either side renames anything.
      assembler:
        pin: atlas_npu
        path: baremetal/assembler.py
    notes: >-
      The corpus spells instructions differently from the model (VMATPUSH.W.MXU0 vs
      vmatpush.weight.mxu0, DMA.CONFIG x5 vs dma.config.ch5). The target's own assembler
      (baremetal/assembler.py) carries both spellings and the operand order, so a round-trip reads the
      target's assembler rather than a hand-written alias map.

  atlas_vpu:
    description: >-
      The lane engine on the same self-hosted ISA. Declared as its own endpoint because it is a distinct
      datapath driven by distinct instructions — 50 of atlas's 137 expert kernels drive it EXCLUSIVELY,
      and a target described by its array endpoint alone loses all of them.
    target: atlas
    engine: vector
    exposure: external_backend
    encoding:
      source: isa_model
      roles_from: isa_model.roles

  muon_simt:
    description: >-
      A SIMT cluster embedding an MX array. Its custom surface spans TWO encoding spaces — custom-0 and
      the REPURPOSED standard OP space — so a decoder that reads only custom-0 sees a third of it.
    target: muon
    engine: simt
    exposure: external_backend
    encoding:
      source: isa_encoding               # mlc_bridge.isa_encoding_for(target)
      spaces: [custom_0, repurposed_op]
      match: opcode                      # roles are declared over the DERIVED opcode-space names
      # ⚠️ PIN THE DISASSEMBLER. With the extensions left to the tool's default, 76% of a real kernel's
      # words came back unnamed and looked like a vast custom surface; given these explicitly it is
      # 15%, and that 15% IS the custom surface. An unpinned probe reports the tool's ignorance as the
      # corpus's nature and the two are indistinguishable in the output.
      disasm_triple: riscv32
      disasm_mattr: "+m,+a,+f,+d,+c"
      # The width of a word AS IT APPEARS IN THE OBJECT, which is not the ISA's internal instruction
      # width: mlc recovers a 64-bit decoder format from this cluster's RTL while the compiled ELF
      # carries architectural 32-bit words. Decoding the ELF at the internal width declines every word
      # and reports the whole kernel as unaccounted.
      stream_width: 32
      # The CUSTOM opcode space is where this target's SIMT control surface lives, and its own
      # intrinsics header IS the decode table for it: each intrinsic names the operation and encodes
      # it in the same place, so reading the header is the same act as reading a funct table out of
      # RTL. Without it these are 4 unexplained opcode spaces; with it, barriers, warp spawns and
      # divergence points are legible — and `simt.barriers_in_loop` becomes decidable from a real
      # kernel instead of being an axis nothing can populate.
      intrinsics:
        pin: radiance_kernels
        path: lib/include/vx_intrinsics.h
    # Roles over the opcode names mlc recovers from this target's own decoder RTL. Coarser than a
    # per-instruction table — an opcode SPACE groups many instructions — and that coarseness is the
    # honest resolution of this evidence: the decoder tells us which space a word falls in, not which
    # operation it performs within that space.
    #
    # ⚠️ The CUSTOM spaces are deliberately UNROLED. They are where this target's accelerator surface
    # lives, and guessing a role for them would invent the very semantics the corpus exists to teach
    # us. The asm audit reports them as claimed-but-unroled, which is a gap we own and can close, and
    # is exactly the state to be honest about rather than paper over.
    roles:
      operand_load: [LOAD]
      commit: [STORE]
      # MADD/MSUB/NM_ADD/NM_SUB are the fused multiply-add opcode group: they advance a partial sum in
      # one instruction, which is what separates a contraction from a multiply followed by an add.
      accumulate: [MADD, MSUB, NM_ADD, NM_SUB]
      elementwise: [OP, OP_IMM, OP_FP]
      # The loop structure around the work. Roled so the UNROLED bucket contains only instructions we
      # genuinely cannot explain — which for this target is the CUSTOM spaces, where its accelerator
      # surface lives and where guessing would invent the semantics the corpus exists to teach us.
      control: [BRANCH, JAL, JALR, AUIPC, LUI]
      # Roles over the intrinsic names the header declares — the same shape as a role table over an
      # RTL funct table, with the target's own vocabulary on the right-hand side.
      #
      # `sync` gains the warp barrier here. Before this the only sync evidence was a fence opcode,
      # so "how many barriers are inside the reduction loop" — the one axis that says whether the
      # engine can hold its state across a reduction — could not be answered from a real kernel.
      sync: [MISC_MEM, SYSTEM, vx_barrier]
      # Thread-mask, predicate, split and join all change WHICH LANES ARE LIVE. Distinct from
      # `control` (branch/jump), which changes what the whole warp executes.
      # vx_tmc_zero / vx_tmc_one are convenience wrappers that encode IDENTICALLY to vx_tmc, so the
      # table (keyed by encoding) holds one name for all three. Declaring the wrappers would report
      # them permanently missing from a table that has nothing to add them to.
      divergence: [vx_tmc, vx_pred, vx_split, vx_join]
      # Spawning warps partitions work across threads of control: a scheduling decision, neither
      # arithmetic nor a branch.
      warp_control: [vx_wspawn]
    notes: >-
      Disassembly of this target MUST pin its ISA extensions. With the extensions left to the tool's
      default, 76% of a real kernel's words come back unnamed; given +m,+a,+f,+d,+c it is 15%, and that
      15% is the actual custom surface. A probe that does not pin them reports the tool's ignorance as
      the corpus's nature.
