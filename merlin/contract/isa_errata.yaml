    CSRRCI:
      declared: '0x00004073'
      hardware: '0x00007073'
      authoritative: rtl
      sources_against_spec: [rtl_bitpat]
      sources_for_spec: []
      rationale: >-
        CSRRCI is a STOCK RISC-V Zicsr instruction, so this one is decidable without trusting the
        target's RTL at all: Zicsr assigns SYSTEM funct3 001/010/011/101/110/111 to CSRRW/S/C and
        their immediate forms, and the RTL matches that exactly (Instructions.scala:61-66). The
        shipped model's 0b100 is not an assigned SYSTEM funct3 in the base ISA. That the error sits on
        a STANDARD instruction, not a custom one, is itself the finding: the defect is not confined to
        the vendor's custom surface.
      upstream: null
    VCUBE_BF16:
      declared: '0x9e000057'
      hardware: '0x8e000057'
      authoritative: rtl
      sources_against_spec: [rtl_bitpat, rtl_decode_table]
      sources_for_spec: [shipped_green_card]
      rationale: >-
        The only finding where the green card and the Python model AGREE and the RTL looks like
        the outlier - which is why a two-source check would not have settled it. The ELABORATED
        decode table breaks the tie independently of the Chisel source: the code
        (0x47 << 7) | 87 = 9175 appears in legal_funct; the model's (0x4f << 7) | 87 = 10199
        does not. Two independent EXTRACTIONS outrank two authored documents; sources are
        ranked by kind, never counted.
      upstream: the vendor green card also carries the wrong funct7 for this pair
    VSQUARE_BF16:
      declared: '0x9c000057'
      hardware: '0x8c000057'
      authoritative: rtl
      sources_against_spec: [rtl_bitpat, rtl_decode_table]
      sources_for_spec: [shipped_green_card]
      rationale: >-
        Same mechanism, same evidence and same funct7 bit (28) as VCUBE_BF16; decided with it.
      upstream: the vendor green card also carries the wrong funct7 for this pair
  gemmini:
    funct=25:
      declared: '25'
      hardware: 'absent from the decoder'
      authoritative: unresolved
      sources_against_spec: [rtl_vs_shipped_headers]
      sources_for_spec: []
      rationale: >-
        NOT a wrong encoding, and deliberately NOT resolved to rtl. The evidence is only that the
        extractor's decoder fan-out never compares funct 25 while the shipped headers declare it.
        Absence from ONE decoder's fan-out does not prove the machine lacks the instruction - it may
        be handled by a module outside the extraction, which is exactly the reasoning
        compare_decode_table applies when it reports NOT_COVERED rather than DISAGREE. There is also
        no alternative encoding to correct TO, so no assembler-side correction exists. Resolving it
        needs someone to establish whether any gemmini decoder implements funct 25; until then
        nothing may derive from either reading.
      upstream: null
  mx_gemmini:
    funct=25:
      declared: '25'
      hardware: 'absent from the decoder'
      authoritative: unresolved
      sources_against_spec: [rtl_vs_shipped_headers]
      sources_for_spec: []
      rationale: >-
        The SAME instruction on the SAME hardware as the gemmini entry above - this target's decode
        evidence is extracted from the same elaborated core - so it carries the same disposition and
        the same reason, not a second independent judgement. Recorded separately because the registry
        is keyed by target while the defect is a property of the machine; if one is ever resolved the
        other must be resolved with it. See the gemmini entry for the full reasoning.
      upstream: null

