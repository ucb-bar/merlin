# Reviewed ISA encoding errata — where a target's SHIPPED specification and its own HARDWARE disagree.
#
# WHY THIS FILE EXISTS. merlin derives a target's encoding by probing whatever ISA definition that target
# ships. That honours "derive, never hardcode" only as far as the shipped definition is right about its
# own hardware, and a shipped definition is a document: it can be wrong. When it is, every backend that
# faithfully derives from it emits a word that ASSEMBLES CLEANLY AND DECODES TO SOMETHING ELSE. That
# failure does not surface as an illegal instruction; it surfaces as wrong numbers, days later, with the
# whole toolchain reporting success.
#
# WHAT AN ENTRY IS, AND IS NOT. An entry is a REVIEWED CORRECTION: it records what the spec declares, what
# the machine does, which side is authoritative, and what still has to happen upstream. It is NOT an
# allowlist for quieting `check_isa_matches_rtl.py`. Recording an entry is the same act that makes
# `merlin.targetgen.isa_lint` warn a backend off the wrong bits, so "declare it and change nothing" does
# not buy silence — it buys the warning reaching the consumer. Never add an entry to make a gate pass; add
# it because someone read the three sources and decided which one is right.
#
# WE DO NOT EDIT THE VENDORED SPEC. A target's `isa_definition.py` / green card is somebody's hardware
# deliverable. Silently patching it in place would hide a real upstream defect, make every downstream copy
# disagree with ours, and destroy the evidence that the defect ever existed. The correction lives HERE,
# beside the evidence, with an `upstream:` field naming where it has to go to actually be fixed.
#
# HOW A DISAGREEMENT IS ADJUDICATED. Sources are ranked by KIND, not counted:
#   * EXTRACTED FROM THE MACHINE — Chisel `BitPat` decode literals, named opcode constants in the RTL, the
#     decode fan-out our CIRCT/mlc extractor recovers from the ELABORATED hardware, and the extractor's own
#     decoder-vs-shipped-header comparison.
#   * AUTHORED ABOUT THE MACHINE — the vendor's green card, the shipped Python ISA model.
# A document outvoted by two independent extractions is not a tie. `authoritative:` must be the side the
# `sources_against_spec:` list actually supports; if the evidence is genuinely ambiguous, say `unresolved`
# and do not let anything derive from either encoding.
#
# Schema per entry (target -> MNEMONIC):
#   declared:              what the shipped spec encodes (as the check prints it)
#   hardware:              what the machine's evidence encodes
#   authoritative:         rtl | spec | unresolved
#   sources_against_spec:  the evidence kinds that contradict the spec
#   sources_for_spec:      the sources that back it (so a reader sees the whole vote)
#   rationale:             why this side wins, in prose, citing the mechanism where known
#   upstream:              where the real fix has to land; null while nobody has taken it
#
# Produced/checked by `build_tools/scripts/check_isa_matches_rtl.py` (which prints ready-to-paste YAML for
# every undeclared disagreement) and read by `merlin.targetgen.isa_rtl_crosscheck`.

version: 1

# REVIEWED 2026-09-04. Each entry below was adjudicated against the sources named in it, not copied from
# the checker's output. Two of the three atlas findings are corroborated by evidence OUTSIDE this repo's
# RTL (the RISC-V base ISA for CSRRCI; the elaborated decode table for the VCUBE/VSQUARE pair), which is
# what makes "the machine outranks the document" a finding rather than a preference.
errata:
  atlas:
    DMA_CONFIG_CH0:
      declared: '0x0200007f'
      hardware: '0x0000007f'
      authoritative: rtl
      sources_against_spec: [rtl_bitpat]
      sources_for_spec: []
      rationale: >-
        The decoder pins funct7=0000000 for DMA_CONFIG_ANY and funct7=0000001 for DMA_WAIT_ANY
        (atlas/scalar/Instructions.scala:96-97). The shipped model declares funct7=0000001 for
        BOTH, so a spec-derived DMA_CONFIG word decodes as DMA_WAIT: dmaBaseReg := rs1_data never
        fires and the core takes dma_wait_stall instead. The correction clears only funct7; funct3
        is a don't-care in the BitPat and carries the CHANNEL, so it is preserved (channel 0).
      upstream: null
