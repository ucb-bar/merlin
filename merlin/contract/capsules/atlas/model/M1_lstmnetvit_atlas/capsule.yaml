name: M1_lstmnetvit_atlas
kind: model
source_role: pytorch_model_slice
source_reference: "lstmnetvit fp8 \u2014 vision+LSTM control net (conv/spatial-attn/MixFFN/upsample/LSTM)"
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: I0
  role: input
  shape:
  - 1
  - 1
  - 60
  - 90
  dtype: fp8_e4m3
- name: I1
  role: input
  shape:
  - 1
  - 1
  dtype: fp8_e4m3
- name: I2
  role: input
  shape:
  - 1
  - 4
  dtype: i64
operation:
  op: model
  attributes:
    model: lstmnetvit
    dtype: fp8_e4m3
    out: Y0
    # Selects the fp8 BUNDLE (the fake-quant capture whose numerics this capstone is about). It does
    # NOT select the scalar/RVV datapath: that follows what the bundle's IR actually carries, which is f32
    # end to end (weight-only fake-quant, zero fp8 tokens in model.mlir), derived by compile_cli's
    # ir_scalar_dtype. The fp8 datapath format is `dtype` above -- the MESH operand format, threaded as
    # routing_dtype and executed on the matrix unit.
    compile_dtype: fp8
    arg_order:
    - I0
    - I1
    - I2
    - Y0
    weights: capsule.weights.safetensors
numeric_policy:
  compare: tolerance_float
  dtype: f32
  atol: 0.25
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPopE1
required_oracle_tiers:
- L0
- L1
- L3
- L4
vcs: optional
firesim: optional
inapplicable_oracle_tiers:
  L2: 'functional core cannot corroborate an RTL result for this target: the ISA encodes
    dma.config.chN and dma.wait.chN to the same word, so an assembled program that
    needs both cannot be decoded back (resolving it as wait leaves the DMA channel
    unarmed and the kernel stalls at its first VLOAD; resolving it as config deletes
    the barriers and every output reads back zero). The core also treats VMEM as byte-addressed
    where the RTL treats it as word-addressed, and reads the fp8->bf16 unpack scale
    as a divisor where the RTL reads a biased exponent. Graded on the RTL tiers instead.'
gate:
  after_op_pass_fraction: 0.8
pytorch_ref:
  op: model
  dtype: fp8_e4m3
  loader: capsule.pytorch.py
linalg_mlir: capsule.interface.mlir
semantic:
  generalization_axis: model
  must_accelerate: true
  eligible: auto
  semantic_family: contraction
