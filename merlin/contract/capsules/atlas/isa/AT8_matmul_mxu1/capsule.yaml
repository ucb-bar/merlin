name: AT8_matmul_mxu1
kind: isa
source_role: handauthored_compiler_test
source_reference: fp8 matmul on MXU mesh 1 (smolvla_matmul_mxu1)
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 32
  - 32
  dtype: fp8_e4m3
- name: A0
  role: input
  shape:
  - 32
  - 32
  dtype: fp8_e4m3
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue: []
    output_dtype: bf16
    semantic: matmul_mxu1
numeric_policy:
  compare: tolerance_float
  dtype: bf16
  atol: 0.25
  rtol: 0.02
expected:
  # The last three entries name EXACT ISA mnemonics, not classes. The class `MXUMatMul` covers this
  # target's matmul op for BOTH matrix units, so a class-granularity expectation is satisfied by
  # whichever unit the backend happened to emit -- which is not a check, it is a coincidence. Measured:
  # this capsule and its sibling for the other unit declared identical expectations, compiled to
  # BYTE-IDENTICAL kernels, and both passed, while no capsule in the corpus ever emitted a single
  # instruction of the second unit. Naming the unit's own ops is what makes the claim falsifiable.
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPop
  - VMATPUSH_WEIGHT_MXU1
  - VMATMUL_MXU1
  - VMATPOP_BF16_ACC_MXU1
  modes: {}
required_oracle_tiers:
- L0
- L1
- L3
- L4
vcs: optional
firesim: optional
inapplicable_oracle_tiers:
  L2: 'functional core cannot corroborate an RTL result for this target: the ISA encodes
    dma.config.chN and dma.wait.chN to the same word, so an assembled program that
    needs both cannot be decoded back (resolving it as wait leaves the DMA channel
    unarmed and the kernel stalls at its first VLOAD; resolving it as config deletes
    the barriers and every output reads back zero). The core also treats VMEM as byte-addressed
    where the RTL treats it as word-addressed, and reads the fp8->bf16 unpack scale
    as a divisor where the RTL reads a biased exponent. Graded on the RTL tiers instead.'
semantic:
  semantic_family: contraction
  generalization_axis: seen
  must_accelerate: true
  eligible: auto
