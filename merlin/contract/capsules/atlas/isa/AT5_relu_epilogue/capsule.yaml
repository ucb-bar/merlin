name: AT5_relu_epilogue
kind: isa
source_role: handauthored_compiler_test
source_reference: matmul + relu epilogue (bf16)
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 32
  - 32
  dtype: fp8_e4m3
- name: A0
  role: input
  shape:
  - 32
  - 32
  dtype: fp8_e4m3
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue:
    - relu
    output_dtype: bf16
numeric_policy:
  compare: tolerance_float
  dtype: bf16
  atol: 0.25
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPop
  - TensorComputeUnary
  modes:
    relu: true
required_oracle_tiers:
- L0
- L1
- L3
vcs: optional
firesim: optional
