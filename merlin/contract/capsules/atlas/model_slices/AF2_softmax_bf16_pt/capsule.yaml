name: AF2_softmax_bf16_pt
kind: model_slice
source_role: pytorch_model_slice
source_reference: PyTorch softmax bf16 (atlas smolvla_softmax)
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: X
  role: input
  shape:
  - 16
  - 16
  dtype: bf16
operation:
  op: softmax
  attributes:
    out: Y0
    arg_order:
    - X
    causal: false
numeric_policy:
  compare: tolerance_float
  dtype: bf16
  # atol is bounded by FALSIFIABILITY, not convention: at the corpus default 0.25 -- wider than
  # this output's entire range -- a constant answer satisfied the comparison at every element, so
  # the capsule passed without the kernel computing anything (it was the sole apparent survivor of
  # a corpus-wide preload defect, returning a constant). Ceiling below is the largest atol under
  # which the best constant still fails, derived from the golden itself (numeric_falsifiability);
  # this sits at half of it, still ~8x the measured bf16 slice error.
  # falsifiability ceiling: 0.0690
  atol: 0.0345
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - TensorComputeUnary
  - TensorComputeBinary
  modes: {}
required_oracle_tiers:
- L0
- L1
- L3
- L4
vcs: optional
firesim: optional
inapplicable_oracle_tiers:
  L2: 'functional core cannot corroborate an RTL result for this target: the ISA encodes
    dma.config.chN and dma.wait.chN to the same word, so an assembled program that
    needs both cannot be decoded back (resolving it as wait leaves the DMA channel
    unarmed and the kernel stalls at its first VLOAD; resolving it as config deletes
    the barriers and every output reads back zero). The core also treats VMEM as byte-addressed
    where the RTL treats it as word-addressed, and reads the fp8->bf16 unpack scale
    as a divisor where the RTL reads a biased exponent. Graded on the RTL tiers instead.'
pytorch_ref:
  op: softmax
  dtype: bf16
  loader: capsule.pytorch.py
linalg_mlir: capsule.interface.mlir
semantic:
  semantic_family: softmax
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
