name: PF04_matmul_m32k64n32
kind: model_slice
source_role: pytorch_model_slice
source_reference: 'a fusion triple at one shape, twice: X@W+B fused, against X@W and
  X+B as the two ops it replaces. The three members are generated from ONE shape statement,
  so they cannot drift apart (tile=32; K=64, M=32, N=32; op=matmul)'
label: dev
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 64
  - 32
  dtype: bf16
- name: A0
  role: input
  shape:
  - 32
  - 64
  dtype: bf16
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue: []
    output_dtype: f32
numeric_policy:
  compare: tolerance_float
  dtype: f32
  atol: 0.25
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPop
  modes:
    relu: false
    acc_scale: false
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
semantic:
  semantic_family: contraction
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
pytorch_ref:
  op: matmul
  dtype: bf16
  loader: capsule.pytorch.py
linalg_mlir: capsule.linalg.mlir
performance:
  level: L5_fusion
  lever: epilogue_fusion
  note: 'the cheapest level to build and the only one whose comparand needs no model
    at all: cycles(fused) against cycles(A) + cycles(B) at the identical shape. `comparison_group`
    has been a declared field on four capsules since they were written and is consumed
    by nothing, which is the same thing as not existing -- the missing halves were
    the PARTS to compare a fused capsule against, and a reader that does the arithmetic'
comparison_group:
  name: fmb_m32k64n32
  role: part
