performance:
  level: L3_inter_layer
  lever: dma_issue_before_wait
  note: "THE LEVEL WITH A LEVER AND NO COVERAGE. Stage two consumes stage one's output,\
    \ so the transition is a real dependence and not two independent kernels side\
    \ by side -- which is what makes the question \"was the next stage's transfer\
    \ issued before this stage's wait\" mean anything at all. It is proven AVAILABLE:\
    \ 2,567 DMA descriptors pair with 2,567 waits, 0 unpaired, distance 0 on 95.4%\
    \ but a real tail out to 50, so the ISA expresses overlap and the hardware does\
    \ it while 97 of 114 programs do not. \u26A0\uFE0F The headline \"14.7% corpus-wide,\
    \ 23.9% on gelu\" is PROVENANCE-SUSPECT and must not be quoted as measured: it\
    \ was computed as min(dma, compute) over buckets that PARTITION cycles, so a kernel\
    \ whose compute is already hidden underneath its transfers reads as having no\
    \ compute to hide and contributes zero. One kernel is known to do exactly that\
    \ -- 428 cycles of vector work priced by an exact model, reported as vpu=0 while\
    \ the same op classes register 621 elsewhere. It is the right order of magnitude\
    \ to size this level against and nothing more; a joint occupancy vector is what\
    \ settles it"
