name: PL00_m224k224n224
kind: model_slice
source_role: pytorch_model_slice
source_reference: intra-layer square and rectangular contractions (343 and 686 tile
  passes) -- large enough that the fixed per-tile transfer cost is amortized, and
  inside the program runner's DRAM window with room (tile=32; K=224, M=224, N=224)
label: dev
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 224
  - 224
  dtype: bf16
- name: A0
  role: input
  shape:
  - 224
  - 224
  dtype: bf16
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue: []
    output_dtype: f32
numeric_policy:
  compare: tolerance_float
  dtype: f32
  atol: 0.25
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPop
  modes:
    relu: false
    acc_scale: false
required_oracle_tiers:
- L0
- L1
- L3
- L4
vcs: optional
firesim: optional
inapplicable_oracle_tiers:
  L2: 'functional core cannot corroborate an RTL result for this target: the ISA encodes
    dma.config.chN and dma.wait.chN to the same word, so an assembled program that
    needs both cannot be decoded back (resolving it as wait leaves the DMA channel
    unarmed and the kernel stalls at its first VLOAD; resolving it as config deletes
    the barriers and every output reads back zero). The core also treats VMEM as byte-addressed
    where the RTL treats it as word-addressed, and reads the fp8->bf16 unpack scale
    as a divisor where the RTL reads a biased exponent. Graded on the RTL tiers instead.'
semantic:
  semantic_family: contraction
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
pytorch_ref:
  op: matmul
  dtype: bf16
  loader: capsule.pytorch.py
linalg_mlir: capsule.linalg.mlir
performance:
  level: L2_intra_layer
  lever: tiling_and_amplification
  note: at tile scale the transfer-amplification ratio is dominated by a fixed per-tile
    transfer cost that proper tiling amortizes away, so a 9-28x measured on a demo
    tile OVERSTATES the available win. These are the shapes at which the question
    can be asked honestly. They also DECLARE their shapes and dtypes, which is what
    makes useful_bytes derivable instead of hand-entered
