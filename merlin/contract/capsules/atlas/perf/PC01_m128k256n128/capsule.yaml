name: PC01_m128k256n128
kind: model_slice
source_role: pytorch_model_slice
source_reference: 'two chained contractions where the second reads the first''s output:
  the inter-layer transition, at two reduction depths so the transition cost can be
  separated from the stages'' own (tile=32; K=256, M=128, N=128)'
label: dev
interface_mlir: capsule.interface.mlir
inputs:
- name: A0
  role: input
  shape:
  - 128
  - 256
  dtype: bf16
- name: W
  role: input
  shape:
  - 256
  - 128
  dtype: bf16
- name: W2
  role: input
  shape:
  - 128
  - 128
  dtype: bf16
operation:
  op: k_chain
  attributes:
    out: Y0
    arg_order:
    - A0
    - W
    - W2
    causal: false
numeric_policy:
  compare: tolerance_float
  dtype: bf16
  atol: 0.25
  rtol: 0.02
expected:
  instruction_classes:
  - TensorBaseOffset
  - MXUWeightPush
  - MXUMatMul
  - MXUAccumulatorPop
  modes: {}
required_oracle_tiers:
- L0
- L1
- L3
- L4
vcs: optional
firesim: optional
inapplicable_oracle_tiers:
  L2: 'functional core cannot corroborate an RTL result for this target: the ISA encodes
    dma.config.chN and dma.wait.chN to the same word, so an assembled program that
    needs both cannot be decoded back (resolving it as wait leaves the DMA channel
    unarmed and the kernel stalls at its first VLOAD; resolving it as config deletes
    the barriers and every output reads back zero). The core also treats VMEM as byte-addressed
    where the RTL treats it as word-addressed, and reads the fp8->bf16 unpack scale
    as a divisor where the RTL reads a biased exponent. Graded on the RTL tiers instead.'
pytorch_ref:
  op: k_chain
  dtype: bf16
  loader: capsule.pytorch.py
linalg_mlir: capsule.interface.mlir
semantic:
  semantic_family: contraction
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
performance:
  level: L3_inter_layer
  lever: dma_issue_before_wait
  note: "THE LEVEL WITH A LEVER AND NO COVERAGE. Stage two consumes stage one's output,\
    \ so the transition is a real dependence and not two independent kernels side\
    \ by side -- which is what makes the question \"was the next stage's transfer\
    \ issued before this stage's wait\" mean anything at all. It is proven AVAILABLE:\
    \ 2,567 DMA descriptors pair with 2,567 waits, 0 unpaired, distance 0 on 95.4%\
    \ but a real tail out to 50, so the ISA expresses overlap and the hardware does\
    \ it while 97 of 114 programs do not. \u26A0\uFE0F The headline \"14.7% corpus-wide,\
    \ 23.9% on gelu\" is PROVENANCE-SUSPECT and must not be quoted as measured: it\
    \ was computed as min(dma, compute) over buckets that PARTITION cycles, so a kernel\
    \ whose compute is already hidden underneath its transfers reads as having no\
    \ compute to hide and contributes zero. One kernel is known to do exactly that\
    \ -- 428 cycles of vector work priced by an exact model, reported as vpu=0 while\
    \ the same op classes register 621 elsewhere. It is the right order of magnitude\
    \ to size this level against and nothing more; a joint occupancy vector is what\
    \ settles it"
