name: SY_regime_spills
kind: isa
source_role: derived_sweep
source_reference: 'synthesized for memory regime ''spills'': the declared inputs occupy
  16448 of 16384 operand-store rows (1.003906 of capacity), which is what puts this
  capsule in that regime. Extents resolved by memory_regime.extents_for_regime with
  the same sizing the coverage gate measures with. 262144 written output elements
  exceeds the 875 a 300.0s certification budget affords on this target, so it is graded
  at L2 and rests on ''SY_contraction_i8_aligned'''
label: public
interface_mlir: capsule.interface.mlir
