name: FE01_fused_epilogue_tail_15x32x17
kind: isa
source_role: derived_sweep
source_reference: 'derived tail-path coverage for the fused epilogue: this target
  declares elementwise_map reachable ONLY composed with a contraction, so a standalone
  elementwise capsule would be the wrong capsule -- the eligibility oracle refuses
  one as a false fallback. The epilogue is therefore the only way the cell can be
  evidenced, and it had never been evidenced at a partial tile (tile=16; K=32, M=15,
  N=17)'
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 32
  - 17
  dtype: i8
- name: A0
  role: input
  shape:
  - 15
  - 32
  dtype: i8
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue:
    - acc_scale
    - relu
    output_dtype: i8
    acc_scale: 0.0625
numeric_policy:
  compare: exact_int
  dtype: i8
  acc_scale: 0.0625
expected:
  instruction_classes:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
  modes:
    i8: true
    relu: true
    acc_scale: true
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
semantic:
  semantic_family: contraction
  generalization_axis: seen
  must_accelerate: true
  eligible: auto
  composed_families:
  - elementwise_map
