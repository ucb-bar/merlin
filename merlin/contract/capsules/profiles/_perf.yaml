    a barrier after every job and once with the minimum pair. Job counts span 1..16 rather than 1..4 because
    the lever''s cost is per barrier and real kernels issue thousands of them -- a three-point sweep over
    1,2,4 cannot separate a saving that grows with the removed barrier count from noise.'
