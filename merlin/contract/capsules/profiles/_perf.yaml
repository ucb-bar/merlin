sweeps:
- id: PK
  fit_axes:
  - K
  comparison_roles:
  - prediction
  - measurement
  base:
    cat: _perf
    kind: model_slice
    op: matmul
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L1_tile
      family: PK
      lever: reduction_depth
      claim: PREDICTS
      comparand:
        kind: fitted_prediction
        against: measured_cycles_same_member
        cancels:
        - identical_M
        - identical_N
        - identical_datapath
        demand_equal:
        - operation
        - M
        - N
        - operand_dtype
        - accum_dtype
      falsifier:
        observation: residual_cycles_by_K
        fires_when: residuals_are_not_bounded_after_rate_and_intercept_fit
        negative_control: fixed_M_and_N_across_all_K_points
      acceptance:
        schema_version: 2
        analyzer: perf_pk_claim.analyze_pk_claim/v3
        fit:
          form: affine
          method: ordinary_least_squares_all_L3_replicates
          independent_variable: K
          dependent_metric: gsim_L3_cycles
        cohort:
          operation: matmul
          fixed_shape_axes:
          - M
          - N
          fixed_fields:
          - operation
          - operand_dtype
          - accum_dtype
          - epilogue
          exact_points: 4
          K_multipliers_of_tile:
          - 1
          - 2
          - 4
          - 8
        replicates:
          exact_count: 2
          identities:
          - r000
          - r001
        evidence:
          correctness_simulator: spike
          correctness_tier: L2
          timing_simulator: gsim
          timing_tier: L3
          spike_cycles_citable: false
          timing_oracle_kind: rtl_gsim
          timing_fidelity: elaborated_rtl
          required_identity_sha256_fields:
          - simulator_binary_sha256
          - elaborated_firrtl_sha256
          - program_elf_sha256
        thresholds:
          slope_cycles_per_K_element_min_exclusive: 0.0
          r_squared_min_inclusive: 0.995
          residual_bound:
            predicate: abs_residual_le_max_of_floor_and_fraction_of_observed
            absolute_floor_cycles: 8
            observed_cycle_fraction: 0.03
      gate:
        traits:
        - structural_pipeline_depth
        instrument: cycle_count
        capacity: four_distinct_reduction_depths
        on_missing: skip_with_evidence
      regime:
        separation: K_is_the_only_varied_shape_axis
        layout: target_native_direct_corpus_builder
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs:
          operation: matmul
          varied_axis: K
      cost:
        tier: 1
        runs: 4
        projected_cycles: derived_at_preflight
        basis: four_members_before_repetition
  axes:
    M:
    - tile
    N:
    - tile
    K:
    - tile
    - 2*tile
    - 4*tile
    - 8*tile
  name: '{id}{i:02d}_k{K}'
  source_reference: shared reduction-depth sweep at fixed single-tile parallel extents
- id: PS
  fit_axes:
  - K
  comparison_roles:
  - contract_settle
  - reduced_settle
  base:
    cat: _perf
    kind: model_slice
    op: matmul
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L1_separation_floor
      family: PS
      lever: per_class_settle
      claim: DIFFERENTIAL
      comparand:
        kind: paired_run
        against: same_kernel_with_descending_settle
        cancels:
        - operation
        - shape
        - operands
        - instruction_multiset
        demand_equal:
        - operation
        - M
        - N
        - K
        - operand_salt
      falsifier:
        observation: bit_exactness_and_cycle_delta
        fires_when: bit_exactness_fails_within_the_declared_settle_range
        negative_control: contract_settle_member
      gate:
        traits:
        - self_hosted_program
        - explicit_completion
        instrument: per_class_completion_and_cycle_count
        capacity: at_least_two_settle_levels_per_class
        on_missing: skip_with_evidence
      regime:
        separation: fixed_before_each_paired_settle_comparison
        layout: identical_kernel_and_operands
      emitter:
        status: new:settle_sweep_materializer
        entry: merlin.perf.workload_gen.plan_matmul
        knobs:
          varied_parameter: settle_by_instruction_class
      cost:
        tier: 1
        runs: 60
        projected_cycles: derived_at_preflight
        basis: three_classes_by_five_levels_by_four_salts
      settle_range:
        kind: derived_from_structural_pipeline_depth
        declared_constant: null
        lower_bound: the_smallest_settle_the_contract_admits
        upper_bound: the_structural_pipeline_depth_derived_from_rtl_facts
        predicate: bit_exactness_must_hold_at_every_settle_in_the_range_and_fail_below_the_lower_bound
        on_underivable: skip_with_evidence
      acceptance:
        schema_version: 1
        analyzer: perf_paired_claim.analyze_paired_claim/v1
        roles:
        - contract_settle
        - reduced_settle
        expected_faster: reduced_settle
        negative_control_capsule: null
        band:
          kind: measured_replicate_dispersion
          declared_constant: null
          predicate: a_difference_counts_iff_it_exceeds_the_pair_s_own_replicate_dispersion
        evidence:
          timing_simulator: gsim
          timing_tier: L3
          correctness_simulator: spike
          correctness_tier: L2
  axes:
    M:
    - tile
    N:
    - tile
    K:
    - tile
    - 2*tile
  name: '{id}{i:02d}_k{K}'
  source_reference: shared separation-floor declaration; emitter not yet admitted
- id: PC
  fit_axes:
  - K
  comparison_roles:
  - not_hoisted
  - hoisted
  base:
    cat: _perf
    kind: model_slice
    op: resident_reuse
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L3_inter_layer
      family: PC
      lever: dma_issue_before_wait
      claim: DIFFERENTIAL
      comparand:
        kind: paired_run
        against: identical_dependence_chain_without_hoist
        cancels:
        - operation
        - shape
        - operands
        - instruction_multiset
        demand_equal:
        - operation
        - M
        - N
        - K
      falsifier:
        observation: paired_cycle_delta
        fires_when: hoisting_does_not_improve_any_declared_separation_regime
        negative_control: single_K_step_hoist
      gate:
        traits:
        - independent_engine_ports
        - explicit_completion
        instrument: per_engine_completion_and_cycle_count
        capacity: at_least_two_separation_regimes
        on_missing: skip_with_evidence
      regime:
        separation: fixed_within_each_pair_and_repeated_at_two_levels
        layout: real_producer_consumer_dependence
      emitter:
        status: existing
        entry: merlin.perf.command_stream_gen.pair_from_interface
        knobs:
          transformation: hoist_a_command_above_ones_it_does_not_depend_on
      cost:
        tier: 1
        runs: derived_from_two_pairs_plus_negative_control
        projected_cycles: derived_at_preflight
        basis: paired_differential_at_two_separation_regimes
      acceptance:
        schema_version: 1
        analyzer: perf_paired_claim.analyze_paired_claim/v1
        roles:
        - not_hoisted
        - hoisted
        expected_faster: hoisted
        negative_control_capsule: null
        band:
          kind: measured_replicate_dispersion
          declared_constant: null
          predicate: a_difference_counts_iff_it_exceeds_the_pair_s_own_replicate_dispersion
        evidence:
          timing_simulator: gsim
          timing_tier: L3
          correctness_simulator: spike
          correctness_tier: L2
  variants:
  - matmuls:
    - lhs: A0
      out: Y0
      M_tiles: 1
    - lhs: A1
      out: Y1
      M_tiles: 1
  axes:
    N:
    - 4*tile
    K:
    - 4*tile
    - 8*tile
  name: '{id}{i:02d}_k{K}'
  source_reference: 'shared inter-layer declaration: one resident weight, two matmuls, and the A/B is
    the command list of THIS capsule permuted by command_stream_gen at measurement time'
- id: PF
  fit_axes: [K]
  comparison_roles: [fused, part]
  base:
    cat: _perf
    kind: model_slice
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L5_fusion
      family: PF
      lever: epilogue_fusion
      claim: DIFFERENTIAL
      comparand:
        kind: group_arithmetic
        against: sum_of_unfused_parts
        cancels: [operation_shape, operands, numeric_policy]
        demand_equal: [M, N, operand_dtype, accum_dtype]
      falsifier:
        observation: fused_cycles_minus_sum_of_parts
        fires_when: fused_cycles_are_not_lower_than_the_sum_of_parts
        negative_control: unfused_matmul_plus_bias_add
      gate:
        traits: [structural_pipeline_depth]
        instrument: cycle_count
        capacity: complete_fused_and_part_comparison_group
        on_missing: skip_with_evidence
      regime:
        separation: one_identical_shape_per_group
        layout: fused_member_and_all_parts_share_inputs
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs: {members: [fused_matmul_bias, matmul, bias_add]}
      cost:
        tier: 1
        runs: three_per_shape
        projected_cycles: derived_at_preflight
        basis: one_fused_member_and_two_parts
  # The group name carries the shape, so no member writes it down: `_render_variant`
  # resolves `{M}`/`{K}`/`{N}` against the point the variant is paired with, and the
  # generator refuses a group with fewer than two members.
  variants:
  - op: fused_matmul_bias
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: fused}
  - op: matmul
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: part}
  - op: bias_add
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: part}
  axes:
    M: [tile]
    N: [tile]
    K: [tile, 2*tile]
  name: '{id}{i:02d}_{op}_m{M}k{K}n{N}'
  source_reference: >-
    shared epilogue-fusion group: one fused matmul+bias against the matmul and
    the bias add it replaces, at one identical shape per group

# The cross-regime amortization pair. Declared as a sweep rather than blocked
# because the lever IS expressible: `resident_reuse` pushes ONE weight and runs
# N matmuls against it, so the tile regime is N=1 and the layer regime is N=4 --
# identical per-tile work, identical lever, different regime scale, which is
# exactly what the comparand asks to be held equal and what it asks to vary.
# The promotion policy ("only passing tier-one members are promoted") is a RUN
# ordering, not a materialization problem, and lives in `cost` where it always did.
- id: PL
  fit_axes:
  - K
  comparison_roles:
  - tile_regime
  - layer_regime
  base:
    cat: _perf
    kind: model_slice
    op: resident_reuse
    weight: W
    N_tiles: 1
    label: dev
    source_role: derived_sweep
    performance:
      level: L2_intra_layer
      family: PL
      lever: cross_regime_amortization
      claim: DIFFERENTIAL
      comparand:
        kind: paired_regime
        against: same_lever_at_tile_and_layer_scale
        cancels:
        - operation
        - datapath
        - lever
        demand_equal:
        - per_tile_pass_work
        - operand_dtype
        - accum_dtype
      falsifier:
        observation: per_tile_pass_saving_by_regime
        fires_when: saving_changes_beyond_the_declared_band
        negative_control: tile_scale_member
      gate:
        traits:
        - structural_pipeline_depth
        instrument: cycle_count_and_preflight
        capacity: non_aliasing_DRAM_and_non_binding_IMEM
        on_missing: skip_with_evidence
      regime:
        separation: tile_scale_versus_promoted_layer_scale
        layout: identical_lever_with_looped_layer_emission
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs:
          promotion: passing_tile_member_to_layer_sibling
      cost:
        tier: 2
        runs: derived_after_tier_one_promotion
        projected_cycles: derived_at_preflight
        basis: only_passing_tier_one_members_are_promoted
      noise_band:
        kind: measured_replicate_dispersion
        declared_constant: null
        minimum_replicate_count: 2
        predicate: a_saving_counts_iff_it_exceeds_the_measured_replicate_dispersion_of_its_own_pair
      acceptance:
        schema_version: 1
        analyzer: perf_paired_claim.analyze_paired_claim/v1
        roles:
        - tile_regime
        - layer_regime
        expected_faster: layer_regime
        negative_control_capsule: null
        band:
          kind: measured_replicate_dispersion
          declared_constant: null
          predicate: a_difference_counts_iff_it_exceeds_the_pair_s_own_replicate_dispersion
        evidence:
          timing_simulator: gsim
          timing_tier: L3
          correctness_simulator: spike
          correctness_tier: L2
  variants:
  - matmuls:
    - lhs: A0
      out: Y0
      M_tiles: 1
    comparison_group:
      name: amort_k{K}
      role: tile_regime
  - matmuls:
    - lhs: A0
      out: Y0
      M_tiles: 1
    - lhs: A1
      out: Y1
      M_tiles: 1
    - lhs: A2
      out: Y2
      M_tiles: 1
    - lhs: A3
      out: Y3
      M_tiles: 1
    comparison_group:
      name: amort_k{K}
      role: layer_regime
  axes:
    K:
    - tile
    - 2*tile
  name: '{id}{i:02d}_k{K}'
  source_reference: 'shared cross-regime amortization pair: one pushed weight reused by one tile versus
    by four, at identical per-tile work'
- id: PG
  fit_axes:
  - K
  comparison_roles:
  - encoding_a
  - encoding_b
  base:
    cat: _perf
    kind: model_slice
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L6_global
      family: PG
      lever: operand_encoding
      claim: DIFFERENTIAL
      comparand:
        kind: group_arithmetic
        against: the_same_layer_in_the_other_encoding
        cancels:
        - operation_shape
        - operands
        demand_equal:
        - M
        - N
        - K
      falsifier:
        observation: encoding_a_cycles_minus_encoding_b_cycles
        fires_when: the_two_encodings_cost_the_same_within_the_noise_band
        negative_control: the_same_encoding_compared_against_itself
      gate:
        traits:
        - multiple_operand_encodings
        instrument: cycle_count
        capacity: two_encodings_of_one_identical_shape
        on_missing: skip_with_evidence
      regime:
        separation: one_identical_shape_per_group
        layout: both_members_share_every_extent
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs:
          encodings:
          - encoding0
          - encoding1
      cost:
        tier: 1
        runs: two_per_shape
        projected_cycles: derived_at_preflight
        basis: one_matmul_per_encoding
      acceptance:
        schema_version: 1
        analyzer: perf_paired_claim.analyze_paired_claim/v1
        roles:
        - encoding_a
        - encoding_b
        expected_faster: either
        negative_control_capsule: null
        band:
          kind: measured_replicate_dispersion
          declared_constant: null
          predicate: a_difference_counts_iff_it_exceeds_the_pair_s_own_replicate_dispersion
        evidence:
          timing_simulator: gsim
          timing_tier: L3
          correctness_simulator: spike
          correctness_tier: L2
  variants:
  - op: matmul
    operand_dtype: encoding0
    comparison_group:
      name: enc_m{M}k{K}n{N}
      role: encoding_a
  - op: matmul
    operand_dtype: encoding1
    comparison_group:
      name: enc_m{M}k{K}n{N}
      role: encoding_b
  axes:
    M:
    - tile
    N:
    - tile
    K:
    - tile
    - 2*tile
  name: '{id}{i:02d}_{operand_dtype}_k{K}'
  source_reference: 'shared operand-encoding pair: one identical contraction computed in two of the target''s
    own declared encodings, so the cost of the encoding choice is isolated'
- id: PR
  fit_axes:
  - K
  comparison_roles:
  - resident
  - spilling
  base:
    cat: _perf
    kind: model_slice
    op: matmul
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L2_intra_layer
      family: PR
      lever: operand_residency
      claim: DIFFERENTIAL
      comparand:
        kind: group_arithmetic
        against: the_same_affine_fit_in_a_different_residency_regime
        cancels:
        - operation
        - M
        - N
        - operand_dtype
        - accum_dtype
        - epilogue
        - drained_output_bytes
        demand_equal:
        - operation
        - M
        - N
        - operand_dtype
        - accum_dtype
      falsifier:
        observation: per_regime_fitted_rate_and_intercept
        fires_when: the_rates_fitted_in_different_residency_regimes_agree_within_the_noise_band
        negative_control: two_disjoint_depth_ranges_inside_one_regime
      gate:
        traits:
        - managed_scratchpad
        - structural_pipeline_depth
        instrument: cycle_count
        capacity: at_least_two_reduction_depths_inside_each_reachable_residency_band
        on_missing: skip_with_evidence
      regime:
        separation: K_is_the_only_varied_shape_axis_and_the_bands_come_from_the_derived_operand_store
        layout: deep_k_contraction_at_fixed_parallel_extents_so_every_point_drains_one_output_tile
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs:
          operation: matmul
          varied_axis: K
          axis_derivation: memory_regime_reduction_depth
      cost:
        tier: 2
        runs: three_depths_per_reachable_residency_band
        projected_cycles: derived_at_preflight
        basis: the spilling members are the most expensive capsules in this corpus and are paid on every
          grade, so the top of the search is a declared multiple of the target's OWN capacity rather than
          an unbounded sweep
      acceptance:
        schema_version: 1
        analyzer: perf_pr_claim.analyze_pr_claim/v1
        fit:
          form: affine_per_residency_band
          method: ordinary_least_squares_over_the_replicate_agreed_cycles_of_one_band
          independent_variable: K
          dependent_metric: verilator_L3_cycles
          comparands: the_fitted_rate_of_one_band_against_the_fitted_rate_of_another
        cohort:
          operation: matmul
          fixed_shape_axes:
          - M
          - N
          fixed_fields:
          - operation
          - operand_dtype
          - accum_dtype
          - epilogue
          axis_derivation: memory_regime_reduction_depth
          minimum_reachable_bands: 2
          points_per_regime: 3
        replicates:
          minimum_count: 2
          identities_authored_by: run
          why: two replicates are the smallest set that MEASURES the dispersion this family's noise band
            is read from; one replicate leaves it UNDETERMINABLE, and assuming it zero on a deterministic
            simulator is the assumption this contract refuses
        evidence:
          correctness_simulator: spike
          correctness_tier: L2
          timing_simulator: verilator
          timing_tier: L3
          spike_cycles_citable: false
          overlap_instrument: target_derived_combination_counters
          overlap_required_per_member: true
        noise_band:
          kind: measured_replicate_dispersion
          declared_constant: null
          predicate: fitted_rates_agree_iff_exactly_equal_when_the_measured_dispersion_is_zero
          why: 'a constant written here would be a knob somebody can turn until the answer changes. The
            band is read off the evidence instead: replicates that are observed IDENTICAL make the dispersion
            zero by measurement, so agreement means exact rational equality. A member with one replicate
            has an UNDETERMINABLE dispersion and its band is refused rather than assumed noiseless'
        transient_guard:
          module: merlin.perf.fill_transient.transient_verdict
          applied: per_residency_band
          on_in_fill_transient: refuse_the_band_and_quote_no_rate
          why: the sibling reduction-depth family was refuted because every one of its depths lay inside
            the machine's overlap fill transient. This family's cheapest band starts at the same depth,
            so a band is put through the guard before any rate is quoted
  axes:
    M:
    - tile
    N:
    - tile
    K:
      derive: memory_regime_reduction_depth
      regimes:
      - fits_double
      - fits_single
      - fits_on_reuse
      - spills
      points_per_regime: 3
      spills_max_fraction_of_capacity: 2.0
  name: '{id}{i:02d}_{K_label}_k{K}'
  source_reference: 'shared operand-residency ladder: one deep-K contraction per derived residency band
    of the target''s own operand store, three depths spread across each band, at fixed single-tile parallel
    extents'
- id: PQ
  fit_axes:
  - K
  comparison_roles:
  - minimum_barriers
  - barrier_after_every_job
  base:
    cat: _perf
    kind: model_slice
    op: resident_reuse
    weight: W
    N_tiles: 1
    label: dev
    source_role: derived_sweep
    performance:
      level: L2_intra_layer
      family: PQ
      lever: redundant_synchronization_removal
      claim: DIFFERENTIAL
      comparand:
        kind: paired_run
        against: the_same_capsule_emitted_with_a_barrier_after_every_job
        cancels:
        - operation
        - M
        - N
        - K
        - job_count
        - operands
        - epilogue
        - operand_dtype
        - accum_dtype
        - movement_and_compute_command_multiset
        - scratchpad_and_accumulator_addressing
        - drained_output_bytes
        - emitted_instruction_multiset_except_the_barrier
        demand_equal:
        - operation
        - M
        - N
        - K
        - job_count
        - operand_dtype
        - accum_dtype
        - epilogue
      falsifier:
        observation: paired_cycle_saving_by_removed_barrier_count
        fires_when: the_saving_does_not_grow_with_the_removed_barrier_count_beyond_the_declared_noise_band
        negative_control: the_single_job_member_whose_two_arms_are_the_byte_identical_program
      gate:
        traits:
        - host_dispatched_queue
        - explicit_completion
        instrument: cycle_count
        capacity: at_least_two_removed_barrier_counts_across_the_members
        on_missing: skip_with_evidence
      regime:
        separation: one_shape_per_pair_and_the_pair_is_two_emissions_of_that_one_capsule
        layout: identical_operands_and_identical_command_stream_plus_the_removed_barriers
      emitter:
        status: existing
        entry: merlin.perf.barrier_arms.paired_removal
        knobs:
          # THE TWO ARMS ARE THE TWO COMPILERS, not two settings of a corpus knob. The previous
          # declaration named `pair_from_emitter` and a "retire knob" on the target emitter; neither
          # exists -- there is no such entry point in the module and no such knob in any emitter --
          # so this family declared `status: existing` against nothing and ten capsules measured one
          # arm against no second arm. The expensive arm is what the BASELINE compiler already emits
          # (a completion point after every unit of work) and the cheap arm is what an optimizing
          # candidate emits instead, which is exactly the pair the measurement path already builds.
          # So the emitter's honest job is to READ both emitted programs and count what each
          # synchronizes. Verified on this corpus's own buffers: COMMIT count tracks the job count
          # exactly (j=2 -> 2, j=8 -> 8, j=16 -> 16), and a buffer declaring no completion opcode
          # yields UNKNOWN rather than a count of zero.
          transformation: count_completion_points_in_the_baseline_and_candidate_emissions_of_one_capsule
          removed_barrier_count: varies_across_members_because_the_job_count_does
      noise_band:
        kind: measured_replicate_dispersion
