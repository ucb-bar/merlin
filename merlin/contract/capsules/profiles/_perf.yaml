# The one generated performance-corpus template. Target-owned profiles may
# describe functional coverage only; applicability comes from the target's own
# canonical merlin.perf.profile traits.
#
# Claim vocabulary is intentionally disjoint:
#   RECOVERS     measured shipped reference / measured reference
#   PREDICTS     predicted cycles for Merlin's kernel / its measured cycles
#   DIFFERENTIAL same work and demand, one compiler lever changed
# This template currently makes one PREDICTS family and two DIFFERENTIAL
# declarations. It makes no RECOVERS claim.

sweeps:

# Minimum runnable coverage: a direct matmul capsule on the target's own
# workload_gen/corpus-binding dtype. On Gemmini this resolves to int8 -> i32.
- id: PK
  fit_axes: [K]
  comparison_roles: [prediction, measurement]
  base:
    cat: _perf
    kind: model_slice
    op: matmul
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L1_tile
      family: PK
      lever: reduction_depth
      claim: PREDICTS
      comparand:
        kind: fitted_prediction
        against: measured_cycles_same_member
        cancels: [identical_M, identical_N, identical_datapath]
        demand_equal: [operation, M, N, operand_dtype, accum_dtype]
      falsifier:
        observation: residual_cycles_by_K
        fires_when: residuals_are_not_bounded_after_rate_and_intercept_fit
        negative_control: fixed_M_and_N_across_all_K_points
      gate:
        traits: [structural_pipeline_depth]
        instrument: cycle_count
        capacity: four_distinct_reduction_depths
        on_missing: skip_with_evidence
      regime:
        separation: K_is_the_only_varied_shape_axis
        layout: target_native_direct_corpus_builder
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs: {operation: matmul, varied_axis: K}
      cost:
        tier: 1
        runs: 4
        projected_cycles: derived_at_preflight
        basis: four_members_before_repetition
  axes:
    M: [tile]
    N: [tile]
    K: [tile, 2*tile, 4*tile, 8*tile]
  name: '{id}{i:02d}_k{K}'
  source_reference: >-
    shared reduction-depth sweep at fixed single-tile parallel extents

# Declared now so an inapplicable target leaves an evidence-bearing skip. Even
# where the traits resolve true, admission remains blocked until the settle
# lever is wired into capsule materialization.
- id: PS
  fit_axes: [K]
  comparison_roles: [contract_settle, reduced_settle]
  base:
    cat: _perf
    kind: model_slice
    op: matmul
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L1_separation_floor
      family: PS
      lever: per_class_settle
      claim: DIFFERENTIAL
      comparand:
        kind: paired_run
        against: same_kernel_with_descending_settle
        cancels: [operation, shape, operands, instruction_multiset]
        demand_equal: [operation, M, N, K, operand_salt]
      falsifier:
        observation: bit_exactness_and_cycle_delta
        fires_when: bit_exactness_fails_within_the_declared_settle_range
        negative_control: contract_settle_member
      gate:
        traits: [self_hosted_program, explicit_completion]
        instrument: per_class_completion_and_cycle_count
        capacity: at_least_two_settle_levels_per_class
        on_missing: skip_with_evidence
      regime:
        separation: fixed_before_each_paired_settle_comparison
        layout: identical_kernel_and_operands
      emitter:
        status: new:settle_sweep_materializer
        entry: merlin.perf.workload_gen.plan_matmul
        knobs: {varied_parameter: settle_by_instruction_class}
      cost:
        tier: 1
        runs: 60
        projected_cycles: derived_at_preflight
        basis: three_classes_by_five_levels_by_four_salts
  axes:
    M: [tile]
    N: [tile]
    K: [tile, 2*tile]
  name: '{id}{i:02d}_k{K}'
  source_reference: shared separation-floor declaration; emitter not yet admitted

# Likewise: Gemmini's independent engine ports are established, but explicit
# completion currently is not, so it must be a structured UNKNOWN skip rather
# than a generated no-op overlap capsule.
- id: PC
  fit_axes: [K]
  comparison_roles: [not_hoisted, hoisted]
  base:
    cat: _perf
    kind: model_slice
    op: resident_reuse
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L3_inter_layer
      family: PC
      lever: dma_issue_before_wait
      claim: DIFFERENTIAL
      comparand:
        kind: paired_run
        against: identical_dependence_chain_without_hoist
        cancels: [operation, shape, operands, instruction_multiset]
        demand_equal: [operation, M, N, K, separation_regime]
      falsifier:
        observation: paired_cycle_delta
        fires_when: hoisting_does_not_improve_any_declared_separation_regime
        negative_control: single_K_step_hoist
      gate:
        traits: [independent_engine_ports, explicit_completion]
        instrument: per_engine_completion_and_cycle_count
        capacity: at_least_two_separation_regimes
        on_missing: skip_with_evidence
      regime:
        separation: fixed_within_each_pair_and_repeated_at_two_levels
        layout: real_producer_consumer_dependence
      # EMITTER CORRECTED, not newly written. `perf.workload_gen.plan_matmul` was the wrong
      # ARCHETYPE for this family: it allocates a scalar register file, encodes backward
      # branches and emits assembly, and a command-driven target declares no self-hosted
      # program at all -- gemmini ships no ISA definition, so no kernel can be encoded for
      # it. Measured consequence: this family's traits are satisfied on gemmini ALONE, and
      # gemmini was the one target that emitter could not reach, so the claim was
      # unsatisfiable while reading as "not yet wired".
      #
      # `command_stream_gen` is the sibling for this archetype. It consumes the ORDERED
      # command list the frozen interface grammar already carries and returns a PERMUTATION
      # of it, so the two members are the same work by construction rather than by
      # assertion, plus a negative control whose `identical_work` is false. Verified on
      # isa/A6_resident_reuse: RES_PACK, MATMUL_RESIDENT, COMMIT, MATMUL_RESIDENT, COMMIT,
      # EVICT -- with the second matmul hoisted from index 3 to 1 across two commits.
      #
      # The A/B is DERIVED FROM ONE CAPSULE at measurement time, so this sweep emits one
      # member per shape and carries no `comparison_group`: the pair is two runs of one
      # program, not two programs. `resident_reuse` is the op because a movable command
      # needs a command list with something to move past.
      emitter:
        status: existing
        entry: merlin.perf.command_stream_gen.pair_from_interface
        knobs: {transformation: hoist_a_command_above_ones_it_does_not_depend_on}
      cost:
        tier: 1
        runs: derived_from_two_pairs_plus_negative_control
        projected_cycles: derived_at_preflight
        basis: paired_differential_at_two_separation_regimes
  # TWO matmuls against the one resident weight, because a command list needs something to
  # move past: this parses to RES_PACK, MATMUL_RESIDENT, COMMIT, MATMUL_RESIDENT, COMMIT,
  # EVICT, and the second matmul is the movable command. One matmul would leave a list with
  # no legal permutation and the pair would be the baseline twice.
  variants:
  - matmuls:
    - {lhs: A0, out: Y0, M_tiles: 1}
    - {lhs: A1, out: Y1, M_tiles: 1}
  axes:
    N: [4*tile]
    K: [4*tile, 8*tile]
  name: '{id}{i:02d}_k{K}'
  source_reference: >-
    shared inter-layer declaration: one resident weight, two matmuls, and the A/B is the
    command list of THIS capsule permuted by command_stream_gen at measurement time

# These families are contract-complete but are not sweeps: putting them under
# `sweeps` would falsely claim their lever can be emitted. Generation persists
# them as blocked_unimplemented with their fit axes and comparison roles.
# The fusion pair, three members from ONE shape statement. Declared as a sweep
# rather than blocked because the members ARE buildable: the fused capsule can
# now name the bias operand its `bias_add` stage consumes, and the unfused half
# has an op to be expressed as, so the comparison group has more than one
# member. Both halves run at the target's OWN datapath dtype -- a bf16 stand-in
# would have measured the host on an integer target, not the accelerator.
- id: PF
  fit_axes: [K]
  comparison_roles: [fused, part]
  base:
    cat: _perf
    kind: model_slice
    out: Y0
    label: dev
    source_role: derived_sweep
    performance:
      level: L5_fusion
      family: PF
      lever: epilogue_fusion
      claim: DIFFERENTIAL
      comparand:
        kind: group_arithmetic
        against: sum_of_unfused_parts
        cancels: [operation_shape, operands, numeric_policy]
        demand_equal: [M, N, operand_dtype, accum_dtype]
      falsifier:
        observation: fused_cycles_minus_sum_of_parts
        fires_when: fused_cycles_are_not_lower_than_the_sum_of_parts
        negative_control: unfused_matmul_plus_bias_add
      gate:
        traits: [structural_pipeline_depth]
        instrument: cycle_count
        capacity: complete_fused_and_part_comparison_group
        on_missing: skip_with_evidence
      regime:
        separation: one_identical_shape_per_group
        layout: fused_member_and_all_parts_share_inputs
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs: {members: [fused_matmul_bias, matmul, bias_add]}
      cost:
        tier: 1
        runs: three_per_shape
        projected_cycles: derived_at_preflight
        basis: one_fused_member_and_two_parts
  # The group name carries the shape, so no member writes it down: `_render_variant`
  # resolves `{M}`/`{K}`/`{N}` against the point the variant is paired with, and the
  # generator refuses a group with fewer than two members.
  variants:
  - op: fused_matmul_bias
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: fused}
  - op: matmul
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: part}
  - op: bias_add
    comparison_group: {name: 'fmb_m{M}k{K}n{N}', role: part}
  axes:
    M: [tile]
    N: [tile]
    K: [tile, 2*tile]
  name: '{id}{i:02d}_{op}_m{M}k{K}n{N}'
  source_reference: >-
    shared epilogue-fusion group: one fused matmul+bias against the matmul and
    the bias add it replaces, at one identical shape per group

# The cross-regime amortization pair. Declared as a sweep rather than blocked
# because the lever IS expressible: `resident_reuse` pushes ONE weight and runs
# N matmuls against it, so the tile regime is N=1 and the layer regime is N=4 --
# identical per-tile work, identical lever, different regime scale, which is
# exactly what the comparand asks to be held equal and what it asks to vary.
# The promotion policy ("only passing tier-one members are promoted") is a RUN
# ordering, not a materialization problem, and lives in `cost` where it always did.
- id: PL
  fit_axes: [K]
  comparison_roles: [tile_regime, layer_regime]
  base:
    cat: _perf
    kind: model_slice
    op: resident_reuse
    weight: W
    N_tiles: 1
    label: dev
    source_role: derived_sweep
    performance:
      level: L2_intra_layer
      family: PL
      lever: cross_regime_amortization
      claim: DIFFERENTIAL
      comparand:
        kind: paired_regime
        against: same_lever_at_tile_and_layer_scale
        cancels: [operation, datapath, lever]
        demand_equal: [per_tile_pass_work, operand_dtype, accum_dtype]
      falsifier:
        observation: per_tile_pass_saving_by_regime
        fires_when: saving_changes_beyond_the_declared_band
        negative_control: tile_scale_member
      gate:
        traits: [structural_pipeline_depth]
        instrument: cycle_count_and_preflight
        capacity: non_aliasing_DRAM_and_non_binding_IMEM
        on_missing: skip_with_evidence
      regime:
        separation: tile_scale_versus_promoted_layer_scale
        layout: identical_lever_with_looped_layer_emission
      emitter:
        status: existing
        entry: merlin.targetgen.corpus_spec.build
        knobs: {promotion: passing_tile_member_to_layer_sibling}
      cost:
        tier: 2
        runs: derived_after_tier_one_promotion
        projected_cycles: derived_at_preflight
        basis: only_passing_tier_one_members_are_promoted
  # One matmul against the resident weight versus four. The per-tile shape is
  # identical in both, so the only thing that changes is how many tiles amortize
  # the single weight push -- the saving the claim is about.
  variants:
  - matmuls:
    - {lhs: A0, out: Y0, M_tiles: 1}
    comparison_group: {name: 'amort_k{K}', role: tile_regime}
  - matmuls:
    - {lhs: A0, out: Y0, M_tiles: 1}
    - {lhs: A1, out: Y1, M_tiles: 1}
    - {lhs: A2, out: Y2, M_tiles: 1}
    - {lhs: A3, out: Y3, M_tiles: 1}
    comparison_group: {name: 'amort_k{K}', role: layer_regime}
  axes:
    K: [tile, 2*tile]
  name: '{id}{i:02d}_k{K}'
  source_reference: >-
    shared cross-regime amortization pair: one pushed weight reused by one tile
    versus by four, at identical per-tile work

blocked_unimplemented:

