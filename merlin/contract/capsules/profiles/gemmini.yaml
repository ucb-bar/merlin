datapath:
  # Corpus-wide generalization posture, matching radiance. must_accelerate is the strongest claim a
  # capsule can make -- an ELIGIBLE region that falls back is a hard failure -- and it was absent here,
  # so every gemmini coverage certificate passed VACUOUSLY: with no capsule asserting it, no violation
  # could ever be raised and the CPU-fallback escape hatch was wide open. Whole-model capsules are
  # exempted structurally in corpus_spec, not by an exception list.
  semantic_defaults: {must_accelerate: true}
  compare: exact_int
  requant_output_dtype: i8
  required_oracle_tiers:
  - L0
  - L1
  - L2
  - L3
capsules:
- name: A0_config_smoke
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: CONFIG_EX/LD/ST smoke via a single 16x16 matmul
  label: public
  comment: 'A0: CONFIG_EX/CONFIG_LD/CONFIG_ST smoke (trace must contain all three
    config classes).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: isa
- name: A2_single_tile_matmul
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/matmul_ws.c
  label: public
  comment: 'A2: single 16x16 i8 matmul -> i32 (CONFIG, MVIN, PRELOAD, COMPUTE_PRELOADED,
    MVOUT).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: isa
- name: A3_k_accumulation
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/tiled_matmul_ws.c
  label: public
  comment: 'A3: K=32 (> tile dim) forces K-accumulation (accumulate-onto PRELOAD across
    K tiles).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    k_accumulate: true
  cat: isa
- name: A4_acc_scale_i8
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/transpose_scale.c
  label: public
  comment: 'A4: int32 accumulator -> f32 acc_scale (0.0625) -> saturating i8 readout.'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  acc_scale: 0.0625
  modes:
    i8: true
    acc_scale: true
  cat: isa
- name: A5_relu_epilogue
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: relu activation
  label: public
  comment: 'A5: relu activation (activation bits set in CONFIG_ST; exact relu numerics).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  epilogue:
  - relu
  modes:
    relu: true
  cat: isa
- name: A6_resident_reuse
  kind: isa
  op: resident_reuse
  source_role: handauthored_compiler_test
  source_reference: resident weight reuse across two matmuls
  label: public
  comment: 'A6 resident reuse: one resident weight reused across two matmuls (16x16
    tiles).'
  weight: W
  K_tiles: 1
  N_tiles: 1
  matmuls:
  - lhs: A0
    out: Y0
    epilogue: []
    M_tiles: 1
  - lhs: A1
    out: Y1
    epilogue:
    - relu
    M_tiles: 1
  cat: isa
- name: A7_edge_padding
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: bareMetalC/padded.c
  label: public
  comment: 'A7: non-16-multiple dims (20x24x12); backend zero-pads to tiles, valid
    window is exact.'
  M: 20
  K: 24
  N: 12
  lhs: A0
  weight: W
  out: Y0
  modes:
    padded_edge: true
  cat: isa
- name: B0_quantized_linear_i8
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + per-tensor requant
  label: public
  comment: 'B0: quantized linear (i8 x i8 -> i32 -> acc_scale -> i8).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  acc_scale: 0.0625
  semantic: quantized_linear
  modes:
    i8: true
    acc_scale: true
    k_accumulate: true
  cat: layers
- name: B1_linear_relu_i8
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + ReLU
  label: public
  comment: 'B1: linear + relu (i32 readout).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - relu
  semantic: linear_relu
  modes:
    relu: true
  cat: layers
- name: B2_linear_acc_scale_relu_i8
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + requant + ReLU
  label: public
  comment: 'B2: linear + acc_scale + relu -> i8.'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  - relu
  acc_scale: 0.0625
  semantic: linear_acc_scale_relu
  modes:
    i8: true
    acc_scale: true
    relu: true
  cat: layers
- name: C0_mlp_linear1
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: mlp.fc1
  label: public
  comment: C0_mlp_linear1
  M_tiles: 1
  K_tiles: 4
  N_tiles: 4
  lhs: X
  weight: W1
  out: Y0
  semantic: mlp_linear1
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
- name: C1_mlp_activation_linear2
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: mlp.relu+fc2
  label: public
  comment: C1_mlp_activation_linear2
  M_tiles: 1
  K_tiles: 4
  N_tiles: 4
  lhs: H
  weight: W2
  out: Y0
  epilogue:
  - relu
  semantic: mlp_relu_linear2
  modes:
    i8: false
    relu: true
    acc_scale: false
  cat: model_slices
- name: C2_attention_q_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.q_proj
  label: public
  comment: C2_attention_q_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wq
  out: Y0
  semantic: attn_q_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
- name: C3_attention_k_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.k_proj
  label: public
  comment: C3_attention_k_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wk
  out: Y0
  semantic: attn_k_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
- name: C4_attention_v_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.v_proj
  label: public
  comment: C4_attention_v_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wv
  out: Y0
  semantic: attn_v_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
- name: C5_attention_qk_matmul
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.q@k^T (Kt = K transposed leaf)
  label: public
  comment: C5_attention_qk_matmul
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: Q
  weight: Kt
  out: Y0
  semantic: attn_qk
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
- name: C6_attention_pv_matmul
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.p@v
  label: public
  comment: C6_attention_pv_matmul
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: P
  weight: V
  out: Y0
  semantic: attn_pv
  modes:
    i8: false
    relu: false
    acc_scale: false
  cat: model_slices
# --- Fused ops mined from gemmini-rocc-tests (tiled_matmul_ws_{layernorm,softmax,igelu}, attn_fp8_*).
# These norm/activation/attention algorithms run in bf16 (the non-accelerator lanes compose with the int8
# matmul mesh), so they are PyTorch-sourced (source: pytorch) with the m2m linalg as the interface.
- {cat: model_slices, name: GF1_softmax_bf16_pt, kind: model_slice, op: softmax, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch softmax bf16 (tiled_matmul_ws_softmax family)', label: public, modes: {}}
- {cat: model_slices, name: GF2_attn_full_bf16_pt, kind: model_slice, op: attention_full,
   operand_dtype: bf16, source: pytorch, M: 16, K: 64, N: 16, Dv: 64, causal: true, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch causal attention bf16 (attn_fp8_full family)', label: public, modes: {}}
- {cat: model_slices, name: GF3_geglu_bf16_pt, kind: model_slice, op: geglu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, N: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GeGLU bf16 (tiled_matmul_ws_igelu family)', label: public, modes: {}}
# --- More int8 matmul-family (direct-MLIR int engine): Q@K^T attention scores.
- {cat: model_slices, name: C7_attention_qk_i8, kind: model_slice, op: attention_qk, M_tiles: 1,
   K_tiles: 2, q: Q, k: K, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'int8 Q@K^T attention scores (bareMetalC attention)', label: public, modes: {}}
# --- Whole-model capstone (GATED): small_llama in int8 (torchAO int8_weight_only) end to end.
- {cat: model, name: M0_small_llama_gemmini, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 — whole-model capstone (embed/RMSNorm/RoPE/attn/SwiGLU/lm_head)',
   label: public, gate: {after_op_pass_fraction: 0.8}}
# --- Elementwise/activation ops mined from gemmini-rocc-tests (resadd residual, igelu activation).
- {cat: model_slices, name: GF4_add_bf16_pt, kind: model_slice, op: add, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch residual add bf16 (gemmini-rocc-tests resadd)', label: public, modes: {}}
- {cat: model_slices, name: GF5_gelu_bf16_pt, kind: model_slice, op: gelu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GELU-tanh bf16 (gemmini-rocc-tests igelu)', label: public, modes: {}}
# --- Spec-sourced capsule: the PROGRAM + bit-exact golden come from the specir verification spec itself
# (spec_ref), not a handauthored template — the spec's command buffer + coverage_goal ship as grounding.
- {cat: isa, name: GS0_matmul_spec, kind: isa, op: matmul, source: spec, spec_ref: 'gemmini:op.matmul',
   M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0, source_role: spec_derived,
   source_reference: 'specir spec-sourced int8 matmul (program + bit-exact refmodel golden + coverage)',
   label: public}
# --- Conv family: native int8 conv2d (direct-MLIR merlin_iface.conv2d, mined from bareMetalC/conv.c) +
# the vector-lane conv/pool ops (bf16 pytorch: depthwise MixFFN, pooling, global average).
- {cat: layers, name: GC0_conv2d_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8, kh: 3, kw: 3,
   source_role: uplifted_from_bareMetalC, source_reference: 'im2col conv2d int8 (bareMetalC/conv.c)',
   label: public}
- {cat: model_slices, name: GC1_depthwise_bf16_pt, kind: model_slice, op: depthwise_conv2d,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 3, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch depthwise conv bf16 (MixFFN depthwise)',
   label: public, modes: {}}
- {cat: model_slices, name: GC2_maxpool_bf16_pt, kind: model_slice, op: maxpool2d, operand_dtype: bf16,
   source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 2, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch 2x2 max-pool bf16', label: public, modes: {}}
- {cat: model_slices, name: GC3_avgpool_bf16_pt, kind: model_slice, op: avgpool2d, operand_dtype: bf16,
   source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 2, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch 2x2 avg-pool bf16', label: public, modes: {}}
- {cat: model_slices, name: GC4_global_avg_bf16_pt, kind: model_slice, op: global_average,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch global average pool bf16', label: public,
   modes: {}}
- {cat: model_slices, name: GC5_fused_matmul_bias_bf16_pt, kind: model_slice, op: fused_matmul_bias,
   operand_dtype: bf16, source: pytorch, M: 16, K: 16, N: 16, out: Y0, comparison_group: fused_matmul_bias,
   source_role: pytorch_model_slice, source_reference: 'PyTorch linear+bias bf16', label: public, modes: {}}
- {cat: model_slices, name: GC6_bias_add_bf16_pt, kind: model_slice, op: bias_add, operand_dtype: bf16,
   source: pytorch, M: 16, N: 16, out: Y0, comparison_group: bias_add, source_role: pytorch_model_slice,
   source_reference: 'PyTorch bias add bf16', label: public, modes: {}}
# --- Second whole-model capstone (GATED): lstmnetvit int8 — broader layer types (conv patch-embed,
# spatial-reduction attention, depthwise MixFFN, PixelShuffle+upsample, LSTM head) beyond small_llama.
- {cat: model, name: M1_lstmnetvit_gemmini, kind: model, op: model, model: lstmnetvit,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'lstmnetvit int8 — vision+LSTM control net (conv/spatial-attn/MixFFN/upsample/LSTM)',
   label: public, gate: {after_op_pass_fraction: 0.8}}
# INTEROP: the capstones above assert the accelerator ran the whole model; this one asserts the compiler
# can SPLIT one across the mesh and the host scalar/RVV lane and still be numerically right. That is the
# normal shape of a real network on a matmul-only mesh -- norms and activations have nowhere else to go --
# so a bar that treats host-lane work as failure tests the wrong thing. `must_accelerate` is withheld for
# a lane-declaring capsule for exactly that reason. This target declares one compute unit (systolic_mesh),
# so `in_contract_vector_scalar` is unreachable here and is deliberately not required.
- {cat: model, name: GX0_interop_rvv_lane, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 composed across the systolic mesh and the host scalar/RVV lane — asserts both lanes carried work',
   label: public, gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]}}

# ---------------------------------------------------------------------------------------------------
# TAIL-PATH COVERAGE, generated rather than typed.
#
# Every capsule above is authored in WHOLE TILES (`M_tiles`/`K_tiles`/`N_tiles`), so the corpus could not
# express a partial tile at all and the derived requirement reported `movement/i8/partial` and
# `elementwise_map/i8/partial` uncovered for as long as it has existed. That is the tail path, which is
# where tiling bugs live: this repo has already shipped a taped-out unit that computed partial N tiles
# wrongly while every functional check passed.
#
# Extents are tile-RELATIVE, so the same declaration produces the right edge cases for any array edge and
# nothing here hardcodes a geometry.
sweeps:
- id: FT
  name: '{id}{i:02d}_movement_tail_{M}x{N}'
  source_reference: >-
    derived tail-path coverage for the movement family: a load/store round-trip on extents that do not
    divide the array edge, one below it and one above
  base: {kind: isa, cat: isa, op: movement, label: public, src: X, out: Y0, modes: {movement: true}}
  axes:
    M: [tile-1, tile+1]
    N: [tile-1]

- id: FE
  name: '{id}{i:02d}_fused_epilogue_tail_{M}x{K}x{N}'
  source_reference: >-
    derived tail-path coverage for the fused epilogue: this target declares elementwise_map reachable
    ONLY composed with a contraction, so a standalone elementwise capsule would be the wrong capsule --
    the eligibility oracle refuses one as a false fallback. The epilogue is therefore the only way the
    cell can be evidenced, and it had never been evidenced at a partial tile
  base:
    kind: isa
    cat: isa
    op: matmul
    label: public
    lhs: A0
    weight: W
    out: Y0
    epilogue: [acc_scale, relu]
    acc_scale: 0.0625
    modes: {i8: true, relu: true, acc_scale: true}
  axes:
    M: [tile-1]
    # Two K points, because one reduction depth cannot separate a tiled unit's rate from its
    # per-tile-pair overhead -- the generator enforces this rather than documenting it.
    K: [tile, 2*tile]
    N: [tile+1]
