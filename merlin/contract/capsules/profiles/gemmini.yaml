- {cat: model_slices, name: GC3_avgpool_bf16_pt, kind: model_slice, op: avgpool2d, operand_dtype: bf16,
   source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 2, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch 2x2 avg-pool bf16', label: public, modes: {}}
- {cat: model_slices, name: GC4_global_avg_bf16_pt, kind: model_slice, op: global_average,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch global average pool bf16', label: public,
   modes: {}}
- {cat: model_slices, name: GC5_fused_matmul_bias_bf16_pt, kind: model_slice, op: fused_matmul_bias,
   operand_dtype: bf16, source: pytorch, M: 16, K: 16, N: 16, out: Y0, comparison_group: fused_matmul_bias,
   source_role: pytorch_model_slice, source_reference: 'PyTorch linear+bias bf16', label: public, modes: {}}
- {cat: model_slices, name: GC6_bias_add_bf16_pt, kind: model_slice, op: bias_add, operand_dtype: bf16,
   source: pytorch, M: 16, N: 16, out: Y0, comparison_group: bias_add, source_role: pytorch_model_slice,
   source_reference: 'PyTorch bias add bf16', label: public, modes: {}}
# --- Second whole-model capstone (GATED): lstmnetvit int8 — broader layer types (conv patch-embed,
# spatial-reduction attention, depthwise MixFFN, PixelShuffle+upsample, LSTM head) beyond small_llama.
- {cat: model, name: M1_lstmnetvit_gemmini, kind: model, op: model, model: lstmnetvit,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'lstmnetvit int8 — vision+LSTM control net (conv/spatial-attn/MixFFN/upsample/LSTM)',
   label: public, gate: {after_op_pass_fraction: 0.8}}
# INTEROP: the capstones above assert the accelerator ran the whole model; this one asserts the compiler
# can SPLIT one across the mesh and the host scalar/RVV lane and still be numerically right. That is the
# normal shape of a real network on a matmul-only mesh -- norms and activations have nowhere else to go --
# so a bar that treats host-lane work as failure tests the wrong thing. `must_accelerate` is withheld for
# a lane-declaring capsule for exactly that reason. This target declares one compute unit (systolic_mesh),
# so `in_contract_vector_scalar` is unreachable here and is deliberately not required.
- {cat: model, name: GX0_interop_rvv_lane, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 composed across the systolic mesh and the host scalar/RVV lane — asserts both lanes carried work',
   label: public, gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]}}
# CYCLE-ACCURATE WHOLE MODEL. The three capstones above are the corpus's strongest claim and the one
# claim no hardware ever checked: at 497 KB of interface MLIR against 6.6 MB of weights, none of them
# can be afforded at the cycle-accurate tier, so "the compiler handles a real network end to end" rests
# on a functional oracle whose own descriptor says derived_from_rtl: false. This one is sized to run
# THERE. What it must contain is derived (merlin.targetgen.micro_model), not chosen: one layer per
# (family, dtype) cell this target's manifest admits, plus the families real captures contain that it
# does NOT admit -- normalization and reduction, which therefore have nowhere but the host lane to go --
# interleaved so the host work sits BETWEEN accelerator work. Its network is defined in the capsule's
# own capsule.pytorch.py: unlike M1 it needs no external model checkout, so a clean clone can rebuild it.
- {cat: model, name: M2_microvit_gemmini, kind: model, op: model, model: microvit,
   loader: merlin/contract/capsules/model/M2_microvit_gemmini/capsule.pytorch.py,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'microvit int8 — tile-sized vision+recurrent control net (overlapping patch-merge, pooled-reduction attention, depthwise MixFFN, pixel-shuffle/max-pool fusion, LSTM cell), composed across the systolic mesh and the host lane',
   label: public, gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]}}

# ---------------------------------------------------------------------------------------------------
# COMPOSITION COVERAGE: the host-island seam, on its own.
#
# `A->H->A` -- an accelerator region, a host island, another accelerator region -- is the expensive seam
# and the one a placement decision gets wrong. The composition axis reported it COVERED, but covered
# INCIDENTALLY: the only capsules containing it are the four whole models, every one of which classifies
# as `routing`, so the shape was exercised by accident rather than proven. When a 155-region routing
# capsule fails, nothing says whether the seam or one of its other regions was the cause.
#
# What sits on each side is derived, not chosen: int8 contraction is the only (family, dtype) this
# target's manifest admits on its mesh, and normalization is a family real captures contain 249 regions
# of that the manifest declares NO capability for -- so the island is host work because the hardware
# cannot do it, not because an author put it there. Small enough for the cycle-accurate tier: two
# 16x32 by 32x32 GEMMs and one 16x32 LayerNorm.
#
# It is a `model` capsule because that is the only authoring route to the linalg grammar: the merlin_iface
# command grammar carries no host computation at all (boundary.py), so a capsule in it can only ever be
# `A` or `A->A`, and the op-level pytorch path takes no custom loader and refuses an int8 dtype. The gate
# is 0.0 rather than the model default 0.8 -- this capsule is three tiles of arithmetic, so deferring it
# behind the op suite buys nothing and would leave the seam unproven whenever the suite is short.
- {cat: model, name: M3_host_island_seam_gemmini, kind: model, op: model, model: host_island_seam,
   loader: merlin/contract/capsules/model/M3_host_island_seam_gemmini/capsule.pytorch.py,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'int8 GEMM -> host LayerNorm -> int8 GEMM: the A->H->A seam as the subject of a capsule rather than a by-product of a whole model',
   label: public, gate: {after_op_pass_fraction: 0.0},
   comment: 'M3: the A->H->A seam as the subject of a capsule. An int8 GEMM on the mesh, a LayerNorm
     on the host lane (this target declares no normalization capability, so the island is host work
     because the hardware cannot do it), and the value back to the mesh for a second int8 GEMM. The
     four whole models all CONTAIN this shape and all classify as `routing`, so the seam was covered
     only incidentally; one region more on either side of this one would retitle it `routing` too.'}

# ---------------------------------------------------------------------------------------------------
# MEMORY-MAPPING COVERAGE (merlin.targetgen.memory_regime).
#
# Every other capsule above fits the target's operand store TWICE over -- the largest of the 37 public
# ones uses 2.34% of its 16384 rows -- while 12.1% of the contraction regions in the 20 real captures
# land in `fits_single` and 42.5% land in `spills`. So the corpus exercises the easiest regime
# exclusively and cannot detect a memory-mapping failure of any kind: a schedule that loads every weight
# tile up front is not punished by any capsule, and the one time it mattered a graded backend addressed
# all kt*nt tiles as simultaneously resident, asked for 16384 rows against 16384, and the simulator
# aborted three layers away in a range check -- a failure indistinguishable from an unreachable oracle.
#
# Both are deep-K contractions with a single output tile, which is the SMALLEST program that can reach
# each regime: residency is (M*K + K*N) elements, so pressure has to come from K, and putting it there
# keeps the graded output at one 16x16 tile. A wider-output shape of the same residency would multiply
# the cycle-accurate tier's cost (which is dominated by how much data the harness materialises and
# prints) without making the mapping problem any harder.
#
# The extents are NOT tile-relative here on purpose: the regime boundary is a property of the store's
# row count, not of the array edge, and the two are independent facts about the target. They are stated
# as absolute extents and the test `merlin/tests/targetgen/test_required_cell_capsules.py` re-derives
# the regime from the target's own operand store, so a target whose store changes fails the test loudly
# instead of silently authoring a capsule in the wrong regime.
- name: GM0_deep_k_fits_single_i8
  kind: layer
  cat: layers
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived memory-mapping coverage: a contraction whose operands occupy 12288 of the operand store's
    16384 rows (75.0%) -- it fits ONCE and cannot be double-buffered, so serialising movement against
    compute is correct here and failing to stage is not a defect
  label: public
  comment: 'GM0: deep-K int8 contraction sized to the fits_single regime (75.0% of the operand store).'
  M: 16
  K: 6144
  N: 16
  lhs: X
  weight: W
  out: Y0
  # The axis this capsule probes is the EXTENT, not a new composition: it is the same fused-free
  # contraction the corpus already has, at a size that changes where the operands can live.
  generalization: {generalization_axis: shape}
  modes:
    k_accumulate: true
- name: GM1_deep_k_spills_i8
  kind: layer
  cat: layers
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived memory-mapping coverage: the SMALLEST tile-aligned contraction whose operands exceed the
    operand store (16416 of 16384 rows, 100.2%) -- no allocation makes it fit, so the compiler must
    choose a loop order and pay re-load traffic instead of holding everything resident
  label: public
  comment: 'GM1: deep-K int8 contraction sized past the operand store (100.2%) -- the spills regime.'
  M: 16
  K: 8208
  N: 16
  lhs: X
  weight: W
  out: Y0
  # The axis this capsule probes is the EXTENT, not a new composition: it is the same fused-free
  # contraction the corpus already has, at a size that changes where the operands can live.
  generalization: {generalization_axis: shape}
  modes:
    k_accumulate: true

# ---------------------------------------------------------------------------------------------------
# POOLING COVERAGE (the `reduction` family, int8, at both alignments).
#
# The target's elaborated config sets has_max_pool, so its capability manifest declares
# `{family: reduction, dtypes: [int8], composed_with: [contraction, movement]}` and the derived
# conformance requirement demands `reduction/i8/aligned` and `reduction/i8/partial`. Both were
# UNCOVERED (6/8 cells) for as long as the requirement has existed, and no standalone pooling capsule
# could have closed them: pooling on this target is FUSED onto the store path -- the store config
# carries pool_size/pool_stride/pool_out_dim/porows/pocols/orows/ocols/upad/lpad and the mvout writes
# the pooled window -- so the eligibility oracle refuses a standalone pool capsule as a false fallback.
# `composed_with` says the same thing in the manifest's own words. The only honest capsule is therefore
# a contraction (or a conv) whose EPILOGUE pools, which is what these three are.
#
# The extents are absolute rather than tile-relative, for the same reason GM0/GM1 above are: the axis
# these capsules probe is the POOLING WINDOW against the image, and an image extent is not a fact about
# the array edge. M is chosen so that it factors into the declared pool_in_dims -- the row count of an
# [M, N] accumulator carries no spatial extent of its own (25 rows is 5x5 or 25x1), so the builder
# refuses a pool_in_dims that does not divide it rather than picking a factorization.
- name: GP0_matmul_maxpool_i8
  kind: layer
  cat: layers
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage: an int8 contraction whose accumulator readout pools 2x2, the store-path
    fusion the capability manifest declares (has_max_pool) and which no capsule exercised -- every
    extent a whole tile, so this is the `reduction/i8/aligned` cell
  label: public
  comment: 'GP0: 16x16x16 int8 matmul whose commit fuses a 2x2/2 max-pool over the 4x4 output plane.'
  M: 16
  K: 16
  N: 16
  lhs: A0
  weight: W
  out: Y0
  epilogue: [maxpool]
  # 16 committed rows read as one 4x4 plane; a 2x2 window at stride 2 tiles it exactly, so this capsule
  # says nothing about the ragged case -- that is GP1's job.
  pool_in_dims: [4, 4]
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: GP1_matmul_maxpool_tail_i8
  kind: layer
  cat: layers
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage at the tail: a 5x5 output plane pooled by a 2x2/2 window (the fifth row and
    column fall outside every window and must be DROPPED, not folded in) with an output extent that does
    not divide the array edge -- the `reduction/i8/partial` cell
  label: public
  comment: 'GP1: 25x16x17 int8 matmul; the commit pools a ragged 5x5 plane 2x2/2 down to 2x2.'
  # 25 = 5x5, and 5 is odd: the last row and the last column of the plane are covered by no window.
  # A pooling store that folded them in (or that rounded the output extent up) still returns a
  # well-formed tensor, which is why the tail is where this family's bugs live.
  M: 25
  K: 16
  # N = tile+1: the pooled result is ALSO a partial tile on the channel axis, so a backend cannot pass
  # by handling the ragged pool while still tiling the store to whole array edges.
  N: 17
  lhs: A0
  weight: W
  out: Y0
  epilogue: [maxpool]
  pool_in_dims: [5, 5]
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: GP2_conv2d_maxpool_i8
  kind: layer
  cat: layers
  op: conv2d
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage in its NATIVE form: the fused conv loop takes the pooling window directly
    (pool_size/pool_stride/pool_padding) and stores the pooled result, so a conv+pool is the shape the
    hardware actually offers -- the conv-with-epilogue counterpart of GP0/GP1
  label: public
  comment: 'GP2: 3x3 int8 conv over 8x8x4 -> 6x6x16, with a 2x2/2 max-pool fused onto the store.'
  Himg: 8
  Wimg: 8
  ci: 4
  N: 16
  kh: 3
  kw: 3
  epilogue: [maxpool]
  # pool_in_dims is NOT declared here: for a conv it is the conv's own 6x6 output extent, derived by the
  # builder and cross-checked by the simulator against the geometry it re-derives. Two hand-typed copies
  # of one extent is how a golden and an engine come to pool different images.
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}


# ---------------------------------------------------------------------------------------------------
# TAIL-PATH COVERAGE, generated rather than typed.
#
# Every capsule above is authored in WHOLE TILES (`M_tiles`/`K_tiles`/`N_tiles`), so the corpus could not
# express a partial tile at all and the derived requirement reported `movement/i8/partial` and
# `elementwise_map/i8/partial` uncovered for as long as it has existed. That is the tail path, which is
# where tiling bugs live: this repo has already shipped a taped-out unit that computed partial N tiles
# wrongly while every functional check passed.
#
# Extents are tile-RELATIVE, so the same declaration produces the right edge cases for any array edge and
# nothing here hardcodes a geometry.
sweeps:
- id: FT
  name: '{id}{i:02d}_movement_tail_{M}x{N}'
  source_reference: >-
    derived tail-path coverage for the movement family: a load/store round-trip on extents that do not
    divide the array edge, one below it and one above
  base: {kind: isa, cat: isa, op: movement, label: public, src: X, out: Y0, modes: {movement: true}}
  axes:
    M: [tile-1, tile+1]
    N: [tile-1]

- id: FE
  name: '{id}{i:02d}_fused_epilogue_tail_{M}x{K}x{N}'
  source_reference: >-
    derived tail-path coverage for the fused epilogue: this target declares elementwise_map reachable
    ONLY composed with a contraction, so a standalone elementwise capsule would be the wrong capsule --
    the eligibility oracle refuses one as a false fallback. The epilogue is therefore the only way the
    cell can be evidenced, and it had never been evidenced at a partial tile
  base:
    kind: isa
    cat: isa
    op: matmul
    label: public
    lhs: A0
    weight: W
    out: Y0
    epilogue: [acc_scale, relu]
    acc_scale: 0.0625
    modes: {i8: true, relu: true, acc_scale: true}
  axes:
    M: [tile-1]
    # Two K points, because one reduction depth cannot separate a tiled unit's rate from its
    # per-tile-pair overhead -- the generator enforces this rather than documenting it.
    K: [tile, 2*tile]
    N: [tile+1]
