# Radiance corpus profile — SIMT (Muon) tensor GEMM + PR#1 op shapes, composed with the contained MX PE.
#
# Radiance is a SIMT tensor-core cluster (CVFPU fp32/fp16/bf16 lanes) that ALSO embeds a gemmini-mx MX PE
# (simt_cluster CONTAINS mx_pe). The corpus exercises both paths:
#   * SIMT float GEMM in fp32 / fp16 / bf16 — ordinary IEEE math (fp32 accumulate), the golden is a plain
#     IEEE reference, independent of any accelerator model;
#   * a couple of PR#1 op shapes — a row RMSNorm and a Q@K^T attention tile (TinyLlama/Gemma-2 family ops);
#   * one MX tensor tile (mxfp8, E8M0 block scale) driving the contained mx_pe, whose golden comes from mlc's
#     mx_ref (hardware semantics) exactly like the standalone mx_gemmini target — closing the loop between
#     radiance's compute_units and the MX PE numerics.
# NOT the gemmini int8 corpus (numerically meaningless for SIMT-fp / MX): that reuse is what this replaces.
datapath:
  operand_dtype: f32            # default (simt_cluster dtypes[0]); each capsule overrides per format
  accum_dtype: f32
  compare: tolerance_float
  atol: 0.03125
  rtol: 0.015625
  # L2 is cyclotron -- radiance's runner declares `sim_via: cyclotron` with
  # `tier_sim: {L2: cyclotron, L3: verilator}`, and cyclotron grades the emitted kernel ELF directly.
  # This said [L0, L1, L3] while all 40 shipped capsules require [L0, L1, L2], so a corpus regeneration
  # would have moved radiance OFF its functional gate onto an optional Verilator tier -- a grading
  # regression disguised as a routine regen. The capsules were right; this line was stale.
  required_oracle_tiers: [L0, L1, L2]
  # Corpus-wide generalization posture. must_accelerate is the strongest claim a capsule can make (an
  # ELIGIBLE region that falls back is a hard failure), so it is stated once here rather than defaulted
  # on: radiance asserts that every non-model capsule it ships must reach the accelerator. Whole-model
  # capsules are exempted structurally in corpus_spec, not by an exception list.
  semantic_defaults: {must_accelerate: true}

capsules:
- {cat: isa, name: R0_gemm_fp32, kind: isa, op: matmul, operand_dtype: f32,
   M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'SIMT fp32 GEMM tile (CVFPU fp32 lanes, fp32 accumulate)', label: public, modes: {}}
- {cat: isa, name: R1_gemm_fp16, kind: isa, op: matmul, operand_dtype: fp16,
   M: 16, K: 32, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'SIMT fp16 GEMM, K=32 (fp16 operands, fp32 accumulate)', label: public,
   modes: {k_accumulate: true}}
- {cat: isa, name: R2_gemm_bf16, kind: isa, op: matmul, operand_dtype: bf16,
   M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'SIMT bf16 GEMM tile (bf16 operands, fp32 accumulate)', label: public, modes: {}}
- {cat: model_slices, name: R3_attention_qk_fp16, kind: model_slice, op: attention_qk, operand_dtype: fp16,
   M_tiles: 1, K_tiles: 2, q: Q, k: K, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'attention Q @ K^T scores, fp16 -> fp32 (TinyLlama/Gemma-2 attn tile)',
   label: public, modes: {}}
- {cat: model_slices, name: R4_rmsnorm_fp32, kind: model_slice, op: rmsnorm, operand_dtype: f32,
   M: 16, K: 16, src: X, gamma: G, out: Y0, eps: 1.0e-05,
   source_role: pytorch_model_slice,
   source_reference: 'row RMSNorm (PR#1 SIMT op): x * rsqrt(mean(x^2)+eps) * gamma', label: public,
   modes: {rmsnorm: true}}
- {cat: isa, name: R5_mx_tile_mxfp8, kind: isa, op: matmul, operand_dtype: mxfp8,
   M: 16, K: 32, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'contained MX PE tile (mxfp8 e4m3, E8M0 block scale, bf16 accumulate) via simt_cluster.mx_pe',
   label: public, modes: {}}
# Lower-precision MX tiles closing the gemm_mxgemmini fp8/fp6/fp4 ladder (radiance-kernels PR#1 GEMM ladder).
# Same contained mx_pe datapath as R5, block-scaled E8M0, bf16 accumulate; golden from mlc's mx_ref.
# fp6/fp4 (sub-format) MX tiles: the mx_pe tiles fp6/fp4 by 32 (2 elements per byte -> a 32-wide logical
# tile), so M and N MUST be multiples of 32 — a 16-wide tile yields a degenerate all-zero GEMM (no tile
# iterations). K=32 (one E8M0 group). bf16 accumulate; golden from mlc mx_ref.
- {cat: isa, name: R6_mx_tile_mxfp6, kind: isa, op: matmul, operand_dtype: mxfp6,
   M: 32, K: 32, N: 32, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'contained MX PE tile (mxfp6 e3m2, E8M0 block scale, bf16 accumulate) via simt_cluster.mx_pe (gemm_mxgemmini fp6 ladder)',
   label: public, modes: {}}
- {cat: isa, name: R7_mx_tile_mxfp4, kind: isa, op: matmul, operand_dtype: mxfp4,
   M: 32, K: 32, N: 32, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: 'contained MX PE tile (mxfp4 e2m1, E8M0 block scale, bf16 accumulate) via simt_cluster.mx_pe (gemm_mxgemmini fp4 ladder)',
   label: public, modes: {}}
# --- MX fused flash-attention (radiance-kernels PR#1 flash_attention_mx) ------------------------------
# O = softmax(Q@K^T / sqrt(H) [+ Gemma-2 soft-cap]) @ V, with BOTH matmuls on the contained mx_pe
# (mxfp8, E8M0 per-32 K group, bf16 accumulate) and a bf16 row-softmax between them. The golden is
# COMPOSED from the validated mlc mx_ref (QK & PV) + a numpy bf16 softmax; the softmax intermediate P is
# requantized to mxfp8 (per-row E8M0) exactly as the MX PE does before the second GEMM. Tiny dims.
- {cat: model_slices, name: R8_flash_attention_mx, kind: model_slice, op: attention_mx, operand_dtype: mxfp8,
   M: 16, H: 32, Skv: 32, Dv: 16, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'MX flash attention (mxfp8, E8M0): softmax(Q@K^T/sqrt(H))@V — radiance-kernels flash_attention_mx',
   label: public, modes: {}}
- {cat: model_slices, name: R9_flash_attn_mx_gqa, kind: model_slice, op: attention_mx, operand_dtype: mxfp8,
   M: 16, H: 32, Skv: 64, Dv: 32, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'MX flash attention, GQA shape (wider KV: Skv=64, Dv=32) — grouped-query attention tile',
   label: public, modes: {}}
- {cat: model_slices, name: R10_flash_attn_mx_gemma, kind: model_slice, op: attention_mx, operand_dtype: mxfp8,
   M: 16, H: 32, Skv: 32, Dv: 16, softcap: 50.0, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'MX flash attention with Gemma-2 logit soft-cap (cap=50) — gemma attention variant',
   label: public, modes: {}}
# Batched MX matmul (radiance-kernels decode-time gemv_batched, MX regime): B independent A_b@W_b GEMMs on
# the mx_pe, stacked to [B*M, N]. The MX PE tiles N by 16, so N is a mesh-tile multiple (a literal N=1 gemv
# is not expressible on the mx_ref datapath). mxfp8; golden from mlc mx_ref.
- {cat: model_slices, name: R11_gemv_batched_mx, kind: model_slice, op: gemv_batched, operand_dtype: mxfp8,
   B: 2, M: 16, H: 32, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'batched MX matmul (mxfp8, E8M0), 2x [16x32]@[32x16] — decode-time gemv_batched',
   label: public, modes: {}}
# fp6/fp4 MX flash-attention — the SAME fused composition as R8 (mx_matmul QK -> bf16 softmax -> per-group
# E8M0 requant of P -> mx_matmul PV) but at the fp6 (e3m2 nibble+LUT) / fp4 (e2m1 nibble) codec proven by
# R6/R7. The sub-format mx_pe tiles by 32, so M, Skv, Dv are all multiples of 32 (a 16-wide tile is
# degenerate). Golden from mlc mx_ref (QK & PV) + numpy bf16 softmax; no fabrication.
- {cat: model_slices, name: R12_flash_attn_mx_fp6, kind: model_slice, op: attention_mx, operand_dtype: mxfp6,
   M: 32, H: 32, Skv: 32, Dv: 32, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'MX flash attention, mxfp6 (e3m2 nibble+LUT, E8M0): softmax(Q@K^T/sqrt(H))@V',
   label: public, modes: {}}
- {cat: model_slices, name: R13_flash_attn_mx_fp4, kind: model_slice, op: attention_mx, operand_dtype: mxfp4,
   M: 32, H: 32, Skv: 32, Dv: 32, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'MX flash attention, mxfp4 (e2m1 nibble, E8M0): softmax(Q@K^T/sqrt(H))@V',
   label: public, modes: {}}
# Spec-sourced capsule: PROGRAM (SIMT warp schedule) + bit-exact IEEE golden from the specir verification
# spec, via emit_radiance_program (matmul composed from the declared warp_fma leaf).
- {cat: isa, name: RS0_matmul_spec, kind: isa, op: matmul, source: spec, spec_ref: 'radiance:op.matmul',
   operand_dtype: f32, M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0, source_role: spec_derived,
   source_reference: 'specir spec-sourced SIMT warp matmul (warp schedule + bit-exact IEEE golden + coverage)',
   label: public}
# PyTorch-sourced float capsules (source: pytorch) — the PREFERRED, frontend-faithful path: each op is
# defined in PyTorch and lowered to linalg-on-tensors via model2MLIR (torchAO for quantized dtypes), with
# the host torch-eager result as the golden. They ship the pytorch loader + the lowered linalg as visible
# grounding (capsule.pytorch.py / capsule.linalg.mlir) alongside the merlin_iface interface the agent
# compiles. Restricted to the SIMT float regime (fp32/fp16/bf16); the MX tile (R5) stays the direct-MLIR
# mx engine. Requires the m2m venv at generation time (additive: skipped with a warning if absent).
- {cat: model_slices, name: RP0_linear_fp32_pt, kind: model_slice, op: linear, operand_dtype: f32,
   source: pytorch, M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch fp32 projection X@W (frontend-faithful linear)', label: public, modes: {}}
- {cat: model_slices, name: RP1_attn_qk_bf16_pt, kind: model_slice, op: attention_qk, operand_dtype: bf16,
   source: pytorch, M_tiles: 1, K_tiles: 2, q: Q, k: K, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch Q@K^T attention scores, bf16 (TinyLlama/Gemma-2 attn tile)',
   label: public, modes: {}}
- {cat: model_slices, name: RP2_rmsnorm_fp16_pt, kind: model_slice, op: rmsnorm, operand_dtype: fp16,
   source: pytorch, M: 16, K: 16, src: X, gamma: G, out: Y0, eps: 1.0e-05,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch row RMSNorm fp16: x * rsqrt(mean(x^2)+eps) * gamma', label: public,
   modes: {rmsnorm: true}}
- {cat: isa, name: RP3_matmul_bf16_k32_pt, kind: isa, op: matmul, operand_dtype: bf16,
   source: pytorch, M: 16, K: 32, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch bf16 GEMM, K=32 (K-accumulate)', label: public, modes: {k_accumulate: true}}
# Fused ops (source: pytorch) whose interface is the m2m linalg module directly (positional args) — the
# agent compiles standard-dialect linalg. Exercise the SIMT elementwise/reduction datapath end to end.
- {cat: model_slices, name: RP4_softmax_fp32_pt, kind: model_slice, op: softmax, operand_dtype: f32,
   source: pytorch, M: 16, K: 16, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch row softmax fp32', label: public, modes: {}}
- {cat: model_slices, name: RP5_layernorm_fp32_pt, kind: model_slice, op: layernorm, operand_dtype: f32,
   source: pytorch, M: 16, K: 16, eps: 1.0e-05, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch LayerNorm fp32 (weight+bias)', label: public,
   modes: {}}
- {cat: model_slices, name: RP6_geglu_bf16_pt, kind: model_slice, op: geglu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, N: 32, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch GeGLU/SwiGLU bf16 (silu-gate)',
   label: public, modes: {}}
- {cat: model_slices, name: RP7_attn_full_fp16_pt, kind: model_slice, op: attention_full, operand_dtype: fp16,
   source: pytorch, M: 16, K: 64, N: 16, Dv: 64, causal: true, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch causal flash-style attention fp16 (Q@K^T,softmax,@V)', label: public, modes: {}}
- {cat: model_slices, name: RP8_rope_bf16_pt, kind: model_slice, op: rope, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch RoPE bf16 (radiance-kernels rope_qkv_fused)', label: public, modes: {}}
- {cat: model_slices, name: RP9_gelu_bf16_pt, kind: model_slice, op: gelu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GELU-tanh bf16 (radiance-kernels geglu gelu-tanh)', label: public, modes: {}}
# --- Transformer/ViT-family composite ops (radiance-kernels: gemv_batched, logit_softcap, embed_scale,
# gemma_4norm, patch_embed, bias/matmul-bias, chained P@V). All SIMT float, host-eager golden.
- {cat: model_slices, name: RP10_gemv_batched_fp16_pt, kind: model_slice, op: gemv_batched,
   operand_dtype: fp16, source: pytorch, M: 16, K: 16, B: 2, out: Y0, comparison_group: gemv_batched,
   source_role: pytorch_model_slice, source_reference: 'PyTorch batched GEMV fp16 (decode-time attn)',
   label: public, modes: {}}
- {cat: model_slices, name: RP11_logit_softcap_fp32_pt, kind: model_slice, op: logit_softcap,
   operand_dtype: f32, source: pytorch, M: 16, K: 16, cap: 50.0, out: Y0, comparison_group: logit_softcap,
   source_role: pytorch_model_slice, source_reference: 'PyTorch Gemma-2 logit soft-cap fp32', label: public,
   modes: {}}
- {cat: model_slices, name: RP12_embed_scale_fp32_pt, kind: model_slice, op: embed_scale,
   operand_dtype: f32, source: pytorch, M: 16, K: 16, out: Y0, comparison_group: embed_scale,
   source_role: pytorch_model_slice, source_reference: 'PyTorch embedding scale x*sqrt(d) fp32',
   label: public, modes: {}}
- {cat: model_slices, name: RP13_gemma_4norm_bf16_pt, kind: model_slice, op: gemma_4norm,
   operand_dtype: bf16, source: pytorch, M: 16, K: 16, eps: 1.0e-05, out: Y0, comparison_group: gemma_4norm,
   source_role: pytorch_model_slice, source_reference: 'PyTorch Gemma-2 chained RMSNorm bf16', label: public,
   modes: {}}
- {cat: model_slices, name: RP14_patch_embed_bf16_pt, kind: model_slice, op: patch_embed,
   operand_dtype: bf16, source: pytorch, Cin: 3, Himg: 8, Wimg: 8, P: 2, N: 16, out: Y0,
   comparison_group: patch_embed, source_role: pytorch_model_slice,
   source_reference: 'PyTorch ViT patch-embed conv bf16', label: public, modes: {}}
- {cat: model_slices, name: RP15_fused_matmul_bias_bf16_pt, kind: model_slice, op: fused_matmul_bias,
   operand_dtype: bf16, source: pytorch, M: 16, K: 16, N: 16, out: Y0, comparison_group: fused_matmul_bias,
   source_role: pytorch_model_slice, source_reference: 'PyTorch linear+bias bf16', label: public, modes: {}}
- {cat: model_slices, name: RP16_bias_add_fp32_pt, kind: model_slice, op: bias_add, operand_dtype: f32,
   source: pytorch, M: 16, N: 16, out: Y0, comparison_group: bias_add, source_role: pytorch_model_slice,
   source_reference: 'PyTorch bias add fp32', label: public, modes: {}}
- {cat: model_slices, name: RP17_k_chain_fp16_pt, kind: model_slice, op: k_chain, operand_dtype: fp16,
   source: pytorch, M: 16, K: 16, N: 16, out: Y0, comparison_group: k_chain,
   source_role: pytorch_model_slice, source_reference: 'PyTorch chained matmul (A@W1)@W2 fp16 (attn P@V)',
   label: public, modes: {}}
- {cat: model_slices, name: RP18_resadd_bf16_pt, kind: model_slice, op: add, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, comparison_group: resadd,
   source_role: pytorch_model_slice, source_reference: 'PyTorch residual add bf16 (radiance-kernels resadd)',
   label: public, modes: {}}
# SIMT fused norm/rope + QKV projection (radiance-kernels rmsnorm_qkv_fused / rope_qkv_fused). Direct-MLIR
# SIMT float (fp32-accumulate); goldens are ordinary IEEE numpy compositions (rmsnorm∘matmul, matmul∘rope)
# — the RoPE uses the SAME GPT-NeoX/Llama convention (theta=10000) as the pytorch RP8 rope.
- {cat: model_slices, name: RF0_rmsnorm_qkv_fp16, kind: model_slice, op: rmsnorm_qkv, operand_dtype: fp16,
   M: 16, K: 16, N: 48, src: X, gamma: G, weight: Wqkv, out: Y0, eps: 1.0e-05,
   source_role: pytorch_model_slice,
   source_reference: 'fused pre-norm QKV: Y = rmsnorm(X)@Wqkv fp16 (radiance-kernels rmsnorm_qkv_fused)',
   label: public, modes: {rmsnorm: true}}
- {cat: model_slices, name: RF1_rope_qkv_bf16, kind: model_slice, op: rope_qkv, operand_dtype: bf16,
   M: 16, K: 16, N: 32, src: X, weight: Wqkv, out: Y0, rope_theta: 10000.0,
   source_role: pytorch_model_slice,
   source_reference: 'fused QKV+RoPE: Y = rope(X@Wqkv) bf16 (radiance-kernels rope_qkv_fused)',
   label: public, modes: {rope: true}}
# Hidden holdout set (label: hidden) — parity with atlas/gemmini. These are UNSEEN SIMT GEMM shapes graded
# only at run end; their goldens are masked from the agent by the sandbox, so an agent that hardcodes a
# public answer cannot generalize to them. For an external_backend/SIMT target the executing cyclotron
# oracle + these hidden shapes ARE the anti-cheese (a host-computed fake produces wrong output on unseen
# inputs) — the trace-gate anti-cheese of a RoCC target has no analog here and is not applicable.
- {cat: hidden, name: RH0_gemm_fp16_hidden, kind: isa, op: matmul, operand_dtype: fp16,
   M: 32, K: 16, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: hidden SIMT fp16 GEMM (unseen M=32 shape), label: hidden, modes: {}}
- {cat: hidden, name: RH1_gemm_bf16_kaccum_hidden, kind: isa, op: matmul, operand_dtype: bf16,
   M: 16, K: 48, N: 16, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: hidden SIMT bf16 GEMM (unseen K=48 accumulate), label: hidden,
   modes: {k_accumulate: true}}
- {cat: hidden, name: RH2_gemm_fp32_hidden, kind: isa, op: matmul, operand_dtype: f32,
   M: 16, K: 16, N: 32, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: hidden SIMT fp32 GEMM (unseen N=32 shape), label: hidden, modes: {}}
# MX-datapath holdout: an unseen-shape mxfp4 tile so the contained mx_pe path has a masked-golden anti-cheese
# too (the public MX tiles R5-R7 are its only other exposure). Golden from mlc's mx_ref, masked by the sandbox.
- {cat: hidden, name: RH3_mx_tile_mxfp4_hidden, kind: isa, op: matmul, operand_dtype: mxfp4,
   M: 32, K: 64, N: 32, lhs: A0, weight: W, out: Y0,
   source_role: handauthored_compiler_test,
   source_reference: hidden contained MX PE tile (mxfp4 e2m1, unseen K=64 shape), label: hidden, modes: {}}
# MX fused flash-attention holdout: an unseen-shape mxfp8 attention (larger M and head dim) so the fused
# MX-attention datapath (R8-R10) has a masked-golden anti-cheese too. Golden from mx_ref (QK & PV) + bf16
# softmax, masked by the sandbox.
- {cat: hidden, name: RH4_flash_attn_mx_hidden, kind: model_slice, op: attention_mx, operand_dtype: mxfp8,
   M: 32, H: 64, Skv: 32, Dv: 16, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: hidden MX flash attention (mxfp8, unseen M=32/H=64 shape), label: hidden, modes: {}}
# fp4 MX flash-attention holdout (unseen shape: wider KV Skv=64, Dv=32) so the fp6/fp4 fused datapath has a
# masked-golden anti-cheese too. Golden from mx_ref + bf16 softmax, masked by the sandbox.
- {cat: hidden, name: RH5_flash_attn_mx_fp4_hidden, kind: model_slice, op: attention_mx, operand_dtype: mxfp4,
   M: 32, H: 32, Skv: 64, Dv: 32, q: Q, k: K, v: V, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: hidden MX flash attention (mxfp4, unseen Skv=64/Dv=32 shape), label: hidden, modes: {}}
# PyTorch-sourced hidden holdouts (source: pytorch) — unseen shapes/ops for the frontend-faithful path.
# Held-out MOVEMENT. Declared under simt_cluster's semantic_capabilities and never exercised. A load->
# store capsule computes nothing, which is exactly the point: the datapath's only job is to carry the
# operand without corrupting it, and the corpus had no capsule that checked that at all.
- {cat: hidden, name: RPH5_movement_fp32_hidden, kind: model_slice, op: movement, operand_dtype: f32,
   M: 24, N: 48, src: X, out: Y0,
