  - i8
  - mxfp8
  - fp16
  - f32
  cells_no_writer_can_express: []
  shape_regions_no_writer_can_express:
  - 'contraction.transpose (layout axis, family ''contraction'', dtype ''fp8_e4m3''): no builder materializes
    a transposed-layout region for this family at this dtype'
  - 'contraction.batched (rank axis, family ''contraction'', dtype ''fp8_e4m3''): no builder materializes
    a rank-3 region for this family at this dtype'
  - 'elementwise_map.batched (rank axis, family ''elementwise_map'', dtype ''fp8_e4m3''): no builder materializes
    a rank-3 region for this family at this dtype'
  - 'movement.batched (rank axis, family ''movement'', dtype ''fp8_e4m3''): no builder materializes a
    rank-3 region for this family at this dtype'
  cells_no_writer_note: a required cell whose op has no direct-MLIR builder and whose dtype the PyTorch
    writer cannot express. Reported as an uncovered cell to argue about rather than emitted as an entry
    nothing can write; adding a builder for that op closes it
  composition_shapes_required:
  - A
  - A->A
  - A->H->A
  - H
  - H->A->H
  - routing
  composition_note: one micro-model capsule is synthesized for this axis, and its composition is whatever
    the derived inventory produces. A shape listed here that the micro model does not reach is not covered
    by synthesis -- emitting a capsule per shape would mean inventing inventories no capture supports
  host_only_unsynthesizable:
  - movement/f32 (op 'movement' has a merlin_iface builder, so its capsule carries an accelerator-dialect
    interface and classifies as accelerator work whatever dtype it declares; this axis needs an op of
    this family the interface dialect cannot express)
  - contraction/f32 (op 'matmul' has a merlin_iface builder, so its capsule carries an accelerator-dialect
    interface and classifies as accelerator work whatever dtype it declares; this axis needs an op of
    this family the interface dialect cannot express)
  - movement/i8 (op 'movement' has a merlin_iface builder, so its capsule carries an accelerator-dialect
    interface and classifies as accelerator work whatever dtype it declares; this axis needs an op of
    this family the interface dialect cannot express)
  host_only_note: 'a host-only family with no materializable op or no dtype observed in any capture. Reported
    rather than dropped: a negative lane nobody demanded reads downstream exactly like one nothing violates'
  accumulation_depth_unsizable:
  - a single 32x32 output tile already costs 361s against a 300.0s budget on this target, so no reduction
    of any depth is certifiable
  accumulation_depth_note: 'a reduction depth this target could not size. Kept separate from `cells_no_writer_can_express`
    because the two license different actions: a cell with no writer needs a builder, while an unsized
    depth needs a CERTIFICATION RUN -- the writer is there and the measured history to size it against
    is not. Reporting them together would make ''we never timed this target'' read as ''the corpus cannot
    express this'''
  memory_regimes_status: resolved
  memory_regimes_unreachable: []
  memory_regime_note: 'a regime with no capsule shape that reaches it on this target. `fits_on_reuse`
    is always here: a capsule''s declared inputs are all live at once, so peak-live and total coincide
    and the regime that separates them cannot arise from inputs alone'
  precision_note: a preference RANKS the dtypes the target already admits and can never widen them; a
    dropped token is reported rather than silently ignored
