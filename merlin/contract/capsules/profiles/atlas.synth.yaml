#   build_tools/scripts/synth_capsule_corpus.py --target atlas --write
# Do not hand-edit. These entries exist because the target's own conformance requirement asks for
# them: each carries the cell it was synthesized for in `source_reference`. Editing one here is a
# claim the requirement does not make, and the next regeneration discards it.
provenance:
  generated_by: merlin.targetgen.corpus_synth.synthesize
  target: atlas
  n_required_cells: 18
  n_entries: 28
  budget: 160
  precision_preference_kept:
  - fp8_e4m3
