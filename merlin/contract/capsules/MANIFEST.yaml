# every arm is granted read-only, so naming a held-out capsule handed the agent under test the op
# family it was being generalization-tested on. `held_out` therefore carries counts only; the holdout
# specification lives in the untracked `profiles/<target>.hidden.yaml` sidecars.
#
# This file is rewritten by generate_corpus.py; do not hand-edit. See AGENT.md.
