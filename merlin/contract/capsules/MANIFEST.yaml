# `generated` capsules are emitted by generate_corpus.py (re-run is byte-stable). `hand_authored`
# capsules have no generator yet — movement (A1) and conv (B3/B4) — and are the frozen
# source-of-record. Public capsules stay committed: they are graded, versioned benchmark INPUTS (the
# op/shape/dtype an agent compiles against), not regenerated on the fly.
#
