# Capsule corpus provenance — which capsules are deterministically regenerable vs hand-authored.
#
# `generated` capsules are emitted by generate_corpus.py (re-run is byte-stable). `hand_authored`
# capsules have no generator yet — movement (A1) and conv (B3/B4) — and are the frozen
# source-of-record. Public capsules stay committed: they are graded, versioned benchmark INPUTS (the
# op/shape/dtype an agent compiles against), not regenerated on the fly.
#
# HOLDOUTS ARE COUNTED, NEVER NAMED. This file is tracked and sits inside the `merlin/contract/` tree
# every arm is granted read-only, so naming a held-out capsule handed the agent under test the op
# family it was being generalization-tested on. `held_out` therefore carries counts only; the holdout
# specification lives in the untracked `profiles/<target>.hidden.yaml` sidecars.
#
# This file is rewritten by generate_corpus.py; do not hand-edit. See AGENT.md.
