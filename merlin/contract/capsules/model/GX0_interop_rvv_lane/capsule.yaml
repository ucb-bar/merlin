name: GX0_interop_rvv_lane
kind: model
source_role: pytorch_model_slice
source_reference: "small_llama int8 composed across the systolic mesh and the host\
  \ scalar/RVV lane \u2014 asserts both lanes carried work"
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: I0
  role: input
  shape:
  - 1
  - 8
  dtype: i64
operation:
  op: model
  attributes:
    model: small_llama
    dtype: i8
    out: Y0
    compile_dtype: int8
    arg_order:
    - I0
    - Y0
    weights: capsule.weights.safetensors
numeric_policy:
  compare: tolerance_float
  dtype: f32
  atol: 0.03125
  rtol: 0.02
expected:
  instruction_classes:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
gate:
  after_op_pass_fraction: 0.8
lanes:
  require:
  - on_mesh
  - scalar_rvv_lane
pytorch_ref:
  op: model
  dtype: i8
  loader: capsule.pytorch.py
linalg_mlir: capsule.interface.mlir
semantic:
  semantic_family: contraction
  generalization_axis: model
  must_accelerate: false
  # WITHHELD ON PURPOSE, and the reason is the capsule's subject. This is the interop capsule: its
  # point is that work is carried across BOTH lanes -- part of the model on the mesh, the rest on the
  # target's own scalar/RVV lane -- so "every eligible region must reach the accelerator" is the wrong
  # bar and would fail the exact behaviour under test. The demand it does make is the `lanes.require`
  # block above, which is stricter than must_accelerate here: it fails unless EVERY named lane actually
  # carried work, so the mesh cannot be silently skipped either.
  not_asserted_reason: >-
    interop capsule: composition across lanes is the behaviour under test, so host/RVV-lane work is
    expected and required. The accelerator demand is expressed as lanes.require [on_mesh,
    scalar_rvv_lane], which fails unless both lanes carried work.
  eligible: auto
