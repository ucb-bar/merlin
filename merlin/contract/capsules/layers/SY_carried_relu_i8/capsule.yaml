name: SY_carried_relu_i8
kind: layer
source_role: derived_sweep
source_reference: 'synthesized for the carried-state axis: ''relu'' is configuration
  a unit stays in (evidenced by [''manifest_composed_with'']), so the command after
  it, which does not ask for it, is where a backend that does not restore its configuration
  shows'
label: public
interface_mlir: capsule.interface.mlir
