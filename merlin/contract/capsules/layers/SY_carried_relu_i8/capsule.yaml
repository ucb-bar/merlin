  role: weight
  shape:
  - 32
  - 16
  dtype: i8
- name: A0
  role: input
  shape:
  - 16
  - 32
  dtype: i8
- name: A1
  role: input
  shape:
  - 16
  - 32
  dtype: i8
operation:
  op: resident_reuse
  attributes:
    weight: W
    matmuls:
    - lhs: A0
      out: Y0
      epilogue:
      - relu
      output_dtype: i8
    - lhs: A1
      out: Y1
      epilogue: []
      output_dtype: i32
    semantic: resident_reuse
numeric_policy:
  compare: exact_int
  dtype: i32
expected:
