name: SY_epilogue_requant
kind: layer
source_role: derived_sweep
source_reference: 'synthesized for the epilogue axis: this target can fuse a ''requant''
  stage onto a contraction (evidenced by [''manifest_composed_with'']), and a (family,
  dtype, alignment) cell cannot demand a particular stage -- so without this the capability
  is reported covered by whichever single stage the cell axis happened to pick'
label: public
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 32
  - 16
  dtype: i8
- name: A0
  role: input
  shape:
  - 16
  - 32
  dtype: i8
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue:
    - requant
    output_dtype: i8
    requant_shift: 3
numeric_policy:
  compare: exact_int
  dtype: i8
expected:
  instruction_classes:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
  modes:
    relu: false
    acc_scale: false
    i8: true
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
semantic:
  semantic_family: contraction
  generalization_axis: epilogue
  must_accelerate: true
  eligible: auto
  composed_families:
  - elementwise_map
pass_requirements:
- target-isa-lowering
- tile-schedule
