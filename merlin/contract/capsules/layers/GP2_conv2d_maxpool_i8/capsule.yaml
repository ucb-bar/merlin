  role: weight
  shape:
  - 36
  - 16
  dtype: i8
- name: IFM
  role: input
  shape:
  - 1
  - 8
  - 8
  - 4
  dtype: i8
operation:
  op: conv2d
  attributes:
    ifm: IFM
    weight: W
    out: Y0
    ci: 4
    kh: 3
    kw: 3
    stride:
    - 1
    - 1
    padding:
    - 0
    - 0
    - 0
    - 0
    dilation:
    - 1
    - 1
    layout: nhwc
    epilogue:
    - maxpool
    output_dtype: i32
    semantic: conv2d_im2col
    pool_in_dims:
