name: GP2_conv2d_maxpool_i8
kind: layer
source_role: handauthored_compiler_test
source_reference: 'derived pooling coverage in its NATIVE form: the fused conv loop
  takes the pooling window directly (pool_size/pool_stride/pool_padding) and stores
  the pooled result, so a conv+pool is the shape the hardware actually offers -- the
  conv-with-epilogue counterpart of GP0/GP1'
label: public
interface_mlir: capsule.interface.mlir
inputs:
