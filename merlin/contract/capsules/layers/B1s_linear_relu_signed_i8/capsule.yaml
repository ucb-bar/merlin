name: B1s_linear_relu_signed_i8
kind: layer
source_role: pytorch_model_slice
source_reference: nn.Linear + ReLU
label: public
interface_mlir: capsule.interface.mlir
# THE POINT OF THIS CAPSULE. The default stimulus is 0..3, so every operand is non-negative, the
# accumulator is never negative, and a fused ReLU is the identity on every value the program can
# produce -- which is why B1_linear_relu_i8 passes whether or not its activation is applied. A
# signed range makes the activation load-bearing: drop it and the answer changes.
stimulus_range:
- -3
- 3
inputs:
- name: W
  role: weight
  shape:
  - 32
  - 16
  dtype: i8
- name: X
  role: input
  shape:
  - 16
  - 32
  dtype: i8
operation:
  op: matmul
  attributes:
    lhs: X
    weight: W
    out: Y0
    epilogue:
    - relu
    output_dtype: i32
    semantic: linear_relu
numeric_policy:
  compare: exact_int
  dtype: i32
expected:
  instruction_classes:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
  modes:
    relu: true
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
semantic:
  semantic_family: contraction
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
  composed_families:
  - elementwise_map
