  - normalization
  dtypes:
    normalization: f32
  observed_in:
    normalization: 1137
  basis: 'families a real capture contains and this target''s capability manifest does not admit. The
    compiler must route them to the host lane; accelerating one is as much a defect as failing to accelerate
    an admitted family. EMPTY means no negative lane is derivable for this target -- every family its
    captures contain is admitted -- and never that none is needed: a target with an empty complement simply
    cannot be asked this question, which is a different fact from passing it'
diagnostics:
  n_cells: 12
  captures_read:
  - gemma2_2b_int8
  - gemma2_2b_int8_full
  - gemma2_2b_int8_full_seq8
  - gemma2_2b_int8_full_seq8_pretransposed
  - gemma2_2b_int8_full_seq8_sliced
  - gemma2_2b_int8_full_seq8_sliced_tiledhead
  - gemma2_2b_int8_full_spec
  - gemma2_2b_int8_full_spec_pretransposed
  - gemma2_2b_int8_section1
  - gemma2_2b_int8_section12
  - gemma2_2b_int8_section2
  - gemma2_2b_int8_spec
  - gemma2_2b_int8_spec_pretransposed
  - small_llama
  - small_llama_fp8
  - small_llama_int8
  - small_llama_int8_pretransposed
  - small_llama_pretransposed
  - spectformer_int8_full
  - spectformer_int8_full_pretransposed
  captures_unreadable: {}
  families_observed:
    contraction: 2195
    elementwise_map: 9061
    movement: 5746
    normalization: 1137
    reduction: 2262
  families_observed_via_primitives: {}
  families_needed_but_not_admitted:
  - normalization
  families_admitted_but_no_model_uses: []
  alignment_axis:
  - aligned
  - partial
  - sub_tile
  alignment_axis_narrowed_by_dtype: {}
  scale_block_elements: null
  admitted_status: resolved
  notes:
  - 1 family/families appear in a real capture but the hardware declares no capability for them (normalization);
    those are compiler work for the scalar/vector lane, not accelerator cells, and are excluded from the
    requirement rather than silently counted as covered
  axis_basis:
    semantic_family: observed in a real capture (or all of its primitives were)
    dtype: "ADMITTED ONLY \u2014 the captures are single-precision, so dtype demand is not observable\
      \ from them; every dtype the hardware declares for an observed family is required"
    tile_alignment: 'both, wherever the target tiles: a unit that only ever sees whole tiles has never
      exercised its tail path'
