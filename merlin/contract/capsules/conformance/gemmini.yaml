  required: admitted INTERSECT observed, x tile alignment where the target tiles
  cell_vocabulary: "(semantic_family, dtype, tile_alignment) \u2014 identical to contract.materialize.cert_capsule_cover,\
    \ so the existing cover measures this spec without a second definition of a cell"
boundaries:
  tile_edge: 16
  tile_edge_is_hardware_fact: true
  tile_edge_source: RTL facts arrays[].rows (the target leaves geometry to discovery rather than restating
    it in the contract)
  block_scale_group: null
  block_scale_source: ''
  operand_store_bytes: null
  operand_store_source: ''
  extent_probes:
