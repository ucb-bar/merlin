  axis_basis: 'the rank and operand-layout regions this target''s capability manifest DECLARES it handles,
    via capability_probes. A (family, dtype, alignment) cell cannot express either: it says what arithmetic
    the corpus must contain and nothing about whether the unit was ever asked for a batched region or
    a transposed operand. Both are declared capabilities, so a target that claims them and is never asked
    for one has an untested claim'
  why_shape_corners_are_excluded: 'the corner probes (tile, tile+-1, prime, skinny) and the dtype probes
    restate the alignment and dtype axes the cells already carry; requiring them again would inflate the
    requirement with points already required under another name. NOTE the alignment axis now carries three
    occupancy classes rather than two: `partial` rags one axis by one element (a nearly-full tile) and
    `sub_tile` leaves the tile barely occupied, which the hand-authored corpus probes 45 times and the
    derived corpus could not express at all. That is a genuinely distinct point, not a corner probe under
    another name'
