  required:
  - stage: relu
    family: elementwise_map
    evidenced_by:
    - isa_instruction_class
    isa_classes:
    - TensorComputeUnary
  - stage: bias_add
    family: elementwise_map
    evidenced_by:
    - isa_instruction_class
    isa_classes:
    - TensorComputeBinary
  rejected:
  - stage: acc_scale
    family: elementwise_map
    why: the manifest declares no family fused-only for it and this target's instruction taxonomy resolves
      no class for the role it needs
  - stage: maxpool
    family: reduction
    why: the manifest declares no family fused-only for it and this target's instruction taxonomy resolves
      no class for the role it needs
  axis_basis: the epilogue stages this target can fuse onto a contraction, evidenced by its capability
    manifest declaring the stage's family fused-only OR by its own instruction taxonomy resolving a class
    for the role the stage needs. A (family, dtype, alignment) cell cannot express WHICH epilogue rides
    the contraction, so a corpus derived from cells alone tests one stage and calls the fusion capability
    covered
application_shapes:
  required: []
  refused: []
  declared_applications: 0
  axis_basis: the contraction shapes this target's DECLARED applications contain, grouped by what the
    compiler must do with them and sized to what a certification costs. A capsule at an application's
    real shape is worthless if nobody can afford to certify it, so each class yields a cycle-accurate
    capsule at an affordable size plus, when the application is larger, an L2 capsule at the true shape
    that extends it -- never one without the other
  cert_budget_s: 300.0
  budget_source: default
cert_affordability:
  max_elements: 862
  budget_s: 300.0
  metric: written_output_elements
  law: seconds = 0.20509 * output ** 1.0782
  calibrated_to_elements: 4096
  extrapolated: false
  why: 'the largest written output whose predicted certification fits the budget. A capsule above it is
    graded at the loop tier and rests on a certified sibling -- not because it is uninteresting, but because
    nobody can afford to run it cycle-accurately. Reduction depth does NOT count against this: K moves
    the operands, not the result'
memory_mapping:
  required: {}
  region_counts: {}
  capacity_rows: null
  captures_unreadable: {}
  why: '''atlas'' declares no operand-store capacity we can derive, so no regime is required of the corpus
    -- that is ''we do not know'', never ''nothing is required'''
  regime_extents: {}
  regime_dtype: fp8_e4m3
  reduction_depth:
    capacity_rows: null
    tile_dim: 32
    m_tiles: 1
    n_tiles: 1
    by_regime: {}
    certified: null
    certified_refusal: a single 32x32 output tile already costs 361s against a 300.0s budget on this target,
      so no reduction of any depth is certifiable
  axis_basis: the regimes real captured models put this target's operand store in, derived from the store's
    own geometry (bytes / row width from the compute array and the datapath element type). A corpus whose
    capsules all fit the store many times over cannot detect a memory-mapping failure of any kind, and
    on a hardware-interlocked target nothing else will report it either -- the schedule is correct whatever
    it chooses
