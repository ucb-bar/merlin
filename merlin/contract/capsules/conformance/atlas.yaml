  axis_basis: "the composition shapes the real captures CONTAIN \u2014 not just the shape each capture\
    \ has as a whole. A model classifies as `routing` end to end, yet it contains isolated dispatches,\
    \ adjacent accelerator pairs and host islands, and each of those is a composition the corpus must\
    \ exercise somewhere. Taking only the whole-model label would demand `routing` and nothing else, the\
    \ narrowest reading of the richest evidence"
