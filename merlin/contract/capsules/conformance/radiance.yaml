    via capability_probes. A (family, dtype, alignment) cell cannot express either: it says what arithmetic
    the corpus must contain and nothing about whether the unit was ever asked for a batched region or
    a transposed operand. Both are declared capabilities, so a target that claims them and is never asked
    for one has an untested claim'
  why_shape_corners_are_excluded: 'the corner probes (tile, tile+-1, prime, skinny) and the dtype probes
