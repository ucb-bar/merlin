  captures_unreadable: {}
  axis_basis: the (family, dtype) work real captures CONTAIN that this target's manifest does not admit.
    The cells intersect admitted with observed and keep only what survives; this keeps what does NOT,
    which is precisely the work the compiler has to place on the host. Both sides come from the same two
    sources the cells do, read at the resolution the cells discard -- a region's dtype decides whether
    the hardware may take it, so a family histogram cannot express it
