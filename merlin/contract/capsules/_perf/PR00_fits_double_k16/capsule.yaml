name: PR00_fits_double_k16
kind: model_slice
source_role: derived_sweep
source_reference: 'shared operand-residency ladder: one deep-K contraction per derived
  residency band of the target''s own operand store, three depths spread across each
  band, at fixed single-tile parallel extents (tile=16; K=16, M=16, N=16; K=16 is
  fits_double)'
label: dev
interface_mlir: capsule.interface.mlir
inputs:
- name: W
  role: weight
  shape:
  - 16
  - 16
  dtype: i8
- name: A0
  role: input
  shape:
  - 16
  - 16
  dtype: i8
operation:
  op: matmul
  attributes:
    lhs: A0
    weight: W
    out: Y0
    epilogue: []
    output_dtype: i32
numeric_policy:
  compare: exact_int
  dtype: i32
expected:
  instruction_classes:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
  modes:
    relu: false
    acc_scale: false
    i8: false
required_oracle_tiers:
- L0
- L1
- L2
- L3
vcs: optional
firesim: optional
semantic:
  semantic_family: contraction
  generalization_axis: composition
  must_accelerate: true
  eligible: auto
performance:
  level: L2_intra_layer
  family: PR
  lever: operand_residency
  member_class: OBJECTIVE
  claim: DIFFERENTIAL
  comparand:
    kind: group_arithmetic
    against: the_same_affine_fit_in_a_different_residency_regime
    cancels:
    - operation
    - M
    - N
    - operand_dtype
    - accum_dtype
    - epilogue
    - drained_output_bytes
    demand_equal:
    - operation
    - M
    - N
    - operand_dtype
    - accum_dtype
  falsifier:
    observation: per_regime_fitted_rate_and_intercept
    fires_when: the_rates_fitted_in_different_residency_regimes_agree_within_the_noise_band
    negative_control: two_disjoint_depth_ranges_inside_one_regime
  gate:
    traits:
    - managed_scratchpad
    - structural_pipeline_depth
    instrument: cycle_count
    capacity: at_least_two_reduction_depths_inside_each_reachable_residency_band
    on_missing: skip_with_evidence
  regime:
    separation: K_is_the_only_varied_shape_axis_and_the_bands_come_from_the_derived_operand_store
    layout: deep_k_contraction_at_fixed_parallel_extents_so_every_point_drains_one_output_tile
  emitter:
    status: existing
    entry: merlin.targetgen.corpus_spec.build
    knobs:
      operation: matmul
      varied_axis: K
      axis_derivation: memory_regime_reduction_depth
    resolved:
      source: direct
      operand_dtype: int8
      accum_dtype: i32
      datatype_basis: corpus_binding
      builder: merlin.targetgen.corpus_spec.build
    derived_axes:
      K:
        derive: memory_regime_reduction_depth
        value: 16
        label: fits_double
        derivation:
          capacity_rows: 16384
          tile_dim: 16
          m_tiles: 1
          n_tiles: 1
          by_regime:
            fits_double:
              points:
              - K: 16
                K_tiles: 1
                M: 16
                N: 16
                rows: 32
                capacity_rows: 16384
                fraction_of_capacity: 0.001953
              - K: 2048
                K_tiles: 128
                M: 16
                N: 16
                rows: 4096
                capacity_rows: 16384
                fraction_of_capacity: 0.25
              - K: 4096
                K_tiles: 256
                M: 16
                N: 16
                rows: 8192
                capacity_rows: 16384
                fraction_of_capacity: 0.5
              unreachable: null
              band_tile_multiples:
              - 1
              - 256
            fits_single:
              points:
              - K: 4112
                K_tiles: 257
                M: 16
                N: 16
                rows: 8224
                capacity_rows: 16384
                fraction_of_capacity: 0.501953
              - K: 6144
                K_tiles: 384
                M: 16
                N: 16
                rows: 12288
                capacity_rows: 16384
                fraction_of_capacity: 0.75
              - K: 8192
                K_tiles: 512
                M: 16
                N: 16
                rows: 16384
                capacity_rows: 16384
                fraction_of_capacity: 1.0
              unreachable: null
              band_tile_multiples:
              - 257
              - 512
            fits_on_reuse:
              points: []
              unreachable: 'unreachable from a capsule''s declared inputs: the harness
                materialises every declared input before the program runs, so peak-live
                equals the sum of all tensors and the band that separates them (rows_total
                > capacity >= rows_live) is empty by construction. Reaching it needs
                a program with a DEAD tensor -- an allocator obligation, not an operand-size
                one -- which the capsule input declaration cannot express'
            spills:
              points:
              - K: 8208
                K_tiles: 513
                M: 16
                N: 16
                rows: 16416
                capacity_rows: 16384
                fraction_of_capacity: 1.001953
              - K: 12288
                K_tiles: 768
                M: 16
                N: 16
                rows: 24576
                capacity_rows: 16384
                fraction_of_capacity: 1.5
              - K: 16384
                K_tiles: 1024
                M: 16
                N: 16
                rows: 32768
                capacity_rows: 16384
                fraction_of_capacity: 2.0
              unreachable: null
              band_tile_multiples:
              - 513
              - 1024
          m_extent: 16
          n_extent: 16
  cost:
    tier: 2
    runs: three_depths_per_reachable_residency_band
    projected_cycles: derived_at_preflight
    basis: the spilling members are the most expensive capsules in this corpus and
      are paid on every grade, so the top of the search is a declared multiple of
      the target's OWN capacity rather than an unbounded sweep
  acceptance:
    schema_version: 1
    analyzer: perf_pr_claim.analyze_pr_claim/v1
    fit:
      form: affine_per_residency_band
      method: ordinary_least_squares_over_the_replicate_agreed_cycles_of_one_band
      independent_variable: K
      dependent_metric: verilator_L3_cycles
      comparands: the_fitted_rate_of_one_band_against_the_fitted_rate_of_another
    cohort:
      operation: matmul
      fixed_shape_axes:
      - M
      - N
      fixed_fields:
      - operation
      - operand_dtype
      - accum_dtype
      - epilogue
      axis_derivation: memory_regime_reduction_depth
      minimum_reachable_bands: 2
      points_per_regime: 3
    replicates:
      minimum_count: 2
      identities_authored_by: run
      why: two replicates are the smallest set that MEASURES the dispersion this family's
        noise band is read from; one replicate leaves it UNDETERMINABLE, and assuming
        it zero on a deterministic simulator is the assumption this contract refuses
    evidence:
      correctness_simulator: spike
      correctness_tier: L2
      timing_simulator: verilator
      timing_tier: L3
      spike_cycles_citable: false
      overlap_instrument: target_derived_combination_counters
      overlap_required_per_member: true
    noise_band:
      kind: measured_replicate_dispersion
      declared_constant: null
      predicate: fitted_rates_agree_iff_exactly_equal_when_the_measured_dispersion_is_zero
      why: 'a constant written here would be a knob somebody can turn until the answer
        changes. The band is read off the evidence instead: replicates that are observed
        IDENTICAL make the dispersion zero by measurement, so agreement means exact
        rational equality. A member with one replicate has an UNDETERMINABLE dispersion
        and its band is refused rather than assumed noiseless'
    transient_guard:
      module: merlin.perf.fill_transient.transient_verdict
      applied: per_residency_band
      on_in_fill_transient: refuse_the_band_and_quote_no_rate
      why: the sibling reduction-depth family was refuted because every one of its
        depths lay inside the machine's overlap fill transient. This family's cheapest
        band starts at the same depth, so a band is put through the guard before any
        rate is quoted
  shape_geometry:
    M: 16
    K: 16
    N: 16
    out_elements: 256
    geometry_class: projection_like
    classifier: merlin.dse_guidance.shape_taxonomy.classify_geometry
    basis: the capsule's own declared operand shapes (activation MxK, weight KxN)
    in_census: true
    census_classes:
    - gemv_like
    - odd_tail_heavy
    - projection_like
    - squareish_gemm
    - tall_skinny
    - unknown
    - wide_skinny
    census_mac_fraction: 0.002062
    census_out_elements: 8960
    census_regions: 148
