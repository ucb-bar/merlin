# WHERE WE ARE TRYING TO GET TO, stated as measured hardware facts.
#
# Not documentation: this is the reference an optimization loop is scored against. Without it the
# only in-loop signal is "make this number smaller", which has no destination -- measured, an
# authoring campaign optimizing one collapsed scalar landed on -2 host operations (+0.000% of the
# estimated window) while the program it was optimizing sat two thirds away from a number the same
# compiler family had already reached by hand.
#
# Every `measured` field is a value a named run PRODUCED. Nothing here is a goal someone hoped for,
# and nothing is derived from another entry. `emitted_structure` is what the program that achieved
# the number LOOKED like -- so a candidate can be compared to it statically, without a simulator.
#
# ⚠️ CYCLES ARE NOT COMPARABLE ACROSS DESIGNS. The same capsule reads 510 cycles on one design and
# 317 on another. A candidate may only be compared against a reference whose `design` it was built
# for; comparing across `design` values is a category error, not a conservative approximation.
#
# ⚠️ `design` NO LONGER NAMES A DEVICE ON ITS OWN, and `device` is the key that does. Measured
# 2026-09-19: TWO registered bitstreams elaborate `FireSimGemminiRocketConfig` onto the same U250
# and are different devices (43,881,284 bytes vs 44,668,362, different digests, different Gemmini
# revisions). Every entry below happens to be from the same one, so nothing has collided YET -- and
# the first entry added from the other one would be matched across devices silently by a lookup that
# keys on `design`. So each measured entry states `device`, the artifact name in
# merlin/contract/hardware_pins.yaml, which IS unique per device; `design` stays for readers and is
# no longer sufficient to select on. See merlin/python/merlin/perf/design_identity.py.
#
# ⚠️ CYCLES ARE NOT COMPARABLE ACROSS PROGRAM IDENTITIES EITHER, and this is the refusal that was
# missing. FOUR different programs in this project carry whole-model numbers for the same network,
# three of them on the same device, and a ratio between two of them was quoted for weeks as a
# compiler result. BATCH SIZE is part of the identity for the same reason the rest of it is: one of
# the four runs a batch of four and publishes that divided by four, which no batch-1 program can be
# ranked against and no compiler edit changes.
# `program_identities` below declares them; every measured entry names the one it belongs to; and
# merlin/python/merlin/perf/program_identity.py refuses a cross-identity comparison the way
# `find_reference` refuses a cross-design one. The reason it must REFUSE rather than warn: no
# compiler edit moves a candidate from one identity to another, because the identity is a property
# of the lowering and of the capture it came from, not of the compiler's quality. A gap the loop
# being scored cannot close is not a gap.
version: 1

# ------------------------------------------------------------------------------------------
# PROGRAM IDENTITIES. Which PROGRAM a cycle count is about. Two entries may be compared only when
# they name the same identity here. `facts` is the machine-checkable form: a candidate that states
# enough of them resolves to exactly one identity, or to UNKNOWN -- never to a guess.
#
# These are not qualities of one program. They are different functions over different argument
# lists at different batch sizes, and the first two do not even agree on what arithmetic ResNet-50
# is: VERIFIED 2026-09-19 by reading the IR, not by reading a label.
# ------------------------------------------------------------------------------------------
program_identities:

  static_quantized_recapture_entry:
    description: >-
      The entry point the PT2E static-calibrated recapture produces. Its parameters arrive as
      pointer arguments, its weights arrive ALREADY QUANTIZED (54 i8 tensors), and each quantized
      contraction's activation scale and zero point arrive as their own calibrated constant
      arguments (54 f32 `_scale_N` + 54 i64 `_zero_point_N`). That hoist is what "static input
      quantizer externalized" names: the quantizer's constants are arguments instead of literals,
      which is possible only because a calibration pass produced them.
    verified_from: >-
      out/artifacts/recaptures/resnet50_pt2e_w8a8_universal_dog_direct_20260906/linalg.mlir --
      217 entry arguments (109 f32 + 54 i64 + 54 i8); and the lowered buffer plan in the q535
      bundle's payload/abi_layout.json -- 393 kernel arguments, being 217 const/read plus 176
      mutable/write intermediates.
    facts:
      entry: kernel_abi_pointer_arguments
      parameters: abi_arguments
      quantization_scheme: int8_static_act_int8_weight
      activation_scales: calibrated_constants_as_arguments
      batch: 1
      cycle_scope: measured_window_between_markers

  capsule_interface_lowering:
    description: >-
      What a compiler produces from the shipped capsule interface. NOT a repackaging of the entry
      above: the capsule interface is an f32 program. All 53 of its convolutions are
      `f32 x f32 -> f32` im2col `linalg.matmul`, its weights are f32 with batch-norm statistics
      still separate arguments, and the ONLY int8 site in its 3,463 lines is the final classifier.
      There is therefore no static activation quantizer anywhere in it to externalize, and the
      compiler must synthesize the quantization itself from the `int8_dyn_act_int8_weight` recipe
      the capsule declares -- computing activation scales rather than reading calibrated ones.
    verified_from: >-
      merlin/contract/capsules/model/SY_model_resnet50/capsule.interface.mlir (sha256
      64925632353b438348d200c82f57d7db922d26325f0e1e627b1982fc60669f7c) -- 321 entry arguments
      (268 f32 + 53 i64 `num_batches_tracked`), 53 f32 `linalg.matmul`, one `arith.fptosi` in the
      whole module (line 3417), and `prov.quantization = "int8_dyn_act_int8_weight"`.
    facts:
      entry: kernel_abi_pointer_arguments
      parameters: abi_arguments
      quantization_scheme: int8_dyn_act_int8_weight
      activation_scales: synthesized_by_the_compiler
      batch: 1
      cycle_scope: measured_window_between_markers

  compute_group_standalone_image:
    description: >-
      A self-contained bare-metal image with NO ABI at all: `int main(void)`, every parameter
      `.incbin`'d into `.rodata`, the input image linked in ALREADY QUANTIZED, and one call per
      compute group. Three properties make it a different program rather than a faster one:
      (1) THE INPUT QUANTIZER IS NOT IN IT -- it is the single host group the builder permits, and
      it is executed in numpy at GENERATION time and baked into the image blob, so its cost is in
      no measured number; (2) the published figure is not a window over the run but the SUM of a
      `read_cycles()` bracket around each of the 71 device calls, so anything between them is
      excluded by construction; (3) the final dequantize happens in `main` outside the timed
      window. Its in-program check is argmax plus a cosine against an embedded golden -- which a
      numerically WRONG run passed identically (see the discarded job 730), so its real oracle is
      the out-of-program per-group checksum comparison, not anything the program prints.
      Its purpose is a fair A/B between two sets of kernel bodies, which is exactly why it has no
      argument surface: any argument would be a difference between the arms that is not the
      schedule. It is not, and was never built as, a destination for a compiler that must produce
      a callable program.
    verified_from: >-
      merlin/experiments/gemmini_perf_bench/scripts/group_model_program.py on branch
      feat/rcp-residual-add (the generator; `int main(void)` template, the BLOB/.incbin macro, the
      numpy input quantization at build time, `total += dt` over per-call read_cycles deltas, and
      the `NotClosed` refusal for any host region other than the input quantizer), and its emitted
      out/artifacts/perf-bench/gemmini/group_model_program_20260917/group_model_program.{c,json}.
    facts:
      entry: c_main_no_arguments
      parameters: linked_constant_blobs
      quantization_scheme: int8_static_act_int8_weight
      input_quantizer: executed_at_build_time_not_in_the_program
      batch: 1
      cycle_scope: summed_per_call_cycle_brackets

  vendor_reference_c_program:
    description: >-
      The accelerator vendor's own shipped ResNet-50 C benchmark, rebuilt unmodified against this
      design's params header. Hand-written C against the vendor library, a closed program with its
      parameters as generated headers -- and, decisively, it runs a BATCH OF FOUR and its per-image
      figure is that batch divided by four. Weight traffic is amortized across the four images, so
      the per-image number is structurally lower than a batch-1 program's and its own artifact says
      so: "a batch-1 library number will be higher per image". Every other entry in this file is
      batch 1. That makes `batch` a fact of the identity, not a footnote: no compiler edit changes
      it, and dividing a batch by its size does not produce a number a batch-1 program can be
      ranked against.
    verified_from: >-
      out/artifacts/perf-bench/gemmini/library_resnet50_stock_20260914/README.md -- stock
      `gemmini-rocc-tests/imagenet/resnet50.c` (sha 2142608f, unmodified), batch 4, conv mode, WS,
      two bit-exactness patches; queue job 656, 96,142,906 cycles for the batch, 24,035,727 per
      image, predictions 75/900/641/897 matching Spike.
    facts:
      entry: c_main_no_arguments
      parameters: generated_headers
      quantization_scheme: vendor_reference_int8
      batch: 4
      cycle_scope: whole_program_divided_by_batch

  UNKNOWN:
    description: >-
      Not an identity: the explicit statement that the program behind a number is UNRECORDED. An
      entry naming this can be READ and can never be scored against, which is the point -- three
      states, never two, so "we do not know which program" is not silently the same as "it is ours".
      Carries no `facts`, so nothing can resolve to it by accident.

references:

  resnet50_w8a8_firesim_q535:
    model: resnet50
    precision: w8a8
    design: FireSimGemminiRocketConfig
    program_identity: static_quantized_recapture_entry
    device: firesim_gemmini_rocket_u250
    status: achieved
    how: >-
      Reached by HAND optimization, not by an authoring loop. That is precisely why it is the
      reference: the compiler family can demonstrably emit a program that runs this fast, so the
      gap to it is an optimization gap and not a hardware ceiling.
    capsules:
      - SY_model_resnet50
    # THE CAPSULE NAMES THE MODEL AND IS NOT THE MEASURED PROGRAM. This entry is
    # `static_quantized_recapture_entry`; a compile of `SY_model_resnet50` is
    # `capsule_interface_lowering`, and `program_identity` above is what stops the two being scored
    # against each other. `capsules:` stays because the entry is ABOUT this network -- a reader
    # needs to find it -- but it is not a claim that the capsule can produce this program.
    #
    # CORRECTED 2026-09-19. The flag is real -- `--externalize-static-input-quantizer` on the
    # gemmini-opt OOT driver -- and the quoted message is its own
    # (`ap.error("no unique proven static input quantizer")`). What the earlier wording got wrong
    # is the shape of the blocker: "no unique proven" reads as an ambiguous set of candidates
    # awaiting a proof, and the set is EMPTY. `static_input_prologue` accepts a
    # `quant_ext.quantize_per_tensor` rooted at an ENTRY BLOCK ARGUMENT whose scale and zero point
    # are splat constants, and returns a candidate only when exactly one exists. The capsule
    # interface contains ZERO `quant_ext` ops of any kind: it is an f32 program -- 53 f32 im2col
    # matmuls, batch-norm computed live from `running_mean`/`running_var` arguments, and exactly
    # one `arith.fptosi` in 3,463 lines (the classifier, whose activation scale is computed at RUN
    # TIME as max(|x|)/127). "Proven" here means statically provable from the IR, so there is no
    # witness anyone can supply; only a different capture changes the answer.
    #
    # AND THIS ENTRY NEVER USED THAT FLAG. The lever moves the quantize prologue OUTSIDE the timed
    # window; the bundle's validation/abi_compatibility_proof.json records
    # `compiler_owned_prologue: true` and `harness_has_no_external_quantized_prologue: true`, and
    # the bundle contains no `externalize` string and no `input_prologue` in its command buffer.
    # The old one-word `input_quantizer: externalized` was carrying two different facts.
    #
    # The argument counts were also being read as one difference and are two opposing ones. 393 is
    # not 325 plus a hoisted quantizer: the read side SHRINKS by 104 (batch-norm folded away, f32
    # weights replaced by prepacked i8 plus separate scale/zero-point) while the write side GROWS
    # by 172 (this lowering exposes every live intermediate as a whole-program pointer). The net
    # +68 is an accident of two unrelated changes.
    measured_program:
      # The lowered whole-program buffer plan, `kernel_abi.kind = whole_program` -- 217 const/read
      # plus 176 mutable/write. NOT an interface arity: the recapture's own `func.func @forward`
      # takes 217. Verified against the bundle's payload/abi_layout.json.
      entry_argument_count: 393
      const_read_args: 217
      mutable_write_args: 176
      # "externalized" means the PER-CHANNEL WEIGHT scale/zero-point are their own arguments and
      # the activation scales are calibration constants fixed at capture time. It does NOT mean the
      # harness owns a quantize prologue: the bundle's validation/abi_compatibility_proof.json
      # records `compiler_owned_prologue: true` and
      # `harness_has_no_external_quantized_prologue: true`, and arg216 `image` is the raw f32
      # image. Stated because the old one-word spelling was read the other way.
      input_quantizer: static_calibrated_constants_with_externalized_weight_scales
      differs_from_capsule_lowering: true
      capsule_interface_sha256: 64925632353b438348d200c82f57d7db922d26325f0e1e627b1982fc60669f7c
      capsule_lowering_kernel_abi_args: 325
      # The gap a candidate compiled FROM the capsule shows against `emitted_structure` below, and
      # why it is not an optimization gap: that lowering emits ONE mesh region (RES_PACK 1,
      # MATMUL_RESIDENT 1, COMMIT 1 -- the classifier) against this entry's 54, because the other
      # 53 contractions are f32 in the capsule and the mesh is int8. Closing it needs a capture
      # with calibrated quantization, not a better schedule.
      capsule_lowering_mesh_regions: 1
    provenance:
      firesim_queue_job: 535
      bundle: >-
        out/artifacts/perf-bench/gemmini/resnet50_merlin_phase2_affine_im2col_spans_w8a8_warm_measured_firesim_candidate_20260908
      # UNSOURCED, flagged 2026-09-19: this prefix matches no MLIR in the bundle
      # (model2mlir_direct.mlir is d92b9ecc, compiler/target.mlir is c18b8671,
      # provenance/q534_target.mlir is 82c53f21) and nothing under out/artifacts/ carries it. Kept
      # verbatim rather than deleted so whoever recorded it can say what it digests; do not cite it.
      input_mlir_sha256_prefix: "76c2617109666165"
      input_mlir_sha256_prefix_status: UNSOURCED
    measured:
      whole_model_cycles: 1316619699
      host_share_lower_bound: 0.93
      cycles_per_host_operation_anchor: 2.601
    emitted_structure:
      commands: 109
      opcodes:
        RES_PACK: 54
        CONV2D: 53
        MATMUL_RESIDENT: 1
        COMMIT: 1
      mesh_regions: 54
      host_lane_regions: 119
      weight_prepack_recipes: 54
      kernel_abi_args: 393
    caveats:
      - >-
        `cycles_per_host_operation_anchor` is a whole-window average, so it prices every host
        operation family identically. It does not, and a revision that trades integer operations
        for floating-point ones can reduce the operation count while increasing cycles.

  resnet50_w8a8_firesim_q545:
    model: resnet50
    precision: w8a8
    design: FireSimGemminiRocketConfig
    program_identity: static_quantized_recapture_entry
    device: firesim_gemmini_rocket_u250
    status: achieved
    how: >-
