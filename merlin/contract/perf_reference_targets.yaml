      Paper Table 4 (16x16 PE array, 96 KB SRAM): 17.00M cycles at 96.2% MAC utilization. Table 6
      repeats the same design point as 17.00 ms at 1 GHz, INT8, 256 MACs, against Gemmini's 43.58 ms
      taken from prior work. Catapult HLS -> VCS RTL simulation; not measured by this project.
    provenance:
      source: arXiv 2509.15205v1, Tables 4 and 6
    measured:
      whole_model_cycles: 17000000
      mac_utilization: 0.962
      peak_macs_per_cycle: 256
    caveats:
      - >-
        HOW THE NUMBER IS PRODUCED MATTERS MORE THAN THE NUMBER. The public regression flow at the
        pinned accelerator commit (run_regression.py) simulates each layer separately, and only
        min(L2 tiles, MAX_TILES) tiles of it -- MAX_TILES defaults to 1 -- then scales runtime and
        ideal cycles by full_tiles * layer_count / simulated_tiles. The paper does not say which
        MAX_TILES produced Table 4. A whole-model figure from that flow is a per-layer,
        tile-extrapolated sum, never one timed invocation; do not rank it against a FireSim rdcycle
        delta, and reproduce it with MAX_TILES = all tiles before citing a head-to-head.
      - >-
        Table 4 states neither datatype nor DRAM bandwidth. INT8 is inferred from Table 6 carrying
        the same 17.00 figure; the accelerator's codegen.mk defines INT8 as per-tensor symmetric int8
        activations and weights with int24 bias. 17.00M is rounded to four significant figures.

