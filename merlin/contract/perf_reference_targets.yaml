  resnet50_int8_vendor_reference_job656:
    model: resnet50
    precision: w8a8
    design: FireSimGemminiRocketConfig
    program_identity: vendor_reference_c_program
    device: firesim_gemmini_rocket_u250
    status: achieved
    how: >-
      The accelerator vendor's own shipped ResNet-50 benchmark, rebuilt unmodified against the
      pinned design's params header with two bit-exactness patches. Not our compiler and not our
      program: it is what the hardware's own library achieves on the hardware, which is why it is
      worth recording, and it is a different program identity from everything else here.
    provenance:
      firesim_queue_job: 656
      bundle: out/artifacts/perf-bench/gemmini/library_resnet50_stock_20260914
      uartlog_sha256_prefix: "00bdefce352e7b06"
      source_sha256_prefix: "2142608f26457e4f"
      gate: predictions 75 / 900 / 641 / 897, equal to Spike; driver PASS
    measured:
      # ⚠️ DERIVED, not measured: the run measured 96,142,906 cycles for a BATCH OF FOUR. This is
      # that number divided by 4, which is the form every citation of it uses. It is recorded with
      # both halves visible because the division is the thing readers lose.
      whole_model_cycles: 24035727
      measured_batch_cycles: 96142906
      batch: 4
    caveats:
      - >-
        BATCH 4, AMORTIZED. Its own artifact states the consequence: "It is batch 4, so weight
        traffic is amortized over 4 images; a batch-1 library number will be higher per image."
        Every other entry in this file is batch 1. Dividing a batch by its size does not produce a
        number a batch-1 program can be ranked against, which is why `batch` is a fact of the
        program identity and not a footnote.
      - >-
        THIS IS THE DENOMINATOR OF THE "70x" -- 1,704,064,223 / 24,035,727 = 70.9, and its own
        artifact states the ratio directly ("Against ours (job 655 ... 1,709,045,472 cycles at
        batch 1): 71.1x this per-image figure"). Same device, so that axis is fine. Two axes are
        not: the numerator is batch 1 against a batch-4-amortized denominator, and the two are
        different program identities. The ratio measures the distance between a compiler's output
        and a hand-written vendor benchmark at a different batch size. It is a real and interesting
        distance; it is not a compiler speedup factor and must not be cited as one.
      - >-
        A SEPARATE MISATTRIBUTION TO STOP REPEATING: this number is also used as exit criterion S4
        for the compute-group route, whose every job (706, 726-731) ran on
        firesim_gemmini_rocket_u250_30mhz (0af6f26e) while this ran on firesim_gemmini_rocket_u250
        (a9a190b9). `hardware_pins.yaml` states the rule for exactly this pair -- "a cycle number
        from one is never a divisor for a cycle number from the other" -- and the S4 comparison
        crosses it. So that use is wrong on device AND on batch AND on program identity.

