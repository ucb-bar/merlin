    caveats:
      - >-
        NOT COMPARABLE WITH THE ENTRIES ABOVE, on two independent grounds, which is the entire
        reason this entry exists. (1) DEVICE: it ran on the 30 MHz U250 bitstream (digest
        0af6f26e), the entries above on 44,668,362-byte a9a190b9. (2) PROGRAM IDENTITY: its number
        is the sum of 71 per-call `rdcycle` brackets over a closed `int main(void)` whose weights
        and PRE-QUANTIZED image are linked-in blobs, while theirs is a window over a callable
        program that quantizes its own f32 input. The deployable route's measured window contains a
        7,387,159-instruction input-quantization prologue that this program does not have at all.
      - >-
        The sibling numbers on this route, for a reader who meets them elsewhere: job 706 =
        28,084,005 (same harness, vendor kernel bodies -- the one true A/B control), 726 =
        25,476,739, 727 = 25,419,657, 729 = 24,483,567 (refuted), 730 = 23,787,829 (DISCARDED, see
        out/artifacts/probes/DISCARDED_firesim_job_730/DO_NOT_CITE.json), 731 = 24,319,110
