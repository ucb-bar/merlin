      firesim_queue_job: 728
      row: >-
        out/artifacts/measurements/firesim_alveo_u250_firesim_gemmini_rocket_30mhz/resnet50/group-model-program_v1_20260919T033641Z_5194e6c/checkpoint_row.json
      elf: out/artifacts/perf-bench/gemmini/rcp_ours_strided_20260919T024325Z/group_model_program.elf
      gate: >-
        71 of 71 per-group checksums equal to the numpy emulation of the same integer program;
        argmax 21=21; cosine 997,981 ppm. The out-of-program checksum comparison is the real
        oracle -- the in-program argmax printed IDENTICALLY on the numerically wrong job 730.
      sealed: false
      sealed_reason: >-
        `status: observed`, never sealed: this queue revision records no `stage_from_sha256` and
        keeps no per-job copy of the staged executable, so the bytes cannot be bound to the result
        by content. True of every job in the 699-731 range.
    measured:
