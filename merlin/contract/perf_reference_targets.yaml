  resnet50_w8a8_firesim_job654_afehg_all_resident:
    model: resnet50
    precision: w8a8
    design: FireSimGemminiRocketConfig
    program_identity: static_quantized_recapture_entry
    device: firesim_gemmini_rocket_u250
    status: achieved
    how: >-
      The above host levers plus a device-side requantization epilogue (per-channel scale and
      activation applied on the accumulator store path), with every descriptor emitting a null C
      DRAM address so the accumulator base never rotates, and the compiler issuing its own MVOUTs.
      Reached by directed agent iteration, not by the authoring loop.
    measured:
      whole_model_cycles: 923047330
      instret: 346257604
      reservation_station_active_cycles: 54093216
      rdma_bytes_rec: 984371200
    provenance:
      firesim_queue_job: 654
      hw_config: resnet50_merlin_warm_measured_full_gemmini_u250_pinned
      elf_sha256: 517353aec32b0aa5c0fabf9d5ae9a698517f868f6705a5c42b4dec379ded0b8c
      gate: >-
        chain-D exact (vs_chain_d bad=0, n_bitdiff 0, cos 1.0, top1=258); the FPGA checksum
        509d616461f69473 EQUALS Spike's, so the simulator/silicon divergence is closed on this
        program, not merely bounded.
    caveats:
      - >-
        NOT bit-exact against the PT2E integer golden. That is impossible in principle once the
        epilogue is on the device -- 32 to 2004 channels per fused site have a flipping
        accumulator -- so the declared reference is chain D from the epilogue simulator at exactly
        the fused sites.
      - >-
        Its predecessor at 916,608,833 cycles PASSED Spike and FAILED on the FPGA (bad=1000,
        top1=107) because the RTL rotates the LOOP_WS accumulator base by max_acc_addr /
        concurrent_loops after every loop with c_dram_addr != 0, while Spike pins it at row 0. A
        Spike gate is NOT sufficient for anything touching the store path.
      - >-
        The rotation is proven SUFFICIENT for that failure, not unique. A separate single-element
        divergence at conv_71 channel 222 is not explained by it. Correctness now leans on the
        ROB's accumulator WAR handling with both loop slots at base 0, unproven for geometries
        this model does not exercise.
