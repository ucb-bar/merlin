  # ------------------------------------------------------------------------------------------
  # EXTERNAL CLAIMS. Numbers we did not measure. Never a `status: achieved` reference -- the
  # lookups only select achieved entries -- but recorded so the distance to them is visible
  # to a reader and can be shown beside our own measurements. Cite the source; do not round
  # up a report into a fact.
  # ------------------------------------------------------------------------------------------
  autocomp_resnet50_external_claim:
    model: resnet50
    precision: w8a8
    design: FireSimGemminiRocketConfig
    program_identity: UNKNOWN
    device: UNKNOWN
    status: external_claim
    how: >-
      Reported by the project lead on 2026-09-09 as "about 30,000,000 cycles" for AutoComp on
      this Gemmini configuration. Not measured by this project; the exact design, input, and
      warm/cold protocol are unverified. Kept as the bar to beat, labelled as a claim.
    provenance:
      source: verbal report, 2026-09-09
    measured:
      whole_model_cycles: 30000000
    context:
      arithmetic_roofline_cycles: 15976562
      note: >-
        4.09e9 MACs / 256 MACs per cycle. The claim is 1.9x the roofline, i.e. ~53% of peak --
        an ordinary well-scheduled result, not an exotic one. Our best achieved is 1.2% of peak.


  tiny_llama_exo_external_claim:
    model: tiny_llama
    precision: w8a8
    design: UNRECORDED
    program_identity: UNKNOWN
    device: UNKNOWN
    status: external_claim
    how: >-
      Reported to this project verbally as an Exo result of about 3,000,000,000 cycles for
      tiny_llama. It is recorded here so the target is written down and attributable, NOT because
      it has been verified: no tiny_llama measurement exists in the kernel corpus on this host
      (that corpus covers ResNet-50 only -- resnet50_autocomp.c, gemmini_exo_shims.h -- where Exo
      measured 30,121,447), and no artifact on this host carries a tiny_llama cycle count.
    caveats:
      - >-
        UNVERIFIED and the DESIGN IS UNRECORDED. Cycles are not comparable across designs, so
        until the design and the program are known this number cannot be scored against. Ask for
        the source before citing it anywhere that matters.
      - >-
        It is not a hardware-limited figure. This network's arithmetic roofline on a 256 MAC/cycle
        array is 32,325,632 cycles and its DMA floor -- streaming 1,034,420,224 int8 weight bytes
        once at 16 B/cycle -- is 64,651,264. So 3e9 is about 46x the binding hardware floor, which
        means it is dominated by host or serial work rather than by the accelerator, for whoever
        measured it as well as for us.
    ours:
      host_dynamic_operations: 15710533301
      host_regions: 5558
      measured_cycles: null
      gate: margin_qualified on the RANKING + asserted values, PASSING
      note: >-
        The gate is no longer the blocker. The one that produced `measured_cycles: null` on FireSim
        job 611 asserted an elementwise tolerance this reference cannot support; it now adjudicates
        the RANKING against the reference's resolving power and asserts the VALUES separately, and
        it PASSES (verified on Spike: 7 rows agree, 0 disagree, 1 row the reference cannot
        discriminate; 47,854 of 256,000 elements outside tolerance against a declared bound of
        51,215; digest reproduced; rc=0, METRIC published). What is still missing is the FPGA run.
        At resnet50's measured 0.556 cycles per host operation, 15,710,533,301 host operations
        would be about 8.7e9 cycles, so reaching 3e9 needs a 2.91x host reduction -- less than the
        3.86x already demonstrated on resnet50 by the same lever family, IF those levers transfer
        to this shape.
      what_the_tie_explains_and_what_it_does_not: >-
        ⚠️ The single round-half-even tie explains the RANKING failure and NOT the value spread.
        Do not describe it as explaining both. Forcing that one activation code -- in BOTH
        quantizers that consume the tensor, since mlp.gate_proj and mlp.up_proj share it and its
        scale -- recovers all 8 token rows' top-1 exactly and makes layer 2 exact again
        (relL2 3.1261e-03 -> 7.2985e-07). It does NOT clear the values: 44,493 of 256,000 logits
        still exceed atol=0.03125/rtol=0.02 and the whole-output relative L2 is still 3.52e-2,
        spread over every row including the six that element cannot causally reach. The value
        spread is a population of the same phenomenon -- 485 of 2,809,856 quantized activations lie
        within 1e-4 of a tie, 6 exactly on one -- and no single element accounts for it. This
        distinction is load-bearing: a gate built as though the tie explained both PASSED a wrong
        program (a 1% miscompile of every RMSNorm kept all eight argmaxes while moving 128,041 of
        256,000 elements outside tolerance), which is why the values are now asserted separately
        against a declared bound and the output digest.
      measurement_outstanding: >-
        FireSim jobs 639-645 (2026-09-10) could not RUN the gated ELF, and the cause is now NAMED
        rather than guessed. 639/640 died on entries the queue's chipyard view does not mirror
        (`logs/`, `generated-topology-diagrams/`) and 641 on a staging collision -- all repaired.
        642 and 643 then hung at FireSim's FIRST localhost SSH command of infrasetup
        (`[localhost] run: uname -a`, which never returns) until the queue's hard 900 s cap killed
        them, on a busy host (load 85) and again on a quiet one (load 48), so it is not contention.
        ROOT CAUSE: the queue's cross-user path runs FireSim AS THE DAEMON USER but with the
        SUBMITTER'S $HOME, and FireSim's manager did not set `env.use_ssh_config`, so fabric never
        read ~/.ssh/config and fell through to a password prompt that cannot be answered in
        parallel mode. With `env.use_ssh_config = True` added to this view's manager, 644 said so
        outright -- `Unable to load SSH config file '/home/agustin/.ssh/config'` -- and that file
        does carry the `Host localhost / IdentityFile ~/.ssh/firesim` block but sits under a 0700
        `~/.ssh` the daemon user cannot read. With $HOME also unset, 645 reached a clean 2-second
        `Authentication failed / Needed to prompt for a connection or sudo password (host:
        localhost)` instead of a 900 s hang. The remaining fix is the queue's: run the job as the
        submitter, or pass the daemon's own HOME/agent. Loosening permissions on private SSH
        material would also "fix" it and was deliberately not done. Matches the shape recorded
        under `firesim-localhost-ssh-fix`. The ELF, its sha256, the declared gate and the passing
        Spike console are in
        out/artifacts/perf-bench/gemmini/tiny_llama_l22_margin_qualified_20260910T065535Z_0c339e1/.
        NO Spike number is substituted here: Spike's `METRIC cycles` is instret + 4, a
        retired-instruction count, and is not a cycle count.
      compile_blocker: >-
        THE CAMPAIGN'S CANDIDATE LINEAGE declines tiny_llama outright: the vocab projection at
        [1, 8, 32000] needs about 3,216,234,988 straight-line element evaluations against a 400,000
        budget. That is the lm_head -- an 8x2048x32000 matmul, 524,288,000 MACs -- being emitted as
        host straight-line code instead of placed on the array.
      compile_blocker_is_lineage_specific: >-
        MEASURED 2026-09-10, and it changes the conclusion: the decline is a property of the
        STRAIGHT-LINE host emitter (`HostLinalg`, HOST_LINALG_ELEMENT_BUDGET = 400,000), not of
        tiny_llama. The sibling LOOP host emitter (`LoopHostLinalg`) compiles the whole model and
        places ALL 155 linears on the array -- the emitted command buffer holds 155
        MATMUL_RESIDENT/RES_PACK/COMMIT triples and the last MATMUL_RESIDENT is
        [8,2048] x [2048,32000] -> [8,32000], i.e. the lm_head IS on the array. So tiny_llama can
        be a phase-2 objective; what must change first is which host emitter the campaign's
        candidate uses.

  # Voyager (arXiv 2509.15205v1, DAC 2026) -- paper numbers on VOYAGER-GENERATED hardware. Every
  # design string below differs from FireSimGemminiRocketConfig, so none of these can ever score a
  # Gemmini candidate; they are the written targets for the home-turf comparison, where merlin and
  # the Voyager compiler are measured on the same generated RTL. Pins: voyager_compiler,
  # voyager_accelerator (merlin/contract/hardware_pins.yaml).
  voyager_paper_resnet50_ic16_oc16_external_claim:
