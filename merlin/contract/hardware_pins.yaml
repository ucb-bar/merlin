  gemmini_rocket_lean_u250_firesim_bitstream:
    description: >-
      The FireSim bitstream every whole-model arm was measured on during 2026-09-24, and the machine
      NO ENTRY IN THIS FILE DESCRIBED WHILE THOSE MEASUREMENTS WERE TAKEN. hwdb
      `alveo_u250_firesim_gemmini_rocket_singlecore_no_nic` selects it; it elaborates
