  gemmini_verilator_memperturb_v2_simulator:
    description: >-
      The reference simulator above, relinked with its SimDRAM harness rebuilt through the seeded,
      response-reordering memory model (merlin/contract/external/sim_memory/). It is the engine the
      opt-in memory-order tier (merlin.targetgen.load_order) re-runs a certified program on: the stock
      testchipip mm_magic_t answers every read in acceptance order, so a program whose answer depends on
      two independent requests completing in issue order passes every cheap tier and fails on a board.
      Latency may be per response or a property of the ADDRESS region, and the knobs may be given as
      MERLIN_MEM_PERTURB_* environment variables, so the engine runs with the command line its backend
      uses. Without a seed it builds the stock in-order model. A distinct role on purpose: a lookup for
