    # refuse the curated 3758ae96 (merlin.perf.whole_model_build.machine_header) instead of accepting
    # whatever a caller passes. It is an assertion about one macro, not a header generated from the
    # parameter set; the gap below stays open until one is. Also: no arm -- the vendor library's
    # included -- classifies correctly on this board (argmax 0 against 21 in every run), so this machine
    # can screen timing and per-group behaviour but cannot adjudicate correctness on its own.
    abi_header_sha256: "5bfbb7263e3db079ead66f1c8b1a7224d9764dd4025e8c91d4f9c65204990ec0"
    notes: >-
      Digest measured 2026-09-24 with sha256sum over the 114,633,982-byte tar.
      THE SOFTWARE ABI WAS UNKNOWN AND THE CURATED HEADER IS NOT IT (see abi_header_sha256 above for
      the header now asserted). Every ELF run on this bitstream on
      2026-09-24 was compiled against the curated harness header 3758ae96, which carries
      `#define ACC_READ_FULL_WIDTH`. This design does not have that readout. The consequence is already
      written down in this file for the sibling `gemmini_universal_rtl`, whose own ABI gap records that
      compiling with that macro against an `acc_read_full_width = false` device would "emit a full-width
      accumulator mvout the hardware cannot service" and that "the mvout DMA on this device physically
      cannot move an int32 accumulator row". MEASURED here, on three independently built arms and on a
      fourth built by another session from a tree without this session's commits: the ONLY group whose
      output leaves as an int32 accumulator row -- the final classifier -- reads back zero in every one
      of them, and the model's argmax is 0 against a golden of 21. Recorded as UNKNOWN rather than
      asserting the lean variant of the header, because no such header has been generated from this
      parameter set and shape agreement is not provenance.
    gaps:
      - >-
        No gemmini_params.h has been GENERATED for this parameter set; the declared abi_header_sha256 is
        the curated header minus one macro, asserted by hand. Generate one from
        `GemminiConfigs.leanConfig` and replace the assertion with its digest.
      - >-
        No `built_from`: the elaboration sources were not recovered from the tar, so the RTL revision is
        asserted by configuration name only, exactly as for the sibling bitstream entry.
      - >-
        THE CAPSULE COHORT AND THE WHOLE-MODEL ARMS ARE GRADED ON DIFFERENT MACHINES. Capsule L3 runs on
        `GemminiGsimSerialClkConfig` (full-width readout, curated header correct for it); the whole-model
        arms ran here (narrow readout, curated header wrong for it). A capsule result and a model result
        are not comparable without saying so, and no capsule can exercise the accumulator-readout path
        this device lacks.


# ------------------------------------------------------------------------------------------------------
# BYTES A BODY OF RESULTS IS ATTRIBUTED TO, WHICH NO LONGER EXIST AND CANNOT BE REPRODUCED.
#
# Read by `merlin.common.provenance_lost` (`load_lost`, `lost_for_digest`). A digest recorded here is
# CLAIMED: no pin's `local_edits` or `build_products` and no `artifacts:` entry may declare it, and the
# loaders refuse the registry if one does. Of the three things one can do with bytes gone missing under
# a corpus of results, two are worse than the loss: repointing the declaration at whatever is on disk
# now (every citation stays, silently wrong) and deleting the declaration (every citation dangles). The
# third is to record the loss -- what, when, why it cannot be rebuilt, and what still verifies.
# ------------------------------------------------------------------------------------------------------
lost_artifacts:
  gsim_emitter_246bfdac:
    state: UNRECOVERABLE
    digest: "246bfdac0a99bd88dfd860e0543cada0af048f8f699315209d6b50b48fe87446"
    bytes_declared: 13275688
    path: build/gsim/gsim
    root_env: MERLIN_EXT_GSIM
    what: >-
      The FIRRTL-to-C++ simulator compiler built from the `gsim_compiler` pin -- the GSIM EMITTER that
      produced the RTL-derived C++ models the elaborated-RTL runs used. The same RTL through a different
      emitter is a different simulator, and an emitted model carries no revision of its own.
    lost_on: "2026-09-08T10:40Z"
    discovered_on: "2026-09-23"
    cause: >-
      Rebuilt IN PLACE at that path by another workstream sharing the checkout; nothing was deleted on
      purpose. The successor binary's mtime (2026-09-08 03:40 PDT) dates the overwrite. The path now
      holds 6da1580d (13,281,968 bytes). Files citing the successor sit under another target's engine
      tree, files citing the lost digest under this one's: two workstreams, one output path.
    superseded_by: "6da1580d3a54ed050bd4126d23a852e41ba64d5d1b963979829aca4839cd4aa9"
    why_unrecoverable: >-
      The build is deterministic except for two values that were never recorded and are baked into the
      binary. At the pinned commit 65a1f89a the Makefile sets `GSIM_BUILD_DATE ?= $(shell date -u ...)`
      (line 149) and compiles it in (line 151), so the wall-clock second of the build is inside the ELF;
      and `-ggdb` (line 146) embeds the absolute build directory. Two rebuilds with both held fixed came
      out byte-identical, so those two values are the whole of the non-determinism, and neither original
      is known. A rebuild at the pinned commit is therefore a SIBLING of 246bfdac, not 246bfdac (the
      2026-09-23 audit measured adc2383d for one). Three digests are in play and are NOT alternative
      accounts of one binary: 246bfdac is the lost emitter the corpus cites, 6da1580d occupies the path
      now, adc2383d is what a fresh rebuild yields. No copy exists: every local filesystem and the home
      directory were swept by size window and none holds a file of the declared length and digest.
    cited_by: >-
      Counted 2026-09-23 by sweeping the generated-output root: 244 JSON artifacts (246 files counting
      one REPORT.md and one rows.jsonl, neither asserting a pin), dated 2026-09-06 to 2026-09-24 -- 205
      sharded layer_cache entries, 26 perf-bench receipts and context files, 8 layer/shape/schedule
      tables, 5 probe tables, 2 refused certificates, 1 autocomp table, 1 external kernel table, and the
      one build receipt (out/build/rtl_engines/<target>/gsim/build_receipt.json) the rest copy. The
      digest appears under five key paths -- `engine.receipt.tools.gsim_emitter`,
      `engine_provenance.receipt.tools.gsim_emitter`, `rows.N.engine.receipt.tools.gsim_emitter`,
      `tools.gsim_emitter.sha256` and `engine_binding.receipt_identity.tools.gsim_emitter` -- so a sweep
      keyed on one spelling finds a fraction. None re-hashes at load, so none fails.
    still_verifies:
      - >-
        The SOURCES the emitter was built from: eight of the nine `gsim_compiler` local_edits are
        byte-identical to the pin today (re-checked 2026-10-06). The ninth, src/cppEmitter.cpp, is not:
        the checkout is at 319a099d, past the pinned 65a1f89a, with that file at 26e0caea against the
        declared 3df277f4. `verify('gsim_compiler')` reports both.
      - >-
        The GENERATED MODEL the emitter produced (17 files, sealed manifest f822a628), intact and pinned:
        the strongest surviving witness to what the emitter did.
      - >-
        The compiled EMULATOR the capsule path runs, artifact `gemmini_gsim_emulator`, present and
        matching its declared digest.
    do_not:
      - >-
        Do NOT repoint any receipt's `tools.gsim_emitter` at the successor digest: the citations would
        keep asserting 246bfdac while different bytes claimed to be what they cite.
      - >-
        Do NOT substitute a rebuild. adc2383d comes from the same source at the same commit and is NOT
        these bytes; presenting it as them would make every citation false undetectably.
      - Do NOT delete this record when the last citing artifact is archived; the archive still cites it.
    attestation_decision: >-
      Decided 2026-09-23, in two tenses. GOING FORWARD the emitter is witnessed by its ELF, now checked
      by content (`build_products` on the `gsim_compiler` pin); the proposal to let the generated-model
      manifest stand in for it is rejected, because an output witness attests that a model is intact,
      not which emitter produced it. RETROSPECTIVELY, for the corpus that cited the lost bytes, the
      sealed manifest f822a628 is the only witness left and is accepted as such, and it is WEAKER: a
      result from that corpus may be cited as "produced from model f822a628", never as "produced by
      emitter 246bfdac verified". A claim that turns on the emitter's own revision must be re-run, not
      re-attributed.
