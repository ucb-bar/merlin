  voyager_accelerator:
    description: >-
      The Voyager accelerator generator (SystemC/Matchlib template -> Catapult HLS -> Verilog) and
      its codegen/regression flow. This is the hardware the Voyager compiler is co-designed for, so
      it is the substrate of the home-turf comparison: its generated RTL is what both compilers are
