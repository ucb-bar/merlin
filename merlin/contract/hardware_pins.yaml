    # this device, and two gemmini U250 bitstreams share one configuration name.
    hw_configs:
      - alveo_u250_firesim_gemmini_rocket_singlecore_no_nic
    # THE ABI HEADER, DECLARED AND SHA-ASSERTED -- not generated. 5bfbb726 is the curated header with
    # `#define ACC_READ_FULL_WIDTH` removed, because `GemminiConfigs.leanConfig` sets
    # `acc_read_full_width = false` (Configs.scala:244). It is the header every lean arm measured from
