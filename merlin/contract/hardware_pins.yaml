  gemmini_rtl:
    description: >-
      The Gemmini generator revision a systolic result is measured against. The mesh dimension the
      compiler tiles to, the scratchpad/accumulator capacities it must respect, and the RoCC funct
      encodings the emitter packs are all read out of this tree, so a different revision can change a
      verdict without changing anything in merlin. Pinned separately from the chipyard root because it
      is a submodule with its own revision: the outer tree can move while this one does not, and vice
      versa, so recording only one of the two leaves the result ambiguous.
    repo_canonical: https://github.com/ucb-bar/gemmini.git
    commit: "6ad65b90b1eb270c20ce4f04109e3dde0180b36f"
    targets: [gemmini]
    branch: HEAD
    root_env: MERLIN_CHIPYARD
    path: generators/gemmini
    requires_paths:
      - src/main/scala/gemmini/Configs.scala
      - src/main/scala/gemmini/GemminiISA.scala
      - src/main/scala/gemmini/Mesh.scala
      # Selected FIRRTL includes the upstream load-stride assertion.
      - src/main/scala/gemmini/LoadController.scala
      # THE NORMALIZATION EXCLUSION rests on these two. The contract (examples/gemmini/target/contracts/
      # target_contract.yaml) leaves `normalization` and `softmax` undeclared because AccumulatorScale's
      # LAYERNORM / IGELU / SOFTMAX arms are gated on `has_normalizations`, which GemminiConfigs defaults
      # to false and `defaultConfig` never sets. A family declared nowhere has no contract line for
      # check_capability_backing.py to attach a citation to, so until these were read here an edit to
      # either file could move that verdict while the pin stayed clean. Both are byte-identical to the
      # pinned revision (checked 2026-10-06).
      - src/main/scala/gemmini/AccumulatorScale.scala
      - src/main/scala/gemmini/GemminiConfigs.scala
    # CONTENT, not `git status`. Turned on for the same reason the sibling pin below turns it on: the
    # dirty heuristic answers "differs from HEAD", and it cannot distinguish a reviewed edit whose
    # bytes are declared here from an unreviewed one. With this on, each read path gets a per-file
    # PINNED / OFF_PIN / UNDETERMINABLE verdict that `check_provenance.py` surfaces by name.
    content_check: true
    # The ISA HEADERS this generator ships are a SEPARATE nested repository with its own revision, and
    # every dtype claim about this target is read out of them. This pin cannot describe them (see the
    # sibling below), so it declares that verifying it INCLUDES verifying them: a caller that verified
    # only this pin and then reported an int8 dtype as "pinned" is the failure the sibling documents,
    # and `covers` is what makes that impossible rather than merely discouraged.
    covers:
      - gemmini_isa_headers
    used_by:
      - RoCC encoding + mesh/capacity fact extraction (targetgen/rtl/introspect.py)
      - run records for the systolic capsule suites (targetgen.provenance.toolchain_shas)
    notes: >-
      Detached HEAD is normal here — a submodule is checked out at the sha its superproject records,
      not on a branch, so `branch` is informational and the sha is the fact. Shares a checkout root
      with radiance_muon_rtl (the same chipyard tree), which is why both are verified by CONTENT.

      EXPECT THIS PIN TO REPORT DRIFT VIA `[gemmini_isa_headers]` ON A DEVELOPMENT CHECKOUT, and read it
      as the coverage working rather than as a fault in this pin. What is off-pin there is the nested
      header repository, and the whole point of `covers` is that that no longer hides behind this pin's
      clean verdict.

      The selected source bundle uses the clean 6ad65b90 generator, including the live
      LoadController stride assertion. Historical assertion-edited builds are separate artifacts.

  gemmini_isa_headers:
    description: >-
      The systolic target's own ISA HEADERS — the software interface `targetgen.capability_discovery`
      parses, and the sole source of every dtype claim about this target (elem_t / acc_t / full_t /
      scale_t typedefs, the activation-mode enumeration, the feature #defines). They ship in a
      repository NESTED inside the generator (`software/gemmini-rocc-tests`, a submodule), which has its
      own revision, so the generator's pin cannot describe them.

      WHY THIS IS A SIBLING PIN AND NOT MORE PATHS ON `gemmini_rtl`. A pin has exactly ONE `commit`, and
      these headers do not belong to the generator's revision — they belong to 7c540b3a, the gitlink the
      generator records, while the generator itself is 8c3f9923. Adding the header paths to
      `gemmini_rtl.requires_paths` would make the presence check fire but would leave nowhere to write
      down WHICH revision the headers are from, i.e. it would fix the symptom by collapsing two
      revisions into one field — the exact ambiguity `gemmini_rtl`'s own description argues against
      ("the outer tree can move while this one does not ... recording only one of the two leaves the
      result ambiguous"). `atlas_fp_units` is pinned apart from `atlas_npu` for the same reason.

      MEASURED FAILURE THIS PIN EXISTS FOR. `verify("gemmini_rtl")` returned ok=true while every int8
      dtype claim came from a header that is not the pinned revision's. Three separate reasons it stayed
      invisible, all now checked:
        1. The headers were in no pin's `requires_paths` at all, so nothing looked at them.
        2. The containing repo reported the whole nested tree as ONE dirty entry
           `software/gemmini-rocc-tests` (a gitlink, spelled WITHOUT a trailing slash). The read-set
           intersection matched only equality or a trailing-slash directory prefix, so it matched
           nothing and `verify` concluded "8 uncommitted change(s), none of them a source this reads".
        3. `git status` was the wrong question. Measured content, on this host:
             include/gemmini.h        clean vs HEAD, bytes 007826db = e6df8b9f  -> OFF-PIN, silently
             include/gemmini_params.h  MODIFIED vs HEAD, bytes 3758ae96 = 7c540b3a -> PINNED by content
           The dirty check gets both cases exactly backwards. Hence `content_check`, which compares each
           read path's bytes against that path at 7c540b3a out of the object store.
    repo_canonical: https://github.com/ucb-bar/gemmini-rocc-tests.git
    commit: "7c540b3adf1b86ad93d07f893abe3a73489b568e"
    targets: [gemmini]
    branch: null                      # a submodule sits at a sha, not on a branch; the gitlink is the fact
    root_env: MERLIN_CHIPYARD
    path: generators/gemmini/software/gemmini-rocc-tests
    # The container and the gitlink inside it. `verify` reads the sha `gemmini_rtl`'s repository records
    # here and compares it to BOTH this pin's declared commit and this checkout's actual HEAD — three
    # revisions that can disagree, and on this host do:
    #   pin declares / gemmini records : 7c540b3a  (int8: elem_t int8_t, acc_t int32_t)
    #   this checkout's HEAD           : e6df8b9f  ("128x128 fp6 sw" — elem_t uint8_t,
    #                                               ELEM_T_IS_LOWPREC_FLOAT, EXP_BITS 3, acc_t uint64_t)
    nested_in: gemmini_rtl
    nested_path: software/gemmini-rocc-tests
    content_check: true               # implied by nested_in; stated because it is the load-bearing check
    requires_paths:
      - include/gemmini.h
      - include/gemmini_params.h
    # DECLARED LOCAL EDIT, with the digest of the bytes actually read.
    #
    # `include/gemmini_params.h` is reported modified by git because this checkout's HEAD is e6df8b9f (the
    # fp6 revision), and the edit is a REVERT of the fp6 parameter block back to the int8 one. The bytes
    # are byte-identical to 7c540b3a's, which is why `source_status` reports this path PINNED by content
    # and not merely "declared": the digest below and the digest of `7c540b3a:include/gemmini_params.h`
    # are the same string. It is recorded anyway so that a DIFFERENT edit to this file is still refused —
    # the digest stops matching and the path drops to OFF_PIN with a message naming both digests.
    #
    # The int8 dtypes these bytes declare are independently corroborated by `merlin.targetgen.rtl.facts`
    # straight from the RTL (operand int8, accumulate int32 — the discovery surface prints the agreement).
    # That corroboration is why the claims are BELIEVED; it is not why they are pinned, and the two were
    # being conflated. Nothing in the pin recorded which bytes the dtypes came from until now.
    # `include/gemmini.h` is likewise OFF the pinned revision (these bytes are e6df8b9f's, this
    # checkout's HEAD). Measured 2026-09-01, pinned 7c540b3a vs read bytes: 36 changed lines, and the
    # delta is ADDITIVE MX surface plus one cast:
    #   + `#define CONFIG_SCALE_MEM 26` and `gemmini_mxquant_config_mvout` (a funct-26 instruction)
    #   + `gemmini_extended3_config_ex` grows 9 -> 13 args (act/wgt/out mx_fmt into RS1[15:10], uselut
    #     into RS1[5]); all four in-header call sites pass 0 for the new fields, so RS1 is bit-identical
    #   ~ RS2 shift becomes `(uint64_t)(uint32_t)(sys_shift)` where the pinned macro had `(sys_shift)`.
    #     This differs ONLY for a NEGATIVE shift, where the pinned form sign-extends and corrupts
    #     C_stride in RS2[63:48] -- i.e. the read bytes fix a latent bug. Every call site passes 0.
    # So for everything this corpus emits, the encodings are identical to the pinned revision's.
    #
    # RESIDUAL RISK, recorded rather than resolved: the header EXPOSES funct 26 and the MX format fields,
    # and the pinned RTL cannot execute them. Verified unused by run merlincirct_arm4_func_20260901_codex1
    # (no CONFIG_SCALE_MEM / mxquant / mx_fmt / uselut anywhere in the submission or generated harness;
    # zero funct-26 instructions across 28 emitted traces). A future round that reaches for that surface
    # would be undefined on this RTL, and this declaration does not prevent it -- it only means the drift
    # is described. Re-check the emitted traces before citing a result that used it.
    local_edits:
      include/gemmini_params.h: "3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924"
      include/gemmini.h: "007826db4fdaf35783e5d91ad3f21c2df9a310c1c51d53499f7745fc379974de"
    used_by:
      - every dtype / activation-mode / feature claim in the discovered capability surface
        (targetgen/capability_discovery.py, via hardware_spec.isa_headers)
      - the hwbringup ISA contract handed to every capsule-bench arm
        (experiments/capsule_bench/targets/gemmini/.../isa_include -> a symlink into THIS checkout)
    notes: >-
      HOW THE HEADERS ARE REACHED, because it is not obvious and it is why nothing associated them with a
      pin. The descriptor declares them as repo-relative paths under
      `experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/`, and
      `isa_include` is a tracked SYMLINK to
      $MERLIN_CHIPYARD/generators/gemmini/software/gemmini-rocc-tests/include. So
      `capability_discovery._resolve_declared_path` resolves them at its FIRST candidate (`merlin_dir`)
      and never reaches its pin-checkout branch — the resolved source therefore recorded `pin: None`, and
      a source with no pin cannot be off-pin from anything. The bytes read are nonetheless this
      checkout's, which is what this pin now describes.

      EXPECT DRIFT ON A DEVELOPMENT CHECKOUT, AND DO NOT SILENCE IT. Two findings are expected here until
      someone reconciles the submodule:
        - the nested checkout is at e6df8b9f but gemmini_rtl records 7c540b3a (off the recorded gitlink);
        - include/gemmini.h is OFF-PIN by content (007826db vs the pinned 18801f4e).
      The second is the one that matters and it is NOT cosmetic: e6df8b9f's instruction header adds
      `CONFIG_SCALE_MEM 26` and MX-format fields to `gemmini_extended3_config_ex` (act/wgt/out_mx_fmt,
      uselut) that the pinned RTL revision 8c3f9923 does not implement. A capability surface derived from
      it can therefore declare an ISA surface the pinned hardware cannot execute.

      TWO DIFFERENT DIGESTS ARE IN PLAY AND THEY ARE NOT COMPARABLE — a trap for anyone reconciling a
      capability surface against this pin. This registry's digests (`local_edits`, and what
      `provenance.source_status` compares) are the PLAIN sha256 of a file's bytes, so they are stable
      across hosts. `capability_discovery.ResolvedSource.digest` is `provenance.source_digest([abs_path])`,
      which hashes the absolute PATH STRING together with the bytes and is therefore host-specific and
      will never equal the value here. Measured on this host: the same
      `include/gemmini_params.h` reads 3758ae96 as a content digest and 5d31e5b4 as that surface's
      source_digest. Neither is wrong; they answer different questions. Compare like with like.

      THE FIX IS IN THE CHECKOUT, NOT IN THIS FILE. `git -C generators/gemmini submodule update
      --checkout software/gemmini-rocc-tests` would put the nested tree back on 7c540b3a — and this
      registry's tooling deliberately CANNOT do that, because other sessions build from that tree and a
      provenance check that moves someone's HEAD is a worse failure than the one it prevents. Do not
      "fix" the drift by re-pinning this commit to e6df8b9f: that would attribute the int8 claims to the
      fp6 revision, which is precisely the mis-attribution the registry exists to prevent. If the fp6
      revision is genuinely what a piece of work wants, it needs its own pin and its own goldens.

  gemmini_rocket_chipyard:
    description: >-
      The chipyard root the Alveo U250 bitstream `firesim_gemmini_rocket_u250_30mhz` was elaborated
      from. Pinned separately from `gemmini_rtl`'s root because it is a DIFFERENT CHECKOUT, not a
      different state of the same one: that pin resolves under $MERLIN_CHIPYARD and carries gemmini
      8c3f9923, this tree is $MERLIN_CHIPYARD_GEMMINI_ROCKET and carries gemmini 63f0b68a. Every
      whole-model systolic cycle number produced in this repo during 2026-09-17..19 -- the vendor
      library baselines (queue jobs 699-705) and every compute-group program (706, 726-731) -- was
      measured on the bitstream below, which is NOT the one `firesim_gemmini_rocket_u250` names.
      Those two bitstreams differ in size (43,881,284 vs 44,668,362 bytes) and in digest, so numbers
      measured on one are not a divisor for numbers measured on the other.
    repo_canonical: https://github.com/ucb-bar/chipyard.git
    commit: "009e85b05ca817a15fcd6c3fe4eedd86cc2a3617"
    targets: [gemmini]
    branch: submission/ASPLOS2026-chipyard-pinned
    root_env: MERLIN_CHIPYARD_GEMMINI_ROCKET
    path: .
    # THE BUILD RECIPE IS NOT IN THE READ SET, AND THAT IS THE POINT.
    # `sims/firesim/deploy/config_build_gemmini_rocket.yaml` is the file whose `builds_to_run` names
    # `alveo_u250_firesim_gemmini_rocket_30mhz`, so it is what actually selected this bitstream -- and
    # it is UNTRACKED in this checkout (`git ls-files` does not know it). A commit-pinned read set
    # cannot contain a file the commit does not have: listing it made this pin report permanent drift
    # for a reason that had nothing to do with the revision. It is recorded in the artifact's notes
    # instead, where "the recipe that produced this bitstream is in no commit" is the fact it is.
    requires_paths:
      - generators/gemmini/src/main/scala/gemmini/Configs.scala

  gemmini_rocket_rtl:
    description: >-
      The Gemmini generator revision inside `gemmini_rocket_chipyard`, and therefore the mesh geometry,
      scratchpad/accumulator capacities and RoCC funct encodings that the 2026-09-17 FireSim bitstream
      actually implements. Recorded because the sibling pin `gemmini_rtl` names a different revision
      (8c3f9923) of the same generator: a fact extracted from that tree and applied to a result measured
      on this bitstream is a cross-revision claim, which is the exact failure this registry exists for.
    repo_canonical: https://github.com/ucb-bar/gemmini
    commit: "63f0b68a68f185a016a2993f2fb32e1661ea9e6c"
    targets: [gemmini]
    branch: submission/ASPLOS2026-gemmini-pinned
    root_env: MERLIN_CHIPYARD_GEMMINI_ROCKET
    path: generators/gemmini
    requires_paths:
      - src/main/scala/gemmini/Configs.scala
      - src/main/scala/gemmini/GemminiISA.scala
      - src/main/scala/gemmini/Mesh.scala
      - src/main/scala/gemmini/LoadController.scala

  gemmini_universal_rtl:
    description: >-
      The "Universal" Gemmini configuration -- a SECOND systolic revision of the same generator, and the
      hardware a second capsule-bench systolic target would be graded against. It is a 16x16 int8 mesh
      like `gemmini_rtl`'s GemminiRocketConfig and it is NOT the same device: the spatial array is
      WEIGHT-STATIONARY ONLY (`dataflow = Dataflow.WS`), the accumulator has no full-width readout
      (`acc_read_full_width = false`), the execute stage can neither read the accumulator nor write the
      scratchpad (`ex_read_from_acc = false`, `ex_write_to_spad = false`), and the D operand is
      hardcoded to GARBAGE_ADDR (`hardcode_d_to_garbage_addr = true`). Each of those removes programs
      the pinned revision executes, so a verdict measured on one is not a verdict about the other.

      WHY A COMMIT ALONE CANNOT NAME THIS DEVICE -- the reason this is a separate pin rather than a
      note on `gemmini_rtl`. The checkout is at the SAME sha as `gemmini_rtl` (8c3f9923) and is not the
      same hardware. Measured 2026-09-09: 25 tracked Scala sources carry 2879 added / 376 removed
      uncommitted lines, and the configuration ITSELF lives in files that are UNTRACKED in both the
      generator and its superproject --
        src/main/scala/gemmini/UniversalResNet50Config.scala          (the parameter set)
        chipyard/UniversalResNet50GemminiConfigs.scala                (the chipyard binding)
        generators/firechip/chip/src/main/scala/UniversalResNet50TargetConfig.scala  (FireSim wrapper,
          in the superproject and covered by `gemmini_universal_chipyard` below)
      So `verify("gemmini_rtl")` run against THIS checkout would report the declared commit, find its
      three Scala read paths dirty, and say nothing at all about a weight-stationary-only array. The
      bytes are therefore declared in `local_edits`, and what actually identifies the device is the
      ELABORATION, declared as artifacts: `gemmini_universal_verilator_firrtl` (the TestHarness
      elaboration a gsim/verilator cert would be built from) and `gemmini_universal_firesim_firrtl`.

      GemminiISA.scala IS ONE OF THE EDITED FILES AND THE EDIT REACHES ENCODINGS, which is why it is in
      the read set. Measured against 8c3f9923: `CONFIG_SCALE_MEM = 26.U` is added; `MvoutRs2` takes 3
      bits out of its rows spacer for an `mx_chunk_id`; and CONFIG_EX RS1's two spacer fields are
      replaced by `uselut` (1 bit) plus three 2-bit MX format fields. That is the RTL side of the same
      delta `gemmini_isa_headers` records on the header side for revision e6df8b9f -- i.e. the header
      surface that pin calls "undefined on this RTL" IS implemented here. Programs that pass 0 for the
      new fields encode identically; a program that reaches for them is defined here and not there.
    repo_canonical: https://github.com/ucb-bar/gemmini
    repo_observed_note: >-
      NOT the checkout `gemmini_rtl` reads. Observed at /scratch/jack/chipyard/generators/gemmini, a
      tree owned by another user and READ ONLY from merlin. The root env var is deliberately a NEW one:
      pointing $MERLIN_CHIPYARD at this tree would silently re-attribute every existing gemmini claim to
      a WS-only device, so that must not be how this pin is reached. Unset by default, and `verify`
      then reports "cannot be located" rather than passing.
    commit: "8c3f9923a44a2fe2c7930587be297d6d4f8c09ca"
    targets: [gemmini_universal]
    branch: HEAD
    root_env: MERLIN_UNIVERSAL_CHIPYARD
    path: generators/gemmini
    # THE READ SET. Every path here is read by a derivation about this target: the two config files
    # define it, GemminiConfigs.scala both declares the parameter class and GENERATES gemmini_params.h,
    # GemminiISA.scala carries the encodings, and the remaining six are what the mesh/capacity/dataflow
    # and accumulator-readout facts are derived from.
    requires_paths:
      - src/main/scala/gemmini/UniversalResNet50Config.scala
      - chipyard/UniversalResNet50GemminiConfigs.scala
      - src/main/scala/gemmini/GemminiConfigs.scala
      - src/main/scala/gemmini/Configs.scala
      - src/main/scala/gemmini/GemminiISA.scala
      - src/main/scala/gemmini/Mesh.scala
      - src/main/scala/gemmini/Tile.scala
      - src/main/scala/gemmini/PE.scala
      - src/main/scala/gemmini/AccumulatorMem.scala
      - src/main/scala/gemmini/ExecuteController.scala
      - src/main/scala/gemmini/Scratchpad.scala
    # NO forbids_paths, DELIBERATELY, and this is the honest answer rather than an omission. What is
    # absent about this device -- the output-stationary datapath, the full-width accumulator readout, the
    # execute-stage accumulator read and scratchpad write -- is absent because of PARAMETER VALUES in an
    # untracked Scala file, not because a file is missing. Gemmini is one Chisel source set for every
    # configuration: the OS branch lives in the same PE.scala either way. Declaring a path absent here
    # would be a check that cannot fail, which this repo has been bitten by repeatedly, so the absences
    # are pinned where they can actually be witnessed instead:
    #   * by CONTENT, via the local_edits digest of UniversalResNet50Config.scala (the parameter values);
    #   * in the ELABORATION, where they are constant-folded -- measured in
    #     `gemmini_universal_verilator_firrtl`, PE's output-stationary branch is gated by a literal
    #     `and(UInt<1>(0h0), ...)` and its propagate registers are SInt<8> rather than accumulator-wide,
    #     so no OS program can be expressed by this netlist;
    #   * in the generated ABI, where `#define ACC_READ_FULL_WIDTH` must be ABSENT (see gaps below).
    #
    # CONTENT_CHECK IS OFF, also deliberately, and NOT to quiet anything. `content_check` compares each
    # read path's bytes against that path AT THIS PIN'S COMMIT out of the object store; it is the right
    # question when HEAD has moved off the pin, which is not the case here -- HEAD IS 8c3f9923 and every
    # divergence is uncommitted. Two of the eleven read paths exist in no revision at all, so the object
    # store has no blob for them and `source_status` would return UNDETERMINABLE, which
    # `check_provenance.py --verify-pins` treats as a gate FAILURE. Failing the gate for anyone who sets
    # the root var would teach people to unset it, and would say nothing true that the digests below do
    # not already say: with content_check off, `verify` intersects the dirty set with the read set and
    # compares each touched path against `local_edits`, which covers all eleven -- including the two
    # untracked ones, whose bytes are the whole configuration. Turn content_check on the day the config
    # lands in a revision.
    content_check: false
    # DECLARED LOCAL EDITS -- the digests of the bytes a derivation about this target would actually
    # read, measured 2026-09-09 at /scratch/jack/chipyard/generators/gemmini. This is what makes
    # "8c3f9923 plus exactly these bytes" a nameable revision; it is NOT a claim that any of them match
    # upstream, and every one of them differs from 8c3f9923's. The first two are UNTRACKED: they belong
    # to no revision anywhere, which is why a result citing this pin must cite the digest and never the
    # sha alone. UniversalResNet50Config.scala's digest independently agrees with the value Jack's own
    # experiment records as `gemmini_array_overlay_scala`, which is the only cross-check available for a
    # file git has never seen.
    local_edits:
      src/main/scala/gemmini/UniversalResNet50Config.scala: "cb6a5248cbeeab2d5ba9564d1e6ca5a3be17287512e5050991f2eb9edaffa8f5"
      chipyard/UniversalResNet50GemminiConfigs.scala: "ee6f568f679ccec67165cbda95365b077e7595ea7c06baab9488645d6acf2fda"
      src/main/scala/gemmini/GemminiConfigs.scala: "06d763189914715ced1a547dc56386f61066d18f9ae2c8d01ca3b19de6fd8416"
      src/main/scala/gemmini/Configs.scala: "2b25c82a385a382acd35aa3ed4a704d91845916fb095d869b6dc7d1bf1f09da6"
      src/main/scala/gemmini/GemminiISA.scala: "5be2e064806c005f06b1997a54a3caa8ad7626c9b1de6191c617b9bad408a218"
      src/main/scala/gemmini/Mesh.scala: "36f776baa16c4023a130c7b05e82f9474e9466419b2d1979e51c5dab302fb067"
      src/main/scala/gemmini/Tile.scala: "a6d73c30556244b64c6e811adb70affb9fa8f6660e0f6715bf16f8aaadd86af9"
      src/main/scala/gemmini/PE.scala: "0ee6f576c4ef22c456fa0cda4b2bb2d932b3863198922e5e6d07da2faab858f0"
      src/main/scala/gemmini/AccumulatorMem.scala: "d7f1adf823a8297765da3d12da14668429729bebb165614729895d54f59d8758"
      src/main/scala/gemmini/ExecuteController.scala: "9588552cdcf63d89787cad8d682a99b352853be59158095fd6301a42fd87878f"
      src/main/scala/gemmini/Scratchpad.scala: "a0586977c9e167bf1c2d2785a903b3c87479d691a16c793bb3e5a20027785a43"
    used_by:
      - candidate second systolic capsule-bench target (not yet wired; see gaps)
    notes: >-
      WHAT WAS VERIFIED BY CONTENT RATHER THAN BELIEVED, 2026-09-09. The configuration's own contract
      file (/scratch/jack/experiments/universal_resnet50_gemmini_20260906/hardware/UNIVERSAL_GEMMINI_U250.yaml,
      sha256 5d4aa1e286d83783f782bf0beac1f5042324432b18bd774faf076f9e40c06497) carries
      `status: source_config_frozen_not_elaborated_not_built`, and the sibling PROVENANCE.yaml lists
      "RTL elaboration" and "simulator invocation" under `explicitly_not_performed`. BOTH ARE STALE.
      Two elaborations and a linked Verilator simulator exist and are declared as artifacts below.
      Corroborated straight out of the FIRRTL: Mesh instantiates 256 Tiles each holding one PE (16x16,
      tileRows=tileColumns=1); the scratchpad is four `UInt<8>[16] [4096]` memories = 256 KiB / 16384
      rows; the accumulator is two banks of 2 x `UInt<256>[1] [512]` = 64 KiB / 1024 rows with
      `addr : UInt<9>` and `data : SInt<32>[1][16]`. Those match the contract's declarations exactly.

      THE ISA HEADERS ARE NOT PINNED HERE, ON PURPOSE, AND THIS IS THE OPEN BLOCKER. `gemmini_rtl` has a
      sibling `gemmini_isa_headers` pin because every dtype claim about that target is read out of the
      generated header. This configuration HAS NO GENERATED HEADER: searched the whole of
      /scratch/jack on 2026-09-09 and every gemmini_params.h there belongs to some other config. The
      nested submodule in THIS checkout is at 7c540b3a (the gitlink it records) with both headers locally
      modified, and its gemmini_params.h (sha256 0b9c7b43...) declares BANK_ROWS 2048 / ACC_ROWS 512 and
      `#define ACC_READ_FULL_WIDTH` -- i.e. HALF this device's scratchpad, HALF its accumulator, and a
      readout port it does not have. Compiling against it would mis-size every tile and emit a
      full-width accumulator mvout the hardware cannot service. Until the header is regenerated from
      THIS parameter set there is no ABI for this target, and a sibling headers pin would have nothing
      to name. Recorded as UNKNOWN rather than filled in with the plausible candidate: a header whose
      #define set matches this config's declared `expected_generated_header` byte-for-byte does exist
      (sha256 d6db18f8edbfeb854780286d8c2afb81ae3b9103224522478a9047d5550272e5, 149 copies under
      /scratch/jack, differing from merlin's own gemmini_params.h by exactly the one line
      `#define ACC_READ_FULL_WIDTH`), but it was written 2026-08-30, a week before this configuration
      was authored, and nothing ties it to this elaboration. Shape agreement is not provenance.
    gaps:
      - >-
        No generated gemmini_params.h for this configuration exists anywhere, so the software ABI is
        UNKNOWN. Regenerate it from UniversalResNet50Configs.arrayConfig before any claim.
      - >-
        CLOSED 2026-09-09, and recorded because the first two places one would look say the opposite.
        `acc_read_full_width = false` is NOT witnessable from AccumulatorMem: its read request still
        carries a `full : UInt<1>` field, and this config's accumulator memory is the MX-era
        `AsymmetricTwoPortSyncMem` (2 x UInt<256> banks) which exposes BOTH a full-row and a
        chunk read. The absence lives one level out, in Scratchpad.scala's
        `writer_data_width = if (acc_read_full_width) acc_w else spad_w`, and it IS in the elaboration:
        `gemmini_universal_verilator_firrtl`'s StreamWriter carries `data : UInt<128>` (DIM x int8)
        where the pinned revision's carries `data : UInt<512>` (DIM x int32). The mvout DMA on this
        device physically cannot move an int32 accumulator row.
      - >-
        `spatialArrayOutputType = SInt(20.W)` IS INERT IN THIS CONFIGURATION, so the contract's declared
        `spatial_output_type: sint20` does not describe the hardware. This tree's Mesh.scala passes
        `meshAccPrecisionList(r)` as the tile's output type, and GemminiConfigs.scala:138 defaults an
        empty `meshAccPrecisionList` to `Seq.fill(meshRows)(accType)`. The config declares
        `meshAccPrecisionList = Seq()`, so the mesh elaborates at accType: measured in the elaborated
        FIRRTL, PE carries `in_b/out_b/out_c : SInt<32>` where the pinned revision's PE carries
        `SInt<20>`. The spatial partial-sum width is therefore 32, not 20, and any numeric claim that
        cites the declared 20 is citing a value the netlist does not use.
      - >-
        The generated collateral directory of the Verilator elaboration is mode 0770 and owned by
        another user, so its Verilog is unreadable from here. The .fir and the linked simulator are
        readable; a REBUILD from this tree is not currently possible without that user's help.
      - >-
        `verify` cannot read either checkout's REVISION from this account and reports it UNKNOWN, not
        "clean": git refuses a repository owned by another user ("detected dubious ownership") and the
        observation collapses to UNDETERMINABLE, which is the correct fail-closed answer and not a fault
        in the tree. Measured 2026-09-09: with the root var set, all 11 declared read-path digests match
        on disk byte for byte, so the CONTENT half of this pin verifies while the revision half does not.
        A caller that needs the revision must add that path to its own git `safe.directory` -- per
        invocation (`git -c safe.directory=...`), never by editing a shared config, and never by touching
        the tree.

  gemmini_universal_chipyard:
    description: >-
      The SUPERPROJECT half of the Universal Gemmini configuration. Pinned apart from
      `gemmini_universal_rtl` for the reason `gemmini_isa_headers` is pinned apart from `gemmini_rtl`: a
      pin has exactly one `commit`, and these files belong to a different revision (chipyard e27c6561)
