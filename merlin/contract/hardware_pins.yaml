      - codegen.mk
      - run_regression.py
      - scripts/main.tcl
    notes: >-
      Publicly readable, but the repository carries NO license file -- check before redistributing
      any generated RTL. Tested upstream with Catapult 2024.2 and VCS T-2022.06-SP2; this host has
