    repo_canonical: https://code.stanford.edu/voyager/accelerator.git
    commit: "e3a725db5459bde947e5cb542ccd7f5b10bdd905"
    branch: open-source-release
    root_env: MERLIN_EXT_VOYAGER_ACCELERATOR
    path: ""
