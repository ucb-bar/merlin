      - gsim_compiler
    config: GemminiGsimSerialClkConfig
    target: gemmini
    role: gsim_binary
    # The ABI this emulator's elaboration takes: GemminiGsimSerialClkConfig -> GemminiGsimMonitorsConfig
    # -> GemminiRocketConfig -> DefaultGemminiConfig keeps the parameter default
    # `acc_read_full_width = true`, so the curated harness header (the one defining
    # ACC_READ_FULL_WIDTH) is correct for it. Stated on the binary, because the binary is what a
    # whole-model measurement runs and checks a program's build header against.
    abi_header_sha256: "3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924"

  gemmini_shuttle_opu_u250_firesim_bitstream:
    description: >-
      The Alveo U250 FireSim bitstream hwdb `alveo_u250_firesim_shuttle_gemmini_opu` selects: a
      two-tile Shuttle SoC elaborating FireSimGemminiAndOPUShuttleConfig -> chipyard.GemminiAndOPUShuttleConfig.
      Hart 0 (tile 0) is Shuttle + the DEFAULT Gemmini (GemminiConfigs.defaultConfig: 16x16 int8 mesh,
      BOTH dataflows, 4x4096-row scratchpad, 2x512-row int32 accumulator, full-width accumulator readout
      -- the StreamWriter data port is 512 bits, DIM x int32); its RoCC router decodes only custom3.
      Hart 1 (tile 1) is Shuttle + Saturn with the outer-product unit (VLEN 128) and NO RoCC: custom3
      there raises an illegal instruction, so a Gemmini program runs on hart 0 with hart 1 parked. Host
      code is RV64GC (+Zba/Zbb/Zbs/Zfh) on hart 0 -- no V. A DIFFERENT DEVICE from every Rocket-hosted
      Gemmini bitstream in this file: the host core is Shuttle, so host-side cycles are not comparable
      even though the Gemmini parameter set (and therefore the ABI header) is the default one.
    root_env: MERLIN_CHIPYARD
    path: sims/firesim/deploy/results-build/2026-05-06--22-08-53-alveo_u250_firesim_shuttle_gemmini_opu/cl_xilinx_alveo_u250-firesim-FireSim-FireSimGemminiAndOPUShuttleConfig-BaseXilinxAlveoU250Config/firesim.tar.gz
    digest: "b727e1fceee4df23fdf4c900e2bae2fbc2ec48c0db8b29896733a2394734072c"
    built_from:
      - gemmini_rtl          # 8c3f9923: all 4326 gemmini source locators in the build's SV resolve; 63f0b68 fails 12
      - saturn_opu_int8      # ea373800: all 3766 saturn locators resolve; saturn_tapeout 249340a6 fails 519
    config: FireSimGemminiAndOPUShuttleConfig
    target: gemmini
    role: firesim_bitstream
    hw_configs:
      - alveo_u250_firesim_shuttle_gemmini_opu
    # sha256 of sims/firesim/deploy/built-hwdb-entries/alveo_u250_firesim_shuttle_gemmini_opu (368 bytes)
    hwdb_digest: "03bc7f8e1db773b98a30de7b4c351bde849d2e3f1f64f27e7e443afb6cc89e72"
    # GENERATED, not asserted: GemminiConfigs.generateHeader re-emitted from parameters read out of this
    # build's own design/FireSim-generated.sv (DIM, banks, rows, types, scale units, readout widths,
    # normalizer, opcode) is byte-identical to the curated header.
    abi_header_sha256: "3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924"
    # THE HARTS, as the description above reads them out of this build: which one's RoCC router reaches
    # the unit, and the ISA each executes, stated no wider than the design has it (a program compiled
    # for a subset runs; one compiled past it traps). A two-hart program runs its host code on the
    # vector hart and hands each dispatch to the unit's hart.
    harts:
      - {hart: 0, isa: rv64gc, unit: true}
      - {hart: 1, isa: rv64gcv, vlen: 128, unit: false}
    notes: >-
      Digest measured 2026-09-26 with sha256sum over the 59,091,214-byte tar (members: metadata,
      firesim.bit e6675c7d..., firesim.mcs). ELABORATION IDENTITY: the build's design/FireSim-generated.sv
      is sha256 bf367efc1e2dec12fb276a4280a7db6a0b46470e0a92e15cd1dfd4214316a286 (38,872,887 bytes,
      written 2026-05-06 15:11 -0700); the driver it was built with is 2927176e..., byte-identical to the
      runtime driver rebuilt 2026-08-29. sims/firesim/sim/generated-src for this config was RE-ELABORATED
      2026-08-29 and its SV (7b9faebf...) differs from the bitstream's only in LoadController.scala (the
      block-stride assert gemmini 63f0b68 disables), so it is NOT this bitstream's elaboration. Build:
      fpga_frequency 30 MHz, strategy TIMING, Vivado 2023.1, all timing constraints met; firesim commit
      b084672c (dirty at build). Memory: DDR channel C only; target DRAM 0x8000_0000..0x4_7FFF_FFFF
      (16 GiB; AXI4AddressTranslation bound 35'h47fffffff). Effective target frequency measured by queue
      job 499 (2026-09-06): 24.58 MHz, FMR 1.22.
    gaps:
      - >-
        The chipyard configs (GemminiAndOPUShuttleConfig, FireSimGemminiAndOPUShuttleConfig) were first
        COMMITTED 2026-09-03 (ed2a5beb), after this 2026-05-06 build, so the build ran from uncommitted
        source. The config chain is asserted from the current source; every Gemmini parameter the ABI
        depends on is read from the SV itself, which is the fact.
      - >-
        built_from is locator-consistent, not proven: every source locator in the SV resolves at the named
        commits, which rules revisions out but does not rule a byte-identical-in-those-lines revision in.
        The saturn checkout is at e16a301 (no src/ diff vs ea373800).
      - >-
        The loop units (LoopConv, LoopMatmul) ARE elaborated on this board; the no-FSM rule is enforced by
        the whole-program check over the linked ELF, not by the hardware's absence.

