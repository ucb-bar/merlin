# BUILT ARTIFACTS — identified by their CONTENTS, because they have no revision of their own.
#
# A pin answers "which checkout was this read from". An FPGA bitstream, a compiled simulator and a packaged
# image have no answer to that: they are outputs. What identifies them is the bytes, plus the revisions they
# were elaborated FROM — so `built_from` names pins above rather than repeating their shas, and `config`
# records which elaborated configuration the bytes are.
#
# `digest` may be absent while a build is still running. That is honest, and `verify_artifact` reports it as
# a GAP rather than a pass: an artifact that verifies against nothing is self-certifying, which is exactly
# what this registry exists to prevent. Fill it in when the build lands.
#

  gsim_compiler:
    description: >-
      The FIRRTL-to-C++ simulator compiler that emits the RTL-derived GSIM models. It is pinned because
      it is part of the derivation: the same RTL through a different compiler is a different simulator,
      and the emitted model carries no revision of its own. Measured on gemmini against the identical
      ELF, GSIM answers in 3.31 s where Verilator takes 86.83 s (26.25x) with both reporting pass, so
      this is the difference between a cert tier that runs per capsule and one affordable once per run.
      The upstream commit alone does NOT describe the bytes that were read -- nine files carry 225 lines
      of uncommitted local work WITHOUT WHICH THIS DESIGN DOES NOT COMPILE AT ALL, so each is declared
      under local_edits and the diff itself is tracked at merlin/contract/external/gsim/. The load-bearing
      hunks: parser/syntax.y accepts SMem/CMem/Flip as identifiers and `parameter PERIOD = 2.0`;
      src/AST2Graph.cpp severs input->ext scheduling edges for clocked extmodules, which is what breaks
      the false zero-delay loops GSIM manufactures through AXI/TL ready-valid paths.
    repo_canonical: https://github.com/OpenXiangShan/gsim.git
    # RECONCILED 2026-09-04 AGAINST THE CHECKOUT, BY CONTENT. The pin previously declared
    # 50b371c60910/master and the checkout had moved to 65a1f89af195 on branch
    # submission/ASPLOS2026-gsim, which `verify()` reported as two lines of drift. The drift is NOMINAL:
    # 50b371c6 is an ANCESTOR of 65a1f89a, and all nine files in the read set are byte-identical to the
    # `local_edits` digests below AND to their bytes at 65a1f89a -- i.e. the work that was uncommitted
    # when this pin was written has since been COMMITTED on that branch, unchanged. Verified by
    # comparing each file's sha256 in three places (worktree, HEAD, 50b371c6): worktree == HEAD for all
    # nine, and all nine differ from 50b371c6, which is exactly the signature of "the patches landed".
    # The commit is updated so the pin names the revision these bytes are actually at; the digests are
    # unchanged because the bytes are unchanged, and they remain the load-bearing check. This is a
    # reconciliation with evidence, not an adoption of whatever happened to be checked out.
    commit: 65a1f89af195c62b365cd9a827fa4f5f2ca71d1f
    branch: submission/ASPLOS2026-gsim
    root_env: MERLIN_EXT_GSIM
    # ALL NINE PATCHED FILES ARE IN THE READ SET, not the four the smoke path happened to name. A
    # `local_edits` digest is only ever compared for a path the pin READS, so the five that sat outside
    # this list were reviewed and then never checked: a different edit to any of them would have gone
    # unnoticed while the pin still verified. The compiler is BUILT from all nine, and `build/gsim/gsim`
    # below is that build's product, so the read set is the whole patch set by construction.
    requires_paths:
      - src/AST2Graph.cpp
      - src/splitArray.cpp
      - src/clockOptimize.cpp
      - parser/syntax.y
      - build/gsim/gsim
      - include/Node.h
      - src/Node.cpp
      - src/cppEmitter.cpp
      - src/graphPartition.cpp
      - src/splitNodes.cpp
    local_edits:
      include/Node.h: 04de20f71880560a2f2566607352794969b89063b05058973d422f867765f549
      parser/syntax.y: 73aca9db9a0fe8236b3a9a8df2a6f922d55628de4d705b1072dd803153254806
      src/AST2Graph.cpp: 98661dea5b480602c20937d9ec4eda11db82a24f2d1ca75d7f3bcaa8035263a6
      src/Node.cpp: 49fc4e55fe7ec23145f9b621d10491932b9fe439e0fb9271b43bd8b29654d6d6
      src/clockOptimize.cpp: d1f57f4977ed54191283c559b880c9eab8272b4310d5fb743a221c84980ca4ff
      src/cppEmitter.cpp: 3df277f416adf6ffa5d92e8516723ebf63119d071eb9b153f5d315f46d6c046a
      src/graphPartition.cpp: 74c5fdec53753ff0ef0ac1193139d48d5e604287c5ded3d99bd49adac852eafb
      src/splitArray.cpp: dfccdbb9a91ba15800c8e015123aad5fb1c22508ba8ed8f4e8279e8f0711afd0
      src/splitNodes.cpp: 4026fb78d304b104f9d1a4391ba54918b1dea0e7549e49bfd2c1f828b7dbff9d
    # THE EMITTER BINARY, BY ITS BYTES. `build/gsim/gsim` has always been in `requires_paths`, which asks
    # only whether the file exists, and the path is gitignored, so no content check ever reached it. It
    # was rebuilt in place and `verify()` stayed ok while the results attributed to the old binary kept
    # citing its digest; that loss is recorded under `lost_artifacts:` (gsim_emitter_246bfdac).
    #
    # This digest is the binary at the path TODAY (re-hashed 2026-10-06; unchanged since 2026-09-23). It
    # is NOT the emitter the earlier corpus was produced by, and its own provenance is weak: it was built
    # by another workstream at an unrecorded commit, and the checkout has since moved past this pin. It
    # is declared so the NEXT in-place rebuild is drift the gate reports, not a later discovery.
    build_products:
      build/gsim/gsim: "6da1580d3a54ed050bd4126d23a852e41ba64d5d1b963979829aca4839cd4aa9"
    notes: >-
      The patch set is reproduced at merlin/contract/external/gsim/gsim-merlin-patches.diff so it does not
      live only in one developer's dirty working tree, which is how it was found. Build with clang >= 19
      via merlin/contract/external/gsim/cxxwrap.sh (system clang is 18).

  voyager_compiler:
    description: >-
      The Voyager compiler (PT2E -> quantize -> FX/protobuf hardware IR) that every Voyager
