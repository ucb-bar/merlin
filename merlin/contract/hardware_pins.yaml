      `acc_read_full_width = false`, where the DEFAULT for the parameter is `true`
      (GemminiConfigs.scala:65). It is therefore a DIFFERENT DEVICE from the one the pinned
      `firesim_gemmini_rocket_u250` describes, which elaborates the stock
      `FireSimGemminiRocketConfig`, and from `GemminiGsimSerialClkConfig`, which the capsule L3 oracle
