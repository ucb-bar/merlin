# Raw-baseline input bundle for the gemmini-mlir-oot-capsule task.
# Defines exactly what a fresh, un-tooled baseline agent may see. The launcher assembles the agent
# workspace from `allowed` only; `denied` are asserted absent (and bwrap-masked) so the agent cannot
# read Merlin internals, reference backends, hidden capsules, or prior submissions.
bundle_id: raw_baseline_public_v0
arm: raw_baseline
task: gemmini-mlir-oot-capsule
description: >-
  Raw baseline: produce an mlir_oot_target_backend package (manifest.yaml + mlir_oot/ + REPORT.md)
  that compiles capsule interface MLIR through a Gemmini target dialect to command_buffer.json and
  LLVM/RoCC MLIR, graded by capsule_bench_v0. No Merlin tooling.
allowed:
  - {path: "merlin/contract/", mode: ro, note: "frozen ABI v0.1: schemas, grammar, command_buffer_abi, integrity_policy"}
  - {path: "merlin/contract/capsules/isa/", mode: ro, note: "public/dev ISA capsules"}
  - {path: "merlin/contract/capsules/layers/", mode: ro, note: "public/dev layer capsules"}
  - {path: "merlin/contract/capsules/model_slices/", mode: ro, note: "public/dev model-slice capsules"}
  - {path: "tmp/dialects/gemmini/software/gemmini-rocc-tests/include/gemmini.h", mode: ro, note: "public Gemmini ISA header (spike model)"}
  - {path: "tmp/dialects/gemmini/software/gemmini-rocc-tests/include/gemmini_params.h", mode: ro, note: "public Gemmini params (DIM, dtypes)"}
  - {path: "experiments/gemmini_capsule_bench_v0/contracts/hwbringup_gemmini_v0", as: "gemmini", mode: ro, note: "SHARED hardware-spec constant (ALL arms): RTL + ISA headers + README + one example. The ISA is a constant input, not Merlin assistance — a correct backend needs the target's defined ISA."}
  - {path: "experiments/gemmini_capsule_bench_v0/task/", mode: ro, note: "TASK.md + runner-interface docs + public Gemmini facts"}
  - {path: "third_party/llvm-install/", mode: ro, note: "LLVM/MLIR 23 toolchain (build the OOT package)"}
denied:
  - {path: "merlin/", reason: "Merlin internals (targetgen/runtime/reference/simulator)"}
  - {path: "artifacts/targets/gemmini/merlin_native_v0/", reason: "exempt reference backend"}
  - {path: "artifacts/targets/gemmini/hand_smoke_oot/", reason: "hand exemplar"}
  - {path: "artifacts/targets/gemmini/agent_spec_v0_mlir_oot/", reason: "prior Merlin-assisted backend"}
  - {path: "artifacts/targets/gemmini/agent_spec_v1_mlir_oot/", reason: "prior Merlin-assisted backend"}
  - {path: "merlin/contract/capsules/hidden/", reason: "hidden capsules + goldens"}
  - {path: "experiments/gemmini_capsule_bench_v0/input_bundles/grader_private_v0/", reason: "grader-private (hidden goldens, oracle adapters)"}
  - {path: "experiments/gemmini_capsule_bench_v0/runs/", reason: "prior submissions / run history"}
integrity_required: true   # submitted package must pass the non-exempt integrity scan
