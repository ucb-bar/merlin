schema: eligibility_manifest/v1
target: radiance
generated_by: llm_kernel_vs_compiler_v0/scripts/build_eligibility_manifest.py
denominator_source: independent hand-written kernels for this hardware, unioned with the target contract's
  own declaration where Merlin's derivation corroborates it
independence_argument: The families in the denominator are established by kernels a human wrote against
  this hardware in the hardware's own repository, classified `hand` by the provenance audit. That evidence
  exists whether or not Merlin does, so Merlin is not setting the denominator it is graded against.
bias_direction: Coverage is accelerated/eligible, so a SMALLER denominator flatters the compiler. Merlin's
  own derivation leaves ['movement', 'reduction', 'synchronization'] undetermined; the independent evidence
  covers them. Using the larger independent denominator is the conservative choice and is what this manifest
  does.
