# Kernel-generation arm A2 — an open model on Bedrock.
#
# Runs in parallel with, and BLIND to, the codex arm.
method: bedrock_kernel
driver: converse                    # capsule_bench/harness/bedrock_agent.py
model: qwen.qwen3-coder-480b-a35b-v1:0
provider: bedrock
billing_mode: metered
effort: high
seeds: [1, 2, 3]
max_spend_usd: 100                  # hard cap; the account ceiling is shared with prior work

# WHY THIS MODEL. It is the most-exercised model of the prior Radiance campaign on this box --
# 2955 calls / $76.10, more calls than any other -- so it is the campaign-proven pick rather than a
# guess. Note the id: model_tiers aliases "qwen-coder" to qwen3-coder-NEXT, a different model that
# the campaign never used.
#
# WHY NOT ANTHROPIC OR OPENAI HERE. They rate-cap quickly on this account, which turns a capability
# comparison into a quota measurement. Anthropic's sonnet-4-6 was in fact the campaign's largest
# line item ($124.11 / 2429 calls) and is still excluded for that reason.
accounting:
  # Bedrock allows cachePoint only for Anthropic and Nova, so this arm is honestly UNCACHED.
  # cache_read = 0 is a property of the arm and must be reported, not hidden.
  prompt_caching_available: false
