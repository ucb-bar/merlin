# Declarative per-target experiment SETUP for RADIANCE (the RadianceMuon / Muon SIMT config) — a real,
# working 3rd target that stresses the ladder's generality: radiance is a SIMT tensor-core GPU (16
# lanes/warp, CVFPU fp32/fp16/bf16) that ALSO embeds a gemmini-mx MX PE for low-bit (mxfp4/6/8/int8)
# matmul. It is matmul-capable and has a validated model — it simply exercises a DIFFERENT oracle path
# than gemmini/atlas.
#
# Authoritative source: the materialized (regenerable) target contract at
#   out/artifacts/targets/radiance/contracts/target_contract.yaml
# derived by `capability_manifests.write_oot_target("radiance", ...)` from the hand-owned residual +
# the RTL-derived Muon facts (family=simt_tensor, ops=[matmul, elementwise], compute_units
# simt_cluster + mx_pe, cyclotron sim). The contract is gitignored (generated); the residual is tracked.
# Plug it into Merlin via MERLIN_TARGET_PATH; its facts are extracted deterministically from the real
# RadianceMuonConfig RTL by muon_introspect (elaborated FIRRTL + cyclotron config + ISA docs ->
# muon_facts.json), the SIMT analog of the arc decoder-derived ISA.
#
# Oracle (what is genuinely per-target here): radiance's RTL oracle is the bespoke CYCLOTRON perf model
# (muon_oracles.cyclotron_adapter, same adapter signature as the arc/gemmini path; MuonUnavailable is
# the honest fail-closed signal), NOT the arc MXU command-buffer model. So arc_available("radiance") is
# False by design — radiance is not an mlc arc-matmul target — and that is correct, not a gap. Validated
# fidelity per the perf comparison: M1 functional bit-exact and M3 data-movement exact vs the RTL, with
# M2 cycles present + 3-way cross-checked but carrying a large, honestly-bracketed SIMT-GEMM overcount
# (~2x on gemm_simt: occupancy / latency-hiding is the documented frontier item, not fitted to look
# tight). Status: prototype, not RTL-certified (requires_human_review).
target: radiance

# This experiment target is served by the MUON core package (the SIMT core inside RadianceMuonConfig),
# so its contracts/ — and therefore the rtl_facts / irdl bundle pins the CIRCT arm is granted — live
# under merlin/targets/muon, NOT merlin/targets/radiance (which does not exist). Declared because it
# cannot be inferred from the target name: inferring it produced a bundle that claimed to grant the
# CIRCT arm its RTL-extracted facts while pointing at a path that can never exist.
backend_package_dir: merlin/targets/muon

rtl:
  via: mlc            # facts via muon_introspect (RadianceMuonConfig RTL); arc-matmul discovery is N/A (SIMT)

hardware_spec:
  target_contract: out/artifacts/targets/radiance/contracts/target_contract.yaml
  # Shipped ISA doc for the derived assembler/disassembler/linter — the stock-LLVM-emittable Vortex CUSTOM0
  # warp-control surface (derived from radiance-kernels vx_intrinsics.h + RISCVInstrInfoVX.td). Self-contained
  # (no model venv); the merlin IsaModel introspects it in-process. Fork-only 64-bit/mnemonic ops are residue.
  isa_headers:
    - experiments/capsule_bench/targets/radiance/contracts/hwbringup_radiance_v0/isa_include/isa_definition.py
  hwbringup_set: experiments/capsule_bench/targets/radiance/contracts/hwbringup_radiance_v0

# Radiance's OWN corpus root (mirrors atlas's per-target subtree) — SIMT fp32/fp16/bf16 GEMM + a norm +
# an attention tile (PR#1 op shapes) composed with the contained MX tensor path (simt_cluster contains
# mx_pe), generated from profiles/radiance.yaml. SIMT goldens are ordinary IEEE float; the MX capsule's
# golden comes from mlc's mx_ref. NOT the gemmini int8 corpus (numerically meaningless for SIMT-fp / MX).
capsule_corpus: merlin/contract/capsules/radiance/isa

# Radiance's RTL oracle is its bespoke cyclotron sim (the muon capsule path), NOT the arc MXU model.
toolchain:
  sim_via: cyclotron

# Scope of the PAID agentic loop: which whole-model capsules each round is scored on.
#
# A model capsule costs one cyclotron invocation per matmul layer, and that cost is the MODEL's size,
# not the compiler's difficulty. Measured on this target: M0's 15 layers take ~45 min per arm, while the
# four together are 297 layers (M0 15, M1 37, M3 90, M2 155) — ~15 h per arm per ROUND, which put a
# 12-round A/B out of reach. The first A/B where both arms cleared the op gate spent its entire budget
# grading M1 and never reached round 1.
#
# M0 is kept because it is the one that answers the question: "does a whole model run on the target
# mesh", certified at L2 with mesh_ran/mesh_fell_back counters. The other three re-ask it at 6-20x the
# price. They are still graded outside the loop (grade_agent_run against a frozen submission), where
# paying once is fine; withholding them here is a statement about the LOOP's budget, not about the
# corpus. The excluded names appear in the run manifest and the denominator moves with them.
# 2026-08-28: M0 joins them FOR A LADDER RUN, on the same "LOOP's budget" grounds stated above and now
# measured rather than estimated. The note says "M0's 15 layers take ~45 min per arm"; on a 4-arm ladder
# an arm sat on M0 for over 3 HOURS -- 4x that -- with its own grade dir still empty, because the
# whole-model path drives ONE warp of the target's 2 cores x 8 warps (measured: 0.286 IPC on c0t0 while
# c0t1/c1t0/c1t1 retire 37 instructions and park) and because its per-layer mesh sims land in /tmp, on a
# root filesystem at 97%, rather than in the TMPDIR the launcher exports (the sandbox does not propagate
# it). Four arms x that cost does not fit any budget, and the ladder's question is the OP corpus: what
# does each nested bundle add? M0 answers a different question and answers it identically for every arm.
#
# This does NOT retire the whole-model capstone. M0 has passed in-loop (v14, v17) and its 80% gate is
# demonstrated in BOTH directions (v20 gated it out at 54%; v21 earned it), so the capability is evidenced.
# It goes back in the loop once warp utilization makes it affordable -- that is the fix, not a smaller model.
grading:
  exclude_capsules:
    - M0_small_llama_fp32
    - M1_lstmnetvit_fp32
    - M2_tiny_llama_fp32
    - M3_spectformer_fp32

answer_surfaces:
  # Both of these are WORKING radiance compilers sitting in out/artifacts/targets/radiance/, which is
  # exactly what atlas declares for its own reference package: an agent that reads one is copying the
  # solution instead of deriving it. The list was empty while both were on disk, so nothing masked
  # them -- the mask set is DERIVED from this list (sandbox/answer_surfaces.py), so an unlisted
  # surface is simply not masked. `hand_v0` is the full hand-authored package (backend + dialect +
  # lowering + derive_facts); `radiance_mlir` is the generated dialect/lowering pair, which answers
  # the dialect-authoring half of the task on its own.
  prior_backends: [hand_v0, radiance_mlir]
