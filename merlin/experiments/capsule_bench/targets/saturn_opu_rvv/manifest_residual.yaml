# RESIDUAL side-input for the saturn_opu_rvv capability contract — the intent + prose that RTL facts
# cannot ground. `capability_manifests.derive_manifest(descriptor, spatial_facts, residual=<this>)` grounds
# the facts on top (the compute unit's dtypes + (in,weight)->acc matrix, the tile geometry, the MRF depth).
#
# WHY A SECOND TARGET OVER THE SAME SILICON. The outer-product unit has TWO software surfaces, and they are
# graded by different artifacts. The command-buffer target (`saturn_opu`) is driven by one-hot op ports and
# its submission is a command_buffer.json. THIS target is the same unit reached the way the shipped
# microkernel reaches it: four instructions in reserved vector-opcode slots, emitted as `.insn r`
# directives, so the submission is a kernel and the coverage expectation names instructions. Neither
# surface subsumes the other — the command buffer cannot express which instruction issued, and the
# instruction surface cannot be answered by a model that only takes buffers.
#
# The exposure is declared PER UNIT rather than target-wide because `kind: spatial` correctly describes the
# datapath and wrongly describes the software interface (see compute_units.resolve_exposure).
name: saturn_opu_mxv256d128_rvv
family: spatial_tensor_tile

# The instruction surface: software issues vector instructions, so the endpoint is inline_asm_insn even
# though the datapath is a spatial tile.
endpoint_kind: inline_asm_insn

compute_units:
  - name: opu
    kind: spatial
    ops: [matmul]
    exposure: inline_asm_insn
    # Where this unit's instruction encodings are READ FROM (a block in merlin/contract/matrix_units.yaml).
    # Declaring it is what makes the corpus's coverage expectation derivable: without it the class list
    # comes out empty and any submission satisfies coverage.
    matrix_unit: saturn_opu
    # WHICH elaborated configuration this target is. It selects the geometry — tile edge and operand
    # alignment are read out of this config's own Scala, never written here. The two tile notions differ on
    # this hardware (spatial array edge 16, logical VLMAX tile 32), and the instruction surface addresses
    # the logical one.
    hardware_config: OPUV256D128ShuttleConfig

concepts:
  - outer_product
  - tensor_tile
  - vector_opcode_extension

provenance: >-
  GENERATED by merlin.targetgen.capability_manifests.derive_manifest from spatial_introspect OPU facts
  (OuterProductUnit state manifest + hw.mlir) grounded onto this residual, at the revision pinned as
  saturn_opu_int8 in merlin/contract/hardware_pins.yaml. The encodings themselves are NOT here: they are
  derived per run by targetgen.rtl.opu_isa from the unit's Chisel sources and cross-checked against the
  unit's own C header, and a disagreement refuses to emit.

notes: >-
  The Saturn OuterProductUnit reached through its vector-opcode instruction extension (accumulate,
  operand move-in, broadcast move-in, accumulator readout). Same silicon as saturn_opu_mxv256d128; a
  different software surface, a different submitted artifact, and a coverage expectation that names
  instructions rather than being empty.
