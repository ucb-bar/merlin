# PINNED COPY of target_experiment.yaml for the g3arm_20260908 batch. DO NOT use for new work.
#
# Arms 1-3 launched when the public/dev corpus held 97 capsules. Mid-batch, commit 68ef1374 added
# `B1s_linear_relu_signed_i8` (a real pytorch_model_slice layer capsule requiring L0-L3), taking the
# live scope to 98, and the resume / official-grade gate then refused every arm with
# 'descriptor-derived task scope drifted' -- correctly: a submission must not be graded against a
# corpus that changed under it.
#
# This copy pins the denominator with grading.search_cohort.include_capsules -- the field built for
# exactly this case ('a new capsule does not silently enter an expensive repeated search'). It is an
# explicit ALLOWLIST of the 97 capsules the arms actually graded, taken from an as-graded round
# verdict, NOT a capability or resource exclusion: B1s is neither, it is simply outside this batch's
# frozen denominator.
#
# The descriptor refuses search_cohort alongside exclusion policies, so the 11 capability
# and 5 resource exclusions are dropped here -- the allowlist already omits every one of
# them (asserted when this file was generated). Their provenance stays recorded in the arms' own
# run records and in the unpinned descriptor.
#
# The shared descriptor is deliberately left UNTOUCHED: another session added that capsule on purpose,
# and new runs should grade all 98.
target: gemmini
rtl:
  via: mlc
hardware_spec:
  isa_headers:
  - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini.h
  - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini_params.h
  hwbringup_set: experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0
  curated_harness: contracts/harness_curated/gemmini-rocc-tests
capsule_corpus: merlin/contract/capsules/isa
grading:
  expected_cohort:
    # Reconciled 113 -> 114 on 2026-09-08: the shared source pool grew (a capsule was added to
    # merlin/contract/capsules while this experiment was in flight). Safe to bump HERE and only
    # here, because this pinned descriptor freezes the graded cohort by the explicit 97-name
    # include_capsules allowlist below -- a new source row cannot enter the graded set, so the
    # denominator the four arms are compared on is unchanged. The upstream `gemmini` descriptor
    # still declares 113 and is NOT touched: bumping it there would move `admitted_capsules`
    # 97 -> 98 and silently change the denominator for every other run on that descriptor.
    source_capsules: 114
    admitted_capsules: 97
  hidden_capability_admission:
    source_capsules: 15
    admitted_capsules: 14
  resource_bound:
    policy: representative_l3_capstones_v1
    required_admitted_models:
    - M2_microvit_gemmini
    - M3_host_island_seam_gemmini
    - SY_micro_model
