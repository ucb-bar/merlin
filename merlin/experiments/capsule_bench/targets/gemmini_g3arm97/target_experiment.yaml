answer_surfaces:
  prior_backends:
  - merlin_native_v0
  - hand_smoke_oot
  - agent_spec_v0_mlir_oot
  - agent_spec_v1_mlir_oot
performance:
  global_objective_capsule: M2_microvit_gemmini
toolchain:
  sim_via: chipyard
host:
  board: chipyard_kodiak
workload_spec:
  models:
  - resnet50
  - tiny_llama
  applications:
  - smolvla_fp32_consistent
  - smolvla_int8_consistent
  - smolvla_denoise_step_fp32_app
  - lstmnetvit_fp8_consistent
  - lstmnetvit_int8_consistent
  - lstmnetvit_int8_w8a8_consistent
  cert_budget_s: 300
  precision_preference:
  - int8
  - fp8_e4m3
  - mxfp8
  - fp16
  - bf16
  - fp32
  max_synthesized_capsules: 160
host_lane:
  description: 'The int8 RVV host compiler: the scalar/vector lane every partitioned Gemmini model capsule falls back to for
    the work the accelerator does not admit (normalization, reduction, activation tails). All of this experiment''s whole-model
    capstones declare compile_dtype=int8, so the frozen package must declare dtype_strategy=int8_w8a8. Frozen for the duration
    of the experiment.'
  repo_canonical: https://github.com/ucb-bar/rvv-mlir.git
  dtype_strategy: int8_w8a8
  provenance: in_tree_minted
  package: out/artifacts/targets/rvv/impr_tuned_wholemodel_vf_int8
  requires_paths:
  - manifest.yaml
  - schedule.mlir
  - knobs.yaml
  read_only:
  - out/artifacts/targets/rvv/impr_tuned_wholemodel_vf_int8/
  deny_modification:
  - merlin/python/merlin/llvmlower/
