# RESIDUAL side-input for the saturn_opu capability contract — the small intent+prose that RTL facts
# cannot ground. capability_manifests.derive_manifest(descriptor, spatial_facts, residual=<this>) grounds
# the FACTS on top: the compute unit's int8+fp8 dtypes + (in,weight)->acc matrix from the OPU datapaths,
# the tile{rows,cols}+mrf_depth geometry, and the command_buffer endpoint from the spatial family default.
# No `encoding` block — the OPU has no funct decode (it is command-buffer driven, not RoCC .insn).
name: saturn_opu_mxv256d128
family: spatial_tensor_tile

compute_units:
  - name: opu
    kind: spatial          # -> family_profile("spatial"): command_buffer endpoint, encoding_required=false, no rocc gate
    ops: [matmul]

concepts:
  - outer_product
  - tensor_tile

provenance: >-
  GENERATED by merlin.targetgen.capability_manifests.derive_manifest from spatial_introspect OPU facts
  (OuterProductUnit state manifest + hw.mlir) grounded onto this residual. render-only prototype;
  requires_human_review.

notes: >-
  Saturn OuterProductUnit spatial tensor tile. Command-buffer driven over one-hot op ports (macc/mvin/
  shift); int8 MAC + fp8 e4m3/e5m2 FMA datapaths. Codegen backend (emit command_buffer.json), the arc
  OpuCosim oracle adapter, and an OPU outer-product capsule corpus are TODO — this contract renders the
  agent brief; it does not yet make the target runnable.
