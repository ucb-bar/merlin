# Gemmini conformance sweep (resumable). Drives merlin.targetgen.eval.gemmini_dispatcher.run_sweep.
name: gemmini_cert
description: >-
  RTL-grounded conformance certification of the Gemmini target. Each (rung x oracle) cell
  lowers a Merlin command buffer, generates the Gemmini kernel, runs it on the oracle, and
  gates three-way bit-exact equality (reference == simulator == oracle output). Resumable via
  a jsonl ledger keyed by run_id; only Verilator/FireSim results are RTL-certified.
rungs: [C0, C1, C4, C4e, C5]  # certifiable (bit-exact) rungs; see eval/gemmini_conformance.py
oracles:
  - {simulator: spike,     level: 1, derived_from_rtl: false, role: bootstrap}
  - {simulator: verilator, level: 2, derived_from_rtl: true,  role: certification}
# Canonical out/ layout (repo-relative; run.py resolves against repo_root). Was the retired top-level
# runs/gemmini_cert from before the out/ restructure.
runs_root: out/runs/gemmini/cert
ledger: out/runs/gemmini/cert/ledger.jsonl
