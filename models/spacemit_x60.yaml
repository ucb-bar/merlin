# models/spacemit_x60.yaml

default_hw: RVV

generic:
  - --iree-hal-target-backends=llvm-cpu
  - --iree-llvmcpu-target-triple=riscv64-unknown-linux-gnu
  - --iree-llvmcpu-target-abi=lp64d
  - --iree-opt-data-tiling=true
  - --iree-llvmcpu-enable-ukernels=none
  - --iree-llvmcpu-link-ukernel-bitcode=false
  - --iree-execution-model=async-external

targets:
  # RVV-enabled (vector) codegen.
  RVV:
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c,+v,+zvl256b
    - --iree-codegen-mmt4d-use-intrinsics
    - --iree-llvmcpu-enable-vector-contract-custom-kernels=true
    - --iree-llvmcpu-loop-vectorization=true
    - --iree-llvmcpu-target-vector-width-in-bytes=32
    # RVV-specific tuning (used by quantized pipelines).
    - --riscv-v-fixed-length-vector-lmul-max=2

  # Ukernel-enabled variants.
  #
  # The `generic:` block above sets --iree-llvmcpu-enable-ukernels=none, which
  # makes 826 lines of vendored RISC-V int8 microkernel dead code in every K1
  # build: third_party/iree_bar/.../riscv_64/mmt4d_riscv_64_v_i8.c contains an
  # RVV int8 mmt4d tile family (M0 in {1,2,4,7,8}, N = VLEN/32 x 2, i.e. 8x16x1
  # at VLEN 256) AND a native 4x4x8 smt.vmadot kernel. Neither has ever been
  # linked here.
  #
  # These two variants override to link it, and are kept SEPARATE from RVV and
  # IME rather than changing them, so the existing measurements stay
  # comparable and the ukernel path is an A/B rather than a silent
  # substitution. Note enable-vector-contract-custom-kernels is turned OFF
  # here: the custom-kernel path and the ukernel path are two different ways to
  # reach the same instruction, and leaving both on makes it ambiguous which
  # one produced a given vmadot.
  RVV_ukernel:
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c,+v,+zvl256b
    - --iree-codegen-mmt4d-use-intrinsics
    - --iree-llvmcpu-enable-vector-contract-custom-kernels=false
    - --iree-llvmcpu-enable-ukernels=all
    - --iree-llvmcpu-link-ukernel-bitcode=true
    - --iree-llvmcpu-loop-vectorization=true
    - --iree-llvmcpu-target-vector-width-in-bytes=32
    - --iree-opt-data-tiling=true
    - --riscv-v-fixed-length-vector-lmul-max=2

  IME_ukernel:
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c,+v,+zvl256b,+xsmtvdot
    - --iree-codegen-mmt4d-use-intrinsics
    - --iree-llvmcpu-enable-vector-contract-custom-kernels=false
    - --iree-llvmcpu-enable-ukernels=all
    - --iree-llvmcpu-link-ukernel-bitcode=true
    - --iree-llvmcpu-loop-vectorization=true
    - --iree-llvmcpu-target-vector-width-in-bytes=32
    - --iree-opt-data-tiling=true
    - --riscv-v-fixed-length-vector-lmul-max=2

  # SpaceMiT IME (smt.vmadot) int8 matrix extension.
  #
  # LEGAL ON CLUSTER 0 ONLY (cores 0-3). Measured with a per-core SIGILL probe:
  # smt.vmadot executes on cores 0-3 and traps on cores 4-7. A dispatch built
  # with this variant does not degrade on cluster 1 -- it dies. xpu-rt's
  # capabilities.py rejects that placement before scheduling.
  #
  # Flags follow third_party/iree_bar/tests/e2e/SpacemiT/compile_vmadot.sh, the
  # recipe that actually emits vmadot. Note it deliberately does NOT use
  # ukernels: IME comes out of vector.contract custom kernels plus mmt4d
  # intrinsics, so enable-ukernels stays none and
  # enable-vector-contract-custom-kernels must be true. (The variant in
  # benchmarks/SpacemiTX60/compile_matmul_xsmt_i8_ukernel_all.sh inverts both
  # and additionally references files absent at the pinned IREE SHA.)
  #
  # Verify with: llvm-objdump -d --mattr=+m,+a,+f,+d,+c,+v,+zvl256b,+xsmtvdot <obj> | grep vmadot
  # A build that silently fell back to RVV must be rejected, not profiled.
  IME:
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c,+v,+zvl256b,+xsmtvdot
    - --iree-codegen-mmt4d-use-intrinsics
    - --iree-llvmcpu-enable-vector-contract-custom-kernels=true
    - --iree-llvmcpu-enable-ukernels=none
    - --iree-llvmcpu-link-ukernel-bitcode=false
    - --iree-opt-data-tiling=true
    - --iree-llvmcpu-loop-vectorization=true
    - --iree-llvmcpu-target-vector-width-in-bytes=32
    - --riscv-v-fixed-length-vector-lmul-max=2

  # Scalar-only (no V extension). Useful as a baseline and/or for cores without RVV.
  scalar:
    - --iree-llvmcpu-target-cpu-features=+m,+a,+f,+d,+c
    - --iree-codegen-mmt4d-use-intrinsics=false
    - --iree-llvmcpu-enable-vector-contract-custom-kernels=false
    - --iree-llvmcpu-loop-vectorization=false

quantized:
  - --iree-llvmcpu-skip-intermediate-roundings=true

models:
  dronet:
    - --iree-preprocessing-pass-pipeline=builtin.module(util.func(iree-global-opt-quantized-conv-to-conv, iree-preprocessing-convert-conv2d-to-img2col))
  smolVLA:
    - --iree-input-type=torch
    - --iree-opt-const-eval=false
    - --iree-global-opt-enable-demote-contraction-inputs-to-bf16=matmul
  smolvla_mx:
    - --iree-input-type=torch
    - --iree-opt-const-eval=false
    - --iree-global-opt-enable-demote-contraction-inputs-to-bf16=matmul
