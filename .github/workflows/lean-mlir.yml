name: lean-mlir

on:
  push:
    paths:
      - 'merlin/lean/**'
      - 'src/merlin/verify/**'
      - 'src/merlin/transforms/**'
      - 'src/merlin/common/owned_process.py'
      - 'src/merlin/llvmlower/**'
      - 'src/merlin/runtime/backends/zephyr_model.py'
      - 'src/merlin/runtime/dispatch_runtime.py'
      - 'merlin/contract/schemas/lean_*.json'
      - 'merlin/tests/ir/*lean*'
      - 'merlin/tests/ir/test_compiler*'
      - 'merlin/tests/data/lean_suite.json'
      - 'build_tools/scripts/run_lean_tests.py'
      - 'merlin/tests/ir/conftest.py'
      - 'merlin/tests/infra/test_owned_process.py'
      - 'merlin/tests/ir/test_lower_quant_ext_granularities.py'
      - 'merlin/tests/ir/test_normalization_reassociation.py'
      - 'merlin/tests/fixtures/lean*'
      - 'build_tools/scripts/check_lean_guard.py'
      - 'build_tools/toolchains/*'
      - '.github/workflows/lean-mlir.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
  workflow_dispatch:

jobs:
  lean-mlir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MERLIN_LEAN_REQUIRED: '1'
      MERLIN_COMPILER_PYTHON: ${{ github.workspace }}/out/build/lean/mlir-venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install test dependencies and pinned MLIR bindings
        run: |
          uv sync --frozen --extra dev --extra verify --extra targetgen
          uv venv --python 3.12 out/build/lean/mlir-venv
          uv pip install --python "$MERLIN_COMPILER_PYTHON" --no-deps -r build_tools/toolchains/lean-mlir-requirements.txt
      - name: install Lean (repository toolchain pin)
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd merlin/lean
          sdk_bin="$(dirname "$("$HOME/.elan/bin/elan" which lean)")"
          echo "MERLIN_LEAN_SDK_BIN=$sdk_bin" >> "$GITHUB_ENV"
      - name: fetch Mathlib cache
        working-directory: merlin/lean
        run: lake exe cache get
      - name: build and audit all Lean declarations and pinned statements
        run: uv run --no-sync python build_tools/scripts/check_lean_guard.py
      - name: bounded compiler verification regression suite (200 cases)
        run: |
          uv run --no-sync python build_tools/scripts/run_lean_tests.py -q \
            -o junit_family=xunit1 \
            --junitxml=out/artifacts/verification/lean-mlir.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-mlir-test-results
          path: out/artifacts/verification/lean-mlir.xml
