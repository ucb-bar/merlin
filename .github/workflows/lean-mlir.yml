name: lean-mlir

on:
  push:
    paths:
      - 'merlin/lean/**'
      - 'src/merlin/verify/lean/**'
      - 'src/merlin/llvmlower/**'
      - 'src/merlin/runtime/backends/zephyr_model.py'
      - 'src/merlin/runtime/dispatch_runtime.py'
      - 'merlin/contract/schemas/lean_*.json'
      - 'merlin/tests/ir/*lean*'
      - 'merlin/tests/ir/conftest.py'
      - 'merlin/tests/ir/test_lower_quant_ext_granularities.py'
      - 'merlin/tests/ir/test_normalization_reassociation.py'
      - 'merlin/tests/fixtures/lean*'
      - 'build_tools/scripts/check_lean_guard.py'
      - 'build_tools/toolchains/*'
      - '.github/workflows/lean-mlir.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
  workflow_dispatch:

jobs:
  lean-mlir:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MERLIN_LEAN_REQUIRED: '1'
      MERLIN_M2M_PYTHON: ${{ github.workspace }}/out/build/lean/mlir-venv/bin/python
      MERLIN_TORCH_PYTHON: ${{ github.workspace }}/out/build/lean/torch-venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install test dependencies and pinned MLIR bindings
        run: |
          uv sync --frozen --extra dev --extra verify --extra targetgen
          uv venv --python 3.12 out/build/lean/mlir-venv
          uv pip install --python "$MERLIN_M2M_PYTHON" --no-deps -r build_tools/toolchains/lean-mlir-requirements.txt
      - name: install isolated pinned CPU source oracle
        run: |
          uv venv --python 3.12 out/build/lean/torch-venv
          uv pip install --python "$MERLIN_TORCH_PYTHON" --no-deps -r build_tools/toolchains/lean-torch-requirements.txt
      - name: install Lean (repository toolchain pin)
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: fetch Mathlib cache
        working-directory: merlin/lean
        run: lake exe cache get
      - name: build and audit all Lean declarations and pinned statements
        run: uv run --no-sync python build_tools/scripts/check_lean_guard.py
      - name: authoritative round trips, receipts, races and semantic differential tests
        # Collect every binding-only Lean suite, including new rewrite/definedness families.
        # Native execution and standalone parser comparisons require separately installed LLVM
        # tools and run out of band. Keep that exclusion explicit; no backend substitution.
        run: |
          set -euo pipefail
          lean_suites=()
          for suite in merlin/tests/ir/test_lean_*.py; do
            case "$suite" in
              */test_lean_differential.py|*/test_lean_splat_inputs.py|\
              */test_lean_integer_fold_native.py|*/test_lean_reshape_differential.py|\
              */test_lean_integer_identity_native.py|*/test_lean_reshape_mixed_differential.py|\
              */test_lean_splat_nested_differential.py|*/test_lean_control_differential.py|\
              */test_lean_integer_cast_native.py|*/test_lean_reshape_typed_differential.py|\
              */test_lean_integer_body_differential.py|*/test_lean_shared_normalize_differential.py|\
              */test_lean_reshape_chain_differential.py|*/test_lean_integer_idempotent_native.py|\
              */test_lean_reshape_nested_differential.py|*/test_lean_floating_source_native.py|\
              */test_lean_defined_bounds_differential.py|*/test_lean_integer_cast_nested_native.py|\
              */test_lean_scalar_carrier_differential.py|*/test_lean_index_bounds_differential.py|\
              */test_lean_defined_conversions_native.py) continue ;;
            esac
            lean_suites+=("$suite")
          done
          uv run --no-sync pytest -q -n 2 --dist loadfile "${lean_suites[@]}" \
            merlin/tests/ir/test_lower_quant_ext_granularities.py \
            merlin/tests/ir/test_normalization_reassociation.py \
            -k 'not standalone and not test_round_trip_identical' \
            -o junit_family=xunit1 \
            --junitxml=out/artifacts/verification/lean-mlir.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-mlir-test-results
          path: out/artifacts/verification/lean-mlir.xml
