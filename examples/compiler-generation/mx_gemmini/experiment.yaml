schema_version: 2
kind: template
id: mx-gemmini-functional
target: mx_gemmini
description: Test generation and combined correctness/performance backend generation; select reviewed operator inputs before execution.
stages:
  test-generation:
    adapter: capsule_derivation
    config:
      recipe: test-generation/recipe.yaml
      performance_template: ../../../experiments/templates/test-generation/performance.yaml
      synth_profile: ../../../out/operator-inputs/mx_gemmini/mx_gemmini.synth.yaml
      smt_profile: ../../../out/operator-inputs/mx_gemmini/mx_gemmini.smt.yaml
      hidden_profile: ../../../out/operator-inputs/mx_gemmini/mx_gemmini.hidden.yaml
      descriptor: target/descriptor.yaml
  backend-generation:
    adapter: capsule_bench
    config:
      # Supply --corpus-seal and --bundle-manifest from the same reviewed release.
      require_reviewed_corpus: true
      # Select actual reviewed files with --backend-joint-campaign / --backend-oracle-timing.
      joint_campaign: ../../../out/operator-inputs/mx_gemmini/joint-policy.json
      fresh_backend: true
      schedule: continuous
      descriptor: target/descriptor.yaml
      level: EL4
      bundle: OPERATOR_BUNDLE_ID
      bundle_manifest: ../../../out/operator-inputs/mx_gemmini/input_bundle_manifest.yaml
      oracle_timing: ../../../out/operator-inputs/mx_gemmini/oracle-timing.json
      model: claude-opus-4-8
      effort: high
      driver: claudecode
      provider: subscription
      max_wall_s: 43200
      round_timeout: 43200
      grade_interval: 900
