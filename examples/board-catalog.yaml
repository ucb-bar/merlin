# Example board catalog: target-owned facts for bring-up demonstrations.
#
# Select explicitly with MERLIN_BOARD_CATALOG=examples/board-catalog.yaml.
# Installed Merlin has no board facts until a target-owned catalog is selected.
# Targeting a new board is an OOT catalog entry, not a core code change -- the field meanings, and the failure mode
# each one prevents when it is wrong, are documented on the `Board` dataclass in that module. Unknown
# fields and unknown enum values are REFUSED at load time rather than ignored.
#
# Facts are derived from each board's own repo, device tree and silicon, not assumed. Where the board's
# own files and the chip disagree, the chip wins and the entry says so.
#
# Value spellings:
#   * byte sizes (`dram_bytes`, `code_reserve`) are an integer or "<n> KiB|MiB|GiB";
#   * every entry explicitly states `dram_base`, `console`, `flow`, `loader`, and `loader_baud`;
  #   * Zephyr entries state `ram_label` (and UART entries also state `uart_label`);
  #   * Zephyr entries state their port's default RAM region and linked-region limit;
  #     an external-weights layout also states its low region and reserved DRAM tail;
#   * bare-metal entries state `code_reserve`;
#   * `console` is htif | uart, `flow` is zephyr | baremetal, `loader` is uart_tsi | pyuartsi;
#   * `vector_hart_ids` is a list of hart ids;
#   * `target` names the merlin target whose RTL the board elaborates. Per-target environment names
#     derive from it (the Verilator binary override is MERLIN_<TARGET>_VERILATOR);
#   * `rtl_sim_config` is the chipyard harness config that elaborates THIS board's SoC, so its simulator
#     is `simulator-chipyard.harness-<rtl_sim_config>`;
#   * `bitstream` is the FireSim hardware config a FireSim board's measurements were taken on.
schema_version: 1

boards:
  # The substrates we already validate on, described here so the same code path serves them.
  spike_riscv64:
    simulator: spike
    dram_bytes: 2 GiB
    dram_base: 0x80000000
    zephyr_default_ram_bytes: 256 MiB
    zephyr_link_limit_bytes: 1900 MiB
    harts: 8
    vector_harts: 8
    vlen: 128
    console: htif
    flow: zephyr
    loader: uart_tsi
    loader_baud: 921600
    ram_label: ram0
    fpu_sharing: false
    zephyr_vector_ext: true
    notes: "functional simulator; DRAM is whatever `-m` says, VLEN comes from the ISA string"

  # The chipyard multicore vector SoC as Verilator elaborates it. Its config
  # (generators/chipyard/src/main/scala/config/MerlinSaturnConfigs.scala) is WithNShuttleCores(4) with a
  # vLen=256/dLen=128 vector unit on every tile -- which is where `harts` and `vlen` below come from. Every
  # stock config of that vector unit is single-core, and the only stock 2-tile SoC puts a vector unit on
  # one tile only, so neither can host a multi-hart RVV image.
  chipyard_riscv64:
    dt_cpu_nodes: 8
    dram_bytes: 256 MiB
    dram_base: 0x80000000
    zephyr_default_ram_bytes: 256 MiB
    zephyr_link_limit_bytes: 1900 MiB
    harts: 4
    vector_harts: 4
    vlen: 256
    console: htif
    flow: zephyr
    loader: uart_tsi
    loader_baud: 921600
    ram_label: ram0
    fpu_sharing: false
    zephyr_vector_ext: true
    target: saturn
    rtl_sim_config: MultiSaturnV256D128ShuttleConfig
    notes: "Verilator/FireSim multi-Saturn SoC"

  # The FPGA TARGET is its own board, not the DTS default. `chipyard_riscv64` keeps ram0's 256 MB because
  # that is what a Verilator/spike run of that config has; the FireSim dual-Saturn target has
  # WithExtMemSize = 16 GB at 0x80000000 (see the external-memory fields below and the whole-model TinyLlama run
  # whose 482 MB of weights could not otherwise have been linked). Conflating the two is what made
  # whisper_tiny -- 464 MB of region -- look like it did not fit on a 16 GB target.
  firesim_dual_saturn:
    zephyr_board: chipyard_riscv64
    dt_cpu_nodes: 8
    dram_bytes: 16 GiB
    dram_base: 0x80000000
    zephyr_default_ram_bytes: 256 MiB
    zephyr_link_limit_bytes: 1900 MiB
    zephyr_external_ram_bytes: 1 GiB
    zephyr_external_tail_reserve_bytes: 256 MiB
    harts: 2
    vector_harts: 2
    vlen: 256
    console: htif
    flow: zephyr
    loader: uart_tsi
    loader_baud: 921600
    ram_label: ram0
    fpu_sharing: false
    zephyr_vector_ext: true
    target: saturn
    bitstream: alveo_u250_firesim_dual_saturn_v256d128
    notes: >-
      FireSim alveo_u250_firesim_dual_saturn_v256d128: 2 Shuttle tiles each with a Saturn unit at
      vLen=256/dLen=128, 25 MHz fpga_frequency (~24.9 MHz effective measured), 16 GB target DRAM.

  # The Kodiak boards (chipyard_kodiak, kodiak_opu_2core, firesim_kodiak_opu) are owned by the Kodiak
  # support package: boards.yaml in ucb-bar/kodiak-mlir, fetched at its pinned commit by
  # `examples/kodiak/run.sh setup` (or `merlin-target-fetch kodiak`). examples/kodiak/run.sh selects it
  # beside this catalog; by hand: MERLIN_BOARD_CATALOG=examples/board-catalog.yaml:$(merlin-target-fetch kodiak --root)

  # gemmelos: NOT a Zephyr target. github.com/Rakanic/gemmelos-bringup is a fork of ucb-bar/Baremetal-IDE
  # -- a bare-metal CMake SDK with no RTOS (grep -ri zephyr returns nothing) -- covering two chips
  # selected by -DCHIP=. Facts below come from its platform/<chip>/*.ld and chip_config.h. Its default
  # linker script declares 256 MB of DRAM; the silicon has 1 GB, which is what we build for.
  #
  # VLEN=256, and this was WRONG here (128) until the chip itself answered. Its own OPE kernel says
  # "VLEN=128/LMUL=4 gives VLMAX=16" while their spike runs use 256, so the tree was ambiguous and 128 was
  # the cautious-looking pick. `vlen_probe.elf` on the silicon reports `vlenb 32`, `vlmax_e8 32`,
  # `vlmax_e32 8` -- three mutually consistent readings of the hardware CSR, i.e. VLEN=256. A comment in a
  # vendor kernel is not a fact about the part; a `csrr vlenb` on the part is. Under-declaring it is not
  # merely slow: see `zephyr_model._vector_max_len_bits` for the kernel-memory corruption it caused, and
  # note that no simulator gate can catch it, because spike is given the VLEN we declare. Console is UART0
  # @115200 8N2 for PLATFORM=CHIP builds and HTIF for PLATFORM=SIMS; our bare-metal harness speaks HTIF,
  # which is what the uart_tsi/FESVR link carries.
  gemmelos_bearly25:
    dram_bytes: 1 GiB
    dram_base: 0x80000000
    harts: 2
    vlen: 256
    console: uart
    loader: uart_tsi
    loader_baud: 921600
    code_reserve: 64 MiB
    sdk_chip: bearly25
    chip_freq_hz: 500000000
    flow: baremetal
    notes: >-
      Bearly ML 25 via Baremetal-IDE (-DCHIP=bearly25). 2 harts, hart 1 idles in wfi until dispatched;
      -march=rv64gcv_zfh -mabi=lp64d -mcmodel=medany; entry _start resumed at 0x80000000. NOT Zephyr.
      Console is the chip's own UART0 (facts derived from its SDK headers): PLATFORM=CHIP builds have no
      host to service HTIF, so an HTIF image hangs in its first print. PLL raised to 500 MHz, the
      frequency their own demos run at.

  # The SAME chip through Zephyr rather than bare metal, which is the only way to get RVV MULTICORE there:
  # on bare metal hart 1 waits in wfi for their own thread-lib to dispatch it, while Zephyr SMP + merlin's
  # OpenMP shim drives both harts the way every other multicore image here does. Facts from
  # platform/bearly25/chip_config.h: SYS_CLK_FREQ 50 MHz, MTIME_FREQ 50 kHz (hence the tick override -- a
  # 50 kHz timebase against a default 10 kHz tick rate is the Kodiak pathology again), CLINT at
  # 0x02000000, DRAM at 0x80000000. TWO harts, confirmed by the chip's owner; their tree is ambiguous about
  # it (thread-lib/hthread.h says 2, four other lib copies say 4) and guessing high would be a silent
  # SMP-boot hang, so this is a fact worth having been told.
  gemmelos_bearly25_zephyr:
    zephyr_board: chipyard_riscv64
    dt_cpu_nodes: 8
    dram_bytes: 1 GiB
    dram_base: 0x80000000
    zephyr_default_ram_bytes: 256 MiB
    zephyr_link_limit_bytes: 1900 MiB
    harts: 2
    vector_harts: 2
    vlen: 256
    console: uart
    loader: uart_tsi
    loader_baud: 921600
    ram_label: ram0
    uart_label: uart0
    fpu_sharing: false
    zephyr_vector_ext: true
    sdk_chip: bearly25
    flow: zephyr
    tick_hz: 100
    notes: >-
      Bearly ML 25 via the GENERIC chipyard Zephyr board (their SDK has no Zephyr port). 50 MHz core,
      50 kHz CLINT timebase, CLINT 0x02000000, DRAM 0x80000000 (1 GB real, 256 MB in their .ld). 2 harts
      (confirmed by the chip's owner). Console is the chip's own UART: that board's defconfig selects
      UART_HTIF, which needs a host servicing tohost and hangs on silicon, and the generic chipyard DT
      already describes this SoC's UART at the address the SDK headers give. No PLL programming on this
      path -- the chip stays on its 50 MHz reset clock and the baud divisor matches it; cycle counts are
      unaffected. See gemmelos_bearly25_zephyr_500mhz for the variant that raises it.

  # The same board, with the chip's PLL raised to the frequency the vendor's own demos run at.
  #
  # Split into a second descriptor rather than made the default, deliberately. The upside is large -- 10x,
  # on the one thing the chip's owner actually wants to do, and their own whisper demo decodes in about
  # fifteen seconds at this clock while ours had no reason to be at a tenth of it. The downside is that
  # programming a PLL wrong does not fail quietly into "no output": it garbles the console, which reads as
  # a corrupt program. So the 50 MHz set stays the one to run first, and this ships beside it. If both
  # come back, we learn the clock AND the correctness in one round trip; if only the slow one does, we
  # have still moved forward.
  #
  # The sequence itself is derived, not written: runtime.sdk_facts parses the PLL base, register offsets,
  # clock-selector map and reset clock out of the chip's own headers, and
  # runtime/c/merlin_socinit_zephyr.c replays their bmark-lib `init_test` order against it.
  gemmelos_bearly25_zephyr_500mhz:
    zephyr_board: chipyard_riscv64
    dt_cpu_nodes: 8
    dram_bytes: 1 GiB
    dram_base: 0x80000000
    zephyr_default_ram_bytes: 256 MiB
    zephyr_link_limit_bytes: 1900 MiB
    harts: 2
    vector_harts: 2
    vlen: 256
    console: uart
    loader: uart_tsi
    loader_baud: 921600
    ram_label: ram0
    uart_label: uart0
    fpu_sharing: false
    zephyr_vector_ext: true
    sdk_chip: bearly25
    chip_freq_hz: 500000000
    flow: zephyr
    tick_hz: 100
    notes: >-
      Bearly ML 25 through the generic chipyard Zephyr port, with the PLL raised to 500 MHz before the
      console driver's divisor is applied (SYS_INIT at CONFIG_SERIAL_INIT_PRIORITY+1, so the driver cannot
      overwrite it). Identical computation to gemmelos_bearly25_zephyr; only the clock differs.

  gemmelos_dsp25:
    dram_bytes: 1 GiB
    dram_base: 0x80000000
    harts: 2
    vlen: 128
    console: uart
    loader: uart_tsi
    loader_baud: 921600
    code_reserve: 64 MiB
    sdk_chip: dsp25
    chip_freq_hz: 500000000
    flow: baremetal
    notes: >-
      DSP 25 via Baremetal-IDE (-DCHIP=dsp25). Same ABI/entry as bearly25; NOT Zephyr. Console is UART0,
      derived from its own platform/dsp25 headers -- where the clock selector sits at RCC_BASE+0x30000
      rather than at RCC_BASE, which is why that address is derived from the SDK's RCC_CLOCK_SELECTOR
      define and not assumed.
