  addendum: "operator approval 2026-10-03 in this session: exact rank-3/4 i8/f32/i64 dequantize_per_tensor host contract only; finite native checks do not prove device execution"
  primitive_addendum: "operator approval 2026-10-06 in this session: only the eight exact typed scalar-host primitive declarations below; finite saved probes do not certify all inputs, emitted compiler, accelerator, or RTL execution"
  selected_source_addendum: "Selected-lowering build/link/host-placement review only: exact typed source bodies, selected index bounds and linked-image checks remain mandatory; all new numerical contracts are unreviewed. Source-call-to-symbol routing is not proved."
compiler:
