# Target-owned host facts for the preferred full Gemmini/Rocket elaborations.
# Select explicitly: MERLIN_BOARD_CATALOG=examples/gemmini/platform/board-catalog.yaml.
# These are placement/build inputs, not evidence that a Merlin host image ran.
schema_version: 1
boards:
  gemmini_rocket_verilator:
    target: gemmini
    rtl_sim_config: GemminiRocketConfig
    host_dts_sha256: a45460168248bd08e47a237f78eb1256d589b5410c046f0031e648207a83dfc3
    dram_bytes: 256 MiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      GemminiRocketConfig DTS has one rv64imafdcbzicsr_zifencei_zihpm_zfh_zba_zbb_zbs_xrocket
      CPU, a 256 MiB enabled memory node at 0x80000000, and an HTIF node. The DTS
      chosen stdout is SiFive UART; HTIF here selects the generic simulator-serviced
      bare-metal console, which has not been executed for this image. The 64 MiB code
      reserve is a build-layout request, not a measured hardware property. No ELF upload
      loader or baud is qualified, so upload estimates must refuse this entry.

  gemmini_rocket_spike_functional:
    target: gemmini
    host_dts_sha256: a45460168248bd08e47a237f78eb1256d589b5410c046f0031e648207a83dfc3
    dram_bytes: 16 GiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      Retained functional instruction-set model of the GemminiRocketConfig host;
      newly prepared Phase 1 full-model programs select the FireSim board below.
      The model's CPU ISA roster is read from this selected DTS. It uses the
      accelerator extension and a declared 16 GiB memory span starting at
      0x80000000. This spans larger whole models without treating the Verilator
      board's 256 MiB DTS limit as a functional-memory limit. It is not evidence
      of FireSim physical capacity, RTL correctness, or cycle timing.

  firesim_gemmini_rocket_u250_30mhz:
    target: gemmini
    rtl_sim_config: FireSimGemminiRocketConfig
    bitstream: alveo_u250_firesim_gemmini_rocket_30mhz
    host_dts_sha256: c4a2009a405945ea98f731713e0f4e7dc483031ab8cd5156d871e4eb7594f1df
    dram_bytes: 16 GiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      FireSimGemminiRocketConfig DTS has one CPU with the same non-vector Rocket ISA
      and a 16 GiB enabled memory node at 0x80000000. It declares an HTIF node and
      SiFive UART as chosen stdout. This entry names the preferred full U250 bitstream,
      not the historical lean design. The DTS span is an address-map declaration,
      not proof that the pinned FPGA bitstream can use all 16 GiB; qualify actual
      capacity on the selected bitstream before a whole-model hardware claim.
      HTIF execution, the provisional code reserve, and any ELF upload mechanism
      still need qualification; no loader/baud is claimed.

  gemmini_rocket_gsim_fire_aligned:
    target: gemmini
    rtl_sim_config: GemminiGsimFireSimAlignedConfig
    host_dts_sha256: c4a2009a405945ea98f731713e0f4e7dc483031ab8cd5156d871e4eb7594f1df
    dram_bytes: 16 GiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      Native gSIM wrapper around the same Rocket/Gemmini target and 16 GiB
      guest address map selected by the FireSimGemminiRocketConfig DTS.
