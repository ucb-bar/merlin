      zero_point: 0
      quant_min: -128
      quant_max: 127
  numerical_contract:
    status: unreviewed
    semantics:
      formula: q = clamp(round_half_even(x / scale) + zero_point, quant_min, quant_max)
      quotient: exact_rational_no_reciprocal
      rounding: round_half_to_even
      scale: binary64 operand equal to prov.quant.scale_numerator/scale_denominator (lowering refuses otherwise)
      scale_granularity: tensor
      zero_point: 0
      quant_min: -128
      quant_max: 127
      infinity: saturates_to_quant_min_or_quant_max
      nan: runtime_assert_refusal (unless recipe quantization_nonfinite=byte_storage_zero_nan_saturating_infinity sets merlin.quantizer_nan_storage_zero, then NaN -> code 0)
    evidence:
      review_status: proposed; operator review required before status may be reviewed
      basis: 'model2MLIR m2m_q::quantize CPU evaluator m2m/capture/exact_quant.py quantize_tensor
        (exact Fraction quotient, Python round half-even, clamp, NaN raises); host lowering
        llvmlower/passes_xdsl.py selects llvmlower/exact_quantize.py for prov.aten
        m2m_q.quantize.default (255 exact RNE thresholds over ordered binary32 codes,
        integer bisection, cf.assert on NaN). Threshold-adjacency check over every
        threshold proves the table equals the evaluator for every finite binary32
        input at the checked scales; RV64 execution remains a separate obligation.'
