# Experiment resources and workload policy; hardware facts are extracted inputs.
# See ../phase0/README.md for deterministic derivation and evidence selection.
target: gemmini
resources_root: merlin/experiments/capsule_bench/targets/gemmini
task_root: examples/gemmini/phase1/task
# Present but intentionally empty (see its README): no curated harness or ISA headers are granted,
# and a declared root stops contract lookups from falling back to legacy capsule_bench contracts.
# Release preparation drops this pointer.
contracts_root: examples/gemmini/phase1/contracts
numeric_profile: examples/gemmini/phase0/recipe.yaml

rtl:
  via: mlc            # RTL facts are DERIVED from mlc discovery (MERLIN_MLC_DIR, the target above)

# Runtime/ISA facts must be independently derived from the selected RTL.
# No curated library kernels or handwritten backend headers are provided.
hardware_spec: {}

capsule_corpus: merlin/contract/capsules/isa

grading:
  release_admission: derive_from_corpus_v1
  resource_bound:
    policy: representative_l3_capstones_v1
    # Derived at release preparation from the staged corpus: every whole-model capsule Phase 0
    # generated and admitted (an integer model only with its model_qualification) is a required
    # capstone; any other public model is excluded by name. No hand-maintained model list.
    derive: phase0_qualified_models_v1

# Operator-side formal obligation. The frozen private specification supplies the
# exact complete captures, source identities and byte pins; it is never copied to
# the authoring workspace or named in this public descriptor.
phase1_gates:
  private_full_models:
    required: true
    models: [resnet50, smolvla, tiny_llama]
    programs:
      resnet50: [model]
      smolvla: [prefix_encode, flow_denoise, action_decode]
      tiny_llama: [prefill, decode]
    source_workload_dirs:
      resnet50: resnet50_v1_5
      smolvla: smolvla
      tiny_llama: tiny_llama
    required_selected_roles:
      resnet50: [checkpoint]
      smolvla: [checkpoint, input]
      tiny_llama: [checkpoint]
    deployment_dtypes:
      resnet50: int8
      smolvla: int8
      tiny_llama: int8
    require_integer_contractions: true
    required_loader_env:
      resnet50:
        M2M_RESNET_PRETRAINED: "1"
      smolvla:
        M2M_SMOLVLA_SESSION: e2e
        M2M_SMOLVLA_PRETRAINED: "1"
        M2M_SMOLVLA_PAPER_READY: "1"
      tiny_llama:
        M2M_LLAMA_SESSION: e2e
    forbidden_loader_env:
      smolvla: [M2M_SMOLVLA_VLM_LAYERS, M2M_SMOLVLA_EXPERT_LAYERS, M2M_SMOLVLA_TAP]
      tiny_llama: [M2M_LLAMA_LAYERS]
  # Operator-side numerical execution of the SAME linked ELFs the static gate above verified
  # (merlin_experiments.phase1.feedback.private_full_model_execution), run by the formal grade after
  # the freeze. Every program of the roster executes; each is linked with full readback (every
  # result printed whole) and its group calls bracketed with cycle counts.
  # Correctness is the QUANTIZED program's semantics, never the float model's:
  #   integer_reference  every result the capture's receipt-bound integer reference states is
  #                      value-exact, wherever the saved program's own host execution reproduces that
  #                      reference exactly (where it does not, the reference's float nonlinear
  #                      arithmetic is not the saved program's, and the result falls to host_execution);
  #   host_execution     every other result is held to an independent host execution of the same
  #                      quantized saved program; host execution is deterministic and the scalar device
  #                      reproduces it exactly, so the tolerance only admits float-order rounding
  #                      (about a hundred float32 ulps), never a changed quantization;
  #   fp32_sanity        the float model is a sanity bound: per result, cosine to it must be at least
  #                      1 - cosine_margin * (1 - cosine of the quantized program's own result to it),
  #                      calibrated per capture; top1 (result 0) must equal the float model's on every
  #                      row where the quantized program's own top-1 does.
  # The engine sets the scope of the evidence: `gsim` is the RTL-equivalent engine (numerics and
  # cycles); `spike` is the functional instruction-set model with the accelerator extension
  # (spike-functional: numerics only, never certification or timing), on the declared functional
  # board, whose DRAM holds the whole program's weights. max_cycles and timeout_s are hang bounds.
  # smolvla.action_decode carries no contraction (no quantization work), so its capture states no
  # integer reference and host execution judges it.
  whole_model:
    private_full_models:
      required: true
      programs:
        resnet50:
          model:
            engine: gsim
            board: gemmini_rocket_verilator
            max_cycles: 150000000
            timeout_s: 86400
            integer_reference: [integer-reference.json]
            require_integer_reference: true
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: true}
            group_profile: true
        smolvla:
          prefix_encode:
            engine: spike
            board: gemmini_rocket_spike_functional
            timeout_s: 86400
            integer_reference: [integer-reference.json]
            require_integer_reference: true
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: false}
            group_profile: true
          flow_denoise:
            engine: spike
            board: gemmini_rocket_spike_functional
            timeout_s: 86400
            integer_reference: [integer-reference.json]
            require_integer_reference: true
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: false}
            group_profile: true
          action_decode:
            engine: spike
            board: gemmini_rocket_spike_functional
            timeout_s: 14400
            integer_reference: [integer-reference.json]
            require_integer_reference: false
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: false}
            group_profile: true
        tiny_llama:
          prefill:
            engine: spike
            board: gemmini_rocket_spike_functional
            timeout_s: 172800
            integer_reference: [integer-reference.json]
            require_integer_reference: true
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: false}
            group_profile: true
          decode:
            engine: spike
            board: gemmini_rocket_spike_functional
            timeout_s: 86400
            integer_reference: [integer-reference.json]
            require_integer_reference: true
            host_execution: {atol: 1.0e-6, rtol: 1.0e-5}
            fp32_sanity: {reference: float_reference.json, cosine_margin: 4, top1: false}
            group_profile: true

answer_surfaces:
  prior_backends: [merlin_native_v0, hand_smoke_oot, agent_spec_v0_mlir_oot, agent_spec_v1_mlir_oot]
  prior_backend_exemptions: []

performance:
  global_objective_capsule: M2_microvit_gemmini

toolchain:
  sim_via: chipyard

oracle_resources:
  L5:
    exclusive_resource: firesim_fpga_queue
    batched: true
    queue_wall_limit_s: 43200

host:
  board: gemmini_rocket_verilator
  catalog: examples/gemmini/target/board-catalog.yaml

workload_spec:
  models: [resnet50, tiny_llama, smolvla]
  # OBJECTIVE VARIANTS of a claim model: the same network captured with a capture capability
  # (`quant_activation_contractions` integerizes the activation x activation contractions,
  # `quant_integer_nonlinear` adds integer softmax / GELU / layer norm). Each is a different numerical
  # model the owner measures after the Phase-1 freeze, exactly like the claim model it names; none is
  # a derivation source. Equivalent forms for derivation come from the `multimodal_policy` application.
  claim_objective_variants:
    smolvla:
      int8attn:
        quant_scheme: int8_dyn_act_int8_weight
        quant_activation_contractions: true
      int8full:
        quant_scheme: int8_dyn_act_int8_weight
        quant_activation_contractions: true
        quant_integer_nonlinear: true
  # The iteration roster; its capture inputs (loader and profile per label) are staged from
  # phase0-workloads.yaml beside this file.
  applications:
    - coverage_mlp
    - residual_cnn
    - causal_decoder
    - causal_decoder_decode_step
    - multimodal_policy
  # Independent performance-scale workloads whose forms feed only the Phase 2 form scope
  # (`corpus derive --performance-capture LABEL=PATH`); never Phase 1 forms or source capsules.
  performance_applications: [residual_cnn_scale, decoder_scale, decoder_step_scale, vit_scale]
  historical_application_suites:
    model_scale: [deepjscc_int8_consistent, lstmnetvit_fp8_consistent,
                  lstmnetvit_int8_consistent, lstmnetvit_int8_w8a8_consistent]
  cert_budget_s: 300
  # Every generated member must require direct RTL certification; costs remain
  # unknown until measured. Larger application shapes are not L2-only substitutes.
  certification_floor: L3
  precision_preference: [int8, fp8_e4m3, mxfp8, fp16, bf16, fp32]
  max_synthesized_capsules: 160

host_lane:
  capability_spec: examples/gemmini/target/host-capabilities.yaml
  # Both selected GemminiRocketConfig and FireSimGemminiRocketConfig DTS files
  # declare this ISA (with no V). resolve_host_lane checks the package march.
  host_isa: rv64imafdcbzicsr_zifencei_zihpm_zfh_zba_zbb_zbs_xrocket
  description: >-
    Generated scalar int8 package for the non-vector Rocket host. The package
    ISA fits the selected DTS; a saved dequantization capture passed Spike.
    These are not Rocket RTL/FireSim execution or blanket host-operation
    qualifications. Each claimed host route still needs its own emitted
    lowering and numerical checks before a partitioned model can pass.
  repo_canonical: https://github.com/ucb-bar/merlin.git
  dtype_strategy: int8_w8a8
  provenance: in_tree_minted
  package: out/artifacts/targets/host/gemmini_rocket_scalar_int8_v0
  requires_paths:
    - manifest.yaml
    - knobs.yaml
  read_only:
    - out/artifacts/targets/host/gemmini_rocket_scalar_int8_v0/
  deny_modification:
    - merlin/python/merlin/llvmlower/
