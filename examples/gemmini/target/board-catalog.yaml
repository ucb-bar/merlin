# Target-owned host facts for the preferred full Gemmini/Rocket elaborations.
# Select explicitly: MERLIN_BOARD_CATALOG=examples/gemmini/target/board-catalog.yaml.
# These are placement/build inputs, not evidence that a Merlin host image ran.
schema_version: 1
boards:
  gemmini_rocket_verilator:
    target: gemmini
    rtl_sim_config: GemminiRocketConfig
    host_dts_sha256: a45460168248bd08e47a237f78eb1256d589b5410c046f0031e648207a83dfc3
    dram_bytes: 256 MiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      GemminiRocketConfig DTS has one rv64imafdcbzicsr_zifencei_zihpm_zfh_zba_zbb_zbs_xrocket
      CPU, a 256 MiB enabled memory node at 0x80000000, and an HTIF node. The DTS
      chosen stdout is SiFive UART; HTIF here selects the generic simulator-serviced
      bare-metal console, which has not been executed for this image. The 64 MiB code
      reserve is a build-layout request, not a measured hardware property. No ELF upload
      loader or baud is qualified, so upload estimates must refuse this entry.

  gemmini_rocket_spike_functional:
    target: gemmini
    host_dts_sha256: a45460168248bd08e47a237f78eb1256d589b5410c046f0031e648207a83dfc3
    dram_bytes: 4 GiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      The functional instruction-set model of the same GemminiRocketConfig host (the CPU ISA roster
      is read from the same DTS), run with the target's accelerator extension and a declared 4 GiB
      memory span starting at 0x80000000. The span is this model's declared memory, not the RTL
      board's 256 MiB: it exists so whole models whose weights exceed the RTL board (about 0.5 and
      1.03 GB of int8 weights) execute for functional numerics. The image states the span in its
      symbol table and the runner sizes the simulated memory from it. Not cycle-accurate and not
      RTL-derived: results are a functional numerics check, never certification or timing.

  firesim_gemmini_rocket_u250_30mhz:
    target: gemmini
    bitstream: alveo_u250_firesim_gemmini_rocket_30mhz
    host_dts_sha256: c4a2009a405945ea98f731713e0f4e7dc483031ab8cd5156d871e4eb7594f1df
    dram_bytes: 16 GiB
    dram_base: 0x80000000
    harts: 1
    vector_harts: 0
    console: htif
    flow: baremetal
    code_reserve: 64 MiB
    notes: >-
      FireSimGemminiRocketConfig DTS has one CPU with the same non-vector Rocket ISA
      and a 16 GiB enabled memory node at 0x80000000. It declares an HTIF node and
      SiFive UART as chosen stdout. This entry names the preferred full U250 bitstream,
      not the historical lean design. HTIF execution, the provisional code reserve,
      and any ELF upload mechanism still need qualification; no loader/baud is claimed.
