      in f32, RNE and saturate to i8. Require zero output-code error against
      the selected two-load device model. This software-model screen is not
      RTL qualification or a source/provider proof; those remain mandatory.
      Pooling, bias, residual extensions and accumulator-full exits are outside
      this contract. Every distinct readout scale needs its own full screen.
    evidence:
