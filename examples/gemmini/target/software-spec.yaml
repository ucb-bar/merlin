  # Host Q/DQ support is selected through the platform manifest.
restrictions:
- declaration: elementwise_map_after_operand_sum
  family: elementwise_map
  field: epilogues
  values:
  - bias_add
  reason: The direct operand-sum witness covers readout scaling and ReLU, not a bias
    epilogue after the sum.
- declaration: elementwise_map_after_per_operand_sum
  family: elementwise_map
  field: epilogues
  values: [bias_add]
  reason: The per-operand screen covers scaling and ReLU only.
quantization:
  # Seal 4 operator review S4.1-S4.3. These are case axes, never model choices.
  schemes:
    schema: merlin.quantization_schemes.v1
    status: reviewed
    # Scheme-derived calibration: power_of_two keeps enclosing_power_of_two;
    # arbitrary_f32 selects declared_observer, never evaluation input ranges.
    axes:
      scale_value: [power_of_two, arbitrary_f32]
      scale_source: [constant, runtime_input]
      weight_scale_granularity: [tensor, column_block]
      activation_scale_granularity: [tensor]
      readout_exit: [narrow_saturating, accumulator_full]
      operand_sum_rounding: [single_rounding, per_operand]
      residual_coefficient: [none, integer_constant]
    constraints:
    - {when: {scale_value: power_of_two}, readout_strategy: [exact_rational_host]}
    - {when: {scale_value: arbitrary_f32}, readout_strategy: [f32_product_rne], oracle: {spike_extension: rounding_fixed}}
    - {when: {readout_exit: accumulator_full}, forbids_stages: from_facts}
    - {when: {operand_sum_rounding: per_operand}, operand_multiplier: {min_exclusive: 0, max: 1}}
    - {when: {residual_coefficient: integer_constant}, coefficient_digits: {dtype: from_facts, max_k_extension: from_facts}}
    schemes:
    # First scheme is the unchanged v1 baseline; no implicit scheme selection.
    - {id: q_pow2_tensor, scale_value: power_of_two, weight_scale_granularity: tensor, operand_sum_rounding: single_rounding, readout_strategy: exact_rational_host}
    - {id: q_f32_tensor, scale_value: arbitrary_f32, scale_source: constant, weight_scale_granularity: tensor, operand_sum_rounding: single_rounding, readout_strategy: f32_product_rne}
    - {id: q_f32_column_block, scale_value: arbitrary_f32, block_scale_reduction: max_abs, weight_scale_granularity: column_block, operand_sum_rounding: single_rounding, readout_strategy: f32_product_rne}
    # Offered on EVERY residual add; each load rounds and saturates independently.
    - {id: q_f32_per_operand_sum, scale_value: arbitrary_f32, weight_scale_granularity: column_block, operand_sum_rounding: per_operand, readout_strategy: f32_product_rne}
    - id: q_f32_packed_panel
      scale_value: arbitrary_f32
      weight_scale_granularity: column_block
      operand_sum_rounding: single_rounding
      readout_strategy: f32_product_rne
      weight_layout: {kind: packed_panel, panel_width: from_facts}
  formats:
  - operand_dtype: int8
    accumulator_dtype: i32
    scale_encoding: fp32
    eligible_operations: from_facts
  # How every model is quantized for this target (merlin.targetgen.quant_methodology). Each hardware
  # value is the word from_output_path: it is read from the selected contract's derived output path,
  # never written here. Prior variants remain frozen in phase0/history; new reviews are explicit below.
  methodology:
    schema: merlin.quantization_methodology.v1
    scale_granularity: from_output_path
    bias: accumulator_preload_int32
    epilogue: integer_domain
    rounding: from_output_path
    clamp: from_output_path
    calibration:
      activation: mse
      weight: minmax
    recovery:
      cross_layer_equalization: false
      bias_correction: false
    float_island:
      host: merlin
      dtype: fp32
      ops:
      - softmax
      - layer_norm
      - rms_norm
      - group_norm
      - gelu
      - silu
      - rotary
    model_variants:
    - model: tiny_llama
      name: static-heads-softmax2-bounded-partner2-operands2
      status: reviewed
      reviewed_by: Codex operator, explicit TinyLlama operands2 implementation request, 2026-10-26
      reason: Add two bounded signed-int8 residual planes for each ordinary activation operand, including
        both attention-score operands. Keep two fixed softmax planes, two bounded partner planes, static head
        scales, and the unchanged per-site agreement bars. Fresh capture must establish agreement; extra precision
        is not an admission result.
      measured_accuracy:
        basis: 'TinyLlama decode admission analysis /tmp/claude-2629/tl_admit.py: three 1-token activation_contraction
          score sites ([1,32,1,64] x [1,32,64,64]) have cosine_min 0.93311 / 0.94296 / 0.94711 below the unchanged
          0.947588 bar; rel_rmse_max meets the unchanged 0.457351 bar. Prefill passes with worst cosine_min
          0.9815. The prior variant static-heads-softmax2-bounded-partner2 and its decode refusal remain in
          the history; examples/gemmini/phase0/history/software-spec-seals1-3.yaml retains the old variant
          text. This new variant is unmeasured and requires fresh capture and per-site verification; the prior
          refusal is not relabeled a pass.'
        prior_variant_decode:
          layer_3_cosine_min: 0.9331125847462606
          layer_4_cosine_min: 0.9471101675350817
          layer_5_cosine_min: 0.9429586776091345
          samples_per_site: 64
        new_variant: unmeasured; no passing admission or dataset-accuracy claim
      changes:
        families:
        - contraction
        - operand_sum
        - window_mean
        - activation_contraction
        dynamic:
          families:
          - activation_contraction
          planes:
            softmax_output: 2
            softmax_partner: 2
            residual_operand: 2
          scales: static_heads
          schema: dynamic_contractions_v1
          site_agreement:
            cosine_min: 0.947588
            rel_rmse_max: 0.457351
            schema: dynamic_site_agreement_v1
          smooth: null
        calibration_count: 1024
    - model: smolvla
      name: static-heads-softmax2-bounded-operands2
      status: reviewed
      reviewed_by: Codex operator, user-directed continuation after measured recipe review, 2026-10-18
      reason: Use two bounded residual planes for each ordinary score/value operand and two fixed softmax
        planes. This preserves final action error under the common recovery policy and retains the original
        per-site bars.
      measured_accuracy:
        basis: One observed input; flow-denoise trajectory compared with its FP32 reference over 10 x 50
          x 32 action values; finite diagnostic, not dataset accuracy
        final_rel_rmse: 0.057562654271323364
        all_steps_rel_rmse: 0.013568965138741243
        cosine: 0.9999080541400752
        max_abs_error: 0.07584631443023682
        baseline_all_steps_rel_rmse: 0.013446767081807483
        baseline_cosine: 0.9999097337790571
        attention_device_call_ratio: 2.6666666666666665
        tradeoff: All-step error rises and cosine decreases slightly; final action error and maximum absolute
          error improve. Attention device calls increase by 8/3.
      changes:
        families:
        - contraction
        - operand_sum
        - window_mean
        - activation_contraction
        dynamic:
          families:
          - activation_contraction
          planes:
            residual_operand: 2
            softmax_output: 2
          scales: static_heads
          schema: dynamic_contractions_v1
          site_agreement:
            cosine_min: 0.999165
            rel_rmse_max: 0.057791
            schema: dynamic_site_agreement_v1
          smooth: null
    description: Common hardware-order epilogues with MSE activation and minmax weight calibration. Recovery
      is disabled across models; finite recipe-agreement measurements preserve primary metrics with the
      recorded secondary tradeoffs. These measurements are not dataset accuracy or Phase 1 qualification.

  # Explicit numerics per declared scheme (merlin.targetgen.quantization_numerics). Every value
  # carries its evidence: rtl_derived (checked against the selected RTL facts at `fact`),
  # rtl_execution_verified, spike_verified, host_definition (arithmetic the host program defines)
  # or declared_unverified. Internal accumulation is declared, never inferred from int8 operands
  # and an int32 result. Each boundary below carries an input that separates the declared order
  # from a rejected regime; validation evaluates both exactly.
  numerics:
    schema: merlin.quantization_numerics.v1
    status: authored_pending_operator_review
    schemes:
      q_pow2_tensor:
        scale_value:
          value: power_of_two
          evidence: host_definition
          basis: calibration_domain.scale_policy enclosing_power_of_two over the declared observer range; chosen by the host recipe
        scale_granularity:
          value: {activation: tensor, weight: tensor}
          evidence: host_definition
          basis: one scale per tensor in the host recipe; the device sees no scale on this path
        zero_point: &symmetric_zero
          value: {activation: 0, weight: 0, output: 0}
          evidence: host_definition
          basis: host_quantize declares zero_point 0, quant_min -128, quant_max 127; the device has no zero-point stage
        signedness: &signed_operands
          value: signed_twos_complement
          evidence: spike_verified
          basis: 193-case device lane (measure-mca wall run, 57 device cases) passes bit-exact with negative int8 operands; the extracted facts record only the 8-bit storage width (scratchpad UInt<8>)
        operand_type: &operand_type
          value: {dtype: int8, range: [-128, 127]}
          evidence: rtl_derived
          fact: [datapaths, input, dtype]
          basis: compute input datapath i8 in the selected RTL facts
        accumulator_type: &accumulator_type
          value: {dtype: int32}
          evidence: rtl_derived
          fact: [datapaths, accumulator, dtype]
          basis: accumulator datapath i32 (AccumulatorMem SInt<32>) in the selected RTL facts
        internal_accumulation: &internal_accumulation
          value: {bits: 20, hardware_overflow: wrap_each_mac, admission: bounded_partial_sums, dataflows: [WS, OS]}
          evidence: declared_unverified
          basis: numerical_semantics.native_unit_contract.mesh_mac (authored, pending operator review); the mesh width is not in the extracted facts, so admission requires every partial sum to fit
        bias: &bias_seed
          value: {dtype: int32, width: 32, placement: accumulator_seed, scaling: none}
          evidence: rtl_execution_verified
          basis: transfer_contracts.accumulator_seed_load (operator decision D1) - Spike and stock RTL bit-exact, FireSim job 2944
        conversion_order:
          value:
            contraction: &v1_contraction
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: seed, dtype: int32}
            - {step: multiply_accumulate, operand: int8, internal_bits: 20, admission: bounded_partial_sums}
            - {step: accumulate, dtype: int32}
            - {step: transfer, from: accelerator, to: host, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: host}
            - {step: multiply, site: host, multiplier: exact_rational, product: exact, granularity: tensor}
            - {step: round, site: host, ties: half_even}
            - {step: saturate, site: host, dtype: int8}
            operand_sum:
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: operand_sum, rounding: single_rounding}
            - {step: accumulate, dtype: int32}
            - {step: transfer, from: accelerator, to: host, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: host}
            - {step: multiply, site: host, multiplier: exact_rational, product: exact, granularity: tensor}
            - {step: round, site: host, ties: half_even}
            - {step: saturate, site: host, dtype: int8}
          evidence: spike_verified
          basis: full int32 readout then exact host readout; the 193-case device lane records host_exact_rational_RNE readouts bit-exact on Spike
        rounding:
          value: {ties: half_even, sites: [host_quantize, host_readout]}
          evidence: host_definition
          basis: numerical_semantics.readout exact_rational_host requant_rounding half_even; computed by the host
        saturation:
          value: {dtype: int8, range: [-128, 127], mode: saturate}
          evidence: host_definition
          basis: numerical_semantics.readout narrowing saturate_to_declared_dtype; computed by the host
        transfer:
          value: {host_to_accelerator: {dtype: int8, conversion: bit_preserving}, accelerator_to_host: {dtype: int32, conversion: bit_preserving}}
          evidence: rtl_derived
          fact: [datapaths, accumulator, dtype]
          fact_value: int32
          basis: transfer_contracts operand_load (i8) and accumulator_readout (i32), both reviewed against the storage datapaths; the readout width is the checked fact
      q_f32_tensor: &f32_tensor_numerics
        scale_value: &arbitrary_scales
          value: arbitrary_f32
          evidence: host_definition
          basis: declared_observer calibration over the declared observer domain; multipliers formed by the host as RNE_f32 of the exact rational
        scale_granularity:
          value: {activation: tensor, weight: tensor}
          evidence: host_definition
          basis: one multiplier per tensor, loaded once into the readout scale
        zero_point: *symmetric_zero
        signedness: *signed_operands
        operand_type: *operand_type
        accumulator_type: *accumulator_type
        internal_accumulation: *internal_accumulation
        bias: *bias_seed
        conversion_order: &f32_order
          value:
            contraction:
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: seed, dtype: int32}
            - {step: multiply_accumulate, operand: int8, internal_bits: 20, admission: bounded_partial_sums}
            - {step: accumulate, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: accelerator}
            - {step: convert, to: f32, rounding: half_even, site: accelerator}
            - {step: multiply, site: accelerator, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: tensor}
            - {step: round, site: accelerator, ties: half_even}
            - {step: saturate, site: accelerator, dtype: int8}
            - {step: transfer, from: accelerator, to: host, dtype: int8}
            operand_sum: &f32_single_sum
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: operand_sum, rounding: single_rounding}
            - {step: accumulate, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: accelerator}
            - {step: convert, to: f32, rounding: half_even, site: accelerator}
            - {step: multiply, site: accelerator, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: tensor}
            - {step: round, site: accelerator, ties: half_even}
            - {step: saturate, site: accelerator, dtype: int8}
            - {step: transfer, from: accelerator, to: host, dtype: int8}
          evidence: declared_unverified
          basis: int8_readout readout_definitions f32_product_rne (AccumulatorScale INToRecFN, MulAddRecFN, RecFNToIN, all RNE, then saturate); activation order resolves from the contract output path, not the extracted facts
        rounding: &device_rounding
          value: {ties: half_even, sites: [host_quantize, accumulator_conversion, multiplier_formation, product, integer_conversion]}
          evidence: spike_verified
          basis: rounding-fixed Spike extension (libgemmini ROUND_NEAR_EVEN fix, sha256 3dd87ffd661a658b7e4ae56c5fe3b5ea21934707ec38f0ede2eb2fd99c3fd5ea) - exhaustive scan 0 mismatches vs rintf over (-2^24, 2^24); the stock extension disagrees at pred(2^e); RTL execution of non-unit f32 scales is not yet recorded
        saturation: &device_saturation
          value: {dtype: int8, range: [-128, 127], mode: saturate}
          evidence: spike_verified
          basis: AccumulatorScale saturating narrowing (int8_readout evidence); Dragon ResNet-18/34/50/101 1000/1000 under the rounding-fixed extension
        transfer: &int8_readout_transfer
          value: {host_to_accelerator: {dtype: int8, conversion: bit_preserving}, accelerator_to_host: {dtype: int8, conversion: bit_preserving}}
          evidence: rtl_derived
          fact: [datapaths, input, dtype]
          fact_value: int8
          basis: transfer_contracts operand_load (i8, checked fact) and int8_readout (bit-preserving copy after the readout's saturation)
      q_f32_column_block:
        scale_value: *arbitrary_scales
        scale_granularity: &column_block_scales
          value: {activation: tensor, weight: column_block, block_width: from_output_path}
          evidence: declared_unverified
          basis: one multiplier per columns_per_scale output columns; the width resolves from the selected output path and is currently unresolved
        zero_point: *symmetric_zero
        signedness: *signed_operands
        operand_type: *operand_type
        accumulator_type: *accumulator_type
        internal_accumulation: *internal_accumulation
        bias: *bias_seed
        conversion_order: &f32_block_order
          value:
            contraction:
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: seed, dtype: int32}
            - {step: multiply_accumulate, operand: int8, internal_bits: 20, admission: bounded_partial_sums}
            - {step: accumulate, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: accelerator}
            - {step: convert, to: f32, rounding: half_even, site: accelerator}
            - {step: multiply, site: accelerator, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: column_block}
            - {step: round, site: accelerator, ties: half_even}
            - {step: saturate, site: accelerator, dtype: int8}
            - {step: transfer, from: accelerator, to: host, dtype: int8}
            operand_sum: *f32_single_sum
          evidence: declared_unverified
          basis: f32_product_rne readout per scale command; a block's columns share one multiplier (scale_commands column_block per_block)
        rounding: *device_rounding
        saturation: *device_saturation
        transfer: *int8_readout_transfer
      q_f32_per_operand_sum:
        scale_value: *arbitrary_scales
        scale_granularity: *column_block_scales
        zero_point: *symmetric_zero
        signedness: *signed_operands
        operand_type: *operand_type
        accumulator_type: *accumulator_type
        internal_accumulation: *internal_accumulation
        bias: *bias_seed
        conversion_order:
          value:
            contraction:
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: seed, dtype: int32}
            - {step: multiply_accumulate, operand: int8, internal_bits: 20, admission: bounded_partial_sums}
            - {step: accumulate, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: accelerator}
            - {step: convert, to: f32, rounding: half_even, site: accelerator}
            - {step: multiply, site: accelerator, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: column_block}
            - {step: round, site: accelerator, ties: half_even}
            - {step: saturate, site: accelerator, dtype: int8}
            - {step: transfer, from: accelerator, to: host, dtype: int8}
            operand_sum:
            - {step: quantize, site: host, dtype: int8, zero_point: 0, rounding: half_even}
            - {step: transfer, from: host, to: accelerator, dtype: int8}
            - {step: operand_sum, rounding: per_operand, ties: half_even, load_dtype: int8, load_multiplier: rne_f32_of_exact_rational, load_product: f32_half_even}
            - {step: accumulate, dtype: int32}
            - {step: activation, function: relu, position: before_scale, site: accelerator}
            - {step: convert, to: f32, rounding: half_even, site: accelerator}
            - {step: multiply, site: accelerator, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: tensor}
            - {step: round, site: accelerator, ties: half_even}
            - {step: saturate, site: accelerator, dtype: int8}
            - {step: transfer, from: accelerator, to: host, dtype: int8}
          evidence: spike_verified
          basis: each load scales, rounds and saturates before the int32 sum (operand multiplier in (0, 1]); Dragon ResNet-18/34/50/101 double-rounding residuals 1000/1000 under the rounding-fixed extension
        rounding: *device_rounding
        saturation: *device_saturation
        transfer: *int8_readout_transfer
      q_f32_packed_panel:
        scale_value: *arbitrary_scales
        scale_granularity: *column_block_scales
        zero_point: *symmetric_zero
        signedness: *signed_operands
        operand_type: *operand_type
        accumulator_type: *accumulator_type
        internal_accumulation: *internal_accumulation
        bias: *bias_seed
        conversion_order: *f32_block_order
        rounding: *device_rounding
        saturation: *device_saturation
        transfer: *int8_readout_transfer
    boundaries:
    - id: readout_ties
      property: rounding
      schemes: [q_pow2_tensor, q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [multiply, saturate]
      input: {accumulators: [5, -5], multipliers: ['1/2'], column_blocks: [0, 0]}
      expected: [2, -2]
      rejected:
        regime:
        - {step: multiply, multiplier: exact_rational, product: exact, granularity: tensor}
        - {step: round, ties: half_away_from_zero}
        - {step: saturate, dtype: int8}
        result: [3, -3]
    - id: readout_saturation
      property: saturation
      schemes: [q_pow2_tensor, q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [multiply, saturate]
      input: {accumulators: [300, -300], multipliers: ['1'], column_blocks: [0, 0]}
      expected: [127, -128]
      rejected:
        regime:
        - {step: multiply, multiplier: exact_rational, product: exact, granularity: tensor}
        - {step: round, ties: half_even}
        - {step: saturate, dtype: int8, mode: wrap}
        result: [44, -44]
    - id: exact_rational_beyond_f32_integers
      property: conversion_order
      schemes: [q_pow2_tensor]
      path: contraction
      segment: [multiply, saturate]
      input: {accumulators: [16777217], multipliers: ['1/33554432']}
      expected: [1]
      rejected:
        regime:
        - {step: convert, to: f32, rounding: half_even}
        - {step: multiply, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: tensor}
        - {step: round, ties: half_even}
        - {step: saturate, dtype: int8}
        result: [0]
    - id: f32_multiplier_formation
      property: conversion_order
      schemes: [q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [convert, saturate]
      input: {accumulators: [-399], multipliers: ['1/14'], column_blocks: [0]}
      expected: [-29]
      rejected:
        regime:
        - {step: multiply, multiplier: exact_rational, product: exact, granularity: tensor}
        - {step: round, ties: half_even}
        - {step: saturate, dtype: int8}
        result: [-28]
    - id: per_operand_rounding
      property: conversion_order
      schemes: [q_f32_per_operand_sum]
      path: operand_sum
      segment: [operand_sum, round]
      input: {operands: [[1, '1/2'], [1, '1/2']], multipliers: ['1']}
      expected: [0]
      rejected:
        regime:
        - {step: operand_sum, rounding: single_rounding}
        - {step: round, ties: half_even}
        result: [1]
    - id: column_block_scale_selection
      property: scale_granularity
      schemes: [q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [convert, saturate]
      input: {accumulators: [8, 8], multipliers: ['1/2', '1/4'], column_blocks: [0, 1]}
      expected: [4, 2]
      rejected:
        regime:
        - {step: convert, to: f32, rounding: half_even}
        - {step: multiply, multiplier: rne_f32_of_exact_rational, product: f32_half_even, granularity: tensor}
        - {step: round, ties: half_even}
        - {step: saturate, dtype: int8}
        result: [4, 4]
    - id: internal_partial_sum_width
      property: internal_accumulation
      schemes: [q_pow2_tensor, q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [multiply_accumulate, accumulate]
      input:
        lhs: [127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127]
        rhs: [127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127, 127]
      expected: refused
      rejected:
        # Inferring the internal width from the int32 accumulator would accept this sum.
        regime:
        - {step: multiply_accumulate, operand: int8, internal_bits: 32, admission: bounded_partial_sums}
        - {step: accumulate, dtype: int32}
        result: [532257]
    - id: bias_accumulator_width
      property: bias
      schemes: [q_pow2_tensor, q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [seed, accumulate]
      input: {bias: 1000, lhs: [1], rhs: [1]}
      expected: [1001]
      rejected:
        regime:
        - {step: seed, dtype: int8}
        - {step: multiply_accumulate, operand: int8, internal_bits: 20, admission: bounded_partial_sums}
        - {step: accumulate, dtype: int32}
        result: [128]
    - id: signed_symmetric_quantization
      property: zero_point
      schemes: [q_pow2_tensor, q_f32_tensor, q_f32_column_block, q_f32_per_operand_sum, q_f32_packed_panel]
      path: contraction
      segment: [quantize, quantize]
      input: {real: ['-1', '1/2', '1/256'], scale: '1/128'}
      expected: [-128, 64, 0]
      rejected:
        regime:
        - {step: quantize, dtype: uint8, zero_point: 128, rounding: half_even}
        result: [0, 192, 128]
    policies:
      scale_source:
        constant:
          value: constant
          evidence: host_definition
          basis: the source embeds its synthetic f32 multiplier as a constant
        runtime_input:
          value: runtime_input
          evidence: rtl_derived
          fact: [interfaces, register_bundle_layouts, bundles, ConfigMvoutRs2, fields, acc_scale, slot_width]
          fact_value: 32
          basis: >-
            ConfigMvoutRs2.acc_scale is a CONFIG_ST rs2 operand (GemminiISA.scala:155-160,
            StoreController.scala:97-102,237-238); ConfigExRs1.acc_scale is a CONFIG_EX rs1 operand
            (GemminiISA.scala:203-215, ExecuteController.scala:542-555); ConfigMvinRs1.scale is a
            CONFIG_LD rs1 operand (GemminiISA.scala:111-123, LoadController.scala:52-54,145).
            readout_semantics.scalar_abi.scale_dtype and operand_sum.scale_dtype declare f32.
            Register operands are software-set per call; arithmetic is unchanged. Source checked at
            Chipyard 0acc1e1de2d3284bcd4d876956932a013ffe1949, RTL gitlink
            8c3f9923a44a2fe2c7930587be297d6d4f8c09ca; the extracted ISA digest matches this checkout.
      block_scale_reduction:
        max_abs:
          value: max_abs
          evidence: host_definition
          basis: grouped_channel_observer shares the largest per-channel absolute range over each channels_per_scale block, including a short tail
        mean_abs:
          value: mean_abs
          evidence: host_definition
          basis: grouped_channel_observer shares the mean per-channel absolute range over each channels_per_scale block; outlier channels may clip
    unmodeled:
    - subject: calibrated scale values
      reason: observer ranges and reduced block scales depend on calibration data; policies are modeled, calibrated values and their accuracy are unmodeled
    - subject: complex-valued arithmetic (complex affine maps, complex addmm with alpha 0)
      reason: per-component quantization of complex products has no declared scheme; these stay host or native-exact constructions
    - subject: integer storage wider than int8 (radix-256 components, F2/F5)
      reason: exact integer constructions, not quantization schemes; numerics live in component_linear/component_bilinear numerical_contract
    - subject: runtime x runtime contractions (activation_contraction, dynamic attention planes)
      reason: model_variants dynamic recipes are not declared schemes; no per-scheme conversion order exists for them
    - subject: residual_coefficient integer_constant (constant-operand K extension)
      reason: coefficient digits and max K extension resolve from facts and are currently unresolved; no scheme selects the axis
    - subject: readout_exit accumulator_full crossings
      reason: crossed per composition, not per scheme; full-width exits apply no readout stage and carry the accumulator conversion only
    - subject: one-column weight scales (weight_scale_granularity column)
      reason: legal but ungraded; no declared scheme selects it
    - subject: fused max pooling on the readout path with padding
      reason: the pooled-store pad value is not derived (output_path pool padding unknown); padded windows are refused
    - subject: output-stationary dataflow partial-sum bound from constant operands
      reason: the value-bound mode of the mesh check is not declared; OS accepts only inputs the bounded_partial_sums admission proves
    - subject: per-channel activation scales and nonzero zero points
      reason: activation_scale_granularity declares tensor only and every zero point is 0; asymmetric or per-channel activations are not modeled
    - subject: floating islands (softmax, layer_norm, rms_norm, group_norm, gelu, silu, rotary)
      reason: methodology float_island computes these in host fp32; no device quantization is declared
    - subject: block-scaled and narrow formats (MX, fp8, int4, uint8 operands)
      reason: quantization.formats declares int8 operands with an int32 accumulator only

# Seal 4 review S4.4-S4.8. Primitive families enumerate instances; no per-op rows.
compositions:
  schema: merlin.software_spec.compositions.v1
  status: reviewed
  grading: placement_and_instruction_audit
  target_count: 50
  # Each chain is generated under the schemes it uses (primary) plus cross-checks
  # that each name the coverage they alone supply; no other chain x scheme pair.
  chains:
  - id: contraction_readout
    producer: contraction
    accumulator_stages: {preload: optional}
    readout_stages: from_output_path
    exits: [requant, accumulator]
    dataflows: from_facts
    quantization_schemes:
      primary: [q_f32_column_block, q_f32_tensor]
      cross_checks:
      - scheme: q_pow2_tensor
        justification: The only chain carrying q_pow2_tensor, so the power_of_two scale value and its
          exact_rational_host readout strategy keep a composition witness; every other chain selects
          arbitrary_f32 schemes read out by f32_product_rne.
    constraints:
    - activation_before_scale_requires_nonnegative_multiplier
    - accumulator_exit_applies_no_readout_stage
    - {pool_window_within_register_fields: from_facts}
    - {pool_padding: from_facts}
    - {os_dataflow_requires: mesh_partial_sum_bound_from_constant_operands}
    - {scale_commands: {tensor: 1, column_block: per_block, column: output_scale_partition}}
  - id: scaled_operand_sum
    producer: operand_sum
    readout_stages: from_output_path
    exits: [requant, accumulator]
    quantization_schemes:
      primary: [q_f32_per_operand_sum]
      cross_checks:
      - scheme: q_f32_tensor
        justification: scaled_operand_sum is the only chain with an operand_sum producer, so without this
          row the single_rounding value of operand_sum_rounding (unit operand multipliers, one rounding at
          the readout) has no composition witness beside q_f32_per_operand_sum's per_operand rounding.
    constraints:
    - {operand_multiplier_in: '(0, 1]'}
    - load_minimum_not_negated
  - id: window_reduction_readout
    producer: [movement, contraction]
    readout_stages: from_output_path
    exits: [requant]
    reduction_kinds: [max, sum]
    quantization_schemes:
      primary: [q_f32_tensor]
    constraints:
    - {max_requires_store_path_pooling: from_facts}
    - scratchpad_source_pooling_fenced
    - {padded_max_requires: producer_lower_bound_or_derived_pad_value}
  - id: contraction_operand_extension
    producer: contraction
    extension: constant_integer_operand
    readout_stages: from_output_path
    exits: [requant, accumulator]
    quantization_schemes:
      primary: [q_f32_tensor]
    constraints:
    - coefficient_integer_exact
    - {k_extension_within: from_facts}
  - id: shared_input_contractions
    producer: contraction
    multiplicity: {min: 2}
    readout_stages: from_output_path
    exits: [requant, accumulator]
    quantization_schemes:
      primary: [q_f32_packed_panel]
      cross_checks:
      - scheme: q_f32_tensor
        axes: {scale_source: runtime_input}
        justification: shared_input_contractions crosses q_f32_tensor with scale_source runtime_input
          to witness an input-supplied f32 scale with per_output_readout_independent narrow and
          accumulator exits; contraction_readout retains q_f32_tensor with scale_source constant.
    constraints:
    - per_output_readout_independent
    - {shared_input_resident: from_facts}

transfer_contracts:
  # Seal 4 review S4.2: narrowed copies require scheme-specific arithmetic admission.
  status: reviewed
  operand_load:
    from: host
    to: accelerator
    copy:
      dtype: int8
      layout: row_major_contiguous
    evidence:
      status: reviewed
      basis: 'RTL facts: storage_datapaths input i8 (scratchpad smem UInt<8>) and
        compute input elem_bits 8 (SInt<8> in_a); every observed host->accelerator
        crossing is an i8 row_major_contiguous SSA value'
  accumulator_readout:
    from: accelerator
    to: host
    copy:
      dtype: i32
      layout: row_major_contiguous
    valid_window: required
    evidence:
      status: reviewed
      basis: "RTL facts: storage_datapaths accumulator i32 (AccumulatorMem SInt<32>); every observed accelerator->host crossing is an i32 row_major_contiguous SSA value"
  accumulator_seed_load:
    from: host
    to: accelerator
    copy: {dtype: i32, layout: row_major_contiguous}
    # Reviewed by the operator (Loren Hung, 2026-10-17, decision D1): Spike + stock RTL bit-exact,
    # gate-3 fixes Q1/Q9/Q10 verified, FireSim job 2944 (gemmini-coverage analysis/FINAL_LISTS.md).
    evidence:
      status: reviewed
      basis: "An int32 bias or constant loaded into the accumulator at full width (MVIN3 through a shrink = 0 load state; no scale unit on that path, Configs.scala:114; LoadController.scala:108). Gate 3 needs it: op_addmm_default__quant, op_convolution_default__quant, op_add_Scalar__quant, op_sub_Scalar__quant."
  int8_readout:
    from: accelerator
    to: host
    signature:
      operand_dtype: int8
      result_dtype: int8
      operand_layout: row_major_contiguous
      result_layout: row_major_contiguous
    semantics:
      conversion: bit_preserving
      valid_window: required
      # Seal 4 operator review S4.2 supersedes unrestricted D6 admission.
      # Movement copies are bit-preserving; arithmetic readouts need this gate.
      exactness_gate:
        exact_rational_host: {proof: prove_fp32_products, requires: rational_equality_proof}
        f32_product_rne: {definitional: f32_product_rne, requires: decoded_multiplier_bits_equal_formed_multiplier}
      readout_definitions:
        f32_product_rne:
          strategy: f32_product_rne
          accumulator_conversion: {to: f32, rounding: half_even}
          multiplier: {dtype: f32, formation: rne_of_exact_rational}
          product: {dtype: f32, rounding: half_even}
          narrowing: {rounding: half_even, saturate: declared_dtype}
          activation_order: from_facts
          exactness_bridge: prove_fp32_products
    evidence:
      status: reviewed
      basis: "An int8 result after the readout's ReLU, acc_scale and saturation (AccumulatorScale.scala:118-138), or an int8 tensor moved by DMA. The crossing itself is a bit-preserving copy; arithmetic admission requires the selected scheme exactness_gate. Non-unit f32 scales require the pinned rounding-fixed oracle."
