# User-authored accelerator software semantics; see README.md for the input boundary.
# Host support is selected separately through the descriptor's platform manifest.
# Hardware-form requests are resolved from selected evidence, never assumed supported.
# Internal arithmetic, accumulator storage and readout retain distinct numeric policies.
schema: merlin.software_spec.v1
target: gemmini
execution_provider_revision: b78bbca9b5b0e302ecd4fdf499e4d19e83bccd2c
status: reviewed
numerical_semantics:
  # Authored, pending operator review: the selected CPU byte quantizer clamps
  # infinities and casts every NaN sign/payload to storage zero. This is solely
  # an input quantization boundary; rational operation arithmetic stays finite.
  quantization_nonfinite: byte_storage_zero_nan_saturating_infinity
  # Authored, pending operator review: a single residual NaN is quieted by
  # preserving its f32 sign/payload word; finite integer MAC terms cannot
  # introduce a competing NaN. Negative residual coefficients are unproved.
  readout_specials: single_residual_quiet_word_f32
  # Authored, pending operator review: one required IEEE f32 output conversion.
  f32_boundary_overflow: ieee_infinity
  calibration_domain:
    schema: merlin.declared_observer_domain.v1
    status: authored_pending_operator_review
    minimum: -1.0
    maximum: 1.0
    scale_policy: enclosing_power_of_two
    evaluation_inputs: never_read
    provenance: authored fixed observer range for all static recipe tensors; values outside the range clamp at quantization
  component_domain:
    bounds: full_dtype_storage_domain
    runtime_input_specialization: forbidden
    zero_limb_omission: source_literals_only
    native_admission: structural_per_dtype_semantic_proof
    unproved_ieee_arithmetic: declared_quantized_fallback
    # Live IEEE arithmetic on data from floating storage is discharged only by
    # the declared quantized model; a literal scale or offset is such arithmetic,
    # except the exact identities x * 1 and x / 1. Movement, integer/bool-to-float
    # conversion, literal fills, exact identities and widen-then-narrow round
    # trips keep eager-bit proofs. Decided from the normalized IR
    # (floating_contract), never from a source overload.
    floating_storage_arithmetic: declared_quantized_model
    # Calibration qparams define the quantized program. Runtime examples never
    # narrow its code ranges or choose component kernels.
    quantized_domain: complete_declared_code_range
    evidence: {review_status: "authored, pending operator review"}
  quantized_native_fallback:
    status: authored_pending_operator_review
    admission: after_native_exact_failure
    operand_storage: [f16, bf16, f32, complex_components_f32]
    calibration: declared_observer_domain_only
    arithmetic: exact_rational_native_family
    readout: full_int32_then_exact_host_rne
    output: declared_byte_quantize_then_single_dtype_dequantize
    runtime_complex_products: composition_requires_host
    evidence: {review_status: "authored, pending operator review"}
  native_unit_contract:
    # Authored, pending operator review: the mesh wraps after every MAC in
    # either dataflow. Int32 accumulator memory does not widen the mesh.
    mesh_mac:
      signed_bits: 20
      overflow: wrap_each_mac
      dataflows: [WS, OS]
      evidence: {review_status: "authored, pending operator review"}
    status: authored_pending_operator_review
    eligibility: source_scalar_dataflow_and_reduction_domains
    allowed_representation: exact_signed_byte_limbs_and_retained_ieee_host_readout
    excluded_constructions: [nonlinear_rounding_construction, parallel_runtime_product_construction, runtime_product_reduction, index_generated_payload_arithmetic, nonuniform_literal_result_construction, nonuniform_literal_coefficient_contraction, forced_ieee_special_division, unproved_payload_carrier, saturation_comparators, readout_offset_rounding, multi_op_identity]
    source_overload_dispatch: forbidden
    result_literals: uniform_fills_are_movement_nonuniform_result_tables_retain_host_construction
    evidence: {review_status: "authored, pending operator review"}
  model:
    engine: integer_reference
  operand_dtype: int8
  accumulator_dtype: i32
  readout_dtype: i32
  subnormal_operand_flush: false
  overflow: wrap_internal_mac
  internal_arithmetic:
    # Catalog target IR observation, bound by compilation.target_ir_sha256.
    # These are semantic field names, not assumed geometry or instruction encodings.
    primitive_k_observation:
      dialect_module: mlir_oot.ir.gemmini_dialect
      dialect_symbol: GEMMINI
      operation: gemmini.compute
      extent_attribute: a_cols
    signed_operand_bits: 8
    mac_result_bits: 20
    mac_result_overflow: wrap_to_20_bits
    full_operation_overflow_policy: bounded_exact_requires_each_partial_sum
  readout:
    strategy: exact_rational_host
    acc_scale_rounding: half_even
    narrowing: saturate_to_declared_dtype
    # Authored, pending operator review: one exact host ties-to-even boundary.
    requant_rounding: half_even
    hardware_integer_shift_rounding: rne
    shift: operation_parameter
quantization_contract:
  status: authored_pending_operator_review
  storage: [int8, uint8]
  ranges: declared_byte_subranges
  zero_points: retained_exact_integer_centering
  weight_scales: [tensor, output_channel]
  admission: selected_provider_exact_centering_and_full_i32_coverage
  requantization: retained_source_exact_rational_host_rne
  evidence: {review_status: "authored, pending operator review"}
operations:
  contraction:
    # Authored, not derived: the exact-offload outline admits contractions against these authored
    # bytes and has no fact view to resolve them with. The spec-vs-facts drift check guards every
    # field here against the selected facts.
    # window_mean: the derived recipe quantizes an average pool as this unit's own contraction
    # against a constant one, with the reciprocal of the count folded into the readout scale.
    # Rank 4 (convolution and its backward) is LOWERED to direct per-tap rank-2 matmuls; no im2col
    # unit is built. A bias is the int32 accumulator seed (`accumulator_seed_load` below). A
    # constant operand (a ones vector, a scaled identity) is an ordinary operand of this unit.
    families: [contraction, window_mean]
    placement: accelerator
    operand_dtypes:
    - int8
    accumulator_dtype: i32
    ranks:
    - 2
    - 3
    - 4
    layouts:
    - row_major_contiguous
    tails:
    - zero_pad_valid_window
    broadcasting:
    - none
    - independent_batches
    aliasing:
    - disjoint_inputs_outputs
  elementwise_map:
    hardware: fused
  elementwise_map_standalone:
    # Operator reviewed 2026-10-01; unchecked RTL paths remain declarations, not facts.
    status: reviewed
    # The operand sum on the load path (accumulate_on_load). operand_sum is the recipe family it
    # quantizes. Its general form is the contract's: out = sat(RNE(s_o * act(sum_i w_i x_i + c)))
    # over at most two int8 tensors and one broadcast constant, per-tensor scales, act in
    # {none, relu}; int8 or int32 result.
    # affine_map: the recipe family that quantizes that general form (scalar add/sub/mul/div, neg,
    # relu, a difference) as integer weights and an int32 constant, then one readout.
    families: [elementwise_map, operand_sum, affine_map]
    hardware: standalone
    max_tensor_operands: 2
    expressions: [affine]
    broadcasting: [none, outer]
  elementwise_map_after_operand_sum:
    status: reviewed
    numerical_contract: operand_sum_exhaustive_i8_v1
    families:
    - elementwise_map
    hardware: fused_operand_sum
    max_tensor_operands: 2
    expressions: [affine]
    broadcasting: [none, outer]
  pooling_on_readout:
    families:
    - reduction
    hardware: fused
  reduction_standalone:
    # Standalone SUM reductions: accumulate-on-load over an outer axis or a window, then one
    # readout scale. Max reductions stay fused (`pooling_on_readout`).
    # The row id is not a family name, so it does not shadow `pooling_on_readout` in family
    # queries; window_mean makes avg pools and mean quantization-eligible.
    families: [reduction, window_mean]
    # Reviewed by the operator (Loren Hung, 2026-10-17, decision D3a). Evidence: Spike and stock
    # GemminiRocketConfig RTL bit-exact for mean.dim, the avg/adaptive pools and their backwards,
    # and col2im; gate-3 int8 numerics 0 LSB; FireSim jobs 2933/2944 (gemmini-coverage repo,
    # analysis/FINAL_LISTS.md).
    status: reviewed
    hardware: standalone
    kinds: [sum]
  movement:
    # Operator reviewed standalone copies/broadcasts; no fact-derived placement claim.
    status: reviewed
    # Forms and their constraints are the contract's: copy, broadcast, zero_fill, permutation.
    hardware: standalone
    broadcasting: [none, outer]
    layouts: [row_major_contiguous]
    aliasing: [disjoint_inputs_outputs]
  movement_bitwise:
    status: authored_pending_operator_review
    evidence:
      review_status: "authored, pending operator review"
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
    families: [movement]
    placement: accelerator
    signature:
      numerical_family: [F1]
      operand_dtypes: [i1, int8, i16, f16, bf16, i32, f32, i64, f64, complex<f32>]
      layouts: [row_major_contiguous]
      aliasing: [disjoint_inputs_outputs]
    numerical_contract:
      family: F1
      arithmetic: none
      representation: opaque_little_endian_bytes
      proof: closed_static_element_selectors
      quantization: none
      device_transfer_dtype: int8
      comparison: native_eager_bits
  component_linear:
    status: authored_pending_operator_review
    evidence:
      review_status: "authored, pending operator review"
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
    families: [elementwise_map, reduction]
    placement: accelerator
    signature:
      numerical_family: [F2, F4, F5]
      operand_dtypes: [int8]
      accumulator_dtype: i32
      readout_dtype: i32
    numerical_contract:
      representation: signed_radix_256_components
      producer: closed_static_linear_integer
      accumulation: exact_i32_with_all_partial_sums_bounded
      readout: full_i32
      recombination: retained_source_host_exact_integer
  component_bilinear:
    status: authored_pending_operator_review
    evidence:
      review_status: "authored, pending operator review"
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
    families: [contraction]
    placement: accelerator
    signature:
      numerical_family: [F2, F4, F5]
      operand_dtypes: [int8]
      accumulator_dtype: i32
      readout_dtype: i32
      ranks: [2, 3]
    numerical_contract:
      representation: signed_radix_256_components
      producer: closed_static_bilinear_integer
      accumulation: exact_i32_with_all_partial_sums_bounded
      readout: full_i32
      recombination: retained_source_host_exact_integer
  # el4 (fd57639a6) removed every host_* declaration from the accelerator software spec;
  # host support is selected through the descriptor's platform manifest.
  host_quantize_exact:
    status: authored_pending_operator_review
    evidence:
      review_status: "authored, pending operator review"
      change: "Generalized exact rank-agnostic host Q/DQ to ranks 0 through 5; not an extension of prior operator approval"
    ops: [quantized_decomposed.quantize_per_tensor.default]
    placement: host
    ordered_operand_dtypes: [f32, f64, i64]
    ordered_result_dtypes: [i8]
  # Exact host dequantization is independent of rank. Phase 1 still owns
  # lowering, execution and numerical qualification of the emitted compiler.
  host_dequantize_per_tensor:
    status: authored_pending_operator_review
    evidence:
      review_status: "authored, pending operator review"
      change: "Generalized exact rank-agnostic host Q/DQ to ranks 0 through 5; not an extension of prior operator approval"
    ops: [quantized_decomposed.dequantize_per_tensor.default]
    placement: host
    ordered_operand_dtypes: [i8, f32, i64]
    ordered_result_dtypes: [f32]
    ranks: [0, 1, 2, 3, 4, 5]
  host_quantize:
    ops: [quantized_decomposed.quantize_per_tensor.default]
    placement: host
    ordered_operand_dtypes: [f32, f32, i64]
    ordered_result_dtypes: [i8]
    quantization_parameters: {zero_point: 0, quant_min: -128, quant_max: 127}
restrictions:
- declaration: elementwise_map_after_operand_sum
  family: elementwise_map
  field: epilogues
  values:
  - bias_add
  reason: The direct operand-sum witness covers readout scaling and ReLU, not a bias
    epilogue after the sum.
quantization:
  formats:
  - operand_dtype: int8
    accumulator_dtype: i32
    scale_encoding: fp32
    eligible_operations: from_facts
  # How every model is quantized for this target (merlin.targetgen.quant_methodology). Each hardware
  # value is the word from_output_path: it is read from the selected contract's derived output path,
  # never written here. Per-model changes exist only as reviewed model_variants rows.
  methodology:
    schema: merlin.quantization_methodology.v1
    scale_granularity: from_output_path
    bias: accumulator_preload_int32
    epilogue: integer_domain
    rounding: from_output_path
    clamp: from_output_path
    calibration:
      activation: mse
      weight: minmax
    recovery:
      cross_layer_equalization: false
      bias_correction: false
    float_island:
      host: merlin
      dtype: fp32
      ops:
      - softmax
      - layer_norm
      - rms_norm
      - group_norm
      - gelu
      - silu
      - rotary
    model_variants:
    - model: resnet50
      name: native-epilogue-contractions-calibration-1024
      status: reviewed
      reviewed_by: Codex operator, user-directed continuation after measured recipe review, 2026-10-18
      reason: Use contraction-only hardware-order epilogues under the common recovery policy. Keep residual
        sums and the average pool on the host; the 1024-sample cap observes 260 disjoint calibration images.
      measured_accuracy:
        basis: Recipe agreement against the FP32 model on 64 samples; finite diagnostic, not dataset accuracy
        argmax_agreement: 0.984375
        cosine_mean: 0.9858536114916205
        cosine_min: 0.9606804251670837
        max_abs_error: 0.9978066086769104
        samples: 64
        calibration_samples: 260
        baseline_cosine_mean: 0.9912215834483504
        tradeoff: Mean cosine decreases; top-1 agreement remains 63/64, while worst cosine and maximum absolute
          error improve.
      changes:
        families:
        - contraction
        calibration_count: 1024
    - model: tiny_llama
      name: static-heads-softmax2-bounded-partner2
      status: reviewed
      reviewed_by: Codex operator, user-directed continuation after measured recipe review, 2026-10-18
      reason: Use two fixed softmax planes and two bounded signed-int8 residual planes for the value operand.
        Retain the original score grid and unchanged per-site bars; extra precision repairs the weak context
        site.
      measured_accuracy:
        basis: Full pretrained 22-layer model, 64 recipe-agreement samples per stage; attention-only check
          on four streams disjoint from calibration; no dataset-accuracy claim
        prefill:
          argmax_agreement: 0.890625
          cosine_mean: 0.9930144296959043
          cosine_min: 0.9245473742485046
          max_abs_error: 9.495887756347656
          samples: 64
        decode:
          argmax_agreement: 0.921875
          cosine_mean: 0.9946034317836165
          cosine_min: 0.8284692764282227
          max_abs_error: 12.52759075164795
          samples: 64
        prefill_calibration_samples: 128
        decode_calibration_samples: 1024
        baseline_prefill_cosine_mean: 0.9931617677211761
        heldout_attention:
          sites: 44
          cosine_min: 0.9999570899268245
          rel_rmse_max: 0.010253275908719361
        attention_device_call_ratio: 1.6666666666666667
        tradeoff: Prefill mean cosine decreases slightly; prefill and decode top-1 agreement improve. Attention
          device calls increase by 5/3.
      changes:
        families:
        - contraction
        - operand_sum
        - window_mean
        - activation_contraction
        dynamic:
          families:
          - activation_contraction
          planes:
            softmax_output: 2
            softmax_partner: 2
          scales: static_heads
          schema: dynamic_contractions_v1
          site_agreement:
            cosine_min: 0.947588
            rel_rmse_max: 0.457351
            schema: dynamic_site_agreement_v1
          smooth: null
        calibration_count: 1024
    - model: smolvla
      name: static-heads-softmax2-bounded-operands2
      status: reviewed
      reviewed_by: Codex operator, user-directed continuation after measured recipe review, 2026-10-18
      reason: Use two bounded residual planes for each ordinary score/value operand and two fixed softmax
        planes. This preserves final action error under the common recovery policy and retains the original
        per-site bars.
      measured_accuracy:
        basis: One observed input; flow-denoise trajectory compared with its FP32 reference over 10 x 50
          x 32 action values; finite diagnostic, not dataset accuracy
        final_rel_rmse: 0.057562654271323364
        all_steps_rel_rmse: 0.013568965138741243
        cosine: 0.9999080541400752
        max_abs_error: 0.07584631443023682
        baseline_all_steps_rel_rmse: 0.013446767081807483
        baseline_cosine: 0.9999097337790571
        attention_device_call_ratio: 2.6666666666666665
        tradeoff: All-step error rises and cosine decreases slightly; final action error and maximum absolute
          error improve. Attention device calls increase by 8/3.
      changes:
        families:
        - contraction
        - operand_sum
        - window_mean
        - activation_contraction
        dynamic:
          families:
          - activation_contraction
          planes:
            residual_operand: 2
            softmax_output: 2
          scales: static_heads
          schema: dynamic_contractions_v1
          site_agreement:
            cosine_min: 0.999165
            rel_rmse_max: 0.057791
            schema: dynamic_site_agreement_v1
          smooth: null
    description: Common hardware-order epilogues with MSE activation and minmax weight calibration. Recovery
      is disabled across models; finite recipe-agreement measurements preserve primary metrics with the
      recorded secondary tradeoffs. These measurements are not dataset accuracy or Phase 1 qualification.

transfer_contracts:
  # The last two rows are PROPOSED and widen this reviewed block: README.md needs a new operator
  # decision row before they apply.
  status: reviewed
  operand_load:
    from: host
    to: accelerator
    copy:
      dtype: int8
      layout: row_major_contiguous
    evidence:
      status: reviewed
      basis: 'RTL facts: storage_datapaths input i8 (scratchpad smem UInt<8>) and
        compute input elem_bits 8 (SInt<8> in_a); every observed host->accelerator
        crossing is an i8 row_major_contiguous SSA value'
  accumulator_readout:
    from: accelerator
    to: host
    copy:
      dtype: i32
      layout: row_major_contiguous
    valid_window: required
    evidence:
      status: reviewed
      basis: "RTL facts: storage_datapaths accumulator i32 (AccumulatorMem SInt<32>); every observed accelerator->host crossing is an i32 row_major_contiguous SSA value"
  accumulator_seed_load:
    from: host
    to: accelerator
    copy: {dtype: i32, layout: row_major_contiguous}
    # Reviewed by the operator (Loren Hung, 2026-10-17, decision D1): Spike + stock RTL bit-exact,
    # gate-3 fixes Q1/Q9/Q10 verified, FireSim job 2944 (gemmini-coverage analysis/FINAL_LISTS.md).
    evidence:
      status: reviewed
      basis: "An int32 bias or constant loaded into the accumulator at full width (MVIN3 through a shrink = 0 load state; no scale unit on that path, Configs.scala:114; LoadController.scala:108). Gate 3 needs it: op_addmm_default__quant, op_convolution_default__quant, op_add_Scalar__quant, op_sub_Scalar__quant."
  int8_readout:
    from: accelerator
    to: host
    copy: {dtype: int8, layout: row_major_contiguous}
    valid_window: required
    # Reviewed by the operator (Loren Hung, 2026-10-17, decision D6): on-device requantize matches
    # the gate-3 bit-level model on Spike and stock RTL; FireSim jobs 2933/2944.
    evidence:
      status: reviewed
      basis: "An int8 result after the readout's ReLU, acc_scale and saturation (AccumulatorScale.scala:118-138), or an int8 tensor moved by DMA. The crossing itself is a bit-preserving copy."
