  elementwise_map_after_per_operand_sum:
    status: reviewed
    numerical_contract: operand_sum_per_operand_exhaustive_i8_v1
    description: >-
      For each selected scalar f32 operand-scale pair in (0, 1] and each
      positive finite f32 readout scale with finite products on the full domain,
      screen all 65,536 ordered signed-i8
      pairs. Independently RNE and saturate each f32 operand product to i8,
