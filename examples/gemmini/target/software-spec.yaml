      basis: "Operator review of the per-operand rounded operand-sum row; operand_sum_numeric.audit_i8_per_operand_sum"
    families: [elementwise_map]
    hardware: fused_operand_sum
    arithmetic: integer_affine
    max_tensor_operands: 2
    expressions: [affine]
    broadcasting: [none]
    ranks: [2]
    layouts: [row_major_contiguous]
    aliasing: [disjoint_inputs_outputs]
    unconstrained:
