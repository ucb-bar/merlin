    # Reviewed by the operator (Loren Hung, 2026-10-17, decision D3a). Evidence: Spike and stock
    # GemminiRocketConfig RTL bit-exact for mean.dim, the avg/adaptive pools and their backwards,
    # and col2im; gate-3 int8 numerics 0 LSB; FireSim jobs 2933/2944 (gemmini-coverage repo,
    # analysis/FINAL_LISTS.md).
    status: reviewed
    hardware: standalone
    arithmetic: integer_sum
    kinds: [sum]
    ranks: [0, 1, 2, 3, 4, 5]
    layouts: [row_major_contiguous]
    tails: [zero_pad_valid_window]
    aliasing: [disjoint_inputs_outputs]
  movement:
    # Operator reviewed standalone copies/broadcasts; no fact-derived placement claim.
    status: reviewed
    # Forms and their constraints are the contract's: copy, broadcast, zero_fill, permutation.
    # A result that views its input (a view op) is materialized as a disjoint copy.
    hardware: standalone
    arithmetic: none
    broadcasting: [none, outer]
    ranks: [0, 1, 2, 3, 4, 5]
    layouts: [row_major_contiguous]
    aliasing: [disjoint_inputs_outputs, result_views_input]
    unconstrained:
      tails: movement copies selected bytes; padded lanes are never written back
  movement_bitwise:
    status: reviewed
    evidence:
      review_status: reviewed
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
      basis: "Operator R2; review packet R2: VectorScalarMultiplier.scala:130,137; LoadController.scala:40,72; Configs.scala:66-69; StoreController.scala:43,73-74; DMA.scala:493,500,597-608; BeatMerger.scala:128; MeshWithDelays.scala:155. Disjointness is a compiler obligation, not hardware-enforced."
    families: [movement]
    placement: accelerator
    arithmetic: none
    unconstrained:
      tails: movement copies selected bytes; padded lanes are never written back
    signature:
      numerical_family: [F1]
      operand_dtypes: [i1, int8, i16, f16, bf16, i32, f32, i64, f64, complex<f32>]
      ranks: [0, 1, 2, 3, 4, 5]
      layouts: [row_major_contiguous]
      aliasing: [disjoint_inputs_outputs, result_views_input]
    # These constrain emitted commands, never source signatures. The generic
    # native ISA audit replays the selected scales, pooling fields and DMA
    # bounds at their retired uses. Byte order and complete alias/selector
    # witnesses still belong to the selected compiler/provider.
    emission_obligations:
      mvin_scale: {status: instruction_audit, check: unit_mvin_scale, constraints: {eq: 1.0}}
      minimum_dram_address: {status: instruction_audit, check: nonzero_dram, constraints: {min: 1}}
      mvout_pool_stride: {status: instruction_audit, check: mvout_pool_stride, constraints: {eq: 0}}
      mvout_pool_size: {status: instruction_audit, check: mvout_pool_size, constraints: {eq: 0}}
      maximum_rows_per_command: {status: instruction_audit, check: transfer_rows, constraints: {min: 1, max: 16}}
      maximum_bytes_per_command: {status: instruction_audit, check: movement_bytes, constraints: {min: 1, max: 64}}
      transpose: {status: compiler_obligation, constraints: {eq: false}}
      byte_order: {status: compiler_obligation, constraints: {eq: little}}
      minimum_stride: {status: instruction_audit, check: nonnegative_stride, constraints: {min: 0}}
      disjoint_inputs_outputs: {status: compiler_obligation, constraints: {eq: true}}
    numerical_contract:
      family: F1
      arithmetic: none
      representation: opaque_little_endian_bytes
      proof: closed_static_element_selectors
      quantization: none
      device_transfer_dtype: int8
      comparison: native_eager_bits
  component_linear:
    status: reviewed
    evidence:
      review_status: reviewed
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
      basis: "Operator R5; review packet R5: Configs.scala:96-107,114; Scratchpad.scala:420-421. Non-unit mvin scaling saturates to int8; non-unit integer weights must use the mesh."
    families: [elementwise_map, reduction]
    placement: accelerator
    arithmetic: integer_components
    unconstrained:
      tails: the closed static producer proof bounds every partial sum over the declared static extents
    signature:
      numerical_family: [F2, F4, F5]
      operand_dtypes: [int8]
      accumulator_dtype: i32
      readout_dtype: i32
      ranks: [0, 1, 2, 3, 4, 5]
      layouts: [row_major_contiguous]
      aliasing: [disjoint_inputs_outputs]
    emission_obligations:
      dataflow: {status: instruction_audit, check: weight_stationary, constraints: {eq: WS}}
      mvin_scale: {status: instruction_audit, check: unit_mvin_scale, constraints: {eq: 1.0}}
      primitive_k_bound: {status: instruction_audit, check: primitive_k_bound, constraints: {min: 1, max: 524287}}
      partial_sum_bound: {status: compiler_obligation, condition: {all: [{path: execution.pe_partial_abs_bound, integer: true, min: 0, max: 524287}, {path: execution.accumulator_partial_abs_bound, integer: true, min: 0, max: 2147483647}, {path: execution.pe_bound_scope, eq: every_retained_partial_sum_including_total_os_k}]}}
    numerical_contract:
      representation: signed_radix_256_components
      producer: closed_static_linear_integer
      accumulation: exact_i32_with_all_partial_sums_bounded
      readout: full_i32
      recombination: retained_source_host_exact_integer
  component_bilinear:
    status: reviewed
    evidence:
      review_status: reviewed
      scope: "Authored family admission screen; source/provider proofs and exact execution gates remain mandatory"
      basis: "Operator R3; review packet R3: LocalAddr.scala:23; Scratchpad.scala:312-325,673; AccumulatorScale.scala:147; StoreController.scala:225; DMA.scala:598-615. Raw full-i32 output bypasses scale and ReLU; R1 WS-only limb restriction applies."
    families: [contraction]
    placement: accelerator
    arithmetic: integer_components
    unconstrained:
      tails: the closed static producer proof bounds every partial sum over the declared static extents
    signature:
      numerical_family: [F2, F4, F5]
      operand_dtypes: [int8]
      accumulator_dtype: i32
      readout_dtype: i32
      ranks: [2, 3]
      layouts: [row_major_contiguous]
      aliasing: [disjoint_inputs_outputs]
    emission_obligations:
      dataflow: {status: instruction_audit, check: weight_stationary, constraints: {eq: WS}}
      mvin_scale: {status: instruction_audit, check: unit_mvin_scale, constraints: {eq: 1.0}}
      readout: {status: instruction_audit, check: full_i32, constraints: {eq: full_i32}}
      mvout_scale: {status: instruction_audit, check: mvout_scale, constraints: {eq: false}}
      mvout_relu: {status: instruction_audit, check: mvout_relu, constraints: {eq: false}}
      raw_i32_exit: {status: instruction_audit, check: raw_i32_exit, constraints: {eq: true}}
      maximum_mvout_columns: {status: instruction_audit, check: max_columns, constraints: {min: 1, max: 16}}
      mvout_pool_stride: {status: instruction_audit, check: mvout_pool_stride, constraints: {eq: 0}}
      mvout_pool_size: {status: instruction_audit, check: mvout_pool_size, constraints: {eq: 0}}
      primitive_k_bound: {status: instruction_audit, check: primitive_k_bound, constraints: {min: 1, max: 524287}}
      partial_sum_bound: {status: compiler_obligation, condition: {all: [{path: execution.pe_partial_abs_bound, integer: true, min: 0, max: 524287}, {path: execution.accumulator_partial_abs_bound, integer: true, min: 0, max: 2147483647}, {path: execution.pe_bound_scope, eq: every_retained_partial_sum_including_total_os_k}]}}
    numerical_contract:
      representation: signed_radix_256_components
      producer: closed_static_bilinear_integer
