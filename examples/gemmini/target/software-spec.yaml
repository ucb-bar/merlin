# User-authored accelerator software semantics; see README.md for the input boundary.
# Host support is selected separately through the descriptor's platform manifest.
# Hardware-form requests are resolved from selected evidence, never assumed supported.
# Internal arithmetic, accumulator storage and readout retain distinct numeric policies.
schema: merlin.software_spec.v1
target: gemmini
execution_provider_revision: 7a61b51895ce09fd0c001b6b421cc61e0c3f1c01
status: reviewed
numerical_semantics:
  # Reviewed R8: the selected CPU byte quantizer clamps
  # infinities and casts every NaN sign/payload to storage zero. This is solely
  # an input quantization boundary; rational operation arithmetic stays finite.
  quantization_nonfinite: byte_storage_zero_nan_saturating_infinity
  # Reviewed R8, non-negative residual coefficients only: a residual NaN is quieted by
  # preserving its f32 sign/payload word; finite integer MAC terms cannot
  # introduce a competing NaN. Negative residual coefficients are unproved.
  readout_specials: single_residual_quiet_word_f32
  # Reviewed R8: one required IEEE f32 output conversion.
  f32_boundary_overflow: ieee_infinity
  policy_reviews:
    quantization_nonfinite: {status: reviewed}
    readout_specials: {status: reviewed, residual_coefficient: nonnegative}
    f32_boundary_overflow: {status: reviewed}
    calibration_domain:
      status: reviewed
      scope: op_validation_only
      composition_observers: independent_scheme_policy
      # The domain below is the historical v1 recipe payload, including its
      # status/provenance. This record owns its current review authority.
      basis: "Operator R6; fixed op-validation convention only; composition tensor/block observers and per-operand sum policies retain their selected domains and reductions"
  calibration_domain:
    schema: merlin.declared_observer_domain.v1
    status: authored_pending_operator_review
    minimum: -1.0
    maximum: 1.0
    scale_policy: enclosing_power_of_two
    evaluation_inputs: never_read
    provenance: authored fixed observer range for all static recipe tensors; values outside the range clamp at quantization
  component_domain:
    status: reviewed
    bounds: full_dtype_storage_domain
    runtime_input_specialization: forbidden
    zero_limb_omission: source_literals_only
    native_admission: structural_per_dtype_semantic_proof
    unproved_ieee_arithmetic: declared_quantized_fallback
    # Live IEEE arithmetic on data from floating storage is discharged only by
    # the declared quantized model; a literal scale or offset is such arithmetic,
    # except the exact identities x * 1 and x / 1. Movement, integer/bool-to-float
    # conversion, literal fills, exact identities and widen-then-narrow round
    # trips keep eager-bit proofs. Decided from the normalized IR
    # (floating_contract), never from a source overload.
    floating_storage_arithmetic: declared_quantized_model
    # Calibration qparams define the quantized program. Runtime examples never
    # narrow its code ranges or choose component kernels.
    quantized_domain: complete_declared_code_range
    evidence: {review_status: reviewed, basis: "Operator R11; review packet R11: documentation of compiler policy in floating_contract.py, not an RTL claim"}
  quantized_native_fallback:
    status: reviewed
    admission: after_native_exact_failure
    operand_storage: [f16, bf16, f32]
    calibration: declared_observer_domain_only
    arithmetic: exact_rational_native_family
    readout: full_int32_then_host_readout_per_scheme
    output: declared_byte_quantize_then_single_dtype_dequantize
    runtime_complex_products: composition_requires_host
    evidence: {review_status: reviewed, basis: "Operator R4; validated real floating storage only; complex components require a separately validated case"}
  native_unit_contract:
    # Int32 accumulator memory does not widen the per-MAC mesh result.
    mesh_mac:
      status: reviewed
      signed_bits: 20
      overflow: wrap_each_mac
      dataflows: [WS, OS]
      # OS accumulates across computes; a per-compute K proof is insufficient.
      # Restrict limb components until an OS total-K bound is available.
      emission_obligations:
        dataflow: {status: instruction_audit, check: weight_stationary, constraints: {eq: WS}}
      evidence:
        review_status: reviewed
        basis: "Operator R1; review packet R1: Configs.scala:29,38; MacUnit.sv:10; PE.scala:23,108-129; ExecuteController.scala:951; AccumulatorMem.scala:70. OS wrap is reachable at total K >= 32."
    status: reviewed
    eligibility: source_scalar_dataflow_and_reduction_domains
    allowed_representation: exact_signed_byte_limbs_and_retained_ieee_host_readout
    excluded_constructions: [nonlinear_rounding_construction, parallel_runtime_product_construction, runtime_product_reduction, index_generated_payload_arithmetic, nonuniform_literal_result_construction, nonuniform_literal_coefficient_contraction, forced_ieee_special_division, unproved_payload_carrier, saturation_comparators, readout_offset_rounding, multi_op_identity]
    source_overload_dispatch: forbidden
    result_literals: uniform_fills_are_movement_nonuniform_result_tables_retain_host_construction
    evidence: {review_status: reviewed, basis: "Operator R1; review packet R1: compiler admission policy approved with WS-only limb execution"}
  model:
    engine: integer_reference
  operand_dtype: int8
  accumulator_dtype: i32
  readout_dtype: i32
  subnormal_operand_flush: false
  overflow: wrap_internal_mac
  internal_arithmetic:
    # Catalog target IR observation, bound by compilation.target_ir_sha256.
    # These are semantic field names, not assumed geometry or instruction encodings.
    primitive_k_observation:
      dialect_module: mlir_oot.ir.gemmini_dialect
      dialect_symbol: GEMMINI
      operation: gemmini.compute
      extent_attribute: a_cols
    signed_operand_bits: 8
    mac_result_bits: 20
    mac_result_overflow: wrap_to_20_bits
    full_operation_overflow_policy: bounded_exact_requires_each_partial_sum
  readout:
    # Seal 4 review (README S4.1): preserve the v1 default and its exact rational
    # reference. New schemes explicitly select f32_product_rne below.
    strategy: exact_rational_host
    acc_scale_rounding: half_even
    narrowing: saturate_to_declared_dtype
    status: reviewed
    evidence:
      review_status: reviewed
      basis: "Operator R9; review packet R9: Arithmetic.scala:101-107 implements RNE; the source comment at :36 saying away from 0 is incorrect. Host requantization uses exact_readout.requantize_int32."
    # Integer shift ties round to even, as does the exact host boundary.
    requant_rounding: half_even
    hardware_integer_shift_rounding: rne
    shift: operation_parameter
quantization_contract:
  status: reviewed
  storage: [int8]
  ranges: declared_byte_subranges
  zero_points: retained_exact_integer_centering
  weight_scales: [tensor, output_channel]
  admission: selected_provider_exact_centering_and_full_i32_coverage
  requantization: retained_source_host_readout_per_scheme
  evidence: {review_status: reviewed, basis: "Operator R7; review packet R7: Configs.scala:23,27; ExecuteController.scala:836-838. Signed int8 storage only; no hardware zero-point centering, and centred uint8 spans [-255,255]."}
# Every device declaration states its domain: shapes (ranks), layouts, tails, aliasing,
# placement and arithmetic. Admission (software_spec.admit_operation) screens these
# declarations; no separate operation table decides what is accelerated. An axis left open
# is named under `unconstrained` with the reason it cannot change a valid result.
# Quantized-island ranks stop at 5; host Q/DQ support is declared by the platform.
operation_domains:
  schema: merlin.software_spec.operation_domains.v1
  status: authored_pending_operator_review
  required: [ranks, layouts, tails, aliasing, arithmetic]
operations:
  contraction:
    status: reviewed
    # Authored, not derived: the exact-offload outline admits contractions against these authored
    # bytes and has no fact view to resolve them with. Drift checks cover fact-derived fields.
    # window_mean: the derived recipe quantizes an average pool as this unit's own contraction
    # against a constant one, with the reciprocal of the count folded into the readout scale.
    # Rank 4 (convolution and its backward) is LOWERED to direct per-tap rank-2 matmuls; no im2col
    # unit is built. A bias is the int32 accumulator seed (`accumulator_seed_load` below). A
    # constant operand (a ones vector, a scaled identity) is an ordinary operand of this unit.
    families: [contraction, window_mean]
    placement: accelerator
    arithmetic: integer_multiply_accumulate
    operand_dtypes:
    - int8
    accumulator_dtype: i32
    ranks:
    - 2
    - 3
    - 4
    layouts:
    - row_major_contiguous
    tails:
    - zero_pad_valid_window
    broadcasting:
    - none
    - independent_batches
    aliasing:
    - disjoint_inputs_outputs
    evidence:
      review_status: reviewed
      reviewed_by: Loren Hung, conditional packet 2 approval
      packet: packet2.md R12; seal3-base 118-145
      basis: Configs.scala:23-38; PE.scala:23,108-129; AccumulatorMem.scala:63-70; LoadController.scala:108; Configs.scala:114;
        BeatMerger.scala:71-75
    emission_obligations:
      execution_program:
        status: compiler_obligation
        condition:
          all:
          - all:
            - path: execution.pe_partial_abs_bound
              integer: true
              min: 0
              max: 524287
            - path: execution.accumulator_partial_abs_bound
              integer: true
              min: 0
              max: 2147483647
            - path: execution.pe_bound_scope
              eq: every_retained_partial_sum_including_total_os_k
          - path: execution.seed_load
            eq: unscaled_full_i32_shrink0_once
          - path: execution.tail_initialization
            eq: explicit_zero
          - path: execution.constants
            eq: signed_int8_or_exact_decomposition
      raw_i32_exit:
        status: instruction_audit
        check: raw_i32_exit
        constraints:
          eq: true
      c_stride:
        status: compiler_obligation
        constraints:
          eq: 1
  elementwise_map:
    status: reviewed
    hardware: fused
    # A fused stage applies to its producer's result, so it shares the contraction's ranks.
    arithmetic: readout_stages
    ranks: [2, 3, 4]
    layouts: [row_major_contiguous]
    aliasing: [disjoint_inputs_outputs]
    unconstrained:
      tails: each readout stage maps one accumulator element to one result element; padded lanes never reach a valid result
    evidence:
      review_status: reviewed
      reviewed_by: Loren Hung, conditional packet 2 approval
      packet: packet2.md R13; seal3-base 146-154
      basis: AccumulatorScale.scala:118-138,147,154; Configs.scala:117-149; GemminiISA.scala:155-159; raw i32 bypasses
        activation and scaling
    emission_obligations:
      execution_program:
        status: compiler_obligation
        condition:
          any:
          - all:
            - path: execution.readout_exit
              eq: narrow_i8
            - path: execution.readout_program
              eq: selected_scheme_order
            - path: execution.readout_strategy
              eq: f32_product_rne
            - path: execution.scale_delivery
              eq: scalar_per_command_partition
            - path: execution.relu_commutation
              eq: nonnegative_multiplier_or_source_order_proof
          - all:
            - path: execution.readout_exit
              eq: accumulator_full
            - path: execution.readout_stages
              eq: []
            - path: execution.columns
              integer: true
              min: 1
              max: 16
            - path: execution.pooling
              eq: false
      raw_i32_exit:
        status: instruction_audit
        check: raw_i32_exit
        constraints:
          eq: true
      c_stride:
        status: compiler_obligation
        constraints:
          eq: 1
  elementwise_map_standalone:
    # Operator reviewed 2026-10-01; unchecked RTL paths remain declarations, not facts.
    status: reviewed
    # Exact integer numerator via unit-scale accumulating loads or bounded weighted mesh.
    families: [elementwise_map, operand_sum, affine_map]
