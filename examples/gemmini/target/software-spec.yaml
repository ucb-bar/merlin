  elementwise_map_after_operand_sum:
    status: reviewed
    numerical_contract: operand_sum_exhaustive_i8_v1
    families:
    - elementwise_map
    hardware: fused_operand_sum
    arithmetic: integer_affine
    max_tensor_operands: 2
    expressions: [affine]
    broadcasting: [none, outer]
    ranks: [0, 1, 2, 3, 4, 5]
    layouts: [row_major_contiguous]
    aliasing: [disjoint_inputs_outputs]
    unconstrained:
      tails: each result element reads only its own operand elements; padded lanes never reach a valid result
