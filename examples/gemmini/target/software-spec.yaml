    evidence:
      review_status: reviewed
      reviewed_by: Loren Hung, conditional packet 2 approval
      packet: packet2.md R14; seal3-base 155-174
      basis: Configs.scala:75-114; Scratchpad.scala:407-421,828-848; VectorScalarMultiplier.scala:130-138; PE.scala:23;
