# GENERATED from ../../target/contracts/residual.yaml plus this provider's plugin block by
# build_tools/scripts/sync_support_contract.py. Edit the reviewed contract, then re-run it.
# Residual side-input for the target-agnostic capability deriver
# (merlin.targetgen.capability_manifests.manifest_for). This is the human intent + prose + ABI
# encoding surface the RTL facts cannot ground; the mesh / memory capacities / datapath dtypes /
# encoding CODES are layered on from facts.json when a residual declares `facts_source: rtl`.
#
# gemmini is an ALL-RESIDUAL prototype (no `facts_source`): the reference contract already omits the
# facts-derived fields — mesh geometry, scratchpad/accumulator capacities and the (in,weight)->acc
# datapath matrix are read by consumers straight from the fact bundle
# (explicitly selected external facts), never re-declared here. So the deriver
# reproduces this residual field-for-field (adding only the empty `legality` default), letting gemmini
# be REGENERATED as an out-of-tree target package via
# `merlin.targetgen.capability_manifests.write_oot_target("gemmini", <root>)` — the same deterministic
# path every other target uses, discoverable via MERLIN_TARGET_PATH.
#
# This file is pinned to the curated reference `contracts/target_contract.yaml` (they must stay
# consistent — test_gemmini_oot_generation asserts manifest_for("gemmini") == the curated contract
# plus the empty `legality` default). Provenance-tagged; requires_human_review.
name: gemmini
version: 0.1
family: tensor_resident
plugin:
  backend: merlin.runtime.backends.chipyard_rocc
  isa_headers: isa_headers.yaml
  rocc_semantics: merlin.targetgen.rocc.semantics
  rtl_checks: merlin.targetgen.rtl_checks_generic
# Reference metadata has no executable backend. The explicitly selected OOT support
# provider owns its plugin declaration and implementation.
# Codegen endpoint + grading knobs the shared RunnerConfig reads (rtl_tiers + the rocc_insn trace gate
# ride the systolic family default; declared here only where they differ from it). Fork-free .insn on
# stock LLVM — no gemmini-forked toolchain.
endpoint_kind: inline_asm_insn
# Source-location anchors for extracting this target's RTL facts. These do not
# declare legal instruction codes, capacity, or executable support.
rtl_extraction:
  firrtl_role_probe:
    array: {name: mesh, parent_module_contains: Mesh, child_module_prefix: Tile}
    memory: {name: scratchpad, declaration_contains: "smem mem : UInt<", source_contains: Scratchpad.scala, datapath_name: input}
    interfaces:
      - {module: ReservationStation, name: rocc_cmd, evidence: "module ReservationStation (RoCC decode/dispatch)"}
      - {module: FrontendTLB, name: dma_tlb, evidence: "module FrontendTLB"}
  scala_funct_block:
    start_comment: "// funct values"
    stop_declaration: CONFIG_EX
  accumulator_memory:
    module: AccumulatorMem
    memory_name: accumulator
    address_port: io_write_bits_addr
    data_prefix: io_write_bits_data_
    data_suffix: _0
    mask_prefix: io_write_bits_mask_
    firrtl_data_field: io.write.bits.data
  boolean_feature_gate:
    feature: max_pool
    module: StoreController
    node: pooling_is_enabled
    dynamic_operand_contains: pool
    config_field: has_max_pool
runner:
  suite: gemmini-capsule-bench
  dtype: i8xi8_i32
  tier_sim: {L2: spike, L3: elaborated_rtl, L4: firesim}
  # The DECLARED bespoke-sim engine (chipyard elaborates the spike L2 / verilator L3 tiers). Read by
  # capsule_runner._bespoke_sim_via so the sim engine comes from this contract, never a hardcoded
  # {spike,verilator} -> chipyard inference. A target with no bespoke sim omits this (arc-only).
  sim_via: chipyard
  # The bare-metal toolchain the generic chipyard RoCC runtime backend
  # (merlin.runtime.backends.chipyard_rocc) runs and links with. Paths are relative to the checkout
  # `root_env` names (MERLIN_EXT_<root_ext> as the fallback); per-target MERLIN_GEMMINI_SPIKE /
  # _VERILATOR / _GSIM_EMU / _GSIM_MAXCYCLES variables override, `compiler.env` overrides the compiler.
  # The ISA headers, CRT, link script and flags are NOT here: they are the support provider's
  # content-pinned `plugin.isa_headers` spec.
  toolchain:
    root_env: MERLIN_CHIPYARD
    root_ext: chipyard
    compiler: {path: .conda-env/riscv-tools/bin/riscv64-unknown-elf-gcc, env: MERLIN_RISCV_GCC}
    spike: {path: .conda-env/riscv-tools/bin/spike}
    spike_library_dir: .conda-env/riscv-tools/lib
    # The extension CLASS libgemmini.so registers (spike --extension=<this>). A model fact of the
    # toolchain, distinct from the target name; a target needing other bytes declares
    # runner.spike_extension (digest-pinned) instead.
    spike_extension_name: gemmini
    # chipyard's Verilator harness for the elaborated config named by runtime.rtl_sim_config.
    verilator: {path: "sims/verilator/simulator-chipyard.harness-{rtl_sim_config}"}
    # GSIM wall-cycle cap = the hang bound (not a performance knob). A starting bound, not measured
    # on this harness; raise per run with MERLIN_GEMMINI_GSIM_MAXCYCLES rather than editing it here.
    gsim_max_cycles: 20000000
# The ABI encoding surface RTL discovery cannot ground (opcode/funct3/legal-funct/DIM come from the
# fact bundle; THESE do not). Declared once from the Gemmini ISA doc (human-reviewed) and consumed as
# the SINGLE source of truth by the generated ISA module + the decoder — retiring the triplicated
# hand-coded constants in GemminiToLLVM.cpp / gemmini_codegen_mlir.py / rocc_decode.py.
encoding:
  addr_len: 32             # RoCC accumulator/scratchpad address field width (bits). The lone irreducible
                           # anchor; header-cross-checkable (gemmini_params.h `#define ADDR_LEN 32`).
  rocc_custom_slot: 3      # RISC-V custom slot this RoCC is wired to (SoC OpcodeSet.custom3); the major
                           # opcode 0x7b is the standard encoding of THIS slot, derived by circt_introspect.
  # readout_bits are NOT declared here: they are DERIVED from addr_len + the 3-flag-bit accumulator-address
  # convention + float32(1.0) by target_experiment.derived_readout_bits (grounded in gemmini.h's own
  # `1<<(ADDR_LEN-1)` / `3<<(ADDR_LEN-2)` / `full_C<<(ADDR_LEN-3)` address arithmetic). Byte-identical to
  # the former {f1,c_acc,acc_i8,acc_accum,full_c_bit} hex; cross-checked by test_encoding_manifest.
  semantic_class:          # RTL funct CODE -> the compiler's shared op class (the guardrail boundary:
    0: CONFIG              # codes are RTL-derived; the MVIN/MVOUT/... vocabulary is human-owned + shared).
    1: MVIN2               # LOAD2_CMD: load-state 1, used for an independent second operand stream.
    2: MVIN                # HEADER-DERIVED: each name == gemmini.h `#define k_<NAME> <code>` (cross-checked
    3: MVOUT               # by circt_introspect.crosscheck_semantic_class_names) — this block is the
    4: COMPUTE_PRELOADED   # human-reviewed cache of those header names, kept for the codes the compiler
    5: COMPUTE_ACCUMULATE  # actually emits. Only funct 15 shortens the header's LOOP_CONV_WS to the
    6: PRELOAD             # compiler alias LOOP_CONV (the _WS dataflow suffix is implicit); all others exact.
    7: FLUSH
    8: LOOP_WS
    15: LOOP_CONV
  # config_subtype: CONFIG (funct 0) refined by rs1 & 0x3. NAMES are HEADER-DERIVED (gemmini.h
  # `#define CONFIG_EX 0` / `CONFIG_LD 1` / `CONFIG_ST 2`); the CODES are the rs1[1:0] sub-field the RTL
  # decoder fans out on (comb.icmp-eq over a width-2 comb.extract — ExecuteController rs1[1:0]==0 -> EX,
  # StoreController rs1[1:0]==2 -> ST). Cross-checked by mlc_bridge.crosscheck_config_subtype. Kept here as
  # the reviewed cache of the 3 subtypes the compiler emits (the 4th decoded value, 3=CONFIG_BERT, is unused).
  config_subtype: {0: CONFIG_EX, 1: CONFIG_LD, 2: CONFIG_ST}
  corpus_issue_order: [FLUSH, CONFIG_EX, CONFIG_LD, MVIN, CONFIG_ST, PRELOAD, COMPUTE_PRELOADED, MVOUT]
  # WHICH CLASSES A HARDWARE LOOP DOES THE WORK OF. A capsule declares the instruction classes its
  # operation needs; a design with a loop FSM performs several of them with ONE instruction, so a
  # program that uses the loop is not missing them. Without this a convolution lowered the way this
  # hardware prefers is reported as missing four classes, and `trace_all_pass` (which gates the run's
  # formal verdict) is false for a correct program -- while the host-compute audit fails the
  # fine-grained lowering for gathering the patches on the host. No lowering could satisfy both.
  # EVIDENCE, from this target's own ISA header: `gemmini_loop_conv_ws` (gemmini.h) issues functs
  # 16-21 then 15, carrying the DRAM pointers for input, weights, bias and output plus the loop
  # bounds, so the movement and the multiply-accumulate are the loop's own work; the vendor's
  # `tiled_conv_auto` emits exactly this and no per-element host gather. `gemmini_loop_ws` (funct 8)
  # is the same statement for a matmul. Codes are the RTL-derived ones named above.
  class_subsumes:
    LOOP_CONV: [MVIN, PRELOAD, COMPUTE_PRELOADED, MVOUT]
    LOOP_WS: [MVIN, PRELOAD, COMPUTE_PRELOADED, MVOUT]
# RoCC OPERAND ROLES — what each decoded field of each instruction class MEANS, consumed by the generic
# RoCC semantics (merlin.targetgen.rocc.semantics). Bit POSITIONS and WIDTHS are never written here: a
# field names a bundle + field of the CIRCT-extracted `register_bundle_layouts` fact (this target's own
# Scala Bundles), so the offsets follow the RTL. This block supplies only what the RTL cannot ground:
# which operand carries which bundle, and how a value is interpreted (an int, float32 bits, a
# local-address flag, an all-ones sentinel). A field whose bundle the facts do not carry decodes as
# UNKNOWN, never at an assumed offset.
rocc_operand_roles:
  # Flag bits of a local (scratchpad/accumulator) address, counted down from the MSB of the
  # encoding.addr_len-bit address field: gemmini.h `1<<(ADDR_LEN-1)` (accumulator select),
  # `3<<(ADDR_LEN-2)` (accumulate, with the select bit), `full_C<<(ADDR_LEN-3)` (full-width readout).
  local_address_flags:
    accumulator_select: {msb_offset: 0}
    accumulate: {msb_offset: 1}
    full_width_readout: {msb_offset: 2}
  # The ISA-constant names this target's consumers read, composed from the flags above (or a float32
  # scalar). Byte-identical to the former hand-declared readout_bits.
  isa_constants:
    F1: {f32_bits: 1.0}
    C_ACC: {flags: [accumulator_select, full_width_readout]}
    ACC_I8: {flags: [accumulator_select]}
    ACC_ACCUM: {flags: [accumulate]}
    FULL_C_BIT: {flags: [full_width_readout]}
  # encoding.readout_bits, as published to the generated ISA module (gen_isa_module).
  readout_bits: {f1: F1, c_acc: C_ACC, acc_i8: ACC_I8, acc_accum: ACC_ACCUM, full_c_bit: FULL_C_BIT}
  # A compute's B/D operand of all ones means "keep what the array already holds" (gemmini.h GARBAGE_ADDR).
  retain_sentinel: {bundle: ComputeRs, field: local_addr, value: all_ones}
  # encoding.semantic_class's CONFIG code is refined by an rs1 selector field (encoding.config_subtype).
  config:
    class: CONFIG
    selector: {operand: rs1, bundle: ConfigMvoutRs1, field: cmd_type}
    publish_layouts: {CONFIG_ST_LAYOUT: ConfigMvoutRs1}
  classes:
    MVIN: &rocc_mvin
      fields:
        - {name: dram, operand: rs1, as: operand}
        - {name: rows, operand: rs2, bundle: MvinRs2, field: num_rows}
        - {name: cols, operand: rs2, bundle: MvinRs2, field: num_cols}
        - {name: addr, operand: rs2, bundle: MvinRs2, field: local_addr}
        - {name: spad_addr, operand: rs2, bundle: MvinRs2, field: local_addr}
    MVIN2: *rocc_mvin
    MVIN3: *rocc_mvin
    MVOUT:
      fields:
        - {name: dram, operand: rs1, as: operand}
        - {name: rows, operand: rs2, bundle: MvoutRs2, field: num_rows}
        - {name: cols, operand: rs2, bundle: MvoutRs2, field: num_cols}
        - {name: addr, operand: rs2, bundle: MvoutRs2, field: local_addr}
        - {name: acc_addr, operand: rs2, bundle: MvoutRs2, field: local_addr}
        - {name: readout, operand: rs2, bundle: MvoutRs2, field: local_addr, as: flag_choice,
           flag: full_width_readout, set: i32, clear: i8}
    PRELOAD:
      fields:
        - {name: weight_spad, operand: rs1, bundle: PreloadRs, field: local_addr}
        - {name: c_addr, operand: rs2, bundle: PreloadRs, field: local_addr}
        - {name: accumulate, operand: rs2, bundle: PreloadRs, field: local_addr, as: flag, flag: accumulate}
        - {name: readout, operand: rs2, bundle: PreloadRs, field: local_addr, as: flag_choice,
           flag: full_width_readout, set: i32, clear: i8}
    COMPUTE_PRELOADED: &rocc_compute
      fields:
        - {name: a_spad, operand: rs1, bundle: ComputeRs, field: local_addr}
        - {name: bd, operand: rs2, bundle: ComputeRs, field: local_addr}
        - {name: garbage, operand: rs2, bundle: ComputeRs, field: local_addr, as: all_ones}
    COMPUTE_ACCUMULATE: *rocc_compute
    CONFIG_EX:
      fields:
        - {name: subtype, const: EX}
    CONFIG_LD:
      unresolved: "null"
      fields:
        - {name: subtype, const: LD}
        # gemmini.h config_ld passes the DRAM row stride as the whole rs2 operand.
        - {name: stride, operand: rs2, as: raw}
        - {name: scale, operand: rs1, bundle: ConfigMvinRs1, field: scale, as: f32}
        - {name: scale_bits, operand: rs1, bundle: ConfigMvinRs1, field: scale}
    CONFIG_ST:
      unresolved: "null"
      fields:
        - {name: subtype, const: ST}
        - {name: acc_act, operand: rs1, bundle: ConfigMvoutRs1, field: activation}
        - {name: relu, from: acc_act, equals: 1}
        - {name: acc_scale, operand: rs2, bundle: ConfigMvoutRs2, field: acc_scale, as: f32}
        - {name: acc_scale_bits, operand: rs2, bundle: ConfigMvoutRs2, field: acc_scale}
        - {name: out_stride_bytes, operand: rs2, bundle: ConfigMvoutRs2, field: stride}
        - operand: rs1
          bundle: ConfigMvoutRs1
          names: [pool_stride, pool_size, pool_out_dim, porows, pocols, orows, ocols, upad, lpad]
# RTL CHECKS — this target's RoCC protocol for the generic HARDWARE-LEGALITY rules
# (merlin.targetgen.rtl_checks_generic). Rule kinds are target-independent code; this block only says
# which instruction classes play which protocol ROLE, which decoded field carries which MEANING, which
# fields are local addresses, and which rules apply. Every bound (legal functs, memory depths, address
# selector) is an RTL fact or a contract encoding. Nothing here describes how a program should be
# scheduled or tiled.
rtl_checks:
  class_roles:
    FENCE: [fence]
    CONFIG_EX: [config_compute]
    CONFIG_LD: [config_load]
    CONFIG_ST: [config_store]
    MVIN: [movement_in]
    MVIN2: [movement_in]
    MVIN3: [movement_in]
    MVOUT: [movement_out]
    PRELOAD: [preload]
    COMPUTE_PRELOADED: [compute, compute_preloaded]
    COMPUTE_ACCUMULATE: [compute]
  role_labels:
    fence: FENCE
    config_compute: CONFIG_EX
    config_load: CONFIG_LD
    config_store: CONFIG_ST
    movement_in: MVIN
    movement_out: MVOUT
    preload: PRELOAD
    compute: COMPUTE
    compute_preloaded: COMPUTE_PRELOADED
  # Decoded-field names (rocc_operand_roles.classes) the rules read, by meaning.
  fields:
    dram: dram
    rows: rows
    cols: cols
    store_pitch: out_stride_bytes
  # Local-address operand fields, bounded by the RTL scratchpad/accumulator depths (LocalAddr: the
  # accumulator-select flag picks the memory, the low bits are the row). `rows` names the field giving
  # the number of consecutive rows a transfer touches; without it only the addressed row is bounded.
  local_addresses:
    - {role: movement_in, address: spad_addr, rows: rows}
    - {role: movement_out, address: acc_addr, rows: rows}
    - {role: preload, address: weight_spad}
    - {role: preload, address: c_addr}
    - {role: compute, address: a_spad}
    - {role: compute, address: bd}
  # Native store-path pooling (RTL StoreController): when the active CONFIG_ST sets a non-zero pool
  # stride on an elaboration whose max_pool feature is enabled, one MVOUT writes porows x pocols pooled
  # rows instead of its encoded row count.
  native_pooling:
    config_role: config_store
    feature: max_pool
    enable_field: pool_stride
    output_positions: [porows, pocols]
  rules:
    - {id: T0.decode_clean, rule: decode_clean}
    - {id: T0.decode_funct_legal, rule: funct_legal}
    - {id: T0.local_address_bounds, rule: local_address_bounds}
    # COMPUTE_AND_FLIP (funct 4) multiplies against the weights the preceding PRELOAD latched into the
    # mesh; with no PRELOAD there is nothing to flip in.
    - {id: T0.preload_before_compute, rule: precedes, first: preload, then: compute_preloaded}
    # ExecuteController reads the dataflow/activation that CONFIG_EX writes; StoreController reads the
    # DRAM stride/scale that CONFIG_ST writes; LoadController reads the stride CONFIG_LD writes.
    - id: T0.config_before_use
      rule: config_before_use
      pairs:
        - {use: compute, config: config_compute}
        - {use: movement_in, config: config_load}
        - {use: movement_out, config: config_store}
    # RoCC commands retire asynchronously to the host: a fence before the first command orders it after
    # the host's writes, and a fence after the last makes the stored results visible to the host.
    - {id: T0.fence_bracket, rule: bracket, role: fence}
    - {id: T0.output_store_coverage, rule: output_store_coverage}
status: prototype
features: [systolic_array, resident_packed_tensor, accumulator_commit, command_buffer, metrics]
# No `ops`/`types` are declared: the TARGET DIALECT is a design decision the agent OWNS (it writes its
# own out-of-tree MLIR backend, interface -> target dialect), verified against the CIRCT oracle. Nothing
# here pre-defines that vocabulary.
runtime:
  backends: [simulator, spike_gemmini, verilator]
  # Default runtime backend the lowering pipeline stamps onto the runtime module when a caller passes
  # none (DERIVED here, not from a name -> backend map in code; see target_registry.backend_for).
  default_backend: baremetal
  # The RTL sim harness that realizes this target — a DECLARED target fact, not a hardcoded backend
  # constant, so it is onboardable from the contract and read from ONE place (not overfit in code). This
  # is the SAME config the ISA facts are introspected from (targetgen.rtl.introspect), so sim and codegen
  # stay coherent: it is the pure chipyard GemminiConfigs.defaultConfig Gemmini on a Rocket host — the
  # certified 16x16 int8 mesh above (byte-identical Gemmini core to the prior gemmini+OPU Shuttle config;
  # dropping the OPU/Shuttle changes only host cycle counts, not the mesh or the ISA facts, and makes the
  # Verilator path coherent with the FireSim path). Change here + re-derive facts + re-cert to move.
  rtl_sim_config: GemminiRocketConfig
# Datatype -> compute-unit -> op capability (parsed by merlin.targetgen.compute_units). The C0 systolic
# mesh is int8 (i8 x i8 -> i32). The input/accumulator dtypes are themselves CIRCT-extracted facts
# (datapaths), so the (in,weight)->acc `accumulate` matrix is NOT re-declared here. `requant` is an
# OPAQUE reference to Gemmini's own accumulator-scale lowering (rounding-shift / FP-scale-multiply) —
# Merlin does not model that arithmetic here.
compute_units:
  - name: systolic_mesh
    kind: systolic
    dtypes: [int8]
    ops: [matmul]
    # The elaborated command register carries one bounded acc_scale value per
    # store command. The derived readout facet therefore admits tensor-wide
    # scaling, not an independent scale for each output channel.
    scaling: per_tensor
    requant: {ref: gemmini.accumulator_scale}
    # Semantic-family capability (ARR denominator): a GEMM accelerator — int8 contraction on the mesh
    # (matmul + conv2d via im2col), fused relu/acc-scale on readout and bias seeded
    # into the accumulator before contraction (integer-shift requant remains host-side),
    # and mvin/mvout DMA (movement). It has NO general reduction / softmax / attention / normalization
    # hardware, so those families are honestly absent (regions needing them fall back off-mesh).
    semantic_capabilities:
      # rank 4 is the im2col convolution path, not an assumption: the RTL funct table carries a
      # dedicated LOOP_CONV_WS (funct 15) plus LOOP_CONV_WS_CONFIG_1/2/3 (16-18), so a rank-4 conv
      # region IS acceleratable. Declaring ranks [2] alone made the shipped conv2d capsules score
      # ineligible and silently left them out of the ARR denominator.
      # rank 3 is the BATCHED contraction path. Unlike rank 4 this is not a distinct hardware
      # sequence: `linalg_lower` lowers a single batched matmul (batch,m,k)@(batch,k,n) by looping the
      # batch and calling the same (M,N,K) kernel per independent slice, so the region IS acceleratable
      # and the evidence class is LOWERING, not RTL. Omitting it made every batched matmul ineligible
      # before it reached the device rewrite -- the machinery existed and the contract forbade its use.
      # Three other targets already ship batched capsules (atlas AF12, mx_gemmini MF5, radiance
      # RP10/R11); gemmini shipped none because of this line. Declaring a narrower rank set than the
      # target can execute is the same denominator loss the mx_gemmini rank bug was (see
      # merlin/python/merlin/targetgen/eligibility.py). `batch` is already derived true, so it is NOT
      # re-declared here: over-declaring a derived axis is how a contract stops tracking its target.
      - {family: contraction, dtypes: [int8], ranks: [2, 3, 4]}
      # STANDALONE, by operator decision 2026-10-01 via coordinating session, approving standalone
      # elementwise_map from RTL evidence (the LocalAddr accumulate bit on a plain load). The review:
      #   - Evidence is NOT the loop sequencer. The old line cited LoopMatmulLdA/LdB `is_resadd`, which
      #     is the hardware-loop FSM (the `loop_descriptor` role) a no-FSM program may not use, so it
      #     cannot license a capability such a program needs.
      #   - Evidence IS the load path every load command takes. LocalAddr carries an `accumulate` bit
      #     (LocalAddr.scala), set by a load into an accumulator address; the accumulator store writes
      #     the adder's sum when the write's accumulate bit is set (AccumulatorMem.scala:183), and the
      #     accumulator bank's accumulate bit is that load-address field (Scratchpad.scala:828), fed by
      #     the DMA read request (Scratchpad.scala:368). Derived from the elaboration as the
      #     `accumulate_on_load` semantic fact (contracts/semantic_probes.yaml): a plain load (role
      #     operand_load) into the accumulator with accumulate=1 adds into the region, and a readout
      #     (config_st's activation and accumulator scale, then the store) reads the sum out.
      #   - The scale each operand gets on the way in is the readout-scale fact the backend derives
      #     from gemmini_params.h (`readout_operand_sum`: MVIN_SCALE, f32, half-even, saturating).
      #   - `standalone_evidence` records the roles that path uses, so an experiment's
      #     prohibited_instruction_roles policy can check it never depends on `loop_descriptor`
      #     (merlin.targetgen.capability_roles).
      # Family-granular: other elementwise_map members still need a device form of their own, which
      # compute_groups decides per region (the operand sum is one); none is placed on admission alone.
      - family: elementwise_map
        dtypes: [int8]
        standalone_evidence:
          - fact: accumulate_on_load
            roles: [operand_load, config, readout, commit]
      # MVIN/MVOUT transfer bytes; they do not establish a standalone tensor
      # permutation. Operand transpose is a contraction variant (CONFIG_EX),
      # not a separate movement kernel. An agent may fuse it with that consumer.
      - {family: movement, dtypes: [int8], forms: [copy]}
      # Preserve the existing reference contract's composed reduction declaration;
      # this input is not new evidence or hardware qualification.
      - {family: reduction, dtypes: [int8], composed_with: [contraction, movement]}
# capabilities is intentionally empty: op/layout support is not pre-declared here. Mesh geometry +
# scratchpad/accumulator capacities are CIRCT-extracted facts (arrays/memories), read from the fact
# bundle by consumers; the supported ops/layouts follow from the agent's own target dialect, verified
# against the oracle. (Kept as a present key for schema compliance.)
capabilities: {}
# WHICH SUBSTRATE MAY PRODUCE WHICH NUMBER. A declaration, not a derived fact: no RTL introspection can
# say which of two substrates that both emit a `cycles` field is the authoritative one, nor which tier a
# number must reach before it may be quoted as a hardware result. It therefore belongs in the residual
# with the other declarations, and lives here rather than only in the emitted contract -- hand-adding it
# downstream meant the deriver could not reproduce its own curated contract, which is drift by
# construction. Read by `merlin.kernels.measurement.authority_for`.
measurement:
  cycles_from: spike          # the functional-cycles reference for this path
  wall_from: k1               # real silicon: the only wall-time authority
  cycles_tier: functional
  wall_tier: silicon
  speed_of_light: mesh_macs_per_cycle
  citable_tier: rtl           # below this a number is not a hardware claim
  notes:
    - "k1 also carries a `cycles` field, but it is an rdtime-derived ESTIMATE, not authoritative.
       Picking cycles by field name rather than by authority gets that estimate."
memory_model:
  resident: true
  accumulators: true
  # THE WIDEST PAYLOAD ONE MEMORY-MOVEMENT INSTRUCTION MAY CARRY, in bytes. An ABI bound, DECLARED
  # here rather than extracted, for the same reason `encoding.addr_len` is: the RTL-facts schema has
  # no field for it, and the value is what this device's own generated parameter header commits to.
  # Consumers turn it into a block length the only way that is correct -- floored against the array
  # tile edge and the input datapath's element width (`trace_check.movement_bound_for`) -- so nothing
  # downstream needs a second constant, and the byte budget rather than the block count is recorded
  # because the header derives the latter from the former (`MAX_BLOCK_LEN (MAX_BYTES/(DIM*1))`) at a
  # different element width for each path. OMIT THE BLOCK ENTIRELY on a target whose transfer payload
  # is unknown: a consumer that reads no bound reports nothing, where a guessed one would invent an
  # optimization the hardware cannot do or hide one it can.
  dma:
    # header-cross-checkable (gemmini_params.h `#define MAX_BYTES 64`), from the header pinned by
    # content as `include/gemmini_params.h` under the `gemmini_isa_headers` pin (hardware_pins.yaml).
    max_transfer_bytes: 64
  # How the hardware resolves a producer/consumer hazard. Declared rather than extracted because the
  # RTL evidences it without deciding it: a delay instruction is strong evidence for `explicit`, but
  # its ABSENCE is not evidence for `interlocked` -- a machine may interlock and still expose a delay.
  # It inverts the performance lever (reorder to overlap here; remove over-conservative separation
  # there) and it decides which gate is able to fail at all, so it is never defaulted.
  hazard_resolution: interlocked
  hazard_evidence:
    kind: target_rtl
    sources:
      - "elaborated design hierarchy: rockettile.gemmini.reservation_station (io_busy)"
    note: >-
      The accelerator tracks its own command dependencies, so a reordering of a legal command stream
      cannot change the answer. A correctness falsifier therefore cannot fire on a scheduling change
      here, and the falsifier must be measured occupancy instead.
prototype_scope:
  workload: repeated_rhs_matmul
  conformance_level: C0
  epilogue: none
  output_dtype: i32
oracle_ladder:
  level_0: {name: merlin_reference_and_command_buffer_sim, derived_from_rtl: false}
  level_1: {name: spike_gemmini_functional, derived_from_rtl: false}
  level_2: {name: gemmini_verilator_rtl, derived_from_rtl: true}
  level_3: {name: firesim, derived_from_rtl: true}
oracle_blind_spots:
  # What a tier of the ladder above cannot observe, in the vocabulary the capsule corpus states about
  # itself. Read by merlin.targetgen.oracle_blind_spots: a capsule in one of these classes is not
  # certified by a pass at a listed tier, whatever the pass says.
  - id: accumulator_base_rotation
    tiers: [L2]
    engine: spike_gemmini_functional
    axes:
      - [instruction_class, LOOP_WS]
      - [instruction_class, LOOP_CONV]
    what: >-
      After every loop command issued with a non-zero output address the RTL rotates the accumulator
      base by the accumulator depth over the number of concurrent loops. The functional model pins
      the base at row zero, so a program that reads the accumulator across two loop commands sees
      different rows on the two engines.
    evidence: >-
      One executable, unchanged: the functional tier reported 0 of 1000 outputs wrong and the FPGA
      reported 1000 of 1000 wrong, with a different top-1 class.
    reproducer: >-
      Two back-to-back loop commands that write through the accumulator with an output address set,
      the second reading what the first accumulated.
  - id: residual_operand_store_state
    tiers: [L0, L1]
    engine: merlin_reference_and_command_buffer_sim
    axes:
      - [mode, padded_edge]
    what: >-
      The command-buffer simulator models tensors and has no operand store. A program whose result
      depends on what the store held at entry (the out-of-bounds taps of a padded convolution that
      the program never wrote) is judged there as if the store were zero.
    evidence: >-
      One padded 3x3 convolution run after a command that left non-zero rows in the store: the
      instruction-level functional tier differs from the declared convolution in 8 of 27 elements,
      and the command-buffer tiers report no difference.
    reproducer: >-
      Move a non-zero tensor into the operand-store rows a padded convolution gathers from, then
      run the convolution.
compiler_obligations:
  - must_prove_rhs_immutable_for_residency
  - must_tile_to_mesh_shape
  - must_commit_accumulator_before_reuse
  - must_respect_scratchpad_capacity
hardware_promises:
  - weight_stationary_resident_array
  - widening_integer_accumulate
  - cycle_counter
runtime_promises:
  - command_buffer
  - metrics
certification:
  status: uncertified
confidence: medium
requires_human_review: true
notes: >-
  Hand-curated prototype contract for the Gemmini C0 RTL-certification path. Mesh geometry, scratchpad/
  accumulator capacities and datapath dtypes are CIRCT-extracted facts (not declared here); consumers
  read them from the fact bundle. Spike-Gemmini is a functional bootstrap model (derived_from_rtl:
  false); only Verilator/FireSim count as RTL-certified.

# How a runner-owned harness calls into this target's kernel. These are conventions of this target's
# own bare-metal test environment, not RTL facts, so they cannot be derived and are declared here.
# Consumed by merlin.targetgen.contract.harness_abi; previously hardcoded in the generic compile path.
# The includes are the C runtime plus the MINIMAL generated hardware-facts header (support provider
# isa_headers.generated_header, merlin.targetgen.isa_header_gen): no vendor kernel library is on a
# fresh experiment's include path. GEMMINI_FENCE is that header's completion fence.
harness_abi:
  entry_symbol: gemmini_kernel
  fence_symbol: GEMMINI_FENCE
  includes:
    - <stdint.h>
    - <stdio.h>
    - <stdlib.h>
    - gemmini_isa.h
  cycle_window_metric: cycle_window_gemmini_region

# Registry pins (merlin/contract/hardware_pins.yaml) this target's results depend on. Read by
# merlin.targetgen.provenance.toolchain_shas so a run record says which hardware revision it belongs to.
hardware_pins:
  - gemmini_rtl

# Families this target DECLARES (the hardware has them) but whose probes cannot yet be turned
# into a runnable capsule. Recorded with a reason rather than left silent: a family that is
# declared, probed and never graded is an untested claim, and the coverage gate refuses to let
# one hide as an empty `skipped` list.
unmaterializable_families:
  elementwise_map: >-
    no probe path today: an elementwise capsule is authored through the PyTorch/linalg source with a host-eager golden (needs the m2m venv, so not a deterministic offline probe), and capsule_golden._recompute_golden has no elementwise op, so it cannot be graded at all on an exact-integer datapath.
    Needs a merlin_iface elementwise mnemonic + a recompute entry.

# SOFTWARE execution capabilities of the runner-owned harness path (runtime.backends.base
# EXECUTION_CAPABILITIES vocabulary), served by the generic chipyard RoCC backend from this block.
# They are properties of the generic harness renderer (merlin.targetgen.contract.harness_render),
# never of the RTL; an omitted name is false, and the renderer must implement every name kept here.
execution_capabilities:
  whole_program_kernel_abi: >-
    render_harness accepts kernel_abi.kind=whole_program and calls declared tensor arguments without
    performing model arithmetic in the runner-owned harness
  warm_single_counter_region_cycles: >-
    the whole-program harness executes one unmeasured warm invocation, then brackets exactly one complete
    kernel invocation with the target cycle counter

# What each readout of this design applies, as reviewed against the generated parameter header the
# harness is built with. The header's digest is cross-checked against the support provider's
# ISA-headers spec on every read: if the spec moves to other bytes, these facts refuse rather than
# describe a different header. Served by the generic backend as readout_epilogue_capability /
# epilogue_stage_routes / readout_scalar_abi / readout_operand_sum.
readout_semantics:
  evidence_header:
    file: include/gemmini_params.h
    sha256: 3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924
  # The full-width readout applies NOTHING: the RoCC model writes the raw accumulator on that path
  # (pre-scale, pre-activation), while the narrowing path applies scale and activation. A capsule
  # declaring i32 + relu measured 126/256 negative outputs. `requant` is absent from both: Merlin's
  # integer round-half-up shift is not the float scale this hardware computes.
  epilogue_capability:
    - selector: i8
      applies: [acc_scale, relu, maxpool]
      evidence: >-
        the narrowing readout applies accumulator scale and activation; bias is loaded into the
        accumulator before computation, not added during readout (GemminiRocketConfig AccumulatorScale
        and LoopMatmulLdD/LoopConvLdBias); RTL-certified bit-exact against Tensor.requant_acc_scale
        (decision A)
    - selector: i32
      applies: []
      evidence: >-
        the full-width readout writes the raw accumulator without applying an epilogue stage (RoCC
        accumulator mvout path); any contraction bias already in the accumulator was loaded before
        computation, via the separate accumulator_seed route
  # Contraction bias is seeded through MVIN (accumulate=0) before the first PRELOAD/COMPUTE, never
  # added by either readout; restricted to contraction paths so a RESIDUAL_ADD cannot inherit it.
  stage_routes:
    - stages: [bias_add, bias]
      site: accumulator_seed
      composed_with: contraction
      readouts: [i8, i32]
      producer_opcodes: [MATMUL_RESIDENT, CONV2D]
      consumer_opcodes: [COMMIT, CONV2D]
      operand_attribute: bias
      operand_role: bias
      evidence: >-
        Selected GemminiRocketConfig FIRRTL LoopMatmulLdD and LoopConvLdBias write bias into
        AccumulatorMem with accumulate=0; AccumulatorScale has no bias operand.
  # gemmini_params.h: `typedef int32_t acc_t`, `typedef int8_t elem_t`, `typedef float acc_scale_t`,
  # ACC_SCALE = ROUND_NEAR_EVEN(x * scale) saturated to [INT8_MIN, INT8_MAX].
  scalar_abi:
    schema: scalar_narrow_readout_contract_v1
    accumulator_dtype: i32
    output_dtype: i8
    scale_dtype: f32
    clamp_min: -128
    clamp_max: 127
  # gemmini_params.h: `#define HAS_MVIN_SCALE`, `typedef float scale_t`, MVIN_SCALE =
  # ROUND_NEAR_EVEN(x * scale) saturated to elem_t. Two loads meet in the addressable accumulator: one
  # overwriting, one accumulating (LocalAddr accumulate bit; see semantic_capabilities above).
  operand_sum:
    schema: operand_sum_contract_v1
    operands: 2
    operand_dtype: i8
    scale_dtype: f32
    operand_rounding: half_even
    operand_saturates: true

# Hardware performance-counter semantics the generic backend serves (counter_engine_kinds /
# counter_partition_inputs). Kinds are DECLARED, never read off a counter's spelling: EX executes on
# the mesh, LD and ST move operands between DRAM and the scratchpad/accumulator. `partition` names
# the elaborated modules the generic CIRCT occupancy-partition verifier inspects; it still has to
# prove the partition from the artifact before an overlap value is called measured.
counter_semantics:
  engine_kinds: {EX: compute, LD: movement, ST: movement}
  partition: {module: Gemmini, counter_module: CounterController}

# The host side of the logical (v2) runner-owned harness: how the caller reads the host cycle counter
# and waits for every outstanding accelerator command and memory access before reading results. Both
# are instructions of the host ISA (RISC-V `rdcycle`; `fence`, which a RoCC-attached core holds until
# the accelerator reports idle), declared here so the harness includes NO target header.
logical_harness:
  cycle_counter_asm: "rdcycle %0"
  completion_asm: "fence"
  # The header-free HARDWARE-COUNTER bracket (opt-in by MERLIN_HW_COUNTERS; never part of a default
  # run). Consumed by merlin.targetgen.contract.counter_bracket, which issues the counter command as a
  # raw RoCC instruction. Only what the extracted facts cannot ground is declared here:
  #   * `command` is a funct NAME; its CODE and the custom opcode are the RTL-decoded facts
  #     (funct_decode_table), never a literal;
  #   * `config_fields` is the bit layout of the command's rs1 word as the counter controller decodes it
  #     (generators/gemmini/src/main/scala/gemmini/CounterFile.scala, CounterController: rs1[0] reset,
  #     rs1[1] snapshot reset, rs1[2] take snapshot, rs1[3] change config, rs1[6:4] counter index,
  #     rs1[17:12] event address, rs1[31] external flag);
  #   * `events` are the event addresses of CounterFile.scala `object CounterEvent` (internal) and
  #     `object CounterExternal` (external, selected with the external flag); only the ones Merlin's
  #     occupancy and byte passes read, plus DISABLE for padding unused slots;
  #   * `slot_capacity` names the CIRCT module and state families the slot count is DERIVED from;
  #   * `partition` names the modules the occupancy-partition proof runs over in the elaborated CIRCT;
  #   * `engine_kinds` says which resource each counted engine is (EX executes on the mesh; LD and ST
  #     move data between memory and the scratchpad/accumulator).
  counter_bracket:
    command: COUNTER_OP
    config_fields:
      reset: {lsb: 0, width: 1}
      snapshot_reset: {lsb: 1, width: 1}
      snapshot_take: {lsb: 2, width: 1}
      configure: {lsb: 3, width: 1}
      slot: {lsb: 4, width: 3}
      event: {lsb: 12, width: 6}
      external: {lsb: 31, width: 1}
    disabled_event: DISABLE
    events:
      internal:
        DISABLE: 0
        MAIN_LD_CYCLES: 1
        MAIN_ST_CYCLES: 2
        MAIN_EX_CYCLES: 3
        MAIN_LD_ST_CYCLES: 4
        MAIN_LD_EX_CYCLES: 5
        MAIN_ST_EX_CYCLES: 6
        MAIN_LD_ST_EX_CYCLES: 7
      external:
        RDMA_BYTES_REC: 4
        WDMA_BYTES_SENT: 5
    slot_capacity:
      module: CounterFile
      state_families: [counter_config, counter_snapshot, counters]
    partition:
      module: Gemmini
      counter_module: CounterController
    engine_kinds: {EX: compute, LD: movement, ST: movement}

# WHICH elaboration this target's RTL facts are read from (merlin.targetgen.rtl.introspect
# declared_rtl_source). The chipyard checkout named by MERLIN_EXT_CHIPYARD at the pinned revision, its
# gemmini gitlink, and the issued elaboration's exact bytes: artifact_sha256 equals the issued
# operator-issued elaboration's SHA256SUMS (TestHarness.fir, top_module_hierarchy.json), so a checkout whose
# generated-src holds any other bytes is refused rather than read.
rtl_source:
  ext_root: chipyard
  config: GemminiRocketConfig
  generator: gemmini
  source_revision: 0acc1e1de2d3284bcd4d876956932a013ffe1949
  gitlinks:
    generators/gemmini: 8c3f9923a44a2fe2c7930587be297d6d4f8c09ca
  artifact_sha256:
    fir: da2c38c1bdc5c7ddf1c12c0d4a10a41323bf420c869351e52f796d41db325485
    hierarchy: 77693d9fdedb1bfdafb5a5a3c8998d59f4bbebef199540fd64c408abb3bc4d87
