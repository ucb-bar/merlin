# Models judged by `python -m merlin.model_check` for this target.
# Contract: docs/reference/model_check.md. Each program lists its @forward model inputs (in0, in1, ...) in
# order, each taken from:
#   {from: input, key: K}                         the input's model-ready array K
#   {from: tokens, slice: prefill|next}            token ids [1, prefill_tokens] / the step's next token [1, 1]
#   {from: output, program: P, output: i}          output i of program P's last step
#   {from: constant, value: [...], dtype: D}       a fixed tensor
# plus `carry: j` -- from the second step on, the program's own output j of the previous step (a state).
# The bindings restate each capture's session contract (session_contract.yaml); a program with `steps`
# runs that many times.
schema: merlin.model_check.models.v1
target: gemmini

# check --mode full: how each program's whole-model image is built and run (contract §2). Paths are
# repo-relative or ${ENV}-expanded; each model adds its arena (`full.arena_mb`).
full:
  board: gemmini_rocket_spike_functional
  board_catalog: examples/gemmini/platform/board-catalog.yaml
  host_dts: ${MERLIN_CHIPYARD}/sims/verilator/generated-src/chipyard.harness.TestHarness.GemminiRocketConfig/chipyard.harness.TestHarness.GemminiRocketConfig.dts
  datapath: int8

models:
  resnet50:
    workload: resnet50_v1_5
    chain: {kind: single}
    full: {arena_mb: 128}
    programs:
      - name: model
        stage: null
        inputs: [{from: input, key: in0}]
    judged:
      kind: logits
      outputs: [{program: model, output: 0}]
      topk: [1, 5]
      admission:                         # contract §4.5 (approved 1.7)
        - {metric: top1_agree, aggregate: mean, min: 0.9375}   # >= 15/16
        - {metric: cosine, aggregate: mean, min: 0.99}

  smolvla:
    workload: smolvla
    chain: {kind: flow, steps: 10}       # checkpoint config num_steps; t = 1.0, dt = -0.1 inside the program
    full: {arena_mb: 8192}
    programs:
      - name: prefix_encode
        stage: prefix_encode
        inputs:
          - {from: input, key: image}
          - {from: input, key: image_mask}
          - {from: input, key: language_tokens}
          - {from: input, key: language_mask}
          - {from: input, key: state}
      - name: flow_denoise
        stage: flow_denoise
        steps: 10
        inputs:
          - {from: output, program: prefix_encode, output: 0}
          - {from: output, program: prefix_encode, output: 1, carry: 1}
          - {from: input, key: noise, carry: 0}
          - {from: constant, value: [1.0], dtype: float32, carry: 2}
      - name: action_decode
        stage: action_decode
        inputs: [{from: output, program: flow_denoise, output: 0}]
    judged:
      kind: per_channel
      outputs: [{program: action_decode, output: 0}]
      channel_axis: -1
      channels: {first: 0, last: 5}      # the checkpoint's action feature shape is [6]; 6..31 are padding
      reference:                         # FP reference in f32; the bf16 model is the baseline
        precision: float32
        baseline: native
        seeds: {input: noise, count: 4}  # each input under 4 initial-noise draws: the 10-step flow is chaotic
      admission:                         # contract §4.5 (approved 1.9, 1.13): within 2x the bf16 model's own error
        - {metric: rel_rmse_worst, aggregate: mean, max_ratio_to_baseline: 2.0}
        - {metric: rel_rmse_worst, aggregate: p90, max_ratio_to_baseline: 2.0}
        - {metric: rel_rmse_worst, aggregate: max, max_ratio_to_baseline: 2.0, report_only: true}

  tiny_llama:
    workload: tiny_llama
    chain: {kind: causal, prefill_tokens: 128, decode_steps: 32}
    full: {arena_mb: 512}
    programs:
      - name: prefill
        stage: prefill
        inputs: [{from: tokens, slice: prefill}]
      - name: decode
        stage: decode
        steps: 32                          # teacher-forced on the input's next tokens
        inputs:
          - {from: tokens, slice: next}
          - {from: output, program: prefill, output: 1, carry: 1}
          - {from: output, program: prefill, output: 2, carry: 2}
    judged:
      kind: next_token_distribution
      outputs: [{program: prefill, output: 0}, {program: decode, output: 0}]
      admission:                         # contract §4.5 (proposed): KL 0.05 nats is about +5% perplexity
        - {metric: kl_mean, aggregate: mean, max: 0.05}
        - {metric: top1_agree, aggregate: mean, min: 0.90}
