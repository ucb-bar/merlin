# Models judged by `python -m merlin.model_check` for this target.
# Contract: docs/reference/model_check.md. State carried between chain steps comes from each capture's
# session_contract.yaml; this file only states the chain kind, the programs and what is judged.
schema: merlin.model_check.models.v1
target: gemmini

models:
  resnet50:
    workload: resnet50_v1_5
    chain: {kind: single}
    programs:
      - {name: model, stage: null}
    judged:
      kind: logits
      outputs: [{program: model, output: 0}]
      topk: [1, 5]

  smolvla:
    workload: smolvla
    chain:
      kind: flow
      steps: 10                # checkpoint config num_steps
      timestep: {start: 1.0, delta: -0.1}
    programs:
      - {name: prefix_encode, stage: prefix_encode}
      - {name: flow_denoise, stage: flow_denoise}
      - {name: action_decode, stage: action_decode}
    judged:
      kind: per_channel
      outputs: [{program: action_decode, output: 0}]
      channel_axis: -1
      channels: {first: 0, last: 13}   # ALOHA joints; 14..31 are zero padding

  tiny_llama:
    workload: tiny_llama
    chain:
      kind: causal
      prefill_tokens: 128
      decode_steps: 32         # teacher-forced on the input's next tokens
    programs:
      - {name: prefill, stage: prefill}
      - {name: decode, stage: decode}
    judged:
      kind: next_token_distribution
      outputs: [{program: prefill, output: 0}, {program: decode, output: 0}]
