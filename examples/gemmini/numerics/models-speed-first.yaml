# Explicit successor: FP quality is report-only; all quantized outputs remain strictly checked.
# Historical models.yaml and its admission rules are unchanged.
schema: merlin.model_check.models.v1
target: gemmini
numerics:
  version: merlin.model_check.numerics.v1
  report_only: true
  functional:
    atol: 2.0e-06
    rtol: 1.0e-05
    equal_nan: false
    finite_required: true
    integer_boolean: exact
    outputs: all_declared_every_step
  reporting:
    input_manifest: MANIFEST.json
    reduction_dtype: float64
    errors:
    - reference_rms
    - rmse
    - mae
    - max_abs_error
    - relative_l2
    zero_reference_energy: relative_l2_unavailable_report_absolute_errors
    sections:
    - program
    - step
    - output
    - channel
    - kernel_group
    - capture_attention_site
    percentile: linear
    missing_data: unavailable_never_pass
    mixed_units: no_cross_tensor_error_average
  quality_rules: models.*.judged.admission
full:
  board: firesim_gemmini_rocket_u250_30mhz
  board_catalog: examples/gemmini/platform/board-catalog.yaml
  host_dts: ${MERLIN_CHIPYARD_GEMMINI_ROCKET}/sims/firesim-staging/generated-src/firechip.chip.FireSim.FireSimGemminiRocketConfig/firechip.chip.FireSim.FireSimGemminiRocketConfig.dts
  datapath: int8
models:
  resnet50:
    workload: resnet50_v1_5
    chain:
      kind: single
    full:
      arena_mb: 128
      host_math_policy: native
    programs:
    - name: model
      stage: null
      inputs:
      - from: input
        key: in0
    judged:
      kind: logits
      outputs:
      - program: model
        output: 0
      topk:
      - 1
      - 5
      reporting:
        labels:
          path: inputs/resnet50/{split}.json
          field: imagenet_label
          namespace: ImageNet_1k
      admission:
      - metric: top1_agree
        aggregate: mean
        min: 0.9375
        report_only: true
      - metric: cosine
        aggregate: mean
        min: 0.98
        report_only: true
    numerical_profile: ../protocol/speed-first.yaml
  smolvla:
    workload: smolvla
    chain:
      kind: flow
      steps: 10
    full:
      arena_mb: 8192
      differential: cached
      host_math_policy: portable_neural_f32
    programs:
    - name: prefix_encode
      stage: prefix_encode
      inputs:
      - from: input
        key: image
      - from: input
        key: image_mask
      - from: input
        key: language_tokens
      - from: input
        key: language_mask
      - from: input
        key: state
    - name: flow_denoise
      stage: flow_denoise
      steps: 10
      inputs:
      - from: output
        program: prefix_encode
        output: 0
      - from: output
        program: prefix_encode
        output: 1
        carry: 1
      - from: input
        key: noise
        carry: 0
      - from: constant
        value:
        - 1.0
        dtype: float32
        carry: 2
    - name: action_decode
      stage: action_decode
      inputs:
      - from: output
        program: flow_denoise
        output: 0
    judged:
      kind: per_channel
      outputs:
      - program: action_decode
        output: 0
      channel_axis: -1
      channels:
        first: 0
        last: 5
      reference:
        precision: float32
        baseline: native
        seeds:
          input: noise
          count: 4
      admission:
      - metric: rel_rmse_worst
        aggregate: mean
        max_ratio_to_baseline: 2.0
        report_only: true
      - metric: rel_rmse_worst
        aggregate: p90
        max_ratio_to_baseline: 2.0
        report_only: true
      - metric: rel_rmse_worst
        aggregate: max
        max_ratio_to_baseline: 2.0
        report_only: true
    numerical_profile: ../protocol/speed-first.yaml
  tiny_llama:
    workload: tiny_llama
    chain:
      kind: causal
      prefill_tokens: 32
      decode_steps: 32
    full:
      arena_mb: 512
      differential: cached
      host_math_policy: portable_exp_trig
    programs:
    - name: prefill
      stage: prefill
      inputs:
      - from: tokens
        slice: prefill
    - name: decode
      stage: decode
      steps: 32
      inputs:
      - from: tokens
        slice: next
      - from: output
        program: prefill
        output: 1
        carry: 1
      - from: output
        program: prefill
        output: 2
        carry: 2
    judged:
      kind: next_token_distribution
      outputs:
      - program: prefill
        output: 0
      - program: decode
        output: 0
      reporting:
        perplexity:
          targets: teacher_forced_continuation
          score_tokens: decode_steps
          exclude_final_decode_logit: true
          padding: none
          threshold: report_only
      admission:
      - metric: kl_mean
        aggregate: mean
        max: 0.075
        report_only: true
      - metric: top1_agree
        aggregate: mean
        min: 0.9
        report_only: true
    numerical_profile: ../protocol/speed-first.yaml
