# The next fresh open-compiler run: the fresh2 spec plus the settings the launch builder
# added after fresh2. Select the run on the command line, e.g.
#   fresh_campaign.py plan --spec fresh-campaign-next.yaml --run-id gemmini-open-compiler-<date>-<tag>
# Its artifacts go to open-fresh/<tag>, its guidance is ${OPERATOR_TMP}/<tag>-guidance.md, and
# the reservation unit is the wrapper's run-id-derived name unless --unit selects one.
extends: fresh-campaign-fresh2.yaml
id: gemmini-open-compiler-fresh-next
variables:
  # Prospective source model; complete estimates guide exploration, not an accuracy claim.
  # Override both variables when selecting a different immutable runtime bundle.
  NEXT_TIMING_SELECTION: ${WORKSPACE}/tasks/el4-cycle-source-repair-20261026/merlin/out/artifacts/prospective-performance-selection-v83/performance-selection.json
  NEXT_TIMING_SELECTION_SHA256: 5a219811e8edbe66197b57cacb84008833abcdc9ee6d73a36a81d4f0eb0788ef
  NEXT_ORDERING_SELECTION: ${WORKSPACE}/tasks/el4-orchestration-feedback-20261026/merlin/out/artifacts/studies/completion-order-selection-v2/selection.json
  NEXT_ORDERING_SELECTION_SHA256: 5ba76d2743c988474bac9dc959f36cc1cfa480cf75d1cda089cff343e089ddb9
  NEXT_CORRECTNESS_ROSTER_PIN: '{"path": "${TASK}/.tmp/fresh4/original-roster-r6.json", "sha256": "ef87a212e750da87b22be4fec6cd947fdeb8db8be876dd95fe7e7e4f0ed12ab8"}'
run:
  run_id: null
  unit: null
  # Operator decision (2026-10-26): a 4.5 h clock; the policy's 1 h drain holds the final grade.
  max_wall_s: 16200
  final_model_s: 3600
  # Codex fresh-context helpers reason at medium effort.
  author_helper_effort: medium
seal:
  # Each corpus seal records its own review: pass --review-note.
  review_note: null
plan:
  record:
    acceptance: Fresh backend with reviewed inputs; correctness and performance qualification remain execution results.
  timing_selection: ${NEXT_TIMING_SELECTION}
  environment:
    MERLIN_COMPLETION_ORDER_SELECTION: '{"path": "${NEXT_ORDERING_SELECTION}", "sha256": "${NEXT_ORDERING_SELECTION_SHA256}"}'
    MERLIN_JOINT_CORRECTNESS_ROSTER: ${NEXT_CORRECTNESS_ROSTER_PIN}
  policy:
    base:
      path: ${REPO}/out/artifacts/open-fresh/fresh4/policy.json
      sha256: 7249861d575f99833d6209b83c30d6ab00d0c3b2c7d3b30059ebd2c5ee7a2a58
    # Preserve this corpus's exclusions and connected-program roles from its policy.
    performance_scope: null
    defaults:
      # Operator decision (2026-10-26): the author's compiler never hands a whole loop nest to the
      # accelerator's own hardware-loop state machine. Every grader of the run fails a case whose
      # executed command stream issues a command the target's derived ISA facts give this role.
      prohibited_instruction_roles: [loop_descriptor]
      # Long gSIM measurements of the largest cases (idle capacity only; never the grade reserve).
      gsim_measurement:
        long_max_jobs: 4
        # gSIM runs only where its projected wall time fits: longer runs stall iteration.
        max_job_wall_s: 1800
      gsim:
        max_job_wall_s: 1800
      gsim_correctness:
        max_job_wall_s: 1800
inputs:
  # Same reviewed regenerated corpus/programs as fresh4, refreshed with the new SDK.
  corpus: ${REPO}/out/build/run-frameworks/f2de5a334b00/out/artifacts/fresh-inputs/source-release
  public_references: ${WORKSPACE}/tasks/el4-feedback-integration-20261026/merlin/out/artifacts/preparation/public-optimized-exo
  public_program_suite:
    path: ${WORKSPACE}/tasks/el4-orchestration-feedback-20261026/merlin/out/artifacts/studies/connected-block-publication-v4/program-selection.json
    sha256: 051893049e77ccd52872e6c93903ea3631a2d381d7a1deeba4c5f7c30a1e8cfd
  host_capability_selection:
    path: ${FRAMEWORK}/examples/gemmini/platform/host-capabilities.yaml
    sha256: f2934e728ecdbb18b9f6a4cf6365aec6bf05ba381fd89bd397010909a151b326
  environment:
    MERLIN_JOINT_CORRECTNESS_ROSTER: ${NEXT_CORRECTNESS_ROSTER_PIN}
    MERLIN_JOINT_PERFORMANCE_SELECTION: '{"path": "${NEXT_TIMING_SELECTION}", "sha256": "${NEXT_TIMING_SELECTION_SHA256}"}'
  # The author SDK that withholds every author-inaccessible module (withheld packages and access-policy
  # grader/oracle modules), with explicit shared exploration and logical-ABI APIs. fresh2 ran
  # the earlier withholding release under its
  # pre-merge number (inventory 20, substrate v13); those numbers now name the V20 carried-event roster.
  library_version: 22
  common_substrate: merlin.common_compiler_substrate.v15
  # Exact additional generic leaves relative to the pinned previous_library.
  # Listing these explicitly keeps SDK expansion reviewable; no package-wide grant.
  reviewed_modules:
  - merlin.sched.ir.events
  - merlin.compile.scheduling.scf_carried_events
  - merlin.sched.primitives.event_loops
  - merlin.common.stat_memo
  - merlin.sched.primitives.loop_handles
  - merlin.compile.scheduling.completion_streams
  - merlin.compile.scheduling.configuration_motion
  - merlin.compile.scheduling.spatial_max_stripes
  - merlin.compile.logical_abi
  - merlin.compile.scheduling.convolution_exploration
  - merlin.transforms.evaluated_exploration
  - merlin.transforms.shape_policy
