  SUPERVISOR_FINAL_RESERVE_S: '4500'
  SUPERVISOR_PSS_MAX_BYTES: '206158430208'
  SUPERVISOR_HOST_HEADROOM_BYTES: '25769803776'
  REFERENCE_CPUS: ''
  READINESS: ${TASK_ROOT}/.tmp/phase1-overnight-20261019-v1
identity:
  target: gemmini
  level: EL4
  arm: merlin_assisted
  treatment: rtlchecks
  bundle: merlin_assisted_rtlchecks_public_v0
  experiment: full
  schedule: continuous
launcher:
