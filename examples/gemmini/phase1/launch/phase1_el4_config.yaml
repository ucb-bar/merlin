  WORKSPACE_ROOT: ${TASK_ROOT}/../..
  REPO: ${TASK_ROOT}/.sub/agent-a754baf87337521b4/merlin
  RELEASE: ${REPO}/out/artifacts/protocols/gemmini/phase0-closure-20261019-v26
  NUMERICS_BUNDLE: ${TASK_ROOT}/private/gemmini/numerics/closure-20261019-overnight-v1
  PYTHON: ${TASK_ROOT}/merlin/.venv/bin/python
  CHIPYARD: ${TASK_ROOT}/.tmp/chipyard-fire-aligned
  SPIKE_RUNTIME: ${TASK_ROOT}/out/fire-aligned-spike-30mhz/runtime
  GSIM_EMULATOR: ${TASK_ROOT}/.tmp/gsim-fire-aligned-provisional-v3/native/emulator
  TIMING_PROFILE: ${TASK_ROOT}/.tmp/fire-aligned-timing-profile-v2.json
  RTL_FACTS: ${TASK_ROOT}/merlin/out/artifacts/probes/gemmini/fire-aligned-30mhz/input/facts-v6.json
