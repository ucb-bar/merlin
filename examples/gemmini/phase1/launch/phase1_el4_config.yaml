schema: merlin.phase1.launch_config.v1
id: gemmini-el4-closure-18cpu-v26
description: Fresh empty-origin EL4 on sealed v26, 18 assigned CPUs. This selects
  frozen accelerator inputs and untuned FireSim-aligned Spike/gSIM. Complete model
  chains must match the selected quantized references with exact accelerator-kernel
  checks. Four-hour guard, final 75-minute reserve and memory policy are described
  in closure-18cpu.md.
