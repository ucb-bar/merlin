    PYTHONDONTWRITEBYTECODE: '1'
    PYTHONUNBUFFERED: '1'
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
    MERLIN_PUBLIC_SCALE_BATCH_WORKERS: '2'
