schema: merlin.phase1.launch_config.v1
id: gemmini-el4-capsule-closure-18cpu-v26
description: Fresh empty-origin EL4 on sealed v26, 18 assigned CPUs. This selects
  frozen accelerator inputs and untuned FireSim-aligned Spike/gSIM. Complete model
  chains remain a separate external validation with exact quantized-reference and
  accelerator-kernel checks. Capsule authoring and strict grading have a three-hour
  clock after preparation; external validation starts only after the capsule owner
  exits.
validation_scope: capsules
external_validation:
