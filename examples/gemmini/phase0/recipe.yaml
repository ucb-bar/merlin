# Authored software semantics and independent checks. Hardware geometry, legal
# families and application shapes belong to extracted facts and the generated
# requirement/synthesis artifacts, not this recipe. These 50 seed cases and two
# sweeps remain authored until a reviewed generated corpus proves equivalence.
datapath:
  # Eligible regions must reach the accelerator; host-only cases override this.
  semantic_defaults: {must_accelerate: true}
  compare: exact_int
  requant_output_dtype: i8
  # Independent round-half-up integer requant shift, distinct from acc_scale.
  # Value 3 detects a backend silently using the historical default of 4.
  requant_shift: 3
  required_oracle_tiers:
  - L0
  - L1
  - L2
  - L3
capsules:
- name: A0_config_smoke
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: CONFIG_EX/LD/ST smoke via a single 16x16 matmul
  comment: 'A0: CONFIG_EX/CONFIG_LD/CONFIG_ST smoke (trace must contain all three
    config classes).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: A2_single_tile_matmul
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/matmul_ws.c
  comment: 'A2: single 16x16 i8 matmul -> i32 (CONFIG, MVIN, PRELOAD, COMPUTE_PRELOADED,
    MVOUT).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: A3_k_accumulation
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/tiled_matmul_ws.c
  comment: 'A3: K=32 (> tile dim) forces K-accumulation (accumulate-onto PRELOAD across
    K tiles).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  modes:
    k_accumulate: true
- name: A4_acc_scale_i8
  stimulus_range: [-4, 3]
  kind: isa
  op: matmul
  source_role: uplifted_from_bareMetalC
  source_reference: bareMetalC/transpose_scale.c
  comment: 'A4: int32 accumulator -> f32 acc_scale (0.0625) -> saturating i8 readout.'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  acc_scale: 0.0625
  modes:
    i8: true
    acc_scale: true
- name: A5_relu_epilogue
  stimulus_range: [-4, 3]
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: relu activation
  comment: 'A5: relu activation (activation bits set in CONFIG_ST; exact relu numerics).'
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: A0
  weight: W
  out: Y0
  epilogue:
  - relu
  modes:
    relu: true
- name: A6_resident_reuse
  stimulus_range: [-4, 3]
  kind: isa
  op: resident_reuse
  source_role: handauthored_compiler_test
  source_reference: resident weight reuse across two matmuls
  comment: 'A6 resident reuse: one resident weight reused across two matmuls (16x16
    tiles).'
  weight: W
  K_tiles: 1
  N_tiles: 1
  matmuls:
  - lhs: A0
    out: Y0
    epilogue: []
    M_tiles: 1
  - lhs: A1
    out: Y1
    epilogue:
    - relu
    M_tiles: 1
- name: A7_edge_padding
  kind: isa
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: bareMetalC/padded.c
  comment: 'A7: non-16-multiple dims (20x24x12); backend zero-pads to tiles, valid
    window is exact.'
  M: 20
  K: 24
  N: 12
  lhs: A0
  weight: W
  out: Y0
  modes:
    padded_edge: true
- name: B0_quantized_linear_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + per-tensor requant
  comment: 'B0: quantized linear (i8 x i8 -> i32 -> acc_scale -> i8).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  acc_scale: 0.0625
  semantic: quantized_linear
  modes:
    i8: true
    acc_scale: true
    k_accumulate: true
- name: B1_linear_relu_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + ReLU
  comment: 'B1: linear + relu (i32 readout).'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - relu
  semantic: linear_relu
  modes:
    relu: true
- name: B2_linear_acc_scale_relu_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: matmul
  source_role: pytorch_model_slice
  source_reference: nn.Linear + requant + ReLU
  comment: 'B2: linear + acc_scale + relu -> i8.'
  M_tiles: 1
  K_tiles: 2
  N_tiles: 1
  lhs: X
  weight: W
  out: Y0
  epilogue:
  - acc_scale
  - relu
  acc_scale: 0.0625
  semantic: linear_acc_scale_relu
  modes:
    i8: true
    acc_scale: true
    relu: true
- name: C0_mlp_linear1
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: mlp.fc1
  comment: C0_mlp_linear1
  M_tiles: 1
  K_tiles: 4
  N_tiles: 4
  lhs: X
  weight: W1
  out: Y0
  semantic: mlp_linear1
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: C1_mlp_activation_linear2
  stimulus_range: [-4, 3]
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: mlp.relu+fc2
  comment: C1_mlp_activation_linear2
  M_tiles: 1
  K_tiles: 4
  N_tiles: 4
  lhs: H
  weight: W2
  out: Y0
  epilogue:
  - relu
  semantic: mlp_relu_linear2
  modes:
    i8: false
    relu: true
    acc_scale: false
- name: C2_attention_q_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.q_proj
  comment: C2_attention_q_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wq
  out: Y0
  semantic: attn_q_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: C3_attention_k_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.k_proj
  comment: C3_attention_k_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wk
  out: Y0
  semantic: attn_k_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: C4_attention_v_projection
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.v_proj
  comment: C4_attention_v_projection
  M_tiles: 1
  K_tiles: 4
  N_tiles: 1
  lhs: X
  weight: Wv
  out: Y0
  semantic: attn_v_proj
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: C5_attention_qk_matmul
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.q@k^T (Kt = K transposed leaf)
  comment: C5_attention_qk_matmul
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: Q
  weight: Kt
  out: Y0
  semantic: attn_qk
  modes:
    i8: false
    relu: false
    acc_scale: false
- name: C6_attention_pv_matmul
  kind: model_slice
  op: matmul
  source_role: pytorch_model_slice
  source_reference: attn.p@v
  comment: C6_attention_pv_matmul
  M_tiles: 1
  K_tiles: 1
  N_tiles: 1
  lhs: P
  weight: V
  out: Y0
  semantic: attn_pv
  modes:
    i8: false
    relu: false
    acc_scale: false
# --- Fused ops mined from gemmini-rocc-tests (tiled_matmul_ws_{layernorm,softmax,igelu}, attn_fp8_*).
# These norm/activation/attention algorithms run in bf16 (the non-accelerator lanes compose with the int8
# matmul mesh), so they are PyTorch-sourced (source: pytorch) with the m2m linalg as the interface.
- {name: GF1_softmax_bf16_pt, kind: model_slice, op: softmax, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch softmax bf16 (tiled_matmul_ws_softmax family)', modes: {}}
- {name: GF2_attn_full_bf16_pt, kind: model_slice, op: attention_full,
   operand_dtype: bf16, source: pytorch, M: 16, K: 64, N: 16, Dv: 64, causal: true, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch causal attention bf16 (attn_fp8_full family)', modes: {}}
- {name: GF3_geglu_bf16_pt, kind: model_slice, op: geglu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, N: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GeGLU bf16 (tiled_matmul_ws_igelu family)', modes: {}}
# No TorchAO dynamic-W8A8 seed is asserted until transposed-RHS and quantizer
# support semantics are executable. See README for the current Phase 0 refusal.

# Negative lane: captured normalization is not admitted by the mesh. Execution,
# not a routing plan, must show this work stayed off mesh.
- {name: GN0_layernorm_host_only_bf16_pt, kind: model_slice, op: layernorm,
   operand_dtype: bf16, source: pytorch, M: 16, K: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch LayerNorm bf16 — the negative lane: this target declares no normalization
     capability, so every region must land on the host and none may reach the mesh',
   modes: {},
   lanes: {forbid: [on_mesh]},
   # This authored seed needs both lowering and host-seam evidence.
   pass_requirements: [host-seam, target-isa-lowering],
   generalization: {must_accelerate: false, not_asserted_reason: 'host-only capsule: this target admits
     no normalization family, so accelerating any region would be the defect. The demand is the inverted
     one -- lanes.forbid [on_mesh] -- checked against execution, never a routing plan.'}}
# --- More int8 matmul-family (direct-MLIR int engine): Q@K^T attention scores.
- {name: C7_attention_qk_i8, kind: model_slice, op: attention_qk, M_tiles: 1,
   K_tiles: 2, q: Q, k: K, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'int8 Q@K^T attention scores (bareMetalC attention)', modes: {}}
# --- Whole-model capstone (GATED): small_llama in int8 (torchAO int8_weight_only) end to end.
- {name: M0_small_llama_gemmini, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 — whole-model capstone (embed/RMSNorm/RoPE/attn/SwiGLU/lm_head)',
   gate: {after_op_pass_fraction: 0.8}}
# --- Elementwise/activation ops mined from gemmini-rocc-tests (resadd residual, igelu activation).
- {name: GF4_add_bf16_pt, kind: model_slice, op: add, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch residual add bf16 (gemmini-rocc-tests resadd)', modes: {}}
- {name: GF5_gelu_bf16_pt, kind: model_slice, op: gelu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GELU-tanh bf16 (gemmini-rocc-tests igelu)', modes: {}}
# --- Spec-sourced capsule: the PROGRAM + bit-exact golden come from the specir verification spec itself
# (spec_ref), not a handauthored template — the spec's command buffer + coverage_goal ship as grounding.
- {name: GS0_matmul_spec, kind: isa, op: matmul, source: spec, spec_ref: 'gemmini:op.matmul',
   M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0, source_role: spec_derived,
   source_reference: 'specir spec-sourced int8 matmul (program + bit-exact refmodel golden + coverage)',
}
# --- Conv family: native int8 conv2d (direct-MLIR merlin_iface.conv2d, mined from bareMetalC/conv.c) +
# the vector-lane conv/pool ops (bf16 pytorch: depthwise MixFFN, pooling, global average).
- {name: GC0_conv2d_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8, kh: 3, kw: 3,
   source_role: uplifted_from_bareMetalC, source_reference: 'im2col conv2d int8 (bareMetalC/conv.c)',
}
# Explicit convolution corners: same-padding must zero out-of-bounds taps;
# stride 2 tests a different input-row reuse pattern.
- {name: GC7_conv2d_pad_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8,
   kh: 3, kw: 3, padding: [1, 1, 1, 1],
   source_role: derived_sweep,
   source_reference: 'im2col conv2d int8 at same-padding: the out-of-bounds taps must read as zero
     rather than as whatever the staging buffer last held',
}
- {name: GC8_conv2d_stride2_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8,
   kh: 3, kw: 3, stride: [2, 2],
   source_role: derived_sweep,
   source_reference: 'im2col conv2d int8 at stride 2: consecutive output positions share no input tap',
}
# Quantized convolution epilogue: four independent geometry/scale cases demand
# ordered bias_add -> acc_scale -> relu on the mesh store path. Value equality
# alone is insufficient; lanes.require asserts placement. These are independent
# semantic checks, not copies of held-out ResNet capture shapes.
- {name: GQ0_conv2d_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 8, Wimg: 8, ci: 4, N: 16, kh: 3, kw: 3,
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.0625,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 conv with the quantized CNN epilogue fused onto the store path
     (per-channel bias -> f32 acc_scale -> relu -> saturating i8 commit), asserted on_mesh',
   comment: 'GQ0: 3x3 int8 conv over 8x8x4 -> 6x6x16 with bias/acc_scale/relu fused on the store path.',
}
# Pointwise convolution isolates the one-tap epilogue path.
- {name: GQ1_conv2d_1x1_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 6, Wimg: 6, ci: 16, N: 16, kh: 1, kw: 1,
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.125,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 1x1 pointwise conv with the quantized epilogue fused onto the store path --
     the shape where the epilogue dominates the layer',
   comment: 'GQ1: 1x1 int8 conv over 6x6x16 -> 6x6x16 with bias/acc_scale/relu fused on the store path.',
}
# Compose same-padding with quantized readout to check border values.
- {name: GQ2_conv2d_pad_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 6, Wimg: 6, ci: 4, N: 16, kh: 3, kw: 3, padding: [1, 1, 1, 1],
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.03125,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 same-padded conv with the quantized epilogue fused onto the store path:
     the out-of-bounds taps must read as zero THROUGH the requantization',
   comment: 'GQ2: 3x3 same-padded int8 conv over 6x6x4 -> 6x6x16 with the quantized epilogue fused.',
}
# Compose stride 2 with quantized readout.
- {name: GQ3_conv2d_stride2_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 8, Wimg: 8, ci: 8, N: 16, kh: 3, kw: 3, stride: [2, 2],
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.25,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 stride-2 conv with the quantized epilogue fused onto the store path --
     the ResNet stage-transition shape',
   comment: 'GQ3: 3x3 stride-2 int8 conv over 8x8x8 -> 3x3x16 with the quantized epilogue fused.',
}
# Rank-3 batched contraction checks the reviewed rank admission.
- {name: GB0_batched_matmul_i8, kind: layer, op: gemv_batched, B: 2, M: 16, H: 32, N: 16,
   source_role: derived_sweep,
   source_reference: 'batched int8 contraction: two independent (M,H)x(H,N) slices, the rank-3 shape
     the target contract admits and no other capsule declares',
   modes: {}}
- {name: GC1_depthwise_bf16_pt, kind: model_slice, op: depthwise_conv2d,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 3, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch depthwise conv bf16 (MixFFN depthwise)',
   modes: {}}
- {name: GC2_maxpool_bf16_pt, kind: model_slice, op: maxpool2d, operand_dtype: bf16,
   source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 2, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch 2x2 max-pool bf16', modes: {}}
- {name: GC3_avgpool_bf16_pt, kind: model_slice, op: avgpool2d, operand_dtype: bf16,
   source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 2, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch 2x2 avg-pool bf16', modes: {}}
- {name: GC4_global_avg_bf16_pt, kind: model_slice, op: global_average,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch global average pool bf16',
   modes: {}}
- {name: GC5_fused_matmul_bias_bf16_pt, kind: model_slice, op: fused_matmul_bias,
   operand_dtype: bf16, source: pytorch, M: 16, K: 16, N: 16, out: Y0, comparison_group: fused_matmul_bias,
   source_role: pytorch_model_slice, source_reference: 'PyTorch linear+bias bf16', modes: {}}
- {name: GC6_bias_add_bf16_pt, kind: model_slice, op: bias_add, operand_dtype: bf16,
   source: pytorch, M: 16, N: 16, out: Y0, comparison_group: bias_add, source_role: pytorch_model_slice,
   source_reference: 'PyTorch bias add bf16', modes: {}}
# --- Second whole-model capstone (GATED): lstmnetvit int8 — broader layer types (conv patch-embed,
# spatial-reduction attention, depthwise MixFFN, PixelShuffle+upsample, LSTM head) beyond small_llama.
- {name: M1_lstmnetvit_gemmini, kind: model, op: model, model: lstmnetvit,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'lstmnetvit int8 — vision+LSTM control net (conv/spatial-attn/MixFFN/upsample/LSTM)',
   gate: {after_op_pass_fraction: 0.8}}
# Mixed-lane model: both mesh and host scalar/RVV work must execute.
- {name: GX0_interop_rvv_lane, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 composed across the systolic mesh and the host scalar/RVV lane — asserts both lanes carried work',
   gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]},
   generalization: {not_asserted_reason: 'interop capsule: composition across lanes is the behaviour
     under test, so host/RVV-lane work is expected and required. The accelerator demand is expressed as
     lanes.require [on_mesh, scalar_rvv_lane], which fails unless both lanes carried work.'}}
# Small whole-model representative sized for the cycle-accurate tier. Its
# composition includes admitted work and host-only islands; inspect the
# generated model source and run receipt for the actual selected network.
# Its loader already expresses integer GEMMs among floating host operations.
# Applying PT2E to this graph would attach observers to int8 tensors, so the
# generic capture mode preserves and verifies its materialized contractions.
- {name: M2_microvit_gemmini, kind: model, op: model, model: microvit,
   loader: examples/gemmini/phase0/inputs/microvit.py,
   operand_dtype: int8, capture_quantization: already_materialized, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'microvit int8 — tile-sized vision+recurrent control net (overlapping patch-merge, pooled-reduction attention, depthwise MixFFN, pixel-shuffle/max-pool fusion, LSTM cell), composed across the systolic mesh and the host lane',
   gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]},
   pass_requirements: [model-boundary-capstone],
   generalization: {not_asserted_reason: 'The model deliberately contains required scalar/RVV host
     islands, so whole-model all-region acceleration is not the claim; lanes.require independently
     requires mesh execution.'}}

# Small VLA denoise-step representative: prefix and action-expert
# cross-attention, with explicitly required mesh and host execution. The
# source application is derivation evidence, not a held-out claim model.
- {name: M4_smolvla_denoise_gemmini, kind: model, op: model, model: smolvla_denoise_step,
   loader: examples/gemmini/phase0/inputs/smolvla_denoise_step.py,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'smolvla denoise step int8 — one flow-matching step of a vision-language-action
     policy (patch-embed conv, concatenated vision+language+state prefix, RoPE self-attention, SwiGLU,
     timestep-conditioned action expert cross-attending into the prefix, GELU FFN, action head), at the
     extents the cycle-accurate tier can afford; op inventory derived from the prov census of
     out/artifacts/recaptures/smolvla_denoise_step_fp32_app/model.mlir',
   gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]},
   pass_requirements: [model-boundary-capstone],
   generalization: {not_asserted_reason: 'The model deliberately contains required scalar/RVV host
     islands (RMSNorm, softmax, silu/gelu), so whole-model all-region acceleration is not the claim;
     lanes.require independently requires mesh execution.'}}

# Focused accelerator -> host -> accelerator composition check. The host island
# is normalization, which the reviewed mesh contract does not admit.
- {name: M3_host_island_seam_gemmini, kind: model, op: model, model: host_island_seam,
   loader: examples/gemmini/phase0/inputs/host_island_seam.py,
   operand_dtype: int8, capture_quantization: already_materialized, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'int8 GEMM -> host LayerNorm -> int8 GEMM: the A->H->A seam as the subject of a capsule rather than a by-product of a whole model',
   gate: {after_op_pass_fraction: 0.0},
   pass_requirements: [model-boundary-capstone],
   lanes: {require: [on_mesh, scalar_rvv_lane]},
   # Both mesh placement and observed host execution are required.
   generalization: {must_accelerate: true},
   comment: 'M3: the A->H->A seam as the subject of a capsule. An int8 GEMM on the mesh, a LayerNorm
     on the host lane (this target declares no normalization capability, so the island is host work
     because the hardware cannot do it), and the value back to the mesh for a second int8 GEMM. The
     four whole models all CONTAIN this shape and all classify as `routing`, so the seam was covered
     only incidentally; one region more on either side of this one would retitle it `routing` too.'}

# Store-pressure corners: one operand set fits once; the next spills. These
# absolute extents are checked against extracted store capacity, not assumed to
# apply to another elaboration.
- name: GM0_deep_k_fits_single_i8
  kind: layer
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived memory-mapping coverage: a contraction whose operands occupy 12288 of the operand store's
    16384 rows (75.0%) -- it fits ONCE and cannot be double-buffered, so serialising movement against
    compute is correct here and failing to stage is not a defect
  comment: 'GM0: deep-K int8 contraction sized to the fits_single regime (75.0% of the operand store).'
  M: 16
  K: 6144
  N: 16
  lhs: X
  weight: W
  out: Y0
  generalization: {generalization_axis: shape}
  modes:
    k_accumulate: true
- name: GM1_deep_k_spills_i8
  kind: layer
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived memory-mapping coverage: the SMALLEST tile-aligned contraction whose operands exceed the
    operand store (16416 of 16384 rows, 100.2%) -- no allocation makes it fit, so the compiler must
    choose a loop order and pay re-load traffic instead of holding everything resident
  comment: 'GM1: deep-K int8 contraction sized past the operand store (100.2%) -- the spills regime.'
  M: 16
  K: 8208
  N: 16
  lhs: X
  weight: W
  out: Y0
  generalization: {generalization_axis: shape}
  modes:
    k_accumulate: true

# Pooling is fused to the store path, not a standalone mesh operation. These
# authored cases check aligned and partial windows and composition with conv.
- name: GP0_matmul_maxpool_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage: an int8 contraction whose accumulator readout pools 2x2, the store-path
    fusion the capability manifest declares (has_max_pool) and which no capsule exercised -- every
    extent a whole tile, so this is the `reduction/i8/aligned` cell
  comment: 'GP0: 16x16x16 int8 matmul whose commit fuses a 2x2/2 max-pool over the 4x4 output plane.'
  M: 16
  K: 16
  N: 16
  lhs: A0
  weight: W
  out: Y0
  epilogue: [maxpool]
  # Store-DMA pooling consumes the narrowed int8 readout.
  output_dtype: i8
  # 16 rows form a 4x4 plane; GP1 covers the ragged case.
  pool_in_dims: [4, 4]
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}
  modes:
    i8: true
    relu: false
    acc_scale: false
- name: GP1_matmul_maxpool_tail_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: matmul
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage at the tail: a 5x5 output plane pooled by a 2x2/2 window (the fifth row and
    column fall outside every window and must be DROPPED, not folded in) with an output extent that does
    not divide the array edge -- the `reduction/i8/partial` cell
  comment: 'GP1: 25x16x17 int8 matmul; the commit pools a ragged 5x5 plane 2x2/2 down to 2x2.'
  # The final row/column in a 5x5 plane must be dropped by 2x2/2 pooling.
  M: 25
  K: 16
  # Also cross the channel tile edge.
  N: tile+1
  lhs: A0
  weight: W
  out: Y0
  epilogue: [maxpool]
  output_dtype: i8
  pool_in_dims: [5, 5]
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}
  modes:
    i8: true
    relu: false
    acc_scale: false
- name: GP2_conv2d_maxpool_i8
  stimulus_range: [-4, 3]
  kind: layer
  op: conv2d
  source_role: handauthored_compiler_test
  source_reference: >-
    derived pooling coverage in its NATIVE form: the fused conv loop takes the pooling window directly
    (pool_size/pool_stride/pool_padding) and stores the pooled result, so a conv+pool is the shape the
    hardware actually offers -- the conv-with-epilogue counterpart of GP0/GP1
  comment: 'GP2: 3x3 int8 conv over 8x8x4 -> 6x6x16, with a 2x2/2 max-pool fused onto the store.'
  Himg: 8
  Wimg: 8
  ci: 4
  N: 16
  kh: 3
  kw: 3
  epilogue: [maxpool]
  output_dtype: i8
  modes: {conv2d: true, k_accumulate: true, i8: true}
  # The conv output determines pool_in_dims; do not duplicate that extent.
  pool_size: [2, 2]
  pool_stride: [2, 2]
  generalization: {generalization_axis: composition}


# Tile-relative sweeps generate partial movement and fused-epilogue cases.
sweeps:
- id: FT
  name: '{id}{i:02d}_movement_tail_{M}x{N}'
  source_reference: >-
    derived tail-path coverage for the movement family: a load/store round-trip on extents that do not
    divide the array edge, one below it and one above
  base: {kind: isa, cat: isa, op: movement, label: public, src: X, out: Y0, modes: {movement: true}}
  axes:
    M: [tile-1, tile+1]
    N: [tile-1]

- id: FE
  name: '{id}{i:02d}_fused_epilogue_tail_{M}x{K}x{N}'
  source_reference: >-
    derived tail-path coverage for the fused epilogue: this target declares elementwise_map reachable
    ONLY composed with a contraction, so a standalone elementwise capsule would be the wrong capsule --
    the eligibility oracle refuses one as a false fallback. The epilogue is therefore the only way the
    cell can be evidenced, and it had never been evidenced at a partial tile
  base:
    kind: isa
    cat: isa
    op: matmul
    label: public
    lhs: A0
    weight: W
    out: Y0
    epilogue: [acc_scale, relu]
    acc_scale: 0.0625
    modes: {i8: true, relu: true, acc_scale: true}
    # Signed inputs make both stages observable.
    stimulus_range: [-4, 3]
  axes:
    M: [tile-1]
    # Two K depths separate tile rate from fixed overhead.
    K: [tile, 2*tile]
    N: [tile+1]
