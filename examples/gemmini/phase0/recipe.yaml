# --- Fused ops mined from gemmini-rocc-tests (tiled_matmul_ws_{layernorm,softmax,igelu}, attn_fp8_*).
# These norm/activation/attention algorithms run in bf16 (the non-accelerator lanes compose with the int8
# matmul mesh), so they are PyTorch-sourced (source: pytorch) with the m2m linalg as the interface.
- {name: GF1_softmax_bf16_pt, kind: model_slice, op: softmax, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch softmax bf16 (tiled_matmul_ws_softmax family)', modes: {}}
- {name: GF2_attn_full_bf16_pt, kind: model_slice, op: attention_full,
   operand_dtype: bf16, source: pytorch, M: 16, K: 64, N: 16, Dv: 64, causal: true, out: Y0,
   source_role: pytorch_model_slice,
   source_reference: 'PyTorch causal attention bf16 (attn_fp8_full family)', modes: {}}
- {name: GF3_geglu_bf16_pt, kind: model_slice, op: geglu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, N: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GeGLU bf16 (tiled_matmul_ws_igelu family)', modes: {}}
# --- W8A8 CAPSULE: MECHANISM LANDED, CAPSULE NOT YET AUTHORED.
# The plumbing is in place and verified (a capture requested at `quant_scheme: int8_dyn_act_int8_weight`
# emits `aten._int_mm` accumulating in i32 instead of a float matmul over dequantized weights), and the
# interface derivation now accepts `int_matmul` as a contraction marker. One step remains: torchAO
# quantizes `nn.Linear`, whose weight is stored [N, K], while the merlin_iface builder declares the RHS
# [K, N] -- so the shape check rightly refuses the pair. Closing it means teaching the builder the
# transposed-RHS layout (the iface's `resident_pack` already carries a `layout` attribute), which is a
# real feature and not a check to loosen. Declaring a capsule before then would either bake a wrong
# layout or force the check to accept a mismatch it exists to catch.

# --- THE NEGATIVE LANE. A family real captures contain that this target's manifest does NOT admit, so
# the compiler must place it on the host -- and a target that accelerates it is as wrong as one that
# misses admitted work. Derived, not chosen: `conformance.spec.host_only.families` reads `normalization`
# out of the complement (admitted families minus the families the captures contain), and it is observed
# 1146 times across them. `H` was previously reported COVERED but only INCIDENTALLY, by whole-model
# capsules named for a different shape; nothing was built to prove it.
#
# `forbid` is the content of the assertion and is honoured ONLY against execution evidence -- "the router
# planned no work here" is not "the compiler put no work here", and absence of a plan entry is the
# default state, so a plan-only pass would make the claim vacuously true for free.
- {name: GN0_layernorm_host_only_bf16_pt, kind: model_slice, op: layernorm,
   operand_dtype: bf16, source: pytorch, M: 16, K: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch LayerNorm bf16 — the negative lane: this target declares no normalization
     capability, so every region must land on the host and none may reach the mesh',
   modes: {},
   # `require` REMOVED, deliberately. On this target routing.reachable_lanes is exactly
   # {on_mesh, scalar_rvv_lane}, so `forbid: [on_mesh]` already leaves the host lane as the only place
   # work can land -- the require added nothing here. What it DID add was an unjudgeable declaration:
   # lane_report_from_elf sets `observed: []` unconditionally (a symbol in a binary is not one that
   # executed), and only the whole-model dispatch ledger can credit a REQUIRED lane. GN0 is a
   # model_slice, so it takes the op tier ladder and never produces a ledger -- it passed L2 and L3 and
   # was still scored `incomplete`/LANE_CONTRACT_NOT_EVALUATED in every arm, the sole graded capsule in
   # that gap. `forbid` remains, and is honoured against execution evidence exactly as below.
   lanes: {forbid: [on_mesh]},
   # The same classes corpus_synth derives for a synthesized entry, declared here because this capsule
   # is hand-authored: it executes (target lowering) and its whole subject is a value crossing to a
   # lane the accelerator does not own (boundary materialization).
   pass_requirements: [host-seam, target-isa-lowering],
   generalization: {must_accelerate: false, not_asserted_reason: 'host-only capsule: this target admits
     no normalization family, so accelerating any region would be the defect. The demand is the inverted
     one -- lanes.forbid [on_mesh] -- checked against execution, never a routing plan.'}}
# --- More int8 matmul-family (direct-MLIR int engine): Q@K^T attention scores.
- {name: C7_attention_qk_i8, kind: model_slice, op: attention_qk, M_tiles: 1,
   K_tiles: 2, q: Q, k: K, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'int8 Q@K^T attention scores (bareMetalC attention)', modes: {}}
# --- Whole-model capstone (GATED): small_llama in int8 (torchAO int8_weight_only) end to end.
- {name: M0_small_llama_gemmini, kind: model, op: model, model: small_llama,
   operand_dtype: int8, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama int8 — whole-model capstone (embed/RMSNorm/RoPE/attn/SwiGLU/lm_head)',
   gate: {after_op_pass_fraction: 0.8}}
# --- Elementwise/activation ops mined from gemmini-rocc-tests (resadd residual, igelu activation).
- {name: GF4_add_bf16_pt, kind: model_slice, op: add, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch residual add bf16 (gemmini-rocc-tests resadd)', modes: {}}
- {name: GF5_gelu_bf16_pt, kind: model_slice, op: gelu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GELU-tanh bf16 (gemmini-rocc-tests igelu)', modes: {}}
# --- Spec-sourced capsule: the PROGRAM + bit-exact golden come from the specir verification spec itself
# (spec_ref), not a handauthored template — the spec's command buffer + coverage_goal ship as grounding.
- {name: GS0_matmul_spec, kind: isa, op: matmul, source: spec, spec_ref: 'gemmini:op.matmul',
   M: 16, K: 16, N: 16, lhs: A0, weight: W, out: Y0, source_role: spec_derived,
   source_reference: 'specir spec-sourced int8 matmul (program + bit-exact refmodel golden + coverage)',
}
# --- Conv family: native int8 conv2d (direct-MLIR merlin_iface.conv2d, mined from bareMetalC/conv.c) +
# the vector-lane conv/pool ops (bf16 pytorch: depthwise MixFFN, pooling, global average).
- {name: GC0_conv2d_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8, kh: 3, kw: 3,
   source_role: uplifted_from_bareMetalC, source_reference: 'im2col conv2d int8 (bareMetalC/conv.c)',
}
# THE GEOMETRY AXES, WHICH EVERY CONV CAPSULE HELD AT ITS DEFAULT. Until these, all four convolution
# capsules in the corpus declared padding [0,0,0,0], unit stride and unit dilation over an identical
# 3x3 window -- the same geometry four times. The builder has accepted all three parameters all along
# and nothing ever passed a non-default, so a lowering defect that only shows up when the window
# leaves the image had no capsule that could observe it.
#
# Padding is the one that matters most. An out-of-bounds tap must read as ZERO, and the im2col the
# golden and the harness share does exactly that ("zero-pad OOB taps"); a lowering that instead reuses
# whatever the on-chip staging buffer held from a previous tile computes a wrong result that is only
# wrong in the border rows, which is why an unpadded corpus never sees it. Same-padding is chosen so
# the output extent matches the input and the border is the majority of the difference.
- {name: GC7_conv2d_pad_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8,
   kh: 3, kw: 3, padding: [1, 1, 1, 1],
   source_role: derived_sweep,
   source_reference: 'im2col conv2d int8 at same-padding: the out-of-bounds taps must read as zero
     rather than as whatever the staging buffer last held',
}
# Non-unit stride moves the window by more than one position, so consecutive output rows no longer
# read overlapping input taps. A schedule that assumes the overlap is what makes a stale-row reuse
# look correct at stride 1.
- {name: GC8_conv2d_stride2_i8, kind: layer, op: conv2d, Himg: 8, Wimg: 8, ci: 4, N: 8,
   kh: 3, kw: 3, stride: [2, 2],
   source_role: derived_sweep,
   source_reference: 'im2col conv2d int8 at stride 2: consecutive output positions share no input tap',
}
# THE QUANTIZED CONVOLUTION EPILOGUE, WHICH EVERY CONV CAPSULE ABOVE LEAVES OFF.
#
# MEASURED, and the reason this family exists. On the ResNet-50 capture all 53 convolutions DO route
# on-mesh -- the contraction was never the problem. The EPILOGUE is: 50 quantize regions, 49 minmax
# regions and 16 elementwise regions stay on the host, 91.68% of all host IR work, and 116 of the 119
# host refusals are contradicted by this target's own derived capability (the store path is licensed
# to apply exactly these stages). Nothing caught it because ZERO capsules required a conv's
# requant/bias/relu to ride the mesh store path: GC0/GC7/GC8 declare no epilogue at all, so a backend
# that commits the raw i32 accumulator and lets the host do the rest matches them perfectly, and
# GP2's epilogue is a max-pool -- a store-DMA window, not the quantized readout a CNN layer carries.
#
# So these four are the conv counterpart of the `*_fused_epilogue_tail_*` contraction family: the
# stages are declared ON the conv op, which means the backend must ask the store path for them rather
# than emitting a separate host map. Three stages, in the order the command-buffer ABI applies them:
# `bias_add` lands the per-output-channel bias on the accumulator, `acc_scale` is the f32 readout
# multiply, `relu` is the activation the store path's own activation bits select -- and the commit is
# i8, derived from the datapath's `requant_output_dtype` rather than declared, so a backend that skips
# the narrowing commits the wrong width instead of the wrong values.
#
# `lanes.require: [on_mesh]` is the half that makes this a claim about PLACEMENT rather than about
# numerics. Without it a backend that computes the whole epilogue on the host still matches the golden
# bit for bit and passes; with it the capsule passes only when the mesh lane carried the work.
#
# The geometry is deliberately four different ResNet-shaped layers, not one shape four times -- the
# defect GC7/GC8 were added for. Each carries a DIFFERENT `acc_scale`, so a backend that reads the
# multiplier from one capsule and hardcodes it fails the other three.
- {name: GQ0_conv2d_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 8, Wimg: 8, ci: 4, N: 16, kh: 3, kw: 3,
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.0625,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 conv with the quantized CNN epilogue fused onto the store path
     (per-channel bias -> f32 acc_scale -> relu -> saturating i8 commit), asserted on_mesh',
   comment: 'GQ0: 3x3 int8 conv over 8x8x4 -> 6x6x16 with bias/acc_scale/relu fused on the store path.',
}
# THE POINTWISE LAYER. Half of ResNet-50's convolutions are 1x1, and a 1x1 conv is where the epilogue
# is the MAJORITY of the layer's non-contraction work -- the contraction is one tap deep, so a host
# round trip per output element is the whole cost. No conv capsule in this corpus is 1x1.
- {name: GQ1_conv2d_1x1_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 6, Wimg: 6, ci: 16, N: 16, kh: 1, kw: 1,
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.125,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 1x1 pointwise conv with the quantized epilogue fused onto the store path --
     the shape where the epilogue dominates the layer',
   comment: 'GQ1: 1x1 int8 conv over 6x6x16 -> 6x6x16 with bias/acc_scale/relu fused on the store path.',
}
# SAME-PADDING WITH THE EPILOGUE ON. GC7 proved the zero-pad taps alone; this pairs them with the
# readout, because a border row that is requantized from a stale staging buffer is wrong only at the
# edge AND only after the scale -- neither capsule alone can see it.
- {name: GQ2_conv2d_pad_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 6, Wimg: 6, ci: 4, N: 16, kh: 3, kw: 3, padding: [1, 1, 1, 1],
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.03125,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 same-padded conv with the quantized epilogue fused onto the store path:
     the out-of-bounds taps must read as zero THROUGH the requantization',
   comment: 'GQ2: 3x3 same-padded int8 conv over 6x6x4 -> 6x6x16 with the quantized epilogue fused.',
}
# THE DOWNSAMPLING LAYER. Every ResNet stage transition is a strided conv whose epilogue is the same
# three stages; at stride 2 consecutive outputs share no input tap, so a schedule that reuses a staged
# row survives GQ0 and fails here.
- {name: GQ3_conv2d_stride2_requant_relu_i8, kind: layer, op: conv2d,
   Himg: 8, Wimg: 8, ci: 8, N: 16, kh: 3, kw: 3, stride: [2, 2],
   stimulus_range: [-4, 3], epilogue: [bias_add, acc_scale, relu], acc_scale: 0.25,
   lanes: {require: [on_mesh]},
   modes: {conv2d: true, k_accumulate: true, i8: true, acc_scale: true, relu: true},
   source_role: handauthored_compiler_test,
   source_reference: 'int8 3x3 stride-2 conv with the quantized epilogue fused onto the store path --
     the ResNet stage-transition shape',
   comment: 'GQ3: 3x3 stride-2 int8 conv over 8x8x8 -> 3x3x16 with the quantized epilogue fused.',
}
# THE RANK-3 CONTRACTION, WHICH THE CONTRACT ADMITS AND NO CAPSULE EXERCISED. The target contract
# declared `ranks: [2, 4]`, so a batched matmul -- output rank 3 -- was ruled ineligible before it
# reached the device rewrite, even though the rewrite already supports the (B,M,N,K) signature, the
# device builder already produces the (M,N,K) kernel, and the generated shim already loops the batch
# calling that kernel once per independent slice. The machinery existed and the contract forbade its
# use. The contract now reads [2, 3, 4]; this is the capsule that keeps it honest, because every
# other operand in the corpus is rank-2 and a revert of that line would otherwise be invisible.
- {name: GB0_batched_matmul_i8, kind: layer, op: gemv_batched, B: 2, M: 16, H: 32, N: 16,
   source_role: derived_sweep,
   source_reference: 'batched int8 contraction: two independent (M,H)x(H,N) slices, the rank-3 shape
     the target contract admits and no other capsule declares',
   modes: {}}
- {name: GC1_depthwise_bf16_pt, kind: model_slice, op: depthwise_conv2d,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, P: 3, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch depthwise conv bf16 (MixFFN depthwise)',
   modes: {}}
