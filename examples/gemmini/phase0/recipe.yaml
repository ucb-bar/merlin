- {name: GC4_global_avg_bf16_pt, kind: model_slice, op: global_average,
   operand_dtype: bf16, source: pytorch, Cin: 8, Himg: 8, Wimg: 8, out: Y0,
   source_role: pytorch_model_slice, source_reference: 'PyTorch global average pool bf16',
   modes: {}}
- {name: GC5_fused_matmul_bias_bf16_pt, kind: model_slice, op: fused_matmul_bias,
