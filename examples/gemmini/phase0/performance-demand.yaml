# Declared policy of the Phase 0 performance-demand stage
# (merlin_experiments.phase0.performance_demand): which contraction shapes of the captured
# performance programs become performance test cases. Every knob is a reviewed choice.
schema: merlin.phase0.performance_demand_policy.v1
# Fraction of each program's contraction MACs that public cases must cover, by exact shape or by the
# nearest admissible representative. 0.99 reaches decode-step attention (1x64x64, 1.3% of decode).
coverage_target: 0.99
# An existing exact case of a program layer stays a scorer when the layer holds at least this
# fraction of the program's MACs; a smaller one is too little of the program to stand for it.
min_scored_share: 0.01
# Regime classes: each extent is binned by these multiples of the array's tile edge (read from the
# RTL facts); M = 1 is its own class. The bins separate one-tile, few-tile, many-tile and
# store-spilling extents.
class_edges:
  M: [1, 4, 32, 256]
  K: [4, 32, 128]
  N: [4, 32, 128]
# The smallest shape of every class with at least two shapes is held out as a hidden case.
holdout: one_per_class
admissibility:
  # The corpus' logical storage budget (operands plus int32 result).
  logical_storage_budget_bytes: 134217728
  # The largest contraction the admitted scalability suite already holds (32 x 2048 x 32000).
  max_case_macs: 2097152000
name_prefix: PD
