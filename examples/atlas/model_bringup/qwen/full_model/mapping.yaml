# Model-derived launch coverage for the pinned Qwen session, not a qualified
# full-model implementation. Unmapped rows retain their FLOPs and are reported.
schema: atlas.coverage.mapping.v1
kernels:
  projection_gemm: FP8 projection with ordered BF16 accumulation
  rmsnorm: Candidate RMSNorm family; current generator rejects Qwen width 1536
  attention: Candidate attention family; current generator rejects Qwen d=128
builds: {}
bench:
  qwen:
    panel_rows: 32
    panel_columns:
      - {n: 128}
rules:
  qwen:
    - match: {op: aten.linear.default}
      where: atlas:projection_gemm
      note: >-
        Unfused projections at export-derived M/K/N, padded to 32 and split into
        128-column panels. Full K is preserved. Bias components are deliberately
        unmapped: the plain generator does not compute Qwen's Q/K/V biases.
        Mapping is a candidate placement, not a claim of model equivalence.
      cite: [atlas-kernels:kernels/projection_gemm/reference.py]
    - match: {module: ['*.input_layernorm', '*.post_attention_layernorm', '*.model.norm']}
      where: atlas:rmsnorm
      launch: {family: rmsnorm, per: {op: aten.rsqrt.default}, width: 1536}
      note: >-
        Whole RMSNorm composition, one launch per rsqrt. Qwen uses width 1536
        and epsilon 1e-6; the current generator supports width 2048 and has a
        different epsilon. This must remain no-variant pending qualification.
      cite: [atlas-kernels:kernels/rmsnorm/gen.py]
    - match:
        module: '*.self_attn'
        op: [aten.matmul.default, aten.div.Tensor, aten.softmax.int]
      where: atlas:attention
      launch:
        family: attention
        per: {op: aten.softmax.int}
        head_dim: 128
        kv_heads: 2
        mask: causal
        output_fp8: false
      note: >-
        QK/softmax/PV core with export-derived rows/keys/heads and the actual
        128-channel head. Current d=64 generator rejects it. RoPE, masking glue,
        casts, cache updates and QKV bias are not claimed by this rule.
      cite: [atlas-kernels:kernels/attention/kernel.yaml]
