schema_version: 1
id: atlas-functional
target: atlas
description: Capsule derivation and installed functional compiler authoring; reviewed inputs and toolchain admission remain required.
phases:
  0:
    adapter: capsule_derivation
    config:
      recipe: phase0/recipe.yaml
      software_spec: target/software-spec.yaml
      capability_contract: target/contracts/target_contract.yaml
      hardware_spec: target/hardware.yaml
      # Diagnostic only: review and production-source consistency are not established.
      evidence_mode: diagnostic
      performance_template: ../../experiments/templates/phase0/performance.yaml
      # Select freshly derived conformance/synthesis artifacts with CLI overrides.
      descriptor: target/descriptor.yaml
  1:
    adapter: capsule_bench
    config:
      require_reviewed_corpus: true
      descriptor: target/descriptor.yaml
      level: EL4
      # Regenerate/review this bundle for the selected corpus before execution.
      bundle: merlin_assisted_rtlchecks_public_v0
      bundle_manifest: ../../experiments/studies/capsule_bench/targets/atlas/input_bundles/merlin_assisted_rtlchecks_public_v0/input_bundle_manifest.yaml
      # Required operator-owned timing evidence; not supplied by this example.
      oracle_timing: ../../experiments/studies/capsule_bench/targets/atlas/.oracle_timing.json
      model: claude-opus-4-8
      effort: high
      driver: claudecode
      provider: subscription
      max_wall_s: 43200
      round_timeout: 43200
      grade_interval: 900
