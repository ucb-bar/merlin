# Declarative per-target experiment SETUP for ATLAS (an NPU with an MXU) — the 2nd target proving the
# 4-arm ladder generalizes beyond gemmini. Everything DERIVABLE (the ISA/opcode set, the mesh DIM=32,
# the memory map) is discovered from atlas's RTL by mlc (arc model libatlas_model.so + atlas_hw.mlir);
# only the irreducible SETUP is declared here. A matmul capsule is target-neutral, so atlas reuses the
# generic op-capsule corpus; its goldens are the target-agnostic math oracle and its RTL oracle is the
# mlc arc MXU model (arc_available=True) — no bespoke sim toolchain needed.
target: atlas
resources_root: merlin/experiments/capsule_bench/targets/atlas
numeric_profile: examples/atlas/phase0/recipe.yaml

rtl:
  via: mlc            # ISA/memory/DIM DERIVED from atlas's RTL via mlc discovery
  # WHERE the elaborated RTL is. Irreducible SETUP: the checkout holds many elaborations and nothing
  # in the RTL says which one is atlas's, so the config is DECLARED (here, in atlas's own descriptor)
  # and everything downstream of it is DERIVED. Read by
  # merlin.targetgen.rtl.introspect.declared_rtl_source; nothing in library code names this config.
  #
  # This is the second, INDEPENDENT reader of atlas's RTL: mlc discovery answers the ISA/decode
  # question (`via: mlc` above) and returns no memory map, while the FIRRTL census answers the
  # structural one -- the SRAMs, their banks/depths/row widths, and the PE array -- straight out of
  # the elaboration. They are complementary, and both are recorded so a disagreement is visible.
  #   ext_root   a `.env` MERLIN_EXT_<NAME> key (this target elaborates in its OWN chipyard checkout,
  #              which is why nothing had ever pointed the FIRRTL reader at it)
  #   generator  the source tree whose modules ARE atlas's, per the FIRRTL's own
  #              `@[generators/<gen>/...]` provenance annotations
  elaboration:
    ext_root: chipyard_atlas
    config: AtlasRocketConfig
    generator: atlas
  # NO `operand_store` is declared, deliberately. The capacity_fit contract obligation needs to know
  # this device's on-chip operand store, and mlc discovers all 39 of its SRAMs and then refuses to
  # classify them ("no memory map discovered"), so the obligation is UNDECIDABLE here and reports itself
  # as such rather than guessing. Two candidates were considered and one was MEASURED AND REFUTED:
  #   - the matrix register file (32 discovered `mreg/banks_N_ext` banks x 64 x 32 B = 65536 B, matching
  #     the shipped ISA model's num_m_registers(64) x mrf_depth(32) x mrf_width(32 B)) is NOT it: a
  #     32x256x256 layer needs 73728 elements against that 65536 and RUNS UNBLOCKED on the arc cosim,
  #     producing output. Declaring it would make the runtime split layers the device handles, which on
  #     this bf16 accumulator also changes the reduction order.
  #   - VMEM is the likelier store, but its two sources disagree (the RTL constant AtlasMemMap.VMEM_SIZE
  #     is 0x180000 = 1.5 MiB; the shipped model config declares vmem_size = 1 MiB) and mlc's discovered
  #     memory list contains no VMEM bank at all, so there is nothing to sum. Declaring an unvalidated
  #     number is worse than reporting the obligation undecidable.
  # To close this: measure the extent at which this backend actually declines, and declare the store
  # that predicts it. Never declare one that has not been checked against the device.

# The shared hardware spec given to ALL arms — a constant input (a correct backend needs the target's
# defined ISA), NOT Merlin assistance. Repo-root-relative bundle-convention path strings: `experiments/...`
# resolves under merlin/, so these point at the curated Atlas bring-up set below. This lets the descriptor
# be the single source of truth the bundle-consistency check compares against. The cycle-accurate FACTS
# (exact encodings, DIM, memory map) are still DERIVED from the RTL by mlc — the ISA reference here is
# orientation material (the green card + the model's authoritative ISA definition), not a merlin ISA.
hardware_spec:
  isa_headers:
    - examples/atlas/phase1/contracts/hwbringup_atlas_v0/isa_include/atlas_isa_green_card.md
    - examples/atlas/phase1/contracts/hwbringup_atlas_v0/isa_include/isa_definition.py
  hwbringup_set: examples/atlas/phase1/contracts/hwbringup_atlas_v0

# The ATLAS-CORRECT capsule corpus: fp8-e4m3 operands, bf16 accumulate/output, FLOAT (tolerance)
# goldens produced by an INDEPENDENT oracle (the specir refmodel's fp8/bf16 datapath — the same
# primitives `specc testbench --gen atlas-npu --op op.matmul_mxu0` uses), NOT the shared gemmini
# INTEGER corpus (i8xi8->i32, exact_int) that a float MXU physically cannot match. Points at the `isa`
# subdir; `layers`/`model_slices` siblings + `hidden` are auto-discovered from the parent (corpus_siblings).
# Regenerate with: PYTHONPATH=<specir> .venv/bin/python merlin/contract/capsules/generate_corpus.py --target atlas
capsule_corpus: merlin/contract/capsules/atlas/isa

# ---------------------------------------------------------------------------------------------------
# THE WHOLE-MODEL COHORT — WHY IT HAS NEVER BEEN MEASURED, AND WHAT ACTUALLY BLOCKS IT.
# Investigated and recorded 2026-09-09.  COMMENT ONLY, deliberately: the arm-4 cohort
# `merlincirct_atlas_arm4_cohort_20260909_r3` was live while this was written, and a machine-read
# `grading:` block would have changed what that run grades mid-flight.  The machine-readable seal is
# the follow-up named at the end; nothing here changes a byte of behaviour.
#
# THE CARDINALITIES, as graded (labels public+dev):
#   62 rows discovered  =  57 op/slice rows  +  5 `kind: model` rows
#   the 5 model rows:  M0_small_llama_atlas, M1_lstmnetvit_atlas, SY_micro_model,
#                      AX0_interop_vector_unit, AX1_interop_rvv_lane
#   every one of them declares `gate: {after_op_pass_fraction: 0.8}`, so 0.8 * 57 -> 46 op passes
#   are needed before any of them is scheduled.
#   op pass rate, measured:  live r3 = 25/57 = 0.439;  best atlas run ever: the op half reached 49/57 = 0.860 in
#   `merlincirct_atlas_fresh_func_20260907` (headline 49/61 — that denominator includes the 5 model rows).
#
# ⚠️ THE GATE IS NOT THE BINDING BLOCKER, and that is the whole finding.  The gate HAS opened once
# (0.860 in that 09-07 run) and all five model capsules were scheduled.  Not one produced a verdict:
#   M0 / AX0 / AX1   `incomplete` — "frozen loader/weights/interface/golden validation failed (rc=1)"
#                     out of `_capsule_bundle_worker`, i.e. the capsule never reached a compiler.
#   M1               `incomplete` — "capsule runtime-bundle adapter requires exactly one model output"
#                     (M1 declares outs [Y0, Y1, Y2]).
#   SY_micro_model   `budget_exhausted` — stopped at the loop's `--model-budget-s 300`.
# So "gated" and "would pass if ungated" are different claims, and only the first was ever true.
# Two of those three defects are since fixed (the one-output refusal is gone from the tree, and M0's
# frozen bundle now validates — verified by a standalone operator grade of M0 on 2026-09-09 against
# `out/artifacts/targets/atlas/agent_spec_v1_mlir_oot`).  What remains is the model budget.
#
# COST IS NOT A REASON TO KEEP THE GATE HERE.  Priced on THIS target's own measured engine, not on the
# global calibration law: `cert_affordability.fits_for("atlas")` yields ONE engine, gsim, at
# seconds = 0.525 + 9.1e-05 * written_output_elements (r2 0.767, n=66 measured certifications,
# calibrated over 8..150,528 elements), and `cert_cost.fit_cycles_for("atlas", engine="gsim")` yields
# seconds = 0.714 + 5e-06 * cycles (r2 0.413, n=66, measured 4..2,460,381 cycles, functional-to-cycle-
# accurate ratio 1.0 over 56 paired samples).  Predicted L3 per model capsule:
#     M0 / AX0 / AX1  2,048 committed output elements -> 0.71 s
#     M1                771                           -> 0.60 s
#     SY_micro_model  4,096                            -> 0.90 s
# The declared `workload_spec.cert_budget_s` is 300 s.  The gate exists so a backend that cannot do the
# ops is not made to pay for a model simulation; on atlas that simulation is under a second, so the
# deferral buys nothing and costs the entire model tier.  This is the same argument
# `M3_host_island_seam_gemmini` already carries for its `after_op_pass_fraction: 0.0` ("this capsule is
# three tiles of arithmetic, so deferring it behind the op suite buys nothing").
#
# WHAT DOES COST REAL TIME is the COMPILE half, which no oracle fit prices: a standalone grade of M0
# with `MERLIN_MESH_VERIFY=0` was still inside `compile_model` after 9 minutes of CPU.  That is why
# `--model-budget-s 300` turns an open gate into `budget_exhausted` rather than into a verdict, and why
# the budget — not the gate — is the first thing to change.
#
# THE DECISION (option (c), sealed per capsule rather than as a target-wide threshold):
#   1. RAISE the loop's `--model-budget-s` to at least 3600 for any run that intends a model verdict.
#      Without this, every remedy below yields `budget_exhausted`, which reads as a measurement that
#      failed rather than as one that never ran.
#      APPLIED 2026-09-09 as `workload_spec.model_budget_s: 3600` below, which is the value an
#      operator now copies onto the launch line.  ⚠️ THE LAUNCH LINE IS STILL THE ONLY THING THAT
#      BINDS: `--model-budget-s` defaults to `--qa-timeout` in run_baseline_qa_loop.py and NOTHING
#      reads this key, so a run that omits the flag is not covered by this declaration.  Wiring the
#      descriptor key into the loop's default is the follow-up; until then, pass the flag.
#   2. THEN set `gate: {after_op_pass_fraction: 0.0}` on SY_micro_model (the cheapest, 0.90 s
#      predicted, and the composition capstone) and on M0_small_llama_atlas (0.71 s), in BOTH
#      `merlin/contract/capsules/atlas/model/<name>/capsule.yaml` AND the profile entry that regenerates
#      it (`examples/atlas/phase0/recipe.yaml`, `profiles/atlas.synth.yaml`) — editing only
#      the capsule is reverted by the next corpus regeneration.
#      APPLIED 2026-09-09, all four places.  Note the two capsules sit in DIFFERENT profiles:
#      M0 is a hand-authored entry in `profiles/atlas.yaml`, while SY_micro_model is a SYNTHESIZED
#      entry in `profiles/atlas.synth.yaml` that carried NO `gate:` key at all — it was inheriting the
#      `after_op_pass_fraction: 0.8` default in `capsule_source._write_model_capsule`, so an explicit
#      0.0 had to be ADDED there rather than edited. Current synthesis preserves this decision via
#      `synthesis_model_gates` in `examples/atlas/phase0/recipe.yaml`; do not edit generated output.
#      The original synthesis sidecar remains byte-preserved in experiments/reference-data/phase0/.
#   3. Leave M1 / AX0 / AX1 at 0.8 until (2) has produced a verdict; they are the same code path and
#      there is no point opening three more rows onto an unproven plane.
#   4. Do NOT lower the threshold target-wide.  A per-capsule 0.0 is a statement about that capsule's
#      cost; a target-wide 0.44 would be a statement about atlas's op coverage, which is not what the
#      gate measures.
#
# ⚠️ RECORDED HONESTLY: M0 and M1 were captured `quant_scheme: float8_weight_only_e4m3`, which is the
# WEIGHT-ONLY default.  `capsule_source._ACTIVATION_QUANTIZING_SCHEME` says in as many words why that is
# the wrong program for a datapath consuming the narrow format on both operands: it emits a float matmul
# over dequantized weights.  So even a passing M0 certifies the host's float math over fp8 weights, not
# atlas's fp8xfp8 -> bf16 MXU arithmetic.  That is a capsule-authoring debt, not a gate question, and it
# is the same blocker as the roster models below.
#
# THE ROSTER MODELS (resnet50 / smolvla / lstmnetvit / tiny_llama) CANNOT BE BUILT ON THIS HOST.
# `workload_spec.models` already declares resnet50, and `profiles/atlas.synth.yaml` already declares
# `SY_model_resnet50`, `SY_model_smolvla`, `SY_model_lstmnetvit` and `SY_model_tiny_llama` at
# operand_dtype fp8_e4m3 with `quant_scheme: float8_dyn_act_float8_weight`.  None of the four exists on
# disk, and `merlin/contract/capsules/MANIFEST.yaml`'s `roster_generation.atlas.not_built` records the
# reason for all four identically:
#     "M2MUnavailable: AssertionError: Float8 dynamic activation quantization is only supported on
#      CUDA>=8.9 and MI300+"
# So resnet50-on-atlas is blocked at CAPSULE SYNTHESIS, before admission, before the gate and before
# any cost question.  Admitting the existing `merlin/contract/capsules/model/SY_model_resnet50` instead
# is NOT the remedy: that capsule is int8, and `precision_policy.best_format("atlas")` reports int8
# `not_admitted` — "the capability manifest declares no contraction datapath for it" (atlas admits
# bf16 and fp8_e4m3 for a contraction).  It would be an unpassable row in the denominator.
# The two honest routes, in order:
#   (i)  capture the fp8_e4m3 dyn-act variant on a host with CUDA>=8.9 (Ada/Hopper) or MI300, which is
#        what the requirement actually asks for; or
#   (ii) mint the atlas resnet50 at bf16 — the other format this target's manifest admits, and one
#        `capsule_source._UNQUANTIZED_FORMATS` needs no quantizer for at all, so it builds on this host
#        today.  Ranked below fp8_e4m3 in `precision_preference`, and that ranking must be recorded with
#        the capsule rather than quietly ignored.
# Cost is not the obstacle in either case: a resnet50 capsule commits 1,000 output elements (the 1x1000
# logits), which the atlas gsim fit prices at 0.62 s — against the 38.6 h that the same arithmetic
# predicts for gemmini's SY_model_tiny_llama on the global law.  The unpriced term is the operand side
# (321 operands, 25,760,733 elements, largest single 2,359,296) and the fact that a model capsule
# certifies N layers rather than one committed output; neither fit covers that, so neither number may be
# quoted as the whole bill.
#
# FOLLOW-UP, once the live cohort seals: turn the cardinalities above into a real `grading:` block
# (`expected_cohort`, `required_admitted_models`, `resource_bound`) the way gemmini's descriptor does.
# atlas has no `grading:` block at all today, so nothing independently recomputes this cohort.
# ---------------------------------------------------------------------------------------------------
# The mlc arc model is the RTL oracle (default); atlas has no separate bespoke sim wired.
toolchain:
  sim_via: ""         # arc-only (the mlc arc MXU model is the RTL tier)

# Pre-flight end-to-end oracle smoke: a KNOWN-GOOD, self-contained npu_model Program that ships its own
# golden_result. The pre-flight assembles it, runs it on the arc cosim, reads back the output, and asserts
# a BIT-EXACT match against that golden — proving the grading oracle produces a correct verdict end-to-end
# BEFORE a paid run (not merely that arc_available is True). MatmulProgram is the model's canonical single
# fp8->bf16 MXU matmul validation program (npu_model.configs.programs.__all__), the same known-good program
# the L4 verilator equivalence test uses. A per-target SETUP choice, so declared here — the ISA/datapath it
# exercises is still DERIVED from the RTL by mlc.
preflight:
  smoke_program: MatmulProgram
  capability_probes:
    # Exercise a definitely-taken backward branch on the same cycle-accurate backend used for grading.
    # A straight-line smoke cannot expose disagreement between an assembler's byte displacement and a
    # target whose internal PC uses another address unit.  The fixture deliberately makes an incorrect
    # target restart the loop, so both halt and the observable trip count are checked.
    - capability: control_flow.relative_branch
      adapter: merlin.targetgen.inline_assembly_probe:run_capability_probe
      fixture:
        kind: inline_assembly_memory
        source: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/taken_backward_branch.S
        assembler: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/adapter.py:assemble
        runner: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/adapter.py:run
        assembler_root: atlas_npu
        assembler_path: baremetal/assembler.py
        assembler_callable: assemble
        max_cycles: 1000
      requirements:
        operations:
          - {domain: instruction, dialect: atlas, operation: BNE}
    - capability: scalar_memory.load_store_roundtrip
      adapter: merlin.targetgen.inline_assembly_probe:run_capability_probe
      fixture:
        kind: inline_assembly_memory
        source: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/scalar_memory_nonzero.S
        assembler: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/adapter.py:assemble
        runner: examples/atlas/phase1/contracts/hwbringup_atlas_v0/preflight/adapter.py:run
        assembler_root: atlas_npu
        assembler_path: baremetal/assembler.py
        assembler_callable: assemble
        max_cycles: 10000
      requirements:
        operations:
          - {domain: instruction, dialect: atlas, operation: LW}
          - {domain: instruction, dialect: atlas, operation: SW}
          - {domain: instruction, dialect: atlas, operation: LBU}
          - {domain: instruction, dialect: atlas, operation: SB}
          - {domain: instruction, dialect: atlas, operation: LHU}
          - {domain: instruction, dialect: atlas, operation: SH}

answer_surfaces:
  # The reference backend is a WORKING atlas compiler, so it is an answer key: an agent that reads it is
  # copying the solution rather than deriving it. Listing it here is what makes the sandbox mask it.
  prior_backends: [agent_spec_v1_mlir_oot]

# ---------------------------------------------------------------------------------------------------
# THE FROZEN HOST LANE — pinned INFRASTRUCTURE, never a thing under test.
#
# This experiment measures the TARGET lane: the target dialect, the target transforms, the partitioning
# decision and the boundary/dispatch across it. It does not measure, and must never reward, a second CPU
# backend. A submission that wins by rewriting the host compiler has moved the work off the accelerator
# and off the question, and its score would be read as a compiler result about the target.
#
# So the host lane is declared here, beside `hardware_spec`, and for the same reason: it is irreducible
# SETUP a run needs and cannot derive. It is granted to every arm READ-ONLY (an agent that cannot see
# what the host lane does cannot reason about where the boundary should fall), and the surface that
# would let it be CHANGED is denied to every arm.
#
# VERIFIED BY CONTENT, NOT BY BRANCH NAME — the same discipline as merlin/contract/hardware_pins.yaml.
# `branch` is informational: branches move, and the same branch name on a fork and on upstream are
# different histories. `requires_paths` names the files whose PRESENCE is what the lane actually is, so
# a checkout that is the right repo on a plausible branch and missing the schedule is caught.
# THE WORKLOAD SPEC — the only input capsule synthesis cannot derive.
#
# Three keys, and every one of them is a DECISION rather than a fact about the hardware, which is why
# they are declared here instead of extracted: which real networks this target is meant to compile, in
# what order to prefer precisions when the requirement leaves the choice open, and how many synthesized
# capsules are acceptable. Everything else about the corpus -- families, dtypes, alignments, memory
# regimes, lanes, compositions, extents, goldens, oracle tiers -- is derived from the RTL facts and the
# capability manifest by `merlin.targetgen.corpus_synth`.
#
# The ranking is narrowest-first and is the same one gemmini and radiance declare; it is filtered
# against what THIS target admits (bf16 and fp8_e4m3 for a contraction), so int8 and mxfp8 are simply
# rejected here as not-admitted rather than silently widening anything. `precision_policy.best_format`
# reports each rejection with its reason.
workload_spec:
  # THE GRADED ROSTER — the models this target's generalization CLAIM is measured on, and the
  # denominator `report_generalization_claim` computes over. Both are claim models: held out of
  # derivation entirely, so the corpus is never built from what it is then said to generalize to.
  # `smolvla` and `lstmnetvit` left this list when they became derivation sources below; counting a
  # model you derived FROM as a model you generalize TO is the circularity the holdout exists to stop.
  models: [resnet50, tiny_llama]
  # THE DERIVATION APPLICATIONS — the exported models this target is FOR, whose real contraction shapes
  # the corpus is built from. Named as bundles in the recapture store rather than as a directory, so the
  # statement is reviewable here instead of depending on which subdirectories a generated tree happens
  # to hold. `check_conformance_coverage._applications` raises if any of these is a claim model.
  #
  # The pretransposed variants are deliberately absent: they are layout rewrites of the captures below,
  # not separate applications, and the layout they differ in is already a class axis.
  applications:
    - smolvla_fp32_consistent
    - smolvla_int8_consistent
    - smolvla_denoise_step_fp32_app
    - lstmnetvit_fp8_consistent
    - lstmnetvit_int8_consistent
    - lstmnetvit_int8_w8a8_consistent
  # Seconds one cycle-accurate certification may take. DECLARED, so the application axis records
  # `budget_source: declared` rather than silently inheriting a default nobody chose.
  cert_budget_s: 300
  # Seconds ONE WHOLE-MODEL capsule (`kind: model`) may take end to end, and the value an operator
  # passes as the loop's `--model-budget-s`. DECLARED separately from `cert_budget_s` above because
  # they price different things: `cert_budget_s` is one CYCLE-ACCURATE CERTIFICATION (this target's
  # measured gsim law puts every model capsule's L3 under a second), while a whole-model capsule is
  # dominated by the COMPILE half, which no oracle fit prices.
  #
  # WHY 3600 AND NOT 300.  MEASURED, gemmini `merlincirct_defcal1` 2026-08-29: a whole-model capstone
  # that cleared its gate then ran 5 h 30 m (19,800 s) — the only end-to-end whole-model wall clock
  # recorded on any target in this repo. On atlas itself the only datum is a lower bound: a standalone
  # M0 grade with `MERLIN_MESH_VERIFY=0` was still inside `compile_model` after 9 minutes of CPU, so
  # 300 s cannot even reach a compile, let alone a verdict. 3600 s is therefore a FLOOR chosen as the
  # smallest round number that clears the one measured atlas lower bound by a wide margin; it is NOT a
  # measured atlas ceiling, and the gemmini datum says a model capsule can legitimately want ~5x more.
  # Raise it (or pass 0 for no ceiling, which is what an operator certification run uses) rather than
  # reading `budget_exhausted` as a verdict — it is a capsule that never finished, not one that failed.
  model_budget_s: 3600
  precision_preference: [int8, fp8_e4m3, mxfp8, fp16, bf16, fp32]
  max_synthesized_capsules: 160

host_lane:
  description: >-
    The RVV host compiler: the scalar/vector lane every partitioned capsule falls back to for the work
    the accelerator does not admit (normalization, reduction, activation tails). Frozen for the
    duration of the experiment.
  repo_canonical: https://github.com/ucb-bar/rvv-mlir.git
  branch: stable/rvv_tuned_v1_d1_vfmacc_outerproduct
  # UNKNOWN, and recorded as UNKNOWN rather than defaulted: this repo publishes TO that remote (see
  # merlin/targets/publish.yaml) and does not vendor a checkout of it, so no commit sha for the branch
  # is readable here. The pin is therefore carried by `package` + `requires_paths` below, which is a
  # CONTENT check over the bytes this experiment actually reads. Fill the sha in the moment a checkout
  # exists; never invent one.
  commit: UNKNOWN
  # The pinned artifact as it exists in this tree: the transform schedule + knobs that ARE the host
  # lane's codegen. Repo-root-relative.
  # WHICH PRECISION LANE THIS IS (see gemmini's descriptor for why it is declared rather than
  # discovered): checkable at load time, and cross-checked against the package's own knobs by `resolve`.
  dtype_strategy: fp32
  package: out/artifacts/targets/rvv/rvv_tuned_v1_d1_vfmacc_outerproduct
  requires_paths:
    - manifest.yaml
    - schedule.mlir
    - knobs.yaml
  # Granted READ-ONLY to every arm. Reading the frozen lane is necessary; it is how an agent knows what
  # the host side costs and therefore where to put the boundary.
  read_only:
    - out/artifacts/targets/rvv/rvv_tuned_v1_d1_vfmacc_outerproduct/
  # DENIED to every arm: the host compiler's implementation. This is the surface a submission would have
  # to touch to become a second CPU backend. It is deliberately a DIFFERENT path from the read-only
  # grant above — deny wins in the sandbox binder, so a path listed on both sides grants nothing at all,
  # and "read-only" would silently become "invisible".
  deny_modification:
    - merlin/python/merlin/llvmlower/
