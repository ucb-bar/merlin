# Authored scheduling policy, formerly a manual edit in the synthesis reference.
# This opens only the composition capsule; it does not relax its numerical verdict.
synthesis_model_gates:
  SY_micro_model:
    after_op_pass_fraction: 0.0
    reason: >-
      Preserve the reviewed 2026-09-09 per-capsule decision: the inexpensive
      composition capstone may run before op coverage reaches the default gate.
      Other synthesized model gates and numerical acceptance remain unchanged.

datapath:
  # Corpus-wide generalization posture, matching radiance. must_accelerate is the strongest claim a
  # capsule can make -- an ELIGIBLE region that falls back is a hard failure -- and it was absent here,
  # so every atlas coverage certificate passed VACUOUSLY: with no capsule asserting it, no violation
  # could ever be raised and the CPU-fallback escape hatch was wide open. Whole-model capsules are
  # exempted structurally in corpus_spec, not by an exception list.
  semantic_defaults: {must_accelerate: true}
  compare: tolerance_float
  atol: 0.25
  rtol: 0.02
  # L4 is the program-driven Verilator sim of the atlas RTL top -- the first truly RTL-CERTIFIED tier
  # (L3's arc cosim is the RTL-DERIVED functional gold, not elaborated Verilog). It was already wired and
  # already fails a capsule on mismatch, but it was ADDITIVE, so atlas effectively graded on the cosim
  # alone while gemmini requires two independent oracles (spike + verilator). Requiring it closes that gap.
  #
  # ⚠️ OPERATIONAL COST, stated rather than discovered: the L4 adapter exists only when the target
  # registers a vsim via MERLIN_EXT_ATLAS_VSIM. Without it there is no L4 adapter and not_run_is_not_pass
  # reports every capsule `incomplete` -- never a pass. That is fail-closed on purpose: a checkout that
  # cannot run the certifying tier should not be able to claim a certified result.
  required_oracle_tiers: [L0, L1, L2, L3]
  # This datapath admits only NORMAL fp8 operands: an operand whose exponent field is zero reaches the
  # multiplier array as zero, in the MXU and in the XLU's fp8->bf16 unpack alike. Measured on the arc
  # cosim, not assumed: the movement capsule AT1_mvin_mvout does no arithmetic at all, its 30 divergent
  # elements were EXACTLY its 30 subnormal codes, and decoding those as zero reproduces the hardware
  # bit-exactly (0 differing elements) on AT0/AT2/AT3/BT0/CT0 as well. See
  # out/artifacts/targets/atlas/{accum_characterization.py,agent_spec_v1_mlir_oot/REPORT.md}.
  subnormal_operand_flush: true
  # L2 (the model's fast FUNCTIONAL core) cannot corroborate an RTL result for this target, so it is
  # reported as skipped/not-applicable rather than failing every capsule forever. It is NOT switched off
  # for being red: it decodes an ASSEMBLED program back into model instruction classes, and this ISA
  # encodes `dma.config.chN` and `dma.wait.chN` to the IDENTICAL word (the shipped `RType.to_bytecode`
  # never encodes the `imm` field that separates them), so no word-level decoder can reconstruct a
  # program that needs both — and every DMA-driven kernel needs both. Measured on the reference kernel:
  # resolving the word as `wait` leaves the channel unarmed (VMEM reads back empty and the kernel stalls
  # at its first VLOAD, pc frozen to the cycle cap), and resolving it as `config` deletes the barriers
  # (every output reads back zero). The model's own validation program is bit-exact on that same core
  # under `wait`, so the core is sound — it simply cannot be handed a program as words. Two further
  # model-vs-RTL disagreements point the same way: the functional core treats VMEM as BYTE-addressed
  # where the RTL treats it as WORD-addressed, and reads VUNPACK_FP8_BF16's scale as a divisor where the
  # RTL reads a biased exponent. The RTL tiers (arc cosim L3, Verilator L4) carry the grade.
  #
  # ⚠️ AMENDED 2026-08-29 — the collision is NOT the cause of the cycle disagreement. Measured by
  # instrumenting `_resolve_collision` and counting how often the ambiguity actually fires, on the
  # three capsules where L2-vs-RTL is measured (same `_tierpolicy_v3` submission for all tiers):
  #
  #     capsule                    L2      L3      L4    L2/RTL    dma collisions hit
  #     AT1_mvin_mvout            543     178     178     3.05x            0
  #     AT2_single_tile_matmul   3081    1090    1090     2.83x            0
  #     CT0_mlp_linear1          6781    2614    2614     2.59x            0
  #
  # Zero, on all three, while L3 and L4 agree EXACTLY. So a second, unidentified defect drives a
  # uniform ~2.6-3x overcount, and the collision cannot be cited as the reason L2 disagrees. (An older
  # measurement points the same way: npu_model's shipped known-good MatmulProgram runs 2392 cycles on
  # L2 against 463 on L3 — 5.2x — a program that exercises no capsule lowering at all.)
  #
  # What survives: the collision is real, and the reference-kernel measurement above stands for a
  # program that needs BOTH dma ops. What does not survive is using it to explain these numbers. L2
  # stays inapplicable — the disagreement is real either way — but the CAUSE is open, and a fix that
  # only resolves the collision should not be expected to close it. Gate any fix on landing exactly
  # 178 / 1090 / 2614 for the `_tierpolicy_v3` kernels; a new third number is not a fix.
  # ⚠️ SUPERSEDED — the `inapplicable_oracle_tiers: {L2: ...}` declaration that stood here has been
  # removed, because it contradicted this same file and made the corpus unregenerable. The tier-index
  # refactor added L2 to `required_oracle_tiers` above, on the reasoning that a tier index names a
  # FIDELITY rather than one simulator, and regenerated all 51 atlas capsules accordingly: every one of
  # them requires L2 and none declares it inapplicable. The declaration was the only thing left saying
  # otherwise, and `corpus_spec` rightly refuses a tier that is both required and inapplicable -- so
  # `generate_corpus --target atlas` raised, and with it the conformance, holdout and float-grading
  # gates. Atlas at that fidelity is reached by the program ORACLE adapter, not the model's fast
  # functional core, which is what makes the tier applicable while everything measured below stays true.
  #
  # The evidence above is retained deliberately and none of it is retracted: the dma.config/dma.wait
  # encoding collision is real, the byte-vs-word VMEM disagreement is real, the biased-exponent reading
  # is real, and the ~2.6-3x cycle overcount on the model's fast core remains UNEXPLAINED. What changed
  # is which engine answers at this tier, not whether those defects exist. The acceptance bar stated
  # above still stands for anyone fixing the fast core: land exactly 178 / 1090 / 2614 for the
  # `_tierpolicy_v3` kernels; a new third number is not a fix.
