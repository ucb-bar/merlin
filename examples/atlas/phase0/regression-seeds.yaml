# Authored coverage policy and semantic seeds; generated capsules are run artifacts.
# Hardware geometry comes from selected facts, numerical behavior from this SW spec.
software_spec: ../target/software-spec.yaml
synthesis_model_gates:
  SY_micro_model:
    after_op_pass_fraction: 0.0
    reason: The small composition capstone may run before default op-coverage gating.
datapath:
  semantic_defaults: {must_accelerate: true}
  compare: tolerance_float
  atol: 0.25
  rtol: 0.02
  required_oracle_tiers: [L0, L1, L2, L3]
  # Required numerical behavior is also declared in the selected software spec.
  subnormal_operand_flush: true
capsules:
- {cat: isa, name: AT0_config_smoke, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, source_role: handauthored_compiler_test,
   source_reference: MXU config plumbing via a single 32x32 fp8 matmul, label: public, modes: {}}
- {cat: isa, name: AT1_mvin_mvout, kind: isa, op: movement, src: X, M: 16, N: 16, out: Y0,
   source_role: handauthored_compiler_test, source_reference: 'load fp8 tile -> store as bf16 (dequant movement)',
   label: public, forbidden: [MXUMatMul], modes: {movement: true}}
- {cat: isa, name: AT2_single_tile_matmul, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, source_role: handauthored_compiler_test,
   source_reference: 'single 32x32 fp8 MXU tile -> bf16', label: public, modes: {}}
- {cat: isa, name: AT3_k_accumulation, kind: isa, op: matmul, M_tiles: 1, K_tiles: 2, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, source_role: handauthored_compiler_test,
   source_reference: K=64 (multi-tile) bf16 accumulate, label: public, modes: {k_accumulate: true}}
- {cat: isa, name: AT4_bf16_scale, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, epilogue: [acc_scale], acc_scale: 0.5,
   source_role: handauthored_compiler_test, source_reference: matmul + bf16 output scale (VPU requant precursor),
   label: public, modes: {acc_scale: true}}
- {cat: isa, name: AT5_relu_epilogue, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, epilogue: [relu], source_role: handauthored_compiler_test,
   source_reference: matmul + relu epilogue (bf16), label: public, modes: {relu: true}}
- {cat: isa, name: AT6_resident_reuse, kind: isa, op: resident_reuse, weight: W, K_tiles: 1, N_tiles: 1,
   matmuls: [{lhs: A0, out: Y0, M_tiles: 1}, {lhs: A1, out: Y1, M_tiles: 1}],
   source_role: handauthored_compiler_test, source_reference: one resident weight, two activation tiles,
   label: public, modes: {resident_reuse: true}}
- {cat: layers, name: BT0_quantized_linear, kind: layer, op: linear, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: X, weight: W, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'nn.Linear fp8 x fp8 -> bf16', label: public, modes: {k_accumulate: true}}
- {cat: layers, name: BT1_linear_relu, kind: layer, op: linear, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: X, weight: W, out: Y0, epilogue: [relu], source_role: pytorch_model_slice,
   source_reference: 'nn.Linear + ReLU, fp8 -> bf16', label: public, modes: {relu: true, k_accumulate: true}}
- {cat: model_slices, name: CT0_mlp_linear1, kind: model_slice, op: linear, M_tiles: 1, K_tiles: 1, N_tiles: 2,
   lhs: X, weight: W, out: Y0, source_role: pytorch_model_slice,
   source_reference: MLP first projection (64-wide hidden), label: public, modes: {k_accumulate: true}}
- {cat: model_slices, name: CT1_attention_qk, kind: model_slice, op: attention_qk, M_tiles: 1, K_tiles: 1,
   q: Q, k: K, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'attention Q @ K^T scores, fp8 -> bf16', label: public, modes: {}}
# --- Fused ops mined from atlas-npu/baremetal (smolvla_rms_norm, fused_silu_gate, softmax,
# fused_attention): the VPU/norm/activation algorithms run in bf16 alongside the fp8 MXU matmuls, so they
# are PyTorch-sourced (the m2m linalg is the interface the atlas backend compiles).
- {cat: model_slices, name: AF1_geglu_bf16_pt, kind: model_slice, op: geglu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, N: 32, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch SiLU-gate/GeGLU bf16 (atlas smolvla_fused_silu_gate)', label: public,
   modes: {}}
# --- Whole-model capstone (GATED): small_llama in fp8 (atlas MXU inputs are fp8 e4m3).
- {cat: model, name: M0_small_llama_atlas, kind: model, op: model, model: small_llama,
   operand_dtype: fp8_e4m3, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama fp8 — whole-model capstone', label: public,
   gate: {after_op_pass_fraction: 0.0}}
# INTEROP pair. This target declares TWO compute units of different kinds -- an mxu (systolic) and a
# vector_unit (vector) -- so it is the only target here that can populate `in_contract_vector_scalar`,
# and it gets both composition capsules:
#   AX0 -- accelerator + the IN-CONTRACT vector unit the target itself declares;
#   AX1 -- accelerator + the HOST scalar/RVV lane (an op routed to no unit at all).
# The two are different claims: the first says the compiler uses the whole accelerator, the second says
# it can hand work off the accelerator entirely and still be right.
- {cat: model, name: AX0_interop_vector_unit, kind: model, op: model, model: small_llama,
   operand_dtype: fp8_e4m3, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama fp8 composed across the mxu and the in-contract vector unit — asserts both declared units carried work',
   label: public, gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, in_contract_vector_scalar]}}
- {cat: model, name: AX1_interop_rvv_lane, kind: model, op: model, model: small_llama,
   operand_dtype: fp8_e4m3, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'small_llama fp8 composed across the mxu and the host scalar/RVV lane — asserts work left the accelerator entirely and stayed correct',
   label: public, gate: {after_op_pass_fraction: 0.8},
   lanes: {require: [on_mesh, scalar_rvv_lane]}}
# --- More VPU/activation/reduction ops mined from atlas-npu/baremetal (smolvla_gelu_tanh, smolvla_silu,
# smolvla_elementwise_*, smolvla_reduction_sum, smolvla_rope_frequency).
- {cat: model_slices, name: AF4_gelu_bf16_pt, kind: model_slice, op: gelu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch GELU-tanh bf16 (atlas smolvla_gelu_tanh)', label: public, modes: {}}
- {cat: model_slices, name: AF5_silu_bf16_pt, kind: model_slice, op: silu, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch SiLU bf16 (atlas smolvla_silu)', label: public, modes: {}}
- {cat: model_slices, name: AF6_add_bf16_pt, kind: model_slice, op: add, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch elementwise add bf16 (atlas smolvla_elementwise_add)', label: public,
   modes: {}}
- {cat: model_slices, name: AF8_rope_bf16_pt, kind: model_slice, op: rope, operand_dtype: bf16,
   source: pytorch, M: 16, K: 16, out: Y0, source_role: pytorch_model_slice,
   source_reference: 'PyTorch RoPE bf16 (atlas smolvla_rope_frequency)', label: public, modes: {}}
# --- Spec-sourced capsule: PROGRAM (MXU command sequence) + golden from the specir verification spec, via
# emit_atlas_program; the spec's fp8->bf16 refmodel is the reference (SA C-model corroborated 1024/1024).
- {cat: isa, name: AS0_matmul_spec, kind: isa, op: matmul, source: spec,
   spec_ref: 'atlas-npu:op.matmul_mxu0', M: 32, K: 32, N: 32, lhs: A0, weight: W, out: Y0,
   spec_program_emitter: {module: specir.interface.emit_atlas_program, function: emit_atlas_program},
   source_role: spec_derived,
   source_reference: 'specir spec-sourced fp8->bf16 MXU matmul (program + refmodel golden + coverage)',
   label: public}
# --- Both MXU mesh types (atlas has two systolic meshes: mxu0/mxu1) as distinct fp8 matmul tiles, plus a
# k-chain and fused matmul+bias mined from atlas-npu/baremetal (smolvla_matmul_mxu*, k_chain, fused_matmul_bias).
- {cat: isa, name: AT7_matmul_mxu0, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, semantic: matmul_mxu0, source_role: handauthored_compiler_test,
   source_reference: 'fp8 matmul on MXU mesh 0 (smolvla_matmul_mxu0)', label: public, modes: {}}
- {cat: isa, name: AT8_matmul_mxu1, kind: isa, op: matmul, M_tiles: 1, K_tiles: 1, N_tiles: 1,
   lhs: A0, weight: W, out: Y0, semantic: matmul_mxu1, source_role: handauthored_compiler_test,
   source_reference: 'fp8 matmul on MXU mesh 1 (smolvla_matmul_mxu1)', label: public, modes: {}}
- {cat: model_slices, name: AF10_bias_add_bf16_pt, kind: model_slice, op: bias_add, operand_dtype: bf16,
   source: pytorch, M: 16, N: 16, out: Y0, comparison_group: bias_add, source_role: pytorch_model_slice,
   source_reference: 'PyTorch bias add bf16 (atlas bias_add)', label: public, modes: {},
   stimulus_range: [-4, 3]}
# --- Second whole-model capstone (GATED): lstmnetvit fp8 — broader layer types (conv patch-embed,
# spatial-reduction attention, depthwise MixFFN, PixelShuffle+upsample, LSTM head) beyond small_llama.
- {cat: model, name: M1_lstmnetvit_atlas, kind: model, op: model, model: lstmnetvit,
   operand_dtype: fp8_e4m3, outs: [Y0, Y1, Y2], source_role: pytorch_model_slice,
   source_reference: 'lstmnetvit fp8 — vision+LSTM control net (conv/spatial-attn/MixFFN/upsample/LSTM)',
   label: public, gate: {after_op_pass_fraction: 0.8}}
# --- The remaining SmolVLA kernels npu_model ships that the AF series did not yet cover
# (smolvla_matmul, smolvla_requant, smolvla_elementwise_{mul,div,sub}, smolvla_fused_norm_scale,
# smolvla_attention). Shapes are npu_model's canonical 32x32 tile rather than the 16x16 the earlier AF
# entries use, because that is the tile those kernels are written for. Each entry's `comment` records
# the atlas-npu assembly that EXECUTES the kernel and, where the hardware operands are fp8 rather than
# the bf16 declared here, says so instead of silently redeclaring the dtype.
- cat: model_slices
  name: AF14_requant_fp8_pt
  kind: model_slice
  op: requant
  operand_dtype: bf16
  source: pytorch
  shape: [32, 32]
  out: Y0
  source_role: pytorch_model_slice
  source_reference: 'PyTorch bf16->fp8 requantize (atlas smolvla_requant)'
  label: public
  modes: {}
  comment: >-
    AF14_requant_fp8_pt ports npu_model's `smolvla_requant`: bf16 -> fp8_e4m3 at unit scale
    (`seli` imm=1). Execution reference: atlas-npu `baremetal/assembly/smolvla_requant.S`, which packs
    the two 32x16 bf16 halves through `VPACK.BF16.FP8`; no VTRPOSE, because nothing is pushed into the
    MXU. DTYPE -- option (a): the fp8 round trip is IN the program, spelled `arith.truncf ... : f32 to
    f8E4M3FN` inside the linalg body exactly as npu_model's own REQUANT_MLIR spells it, so the bf16
    tensor dtype declared in capsule.yaml and the tensor dtype in capsule.interface.mlir agree and the
    quantization is the thing being graded rather than a footnote. The interface module is AUTHORED
    rather than captured: model2MLIR lowers `x.to(float8_e4m3fn).to(bf16)` to bf16 -> f32 -> bf16, an
    identity, so a captured module would not contain the quantization its own golden was computed
    with. The golden is still the host torch-eager result of capsule.pytorch.py, which does round.
    Inputs span +-64 deliberately: on [-1, 1) the fp8 rounding error is a few hundredths, and at the
    tolerance a float corpus declares a plain COPY of the input would pass.
- cat: model_slices
  name: AF15_mul_bf16_pt
  kind: model_slice
  op: mul
  operand_dtype: bf16
  source: pytorch
  shape: [32, 32]
  out: Y0
  source_role: pytorch_model_slice
  source_reference: 'PyTorch elementwise mul bf16 (atlas smolvla_elementwise_mul)'
  label: public
  modes: {}
  comment: >-
    AF15_mul_bf16_pt ports npu_model's `smolvla_elementwise_mul`, the 32x32 canonical form of a
    pattern that appears 664 times across SmolVLA (gate/up fusion in the MLPs, norm x scale, attention
    score x mask) in 19 shape variants. Execution reference: atlas-npu
    `baremetal/assembly/smolvla_elementwise_mul.S` (`VMUL.BF16` pair-op); no VTRPOSE, because nothing
    reaches the MXU. DTYPE -- option (a): bf16 IS the hardware dtype here. npu_model builds both
    operands as `torch.bfloat16` and the VPU computes in bf16, so the declared dtype, the MLIR and the
    datapath agree.
- cat: model_slices
  name: AF16_div_bf16_pt
  kind: model_slice
  op: div
  operand_dtype: bf16
  source: pytorch
  shape: [32, 32]
  out: Y0
  source_role: pytorch_model_slice
  source_reference: 'PyTorch elementwise div bf16 (atlas smolvla_elementwise_div)'
  label: public
  modes: {}
  comment: >-
    AF16_div_bf16_pt ports npu_model's `smolvla_elementwise_div`, the 32x32 canonical form of a
    pattern with 217 instances and 6 shape variants in SmolVLA. Execution reference: atlas-npu
    `baremetal/assembly/smolvla_elementwise_div.S` -- the ISA has no divide, so the kernel is
    `VRECIP.BF16` followed by `VMUL.BF16`; no VTRPOSE, because nothing reaches the MXU. DTYPE --
    option (a): bf16 is the hardware dtype, and the declared dtype, the MLIR and the datapath agree.
    The divisor is held away from zero (|b| < 0.25 replaced by 0.5), the same guard npu_model applies,
    so the golden is not dominated by a handful of unbounded elements. One honest gap: this capsule's
    reference is an exact bf16 divide, while the kernel's reciprocal-then-multiply differs from it by
    about a bf16 ULP -- inside the declared tolerance, but it is a tolerance the capsule relies on.
- cat: model_slices
  name: AF17_sub_bf16_pt
  kind: model_slice
  op: sub
  operand_dtype: bf16
  source: pytorch
  shape: [32, 32]
  out: Y0
  source_role: pytorch_model_slice
  source_reference: 'PyTorch elementwise sub bf16 (atlas smolvla_elementwise_sub)'
  label: public
  modes: {}
  comment: >-
    AF17_sub_bf16_pt ports npu_model's `smolvla_elementwise_sub`, the 32x32 canonical form of a
    pattern with 114 instances and 6 shape variants across SmolVLA (softmax's `x - rowmax` step,
    residual-difference paths). Execution reference: atlas-npu
    `baremetal/assembly/smolvla_elementwise_sub.S` (`VSUB.BF16` pair-op); no VTRPOSE, because nothing
    reaches the MXU. DTYPE -- option (a): bf16 is the hardware dtype, so the declared dtype, the MLIR
    and the datapath agree.
- cat: model_slices
  name: AF18_fused_norm_scale_bf16_pt
  kind: model_slice
  op: fused_norm_scale
  operand_dtype: bf16
  source: pytorch
  shape: [32, 32]
  out: Y0
  source_role: pytorch_model_slice
  source_reference: 'PyTorch fused rsqrt+scale bf16 (atlas smolvla_fused_norm_scale)'
  label: public
  modes: {}
  comment: >-
    AF18_fused_norm_scale_bf16_pt ports npu_model's `smolvla_fused_norm_scale`:
    out[i, j] = matrix[i, j] * rsqrt(variance[i, j]), a pattern that appears 64 times in the model and
    whose full shape is variance[241] x matrix[241, 960]. Like npu_model's own Program this capsule is
    the one-tile 32x32 form with the variance already broadcast to the matrix shape on the host.
    Execution reference: atlas-npu `baremetal/assembly/smolvla_fused_norm_scale.S` -- there is no
    VRSQRT in this ISA, so rsqrt is `VSQRT.BF16` followed by `VRECIP.BF16`, then `VMUL.BF16`; no
    VTRPOSE, because nothing reaches the MXU. DTYPE -- option (a): bf16 end to end, which is what
    npu_model states and what the VPU computes.
