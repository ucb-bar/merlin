# Generated by generate_selection.py from atlas-kernels ce46582; do not edit by hand.
# Shape rules derive from pinned kernels/*/kernel.yaml, with coverage placement cross-checks.
# Radiance v1 field names, plus exact sets, powers of two, divisibility, and tiled-product bounds.
#
# This is the current Qwen full-model bringup pin, reachable from public origin/feat/kernel-library.
# source-map.json records the older relocation snapshot. No information treatment is enabled.
schema: atlas_kernel_library_selection_v1
name: atlas_kernels_model_kernel_library
source_pin: atlas_kernels
source_commit: ce465827a977ba8451b585f71910726e7f12b885
source_pr: https://github.com/ucb-bar/atlas-kernels
package: out/artifacts/targets/atlas/kernel_library_v1
purpose: read-only authoring evidence; submitted packages may not copy, link, or call it

shared_paths:
  - Makefile
  - atlas_kernels_path.py
  - lib
  - kernels/common.mk

qualified_families:
  - kernels/projection_gemm
  - kernels/epilogue
  - kernels/rne_add
  - kernels/rmsnorm
  - kernels/rope
  - kernels/attention
  - kernels/smol_fusion
  - kernels/resnet_pool
  - kernels/resnet_patch_gather

# Candidate authoring families, not a claim of numerical qualification at this revision.
experimental_families: []

# Currently disabled selection and materialization example with no Atlas compile or runtime consumer.
# These authored rules describe candidate schedule strategies from semantic workload facts. A match
# in the generic matcher does NOT extend the source library's numeric
# qualification to a new implementation or shape.  Hardware features are supplied by introspection or
# the target contract at the call site; the selector does not manufacture them.
#
# Shapes are the extents a launch receives: callers pad projection, epilogue, RoPE, and norm rows to a
# multiple of 32, and split projection rows into panels; attention takes logical Sq and Sk.  Families
# whose stage is not a launch of their own are selected through compound semantic ops (matmul_<stage>,
# conv2d_im2col_matmul); each rule's comment repeats the manifest's stage.
compiler_selection:
  schema: semantic_kernel_family_registry_v1
  rules:
    # standalone launch; kernel.yaml stage: standalone
    # the library picks the traffic-reuse recipe for an exact MxKxN (kernel.yaml variants); any other multiple-of-32 shape uses the default program
    - family: kernels/projection_gemm
      semantic_ops: [matmul]
      dtypes: [fp8_e4m3]
      shape: {M: {min: 32, multiple_of: 32}, K: {min: 32, multiple_of: 32}, N: {min: 32, multiple_of: 32}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate]
      priority: 40
    # fused into projection_gemm; kernel.yaml stage: epilogue (fused by default, with an opt-in standalone contiguous SiLU times up stream)
    # its plain add truncates; matmul_add selects rne_add (priority 70) for the exact BF16 sum
    - family: kernels/epilogue
      semantic_ops: [matmul_silu, matmul_mul, matmul_add, matmul_relu, matmul_exp, matmul_reciprocal, matmul_gelu_tanh, matmul_scale]
      dtypes: [fp8_e4m3]
      shape: {M: {min: 32, multiple_of: 32}, K: {min: 32, multiple_of: 32}, N: {min: 32, multiple_of: 32}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit, exp, reciprocal, tanh]
      priority: 60
    # fused into projection_gemm; kernel.yaml stage: epilogue stage, rope post-pass building block, or opt-in standalone streamed add
    - family: kernels/rne_add
      semantic_ops: [matmul_add]
      dtypes: [fp8_e4m3]
      shape: {M: {min: 32, multiple_of: 32}, K: {min: 32, multiple_of: 32}, N: {min: 32, multiple_of: 32}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit, tanh]
      priority: 70
    # standalone launch; kernel.yaml stage: post-pass; TinyLlama runs it as a standalone launch that DMAs h into VMEM banks 2 and 3
    # physical rows 32 or 128; logical width equals physical width; epsilon needs separate numeric admission
    - family: kernels/rmsnorm
      semantic_ops: [rmsnorm]
      dtypes: [bf16]
      shape: {rows: {one_of: [32, 128]}, cols: {min: 32, max: 7136, multiple_of: 32}}
      requires_hardware: [vector_unit, sqrt, reciprocal]
      priority: 80
    # fused into projection_gemm; kernel.yaml stage: producer post-pass, or opt-in standalone BF16 launch
    # producer post-pass only; standalone BF16 RoPE is outside this catalog
    - family: kernels/rope
      semantic_ops: [matmul_rope]
      dtypes: [fp8_e4m3]
      shape: {M: {one_of: [32, 128]}, K: {one_of: [2048]}, N: {one_of: [256, 2048]}, head_dim: {eq: 64}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit, tanh]
      priority: 100
    # standalone launch; kernel.yaml stage: standalone
    # dimension-64 v2, unpacked heads; ceil(Sq/32)*ceil(Sk/32) <= 2048; masks need separate admission
    - family: kernels/attention
      semantic_ops: [attention_gqa, attention_gqa_causal, attention_gqa_masked]
      dtypes: [bf16]
      shape: {Sq: {min: 1, max: 4096, tile_product_max: {dimension: Sk, tile: 32, max: 2048}}, Sk: {min: 1, max: 2048}, D: {eq: 64}, QH: {min: 1, multiple_of_dimension: KVH}, KVH: {min: 1}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit, exp, reciprocal]
      priority: 100
    # standalone launch; kernel.yaml stage: projection_gemm launch with a fused epilogue, relocated to the 0x90000000 arena
    - family: kernels/smol_fusion
      semantic_ops: [matmul_bias_gelu_tanh]
      dtypes: [fp8_e4m3]
      shape: {M: {eq: 128}, K: {eq: 768}, N: {eq: 3072}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit, tanh]
      priority: 90
    # standalone launch; kernel.yaml stage: standalone
    # manifest-qualified stem geometry only; exactness also requires nonnegative normal FP8 inputs
    - family: kernels/resnet_pool
      semantic_ops: [max_pool2d]
      dtypes: [fp8_e4m3]
      shape: {kernel: {eq: 3}, stride: {eq: 2}, padding: {eq: 1}, channels: {eq: 64}, height: {eq: 112}, width: {eq: 112}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate, vector_unit]
      priority: 80
    # fused into projection_gemm; kernel.yaml stage: A-operand source of a projection_gemm launch (direct_input=)
    # 1x1/3x3 with same padding; physical M/K, blocked recipe, and arena bounds need separate admission
    - family: kernels/resnet_patch_gather
      semantic_ops: [conv2d_im2col_matmul]
      dtypes: [fp8_e4m3]
      shape: {channels: {min: 32, multiple_of: 32, power_of_two: true}, kernel: {one_of: [1, 3]}, stride: {one_of: [1, 2]}, out_channels: {min: 32, multiple_of: 32}}
      requires_hardware: [systolic_array, fp8_mxu, bf16_accumulate]
      priority: 80

prohibited_uses:
  - copying kernel bodies into a submission
  - linking or calling the reference library from a submission
  - capsule-name or expected-output dispatch
