# Kodiak's delta on top of the rvv base contract. Everything not stated here is inherited from rvv
# (vector unit, dtypes, int8 W8A8 requant, semantic capabilities). `merlin-target-compose .` writes the
# effective contracts/target_contract.yaml; never edit that file by hand.

# The base describes the SpacemiT K1 it was measured on; none of that is true of Kodiak.
remove:
  - provenance
  - runner
replace:
  - measurement

provenance: >-
  Kodiak tapeout: Saturn vector units (VLEN=512, confirmed on silicon by vlen_probe) on 2 of 3 harts,
  plus the int8 outer-product matrix unit (OPU) of saturn opu-int8 (pin saturn_opu_int8). RVV datapaths
  inherited from rvv; OPU encodings derived from the RTL named in contracts/matrix_units.yaml.

# WHERE the elaborated RTL is: chipyard's TestHarness config for the OPU variant of Kodiak. Facts
# (geometry, encodings) are derived from it, never written here.
rtl_source:
  ext_root: chipyard
  config: KodiakOPUConfig
  generator: saturn

features:
  - multicore
  - matrix_unit

# The OPU: driven by raw `.insn` (a command buffer of vector-opcode instructions), NOT by RoCC.
compute_units:
  - name: opu
    kind: spatial
    dtypes: [int8]
    ops: [matmul]
    scaling: none
    requant: {ref: none}
    exposure: command_buffer
    accumulate:
      - {in: int8, weight: int8, acc: i32}
    semantic_capabilities:
      - {family: contraction, dtypes: [int8]}
    notes: >-
      Unit saturn_opu in contracts/matrix_units.yaml (pin saturn_opu_int8): four instructions in
      reserved even funct6 slots of the vector opcode, int8 inputs accumulating in int32, a tile whose
      edge is VLMAX at e8/m1 (64 on Kodiak). Tile geometry is RTL-derived, not restated here.

matrix_contract: contracts/matrix_units.yaml

# The OPU's functional model for spike (spike/: source + build.py, which generates the instruction words
# and geometry from the RTL). Merlin loads it ONLY as declared here, through
# `merlin.targetgen.spike_extension`: the .so comes from $MERLIN_KODIAK_OPU_SPIKE_EXTLIB, and it is
# accepted only if the manifest.json build.py writes beside it describes that exact file, records these
# exact inputs (the model source, the RTL-derived encodings header, the model description) and a passing
# self-test. Pinning the INPUTS rather than one binary lets every user build the model with their own
# compiler and spike (`examples/kodiak/run.sh spike-model`) without re-declaring it here.
runner:
  spike_extension:
    extension_name: saturn_opu
    extlib_env: MERLIN_KODIAK_OPU_SPIKE_EXTLIB
    built_from:
      manifest: manifest.json
      source_sha256: c7427ced1205fd09dbc52e4cd94bb6d619d78fce109fba812c8cbfd9fff98e60
      header_sha256: e7dc60cd676090c32aab7e38b2297e45d9e0398746660f244c26fe6ca1fe2075
      model_sha256: 181971da18d39f366d13b655a145d43f8899aa2262e652d0fa07b11f5b3ce71b
    built_by: spike/build.py
    models: KodiakOPUConfig (rtl_source.config) at pin saturn_opu_int8

# Executable support owned by THIS package: the whole-model route's contraction rewrite + OPU shim.
plugin:
  matrix_lowering: matrix_lowering.py

measurement:
  cycles_from: spike
  cycles_tier: functional
  wall_from: chipyard_kodiak
  wall_tier: silicon
  citable_tier: rtl
  speed_of_light: rvv_lane_peak
  notes:
    - Whole-model wall cycles on the Kodiak rig are dominated by the rig's host memory path; compare
      RVV vs OPU on the same rig, same day, and report the OPU-region cycles alongside the total.
    - An OPU cycle count is only citable on a checkout whose saturn_opu_int8 pin verifies.

runtime_promises:
  - metrics
  - multicore_barrier

hardware_promises:
  - per_hart_mcycle
