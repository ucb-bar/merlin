# RVV codegen tunable surface, AS DATA. The authoritative artifact is schedule.mlir (the
# transform-dialect text clang lowers to RVV); these knobs DESCRIBE it + carry the cflags. A
# generator (rvvgen.from_strategy) emits schedule.mlir FROM these knobs for variant packages;
# for hand_v0 the schedule is a verbatim capture of pipeline.RVV_TRANSFORM_SCHEDULE and the
# knobs below mirror it exactly.
schedule_file: schedule.mlir

# Which linalg contraction ops the schedule tiles + vectorizes (fixed-width vectors). Extending
# this set beyond the two contraction ops is experimental: a blanket vectorize of
# transposes/reduces/elementwise explodes into vector.extract that does not lower in this
# LLVM-23 build (see pipeline.py). tile == vector here (fixed-width, smaller dims masked).
op_match:
  - {op: linalg.matmul,       tile: [4, 8, 1],    vector: [4, 8, 1]}
  - {op: linalg.batch_matmul, tile: [1, 4, 8, 1], vector: [1, 4, 8, 1]}

# Vector-lowering patterns applied to func bodies (transform.apply_patterns.vector.*).
lowering_patterns:
  - lower_contraction
  - lower_masked_transfers
  - lower_transpose
  - lower_shape_cast

# Informational: this schedule emits fixed-width vectors with LMUL=1 (e32m1). A schedule
# certified at one VLEN needs a separate measurement on a different vector length.
lmul_policy: m1

# The RVV-specific cflags. The applier appends zephyr_model._CFLAGS_COMMON. -fno-vectorize /
# -fno-slp-vectorize disable clang autovectorization so the schedule controls vector widths.
cflags: ["-march=rv64gcv", "-fno-vectorize", "-fno-slp-vectorize"]

# Selects an existing lowering path; no new lowering logic. fp32 | int8_w8a8 | bf16_f32acc.
dtype_strategy: fp32

# objdump evidence contract — the MEASURED fp32-GEMM instruction set of THIS baseline schedule
# (recorded by certify_rvv as evidence, not a hard gate). KNOWN GAP vs expert kernels (XNNPACK):
# the schedule's lower_contraction emits vfmul.vv + vfadd.vv SEPARATELY, not the fused vfmacc.vv,
# and uses vsetivli (immediate) not vsetvli. These divergences are exactly what the S4 comparison
# + gap-router target (lever 2: a targeted contraction-lowering pattern to recover vfmacc).
expected_instructions: [vsetivli, vle32.v, vfmul.vv, vfadd.vv]
