# Muon (SIMT) target contract (validates against merlin/schemas/target_contract.schema.yaml).
#
# Curated reference metadata for the Muon SIMT core (RadianceMuonConfig cluster).
# Executable backend, introspection and oracle declarations belong to the explicitly
# selected OOT support provider, not this retained reference contract.
#
# Mesh/warp geometry, register-file and shared-memory capacities and datapath dtypes are NOT declared
# here: they are RTL-derived facts (the OOT provider's muon_introspect, registered via the
# mlc_bridge SIMT-introspect seam) that consumers read from the fact bundle directly.
name: muon
version: 0.1
family: simt_tensor
features: [simt, warp_parallel, self_hosted_isa, command_buffer, metrics]
runtime:
  backends: [simulator, cyclotron, verilator]
  # Default runtime backend the lowering pipeline stamps when a caller passes none (DERIVED from this
  # contract, not from a name -> backend map in code; see target_registry.backend_for).
  default_backend: simulator
capabilities:
  ops: [matmul, elementwise]
  layouts: [row_major]
# Datatype -> compute-unit -> op capability model (parsed by merlin.targetgen.compute_units). The concrete
# warp/mesh geometry + accumulator dtypes are RTL-derived facts, so they are NOT re-declared here.
compute_units:
  - name: simt_cluster
    kind: simt
    dtypes: [float32]
    ops: [matmul, elementwise]
    scaling: none
    requant: {ref: none}
    # The cluster EMBEDS the MX array below, so the target has two engines and not one. This was found by
    # auditing the declaration against the RTL: the introspected design's top module is the Radiance
    # cluster, and inside it a mesh instantiates 256 multiply-accumulating, spatially interconnected tiles
    # (128 + 80 + 32 + 16 across four CIRCT structural variants, the partial-sum bus widening down the
    # column) whose ports carry weight/activation MX format selectors. Declaring only the SIMT cluster
    # described half the silicon, and `contains` is how composition is expressed (compute_units.effective
    # folds the union) rather than by promoting one unit to "the" kind.
    contains: [mx_pe]
  # The same physical array radiance declares -- both targets are the same cluster RTL -- so this mirrors
  # radiance's mx_pe rather than re-deriving a second, drifting description of one piece of hardware.
  # Geometry is deliberately absent: mesh/warp dimensions are RTL-derived facts consumers read from the
  # fact bundle (see the header note), and duplicating DIM here is how a contract goes stale.
  - name: mx_pe
    kind: systolic
    dtypes: [mxfp4, mxfp6, mxfp8, int8, bf16]
    ops: [matmul]
    scaling: block_e8m0
    requant: {ref: mx_gemmini.mx_requantizer}
    accumulate:
      - {in: mxfp4, weight: mxfp4, acc: f32}
      - {in: mxfp6, weight: mxfp6, acc: f32}
      - {in: mxfp8, weight: mxfp8, acc: f32}
      - {in: int8,  weight: int8,  acc: i32}
    semantic_capabilities:
      - family: contraction
        dtypes: [mxfp4, mxfp6, mxfp8, int8, bf16]
measurement:
  # The cyclotron perf model, NOT a functional simulator: it is the only substrate that produces cycles
  # for this target at all.
  cycles_from: cyclotron
  wall_from: null             # no silicon and no board: wall time is UNKNOWN, which is not zero
  cycles_tier: cycle_model
  wall_tier: silicon
  speed_of_light: simt_lane_peak
  citable_tier: cycle_model
  notes:
    - "The cyclotron model carries a bracketed SIMT-GEMM overcount that must be carried through to any
       number quoted from it, rather than silently absorbed into the result."
memory_model:
  resident: false
  accumulators: false
compiler_obligations:
  - must_emit_relocation_free_kernel
  - must_partition_work_across_warps_deterministically
hardware_promises:
  - warp_parallel_execution
  - cycle_counter
runtime_promises:
  - command_buffer
  - metrics
legality:
  - "kernel must be self-hosted-ISA (emits its own encoded instructions, not host .insn)"
confidence: medium
requires_human_review: false
notes: >-
  Curated reference contract for the Muon SIMT core. Executable support lives OOT.
  RTL geometry/datapath facts come from the explicitly provided fact bundle,
  never from this contract. Metadata discovery is not execution or certification.
