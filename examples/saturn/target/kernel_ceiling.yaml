# Kernel-ceiling bench configuration for this target's standalone benchmark corpus.
#
# Read by merlin.kernels.bench_ceiling, which owns only the generic machinery (build a bench as-is,
# run it on spike, read its console in three states). Everything specific to this corpus -- the
# toolchain flags, the spike memory map, the bench tree layout and which bench measures what -- is
# declared here, beside the target that owns it. The corpus itself is located through
# src/merlin/resources/contracts/corpora.yaml (`kernel_corpora.<corpus>`), whose `target:` names this target.
#
# Every value below was lifted verbatim from the corpus's own benchmarks/Makefile and bench sources;
# none is an RTL-derived fact.
schema: merlin.kernel_ceiling.v1
target: saturn
corpus: saturn

spike:
  # benchmarks/Makefile RISCV_SIM line.
  isa: rv64gcv_zfh_zvfh
  harts: 4
  memory: "-m0x70020000:0x20000,0x80000000:0x10000000"

build:
  # benchmarks/Makefile RISCV_GCC_OPTS verbatim, minus the per-bench -I flags (added from `includes`).
  cflags:
    - -DPREALLOCATE=1
    - -mcmodel=medany
    - -static
    - -O2
    - -g
    - -ffast-math
    - -fno-common
    - -fno-builtin-printf
    - -fno-tree-loop-distribute-patterns
    - -march=rv64gcv_zfh_zvfh
    - -mabi=lp64d
    - -std=gnu99
  link_opts: [-static, -nostdlib, -nostartfiles, -lm, -lgcc]
  # Paths relative to the corpus's benchmark tree; `{bench}` is the bench's own directory.
  # Every *.c and *.S under each `sources` directory is compiled, in this order.
  sources: ["{bench}", common, common/ara]
  includes: [env, common, "{bench}"]
  linker_script: common/test.ld
  # The corpus's empty env/ directory lacks the encoding.h that util.h/crt.S include (read_csr,
  # mcycle, minstret). Candidates relative to the spike toolchain's chipyard root, first match wins.
  toolchain_headers:
    - toolchains/libgloss/include/encoding.h
    - tools/torture/env/encoding.h

# Benches that build standalone AND run on spike with a parseable cycle line. `dtype` is the element
# type the kernel actually computes on. `console` names the generic reader for the bench's printf
# format; `shape` pins a bench that measures one fixed (M, N, K) only.
benches:
  vec-igemm:
    op: matmul
    dtype: i64
    kernel_ref: imatmul
    console: square_sweep          # "Calculating a (s x s) x (s x s) ..." then "The execution took N cycles."
  vec-dotprod:
    op: dotprod
    dtype: i64
    kernel_ref: dotp_v64b
    console: length_sweep          # "... with length = L" then "Vector cycles: C instructions: I"
  vec-sgemm:
    op: matmul
    dtype: f32
    kernel_ref: vec_sgemm_nn
    console: counter_dump          # setStats(0): "mcycle = N" / "minstret = N" deltas
    shape: [71, 71, 71]
